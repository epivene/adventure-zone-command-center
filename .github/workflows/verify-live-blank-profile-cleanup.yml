name: Verify live blank profile cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/verify-live-blank-profile-cleanup.yml"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Wait for live cleanup and enrichment
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          BASE_URL="${API_URL%/}"
          mkdir -p live-verification

          for attempt in $(seq 1 60); do
            rm -f live-verification/*.json live-verification/*.status

            for PROFILE_ID in \
              08e8e9b8-618a-4129-ab14-640345c1abf0 \
              b0b9007c-e145-4f72-955e-03a28ef149f4 \
              9fcb2baa-9014-46bc-96be-6009b95d93ba \
              0bfee77c-e42c-417f-9d5e-7df54d57c38b \
              7fff8f6c-5e88-46ad-9f00-d1a853040a42 \
              9c6b750d-828a-4b97-b6aa-0a19c22f18cf \
              e7ba291f-5d7c-48ec-9c66-7756196ee290
            do
              curl --silent --show-error \
                --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
                --output "live-verification/${PROFILE_ID}.json" \
                --write-out "%{http_code}" \
                "${BASE_URL}/api/assistant-import/profile-history/${PROFILE_ID}" \
                > "live-verification/${PROFILE_ID}.status" || true
            done

            if node <<'NODE'
          const fs = require('fs');
          const directory = 'live-verification';
          const deleted = [
            '08e8e9b8-618a-4129-ab14-640345c1abf0',
            'b0b9007c-e145-4f72-955e-03a28ef149f4',
            '9fcb2baa-9014-46bc-96be-6009b95d93ba',
            '0bfee77c-e42c-417f-9d5e-7df54d57c38b',
          ];
          const expected = {
            '7fff8f6c-5e88-46ad-9f00-d1a853040a42': {
              name: 'Colorado Events', city: 'Boulder', region: 'CO',
              phone: '720-272-7467', website: 'https://www.coloradoevents.org/',
              contactEmail: 'coloradoevents@gmail.com',
            },
            '9c6b750d-828a-4b97-b6aa-0a19c22f18cf': {
              name: 'Idaho Department of Fish and Game', city: 'Boise', region: 'ID',
              phone: '208-334-3700', website: 'https://idfg.idaho.gov/',
            },
            'e7ba291f-5d7c-48ec-9c66-7756196ee290': {
              name: 'Te-Moak Tribe of Western Shoshone', city: 'Elko', region: 'NV',
              phone: '775-738-9251', website: 'https://www.temoaktribe.com/',
            },
          };

          const status = (id) => fs.readFileSync(`${directory}/${id}.status`, 'utf8').trim();
          for (const id of deleted) {
            if (status(id) !== '404') process.exit(1);
          }

          for (const [id, target] of Object.entries(expected)) {
            if (status(id) !== '200') process.exit(1);
            const record = JSON.parse(fs.readFileSync(`${directory}/${id}.json`, 'utf8'));
            const place = record.place ?? {};
            if (record.ok !== true) process.exit(1);
            if (place.name !== target.name || place.city !== target.city || place.region !== target.region) process.exit(1);
            if (place.phone !== target.phone || place.website !== target.website) process.exit(1);
            if (!Array.isArray(record.contacts) || record.contacts.length < 1) process.exit(1);
            if (!Array.isArray(record.notes) || record.notes.length < 2) process.exit(1);
            if (!Array.isArray(record.followUps) || record.followUps.length < 1) process.exit(1);
            if (target.contactEmail && !record.contacts.some((contact) => contact.email === target.contactEmail)) process.exit(1);
          }
          NODE
            then
              node <<'NODE'
          const fs = require('fs');
          const directory = 'live-verification';
          const ids = [
            '7fff8f6c-5e88-46ad-9f00-d1a853040a42',
            '9c6b750d-828a-4b97-b6aa-0a19c22f18cf',
            'e7ba291f-5d7c-48ec-9c66-7756196ee290',
          ];
          const profiles = ids.map((id) => {
            const record = JSON.parse(fs.readFileSync(`${directory}/${id}.json`, 'utf8'));
            return {
              id,
              name: record.place?.name ?? null,
              city: record.place?.city ?? null,
              region: record.place?.region ?? null,
              contactCount: record.contacts?.length ?? 0,
              noteCount: record.notes?.length ?? 0,
              followUpCount: record.followUps?.length ?? 0,
            };
          });
          fs.writeFileSync('live-blank-profile-cleanup-summary.json', JSON.stringify({
            verifiedAt: new Date().toISOString(),
            removedTestProfileCount: 4,
            enrichedProfileCount: 3,
            profiles,
          }, null, 2));
          NODE
              echo "Live cleanup verified on attempt ${attempt}."
              exit 0
            fi

            echo "Live cleanup is not complete yet (attempt ${attempt})."
            sleep 15
          done

          echo "The deployed app never reached the expected cleanup state."
          exit 1

      - name: Upload sanitized verification summary
        uses: actions/upload-artifact@v4
        with:
          name: live-blank-profile-cleanup-verification
          path: live-blank-profile-cleanup-summary.json
          retention-days: 1
