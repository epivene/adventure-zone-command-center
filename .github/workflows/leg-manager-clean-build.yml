name: Assemble Clean Leg Manager Release 1
on:
  push:
    branches: [feature/leg-manager-foundation-clean]

jobs:
  build-clean-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble only Release 1 files
        run: |
          git fetch origin feature/leg-manager-foundation
          git checkout origin/feature/leg-manager-foundation -- \
            artifacts/adventure-zone/public/sw.js \
            artifacts/adventure-zone/src/App.tsx \
            artifacts/adventure-zone/src/components/manager/manager-shell.tsx \
            artifacts/adventure-zone/src/components/manager/manager-sync-status.tsx \
            artifacts/adventure-zone/src/components/manager/report-schedule-issue.test.tsx \
            artifacts/adventure-zone/src/components/manager/report-schedule-issue.tsx \
            artifacts/adventure-zone/src/components/routes/leg-manager-access.test.tsx \
            artifacts/adventure-zone/src/components/routes/leg-manager-access.tsx \
            artifacts/adventure-zone/src/components/routes/travel-leg-editor.test.tsx \
            artifacts/adventure-zone/src/components/routes/travel-leg-editor.tsx \
            artifacts/adventure-zone/src/features/routes/travel-leg-input.ts \
            artifacts/adventure-zone/src/lib/manager-auth-context.tsx \
            artifacts/adventure-zone/src/lib/manager-offline-db.ts \
            artifacts/adventure-zone/src/lib/manager-sync-queue.test.ts \
            artifacts/adventure-zone/src/lib/manager-sync-queue.ts \
            artifacts/adventure-zone/src/pages/ManagerHomePage.tsx \
            artifacts/adventure-zone/src/pages/ManagerIssuesAdminPage.tsx \
            artifacts/adventure-zone/src/pages/ManagerRoutePage.test.tsx \
            artifacts/adventure-zone/src/pages/ManagerRoutePage.tsx \
            artifacts/adventure-zone/src/pages/ManagerSignInPage.test.tsx \
            artifacts/adventure-zone/src/pages/ManagerSignInPage.tsx \
            artifacts/adventure-zone/src/pages/RoutesPage.tsx \
            artifacts/api-server/src/features/leg-manager/leg-manager-auth.test.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-auth.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-dashboard.test.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-dashboard.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-middleware.test.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-middleware.ts \
            artifacts/api-server/src/features/leg-manager/leg-manager-repository.ts \
            artifacts/api-server/src/features/leg-manager/schedule-issue-repository.test.ts \
            artifacts/api-server/src/features/leg-manager/schedule-issue-repository.ts \
            artifacts/api-server/src/features/routes/travel-leg-editor.test.ts \
            artifacts/api-server/src/features/routes/travel-leg-editor.ts \
            artifacts/api-server/src/features/routes/travel-leg-input.ts \
            artifacts/api-server/src/routes/index.ts \
            artifacts/api-server/src/routes/leg-manager-admin.ts \
            artifacts/api-server/src/routes/leg-manager-auth.ts \
            artifacts/api-server/src/routes/leg-manager.ts \
            artifacts/api-server/src/routes/routes-map.ts \
            artifacts/api-server/tsconfig.manager.json \
            lib/db/migrations/034_unlimited_travel_legs.sql \
            lib/db/migrations/035_leg_manager_access.sql \
            lib/db/migrations/036_leg_schedule_issues.sql \
            lib/db/src/schema/index.ts
          python - <<'PY'
          from pathlib import Path

          migrations = Path('lib/db/src/migrations.ts')
          text = migrations.read_text()
          if '034_unlimited_travel_legs.sql' not in text:
              marker = '] as const;'
              addition = '''  {
              name: "034_unlimited_travel_legs.sql",
              markerSql: `SELECT NOT EXISTS (
                SELECT 1 FROM pg_constraint
                WHERE conrelid = to_regclass(current_schema() || '.travel_legs')
                  AND conname = 'travel_legs_sort_order_between_1_and_9'
              ) AS ready`,
            },
            {
              name: "035_leg_manager_access.sql",
              markerSql: "SELECT to_regclass(current_schema() || '.leg_manager_access') IS NOT NULL AS ready",
            },
            {
              name: "036_leg_schedule_issues.sql",
              markerSql: "SELECT to_regclass(current_schema() || '.leg_schedule_issues') IS NOT NULL AS ready",
            },
          '''
              migrations.write_text(text.replace(marker, addition + marker))

          routes = Path('artifacts/api-server/src/routes/routes-map.ts')
          text = routes.read_text()
          if 'DrizzleLegManagerRepository' not in text:
              text = text.replace('import { TravelLegService } from "@/features/routes/travel-leg-editor";','import { TravelLegService } from "@/features/routes/travel-leg-editor";\nimport { DrizzleLegManagerRepository } from "@/features/leg-manager/leg-manager-repository";')
          needle = '    res.json({ ok: true, leg: result.value });\n  } catch (err) {\n    req.log.error({ err }, "Failed to archive travel leg");'
          if 'incrementSessionVersion(id)' not in text:
              replacement = '    // Archiving permanently invalidates every manager token, including after a later restore.\n    await new DrizzleLegManagerRepository(db).incrementSessionVersion(id);\n    res.json({ ok: true, leg: result.value });\n  } catch (err) {\n    req.log.error({ err }, "Failed to archive travel leg");'
              if needle not in text:
                  raise SystemExit('archive route patch point missing')
              text = text.replace(needle, replacement)
          routes.write_text(text)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add . ':!.github/workflows/leg-manager-clean-build.yml'
          if ! git diff --cached --quiet; then
            git commit -m 'feat: complete leg manager portal release 1'
            git push
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/routes/travel-leg-editor.test.ts src/features/leg-manager
      - name: Focused web tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerSignInPage.test.tsx src/pages/ManagerRoutePage.test.tsx src/lib/manager-sync-queue.test.ts src/components/manager/report-schedule-issue.test.tsx src/components/routes/leg-manager-access.test.tsx src/components/routes/travel-leg-editor.test.tsx
      - name: Web typecheck
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: Manager API scoped typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.manager.json --noEmit
      - name: Full API typecheck diagnostic
        continue-on-error: true
        run: pnpm --filter @workspace/api-server typecheck
      - name: API build
        run: pnpm --filter @workspace/api-server build
      - name: Web build
        run: pnpm --filter @workspace/adventure-zone build
      - name: Security smoke assertions
        run: |
          grep -q 'req.legManager!.legId' artifacts/api-server/src/routes/leg-manager.ts
          grep -q 'incrementSessionVersion(id)' artifacts/api-server/src/routes/routes-map.ts
          grep -q 'onConflictDoNothing' artifacts/api-server/src/features/leg-manager/schedule-issue-repository.ts
          ! grep -q 'passwordHash' artifacts/adventure-zone/src/components/routes/leg-manager-access.tsx
      - name: Remove temporary workflow after success
        run: |
          git rm .github/workflows/leg-manager-clean-build.yml
          git commit -m 'chore: remove temporary release verification workflow'
          git push
