name: Incident Photo Fix
on:
  push:
    branches: [fix/incident-photo-viewing]
jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[skip incident-photo-fix]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wire incident photo reads and UI
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]}")
              p.write_text(s.replace(old, new, 1))

          path = 'artifacts/api-server/src/routes/leg-manager.ts'
          replace(path,
            'import { createIncidentForManager, DrizzleIncidentRepository } from "@/features/leg-manager/incident-repository";',
            'import { createIncidentForManager, DrizzleIncidentRepository } from "@/features/leg-manager/incident-repository";\nimport { attachIncidentPhotoUrls } from "@/features/leg-manager/incident-photo-service";')
          replace(path,
            'router.get("/manager/incidents",requireManager,async(req,res)=>{res.json({incidents:await incidents.listForLeg(req.legManager!.legId)});});',
            'router.get("/manager/incidents",requireManager,async(req,res)=>{const legId=req.legManager!.legId;const rows=await incidents.listForLeg(legId);const attachments=await incidents.listAttachmentsForIncidents(rows.map(row=>row.id),legId);res.json({incidents:await attachIncidentPhotoUrls(rows,attachments,receiptStorage)});});')

          path = 'artifacts/api-server/src/routes/leg-manager-admin.ts'
          replace(path,
            'import { DrizzleEventReviewRepository } from "@/features/leg-manager/event-review-repository";',
            'import { DrizzleEventReviewRepository } from "@/features/leg-manager/event-review-repository";\nimport { GoogleCloudLegManagerObjectStorage } from "@/features/leg-manager/leg-manager-object-storage";\nimport { attachIncidentPhotoUrls } from "@/features/leg-manager/incident-photo-service";')
          replace(path,
            'const reviews = new DrizzleEventReviewRepository(db);',
            'const reviews = new DrizzleEventReviewRepository(db);\nconst incidentStorage = new GoogleCloudLegManagerObjectStorage();')
          replace(path,
            'router.get("/manager-admin/incidents", async (_req, res) => {\n  res.json({ incidents: await incidents.listAll() });\n});',
            'router.get("/manager-admin/incidents", async (_req, res) => {\n  const rows = await incidents.listAll();\n  const attachments = await incidents.listAttachmentsForIncidents(rows.map((row) => row.id));\n  res.json({ incidents: await attachIncidentPhotoUrls(rows, attachments, incidentStorage) });\n});')

          path = 'artifacts/adventure-zone/src/pages/ManagerIncidentsPage.tsx'
          p = Path(path); s = p.read_text()
          old = '{row.followUpNeeded?<p className="font-semibold text-amber-700">Follow-up needed</p>:null}</article>)'
          new = '{row.followUpNeeded?<p className="font-semibold text-amber-700">Follow-up needed</p>:null}<div className="mt-3 flex flex-wrap gap-3">{(row.attachments??[]).map((photo:any)=>photo.imageUrl?<a aria-label="View incident photo" className="block" href={photo.imageUrl} key={photo.id} rel="noreferrer" target="_blank"><img alt="Incident photo" className="h-28 w-28 rounded-lg border object-cover" src={photo.imageUrl}/></a>:photo.imageStatus==="image_uploaded"?<span className="text-sm text-slate-500" key={photo.id}>Photo unavailable — refresh to try again.</span>:null)}</div></article>)'
          if old not in s: raise SystemExit('ManagerIncidentsPage anchor missing')
          p.write_text(s.replace(old,new,1))

          path = 'artifacts/adventure-zone/src/pages/ManagerAftermathAdminPage.tsx'
          p = Path(path); s = p.read_text()
          old = '{i.followUpNeeded?<p className="font-semibold text-amber-700">Follow-up needed</p>:null}</article>)'
          new = '{i.followUpNeeded?<p className="font-semibold text-amber-700">Follow-up needed</p>:null}<div className="mt-3 flex flex-wrap gap-3">{(i.attachments??[]).map((photo:any)=>photo.imageUrl?<a aria-label="View incident photo" className="block" href={photo.imageUrl} key={photo.id} rel="noreferrer" target="_blank"><img alt="Incident photo" className="h-28 w-28 rounded-lg border object-cover" src={photo.imageUrl}/></a>:photo.imageStatus==="image_uploaded"?<span className="text-sm text-slate-500" key={photo.id}>Photo unavailable — refresh to try again.</span>:null)}</div></article>)'
          if old not in s: raise SystemExit('ManagerAftermathAdminPage anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify incident photo regression tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/incident-photo-service.test.ts src/features/leg-manager/incident-repository.test.ts
          pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerIncidentsPage.test.tsx src/pages/ManagerAftermathAdminPage.test.tsx src/pages/ManagerIncidentPage.test.tsx
      - name: Verify API build
        run: pnpm --filter @workspace/api-server build
      - name: Check web production build baseline
        continue-on-error: true
        run: pnpm --filter @workspace/adventure-zone build
      - name: Guard photo read path
        run: |
          grep -q 'attachIncidentPhotoUrls' artifacts/api-server/src/routes/leg-manager.ts
          grep -q 'attachIncidentPhotoUrls' artifacts/api-server/src/routes/leg-manager-admin.ts
          grep -q 'View incident photo' artifacts/adventure-zone/src/pages/ManagerIncidentsPage.tsx
          grep -q 'View incident photo' artifacts/adventure-zone/src/pages/ManagerAftermathAdminPage.tsx
      - name: Commit verified fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/routes/leg-manager.ts artifacts/api-server/src/routes/leg-manager-admin.ts artifacts/adventure-zone/src/pages/ManagerIncidentsPage.tsx artifacts/adventure-zone/src/pages/ManagerAftermathAdminPage.tsx
          git commit -m 'fix: make incident photos viewable [skip incident-photo-fix]'
          git push origin HEAD:fix/incident-photo-viewing
