name: Map Viewport None Check
on:
  push:
    branches: [fix/map-viewport-none]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/routes/map-focus.test.ts
      - run: pnpm --filter @workspace/adventure-zone typecheck
      - run: pnpm --filter @workspace/adventure-zone build
