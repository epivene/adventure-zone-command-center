name: Diagnose Meeker profile match

on:
  push:
    branches:
      - ops/log-meeker-decline-2026-09-01
    paths:
      - ".github/workflows/log-meeker-decline.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Export focused live search evidence
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          mkdir -p .github/runtime-status
          node <<'NODE'
          const fs = require("fs");
          const baseUrl = process.env.API_URL.replace(/\/$/, "");
          const auth = { Authorization: `Bearer ${process.env.ASSISTANT_IMPORT_TOKEN}` };

          async function search(query) {
            const response = await fetch(
              `${baseUrl}/api/assistant-import/profile-search?q=${encodeURIComponent(query)}&limit=20`,
              { headers: auth },
            );
            const text = await response.text();
            const body = JSON.parse(text);
            if (!response.ok || body.ok !== true || !Array.isArray(body.results)) {
              throw new Error(`Search failed for ${query} (HTTP ${response.status}): ${body.error || "unknown error"}`);
            }
            return body.results.map(({ id, kind, label, secondaryLabel, city, region, matchedOn }) => ({
              id, kind, label, secondaryLabel, city, region, matchedOn,
            }));
          }

          async function main() {
            const queries = ["Mary Cunn", "Maym", "Meeker Classic Sheepdog Trials"];
            const evidence = {};
            for (const query of queries) evidence[query] = await search(query);
            fs.writeFileSync(
              ".github/runtime-status/meeker-search-results.json",
              JSON.stringify({ generatedAt: new Date().toISOString(), evidence }, null, 2) + "\n",
            );
            for (const [query, results] of Object.entries(evidence)) {
              console.log(`${query}: ${results.length} result(s)`);
              for (const item of results) {
                console.log(JSON.stringify(item));
              }
            }
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error));
            process.exit(1);
          });
          NODE

      - name: Persist diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/runtime-status/meeker-search-results.json
          git commit -m "Record Meeker profile search evidence"
          git push origin HEAD:ops/log-meeker-decline-2026-09-01
