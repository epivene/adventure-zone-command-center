name: Apply profiles-first booking repair

on:
  push:
    branches:
      - fix/profiles-primary-pirate-confirmed

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/profiles-primary-pirate-confirmed

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Add regression tests first
        run: python .github/scripts/profiles_primary_pirate_fix.py tests

      - name: Prove regressions fail against the old behavior
        run: |
          set +e
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/navigation/app-shell.test.tsx src/pages/BookingsPage.test.ts src/components/profiles/profile-bookings-primary.test.ts
          WEB_RED=$?
          pnpm --filter @workspace/api-server exec vitest run src/features/approved-profile-import/pirate-fest-confirmed.test.ts
          API_RED=$?
          set -e
          test "$WEB_RED" -ne 0
          test "$API_RED" -ne 0
          echo "Both regression groups failed before the repair as expected."

      - name: Apply the repair
        run: python .github/scripts/profiles_primary_pirate_fix.py fix

      - name: Run focused regression suites
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/navigation/app-shell.test.tsx src/pages/BookingsPage.test.ts src/components/profiles/profile-bookings-primary.test.ts
          pnpm --filter @workspace/api-server exec vitest run src/features/approved-profile-import/startup-import.test.ts src/features/approved-profile-import/pirate-fest-confirmed.test.ts

      - name: Record current web typecheck baseline
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @workspace/adventure-zone typecheck 2>&1 | tee web-typecheck.log

      - name: Upload web typecheck baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-typecheck-baseline
          path: web-typecheck.log

      - name: Record current API typecheck baseline
        continue-on-error: true
        run: pnpm --filter @workspace/api-server typecheck

      - name: Build web app
        run: pnpm --filter @workspace/adventure-zone build

      - name: Build API server
        run: pnpm --filter @workspace/api-server build

      - name: Verify and commit repair
        run: |
          rm .github/workflows/apply-profiles-primary-pirate-fix.yml
          rm .github/scripts/profiles_primary_pirate_fix.py
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: make profiles primary and confirm Pirate Fest"
          git push origin HEAD:fix/profiles-primary-pirate-confirmed
