name: Profile notes full branch tests
on:
  push:
    branches: [feature/profile-family-notes-impl]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: API full test suite
        run: |
          pnpm --filter @workspace/api-server exec vitest run > /tmp/api-tests.log 2>&1 || { tail -160 /tmp/api-tests.log; exit 1; }
          tail -30 /tmp/api-tests.log
      - name: Frontend full test suite
        if: always()
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run > /tmp/frontend-tests.log 2>&1 || { tail -160 /tmp/frontend-tests.log; exit 1; }
          tail -30 /tmp/frontend-tests.log
