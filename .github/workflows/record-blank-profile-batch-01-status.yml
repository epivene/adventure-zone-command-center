name: Record blank profile batch 01 status

on:
  push:
    branches:
      - ops/merge-blank-profiles-batch-01
    paths:
      - ".github/workflows/record-blank-profile-batch-01-status.yml"

permissions:
  actions: read
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/merge-blank-profiles-batch-01
          fetch-depth: 0

      - name: Wait for completion and create a compact status receipt
        run: |
          set -euo pipefail
          mkdir -p docs/operations
          for attempt in $(seq 1 220); do
            ROW=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "Complete blank profiles batch 01" \
              --branch ops/merge-blank-profiles-batch-01 \
              --limit 1 \
              --json databaseId,status,conclusion,url,createdAt,updatedAt \
              --jq '.[0] // empty')
            if [ -n "$ROW" ] && [ "$(printf '%s' "$ROW" | jq -r '.status')" = completed ]; then
              RUN_ID=$(printf '%s' "$ROW" | jq -r '.databaseId')
              CONCLUSION=$(printf '%s' "$ROW" | jq -r '.conclusion // "unknown"')
              if [ "$CONCLUSION" = success ]; then
                rm -rf status-download && mkdir status-download
                gh run download "$RUN_ID" \
                  --repo "$GITHUB_REPOSITORY" \
                  --name blank-profile-batch-01-live-verification \
                  --dir status-download
                RECEIPT=$(cat status-download/blank-profile-batch-01-live-verification.json)
                jq -n \
                  --argjson run "$ROW" \
                  --argjson verification "$RECEIPT" \
                  '{recordedAt:(now|todateiso8601),state:"verified",run:$run,verification:$verification}' \
                  > docs/operations/blank-profile-batch-01-completion-status-2026-08-31.json
              else
                FAILED_LOG=$(gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -c 12000 || true)
                jq -n \
                  --argjson run "$ROW" \
                  --arg failure "$FAILED_LOG" \
                  '{recordedAt:(now|todateiso8601),state:"failed",run:$run,failure:$failure}' \
                  > docs/operations/blank-profile-batch-01-completion-status-2026-08-31.json
              fi
              break
            fi
            sleep 10
          done
          test -f docs/operations/blank-profile-batch-01-completion-status-2026-08-31.json

      - name: Commit the status receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/blank-profile-batch-01-completion-status-2026-08-31.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: record blank profile batch 01 completion status"
          git push origin HEAD:ops/merge-blank-profiles-batch-01
