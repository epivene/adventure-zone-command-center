name: Apply calendar renderer readonly packages

on:
  push:
    branches:
      - fix/calendar-renderer-readonly-packages
    paths:
      - ".github/workflows/apply-calendar-renderer-readonly-packages.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-renderer-readonly-packages
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm readonly package compiler errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          count=$(grep -cE 'operational-calendar-renderer\.test\.ts.*readonly.*zone' /tmp/api-before.log || true)
          if [ "$count" -lt 2 ]; then
            echo "Expected readonly package fixture errors were not present." >&2
            exit 1
          fi
      - name: Accept readonly package projections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/google-workspace/calendar/operational-calendar-renderer.ts')
          text = path.read_text()
          old = '  packages: Array<Exclude<OperationalPackageKey, "unknown">>;'
          new = '  packages: ReadonlyArray<Exclude<OperationalPackageKey, "unknown">>;'
          if text.count(old) != 1:
              raise SystemExit(f'expected one mutable package type, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run renderer tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/google-workspace/calendar/operational-calendar-renderer.test.ts
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/google-workspace/calendar/operational-calendar-renderer.ts
          git diff --cached --quiet || git commit -m "fix: accept readonly operational calendar packages"
          git push origin HEAD:fix/calendar-renderer-readonly-packages
      - run: pnpm run typecheck:libs
      - name: Verify renderer readonly package errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'operational-calendar-renderer\.test\.ts.*readonly.*zone' /tmp/api-after.log; then
            echo "Readonly package fixture errors remain." >&2
            exit 1
          fi
