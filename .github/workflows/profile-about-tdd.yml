name: Profile About TDD

on:
  push:
    branches:
      - fix/profile-about-visibility
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/pages/EventProfilePage*"
      - "artifacts/adventure-zone/src/components/organizations/organization-list*"
      - "artifacts/api-server/src/routes/organizations*"
      - ".github/workflows/profile-about-tdd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused frontend tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/EventProfilePage.test.tsx src/components/organizations/organization-list.test.tsx --testNamePattern About
      - name: Focused API test
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/organizations.profile-card-typed-query.test.ts
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone run build
      - name: API build
        run: pnpm --filter @workspace/api-server run build
