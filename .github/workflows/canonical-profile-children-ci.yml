name: Canonical profile children CI

on:
  push:
    branches:
      - fix/canonical-profile-children

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/canonical_profile_children_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm run typecheck:libs

      - name: Apply production repair
        run: |
          python -m py_compile .github/scripts/apply_canonical_profile_children.py
          python -m py_compile .github/scripts/refine_canonical_profile_children.py
          python .github/scripts/apply_canonical_profile_children.py
          python <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/refine_canonical_profile_children.py')
          value = path.read_text(encoding='utf-8')
          value = value.replace(
              '"        importedFromAct: activity.importedFromAct,"',
              '"importedFromAct: activity.importedFromAct,"',
          ).replace(
              '"        importedFromAct: Boolean(activity.importedFromAct),"',
              '"importedFromAct: Boolean(activity.importedFromAct),"',
          )
          path.write_text(value, encoding='utf-8')
          PY
          python .github/scripts/refine_canonical_profile_children.py

      - name: Canonical profile regression tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/event-profiles/event-profile-canonical-children.test.ts
          src/features/approved-profile-import/approved-profile-existing-id.test.ts
          src/features/profile-integrity/profile-integrity-audit.test.ts

      - name: Existing event profile and startup tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/event-profiles
          src/db/required-schema-startup.test.ts
          src/features/organizations/organization-list-sort.test.ts

      - name: Complete approved-profile import suite
        run: pnpm --filter @workspace/api-server exec vitest run src/features/approved-profile-import

      - name: Production API build
        run: pnpm --filter @workspace/api-server build

      - name: Commit verified repair
        run: |
          rm .github/workflows/export-pirate-profile-debug.yml
          rm .github/workflows/canonical-profile-children-ci.yml
          rm .github/scripts/apply_canonical_profile_children.py
          rm .github/scripts/refine_canonical_profile_children.py
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: canonicalize profile contacts and yearly appearances"
          git push origin HEAD:fix/canonical-profile-children
