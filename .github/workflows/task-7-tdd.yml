name: Task 7 Incoming Caller UI TDD

on:
  push:
    branches:
      - agent/assisted-calling-workspace

jobs:
  task-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - id: focused_tests
        continue-on-error: true
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/calls/caller-finder.test.tsx src/components/contacts/quick-add-caller.test.tsx
      - name: Confirm the known six-error web baseline
        run: |
          set +e
          pnpm --filter @workspace/adventure-zone typecheck 2>&1 | tee web-typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          set -e
          test "$typecheck_status" -ne 0
          test "$(grep -c 'error TS' web-typecheck.log)" -eq 6
      - name: Require focused tests
        if: always()
        run: test "${{ steps.focused_tests.outcome }}" = "success"
