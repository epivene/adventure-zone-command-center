name: Verify Paper Notes frontend test drift

on:
  pull_request:
    branches: [main]

jobs:
  focused-paper-notes-frontend:
    strategy:
      fail-fast: false
      matrix:
        test-file:
          - paper-note-destination-picker.test.tsx
          - paper-note-entry-card.test.tsx
          - paper-note-entry-panel-autosave.test.tsx
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run focused test file
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run
          src/components/paper-notes/${{ matrix.test-file }}
          --reporter=verbose
