name: Apply Lead Scout PGlite row typing

on:
  push:
    branches:
      - fix/lead-scout-pglite-row-typing
    paths:
      - ".github/workflows/apply-lead-scout-pglite-row-typing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lead-scout-pglite-row-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm stale PGlite row errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          for file in lead-scout-candidate-save-store.test.ts lead-scout-enrichment-repository.test.ts; do
            grep -E "${file//./\\.}.*error TS2339" /tmp/api-before.log >/dev/null || {
              echo "Expected PGlite row property errors were not present for $file." >&2
              exit 1
            }
          done
      - name: Read PGlite test rows through guarded helpers
        run: |
          python - <<'PY'
          from pathlib import Path

          candidate = Path('artifacts/api-server/src/features/assistant/lead-scout-candidate-save-store.test.ts')
          text = candidate.read_text()
          marker = 'import { PostgresLeadScoutCandidateSaveLinker } from "./lead-scout-candidate-save-store";\n'
          helper = marker + '''\nfunction rowValue(rows: unknown[], index: number, key: string): unknown {\n  const row = rows[index];\n  return row && typeof row === "object" && !Array.isArray(row) && key in row\n    ? (row as Record<string, unknown>)[key]\n    : undefined;\n}\n'''
          if marker not in text:
              raise SystemExit('candidate import marker not found')
          text = text.replace(marker, helper, 1)
          text = text.replace('String(run.rows[0]?.id)', 'String(rowValue(run.rows, 0, "id"))')
          text = text.replace('String(candidate.rows[0]?.id)', 'String(rowValue(candidate.rows, 0, "id"))')
          text = text.replace('count.rows[0]?.count', 'rowValue(count.rows, 0, "count")')
          candidate.write_text(text)

          enrichment = Path('artifacts/api-server/src/features/assistant/lead-scout-enrichment-repository.test.ts')
          text = enrichment.read_text()
          marker = 'import type { LeadScoutEvidenceFact } from "./lead-scout-types";\n'
          helper = marker + '''\nfunction rowValue(rows: unknown[], index: number, key: string): unknown {\n  const row = rows[index];\n  return row && typeof row === "object" && !Array.isArray(row) && key in row\n    ? (row as Record<string, unknown>)[key]\n    : undefined;\n}\n'''
          if marker not in text:
              raise SystemExit('enrichment import marker not found')
          text = text.replace(marker, helper, 1)
          text = text.replace('String(run.rows[0]?.id)', 'String(rowValue(run.rows, 0, "id"))')
          text = text.replace('String(other.rows[0]?.id)', 'String(rowValue(other.rows, 0, "id"))')
          text = text.replace('String(candidate.rows[0]?.id)', 'String(rowValue(candidate.rows, 0, "id"))')
          text = text.replace('String(source.rows[0]?.id)', 'String(rowValue(source.rows, 0, "id"))')
          text = text.replace('rows[0]?.fact_key', 'rowValue(rows, 0, "fact_key")')
          text = text.replace('rows[0]?.fact_value', 'rowValue(rows, 0, "fact_value")')
          text = text.replace('rows[0]?.source_ids', 'rowValue(rows, 0, "source_ids")')
          enrichment.write_text(text)
          PY
      - name: Run focused Lead Scout PGlite tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/features/assistant/lead-scout-candidate-save-store.test.ts \
            src/features/assistant/lead-scout-enrichment-repository.test.ts
      - name: Commit verified test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/features/assistant/lead-scout-candidate-save-store.test.ts \
            artifacts/api-server/src/features/assistant/lead-scout-enrichment-repository.test.ts
          git diff --cached --quiet || git commit -m "test: guard Lead Scout PGlite row access"
          git push origin HEAD:fix/lead-scout-pglite-row-typing
      - run: pnpm run typecheck:libs
      - name: Verify Lead Scout row errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          for file in lead-scout-candidate-save-store.test.ts lead-scout-enrichment-repository.test.ts; do
            if grep -E "${file//./\\.}.*error TS2339" /tmp/api-after.log; then
              echo "PGlite row property errors remain in $file." >&2
              exit 1
            fi
          done
