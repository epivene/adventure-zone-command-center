name: Export Kristy manager review audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/export-kristy-manager-review-audit.yml"
      - "artifacts/api-server/src/routes/assistant-manager-review-audit.ts"
      - "artifacts/api-server/src/app.ts"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-kristy-manager-review-audit.yml"
      - "artifacts/api-server/src/routes/assistant-manager-review-audit.ts"
      - "artifacts/api-server/src/app.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build protected audit route with the production API
        run: pnpm --filter @workspace/api-server run build
      - name: Guard the read-only token boundary and route mount
        run: |
          grep -F 'managerReviewAuditRouter.use(requireAssistantImportToken);' artifacts/api-server/src/routes/assistant-manager-review-audit.ts
          grep -F 'managerReviewAuditRouter.get("/manager-review-audit"' artifacts/api-server/src/routes/assistant-manager-review-audit.ts
          grep -F 'assistantManagerReviewAuditRouter' artifacts/api-server/src/app.ts
          if grep -Eq 'managerReviewAuditRouter\.(post|put|patch|delete)\(' artifacts/api-server/src/routes/assistant-manager-review-audit.ts; then
            echo "The audit route must remain read-only."
            exit 1
          fi

  export:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Wait for the deployed audit endpoint
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          BASE_URL="${API_URL%/}"
          rm -f kristy-manager-review-audit.json

          for attempt in $(seq 1 60); do
            HTTP_STATUS=$(curl --silent --show-error \
              --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --output kristy-manager-review-audit.json \
              --write-out "%{http_code}" \
              "${BASE_URL}/api/assistant-import/manager-review-audit?manager=Kristy" || true)

            if [ "${HTTP_STATUS}" = "200" ] && node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('kristy-manager-review-audit.json','utf8')); if(x.ok!==true || !x.leg || !Array.isArray(x.bookings)) process.exit(1)"; then
              echo "Live Kristy manager review audit exported on attempt ${attempt}."
              exit 0
            fi

            echo "Audit endpoint not ready yet (HTTP ${HTTP_STATUS}, attempt ${attempt})."
            sleep 15
          done

          echo "The deployed audit endpoint never returned a valid report."
          cat kristy-manager-review-audit.json 2>/dev/null || true
          exit 1

      - name: Require the exact live cleanup result
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('kristy-manager-review-audit.json', 'utf8'));
          const byId = new Map(report.bookings.map((booking) => [booking.id, booking]));
          const expectedDismissed = [
            ['ff3dce3f-dad2-41a9-9ecf-c87bd448ed6f', 'Moorcroft Jubilee Days'],
            ['e082626f-1759-48b7-b77c-4d6188e42ee9', 'Sublette County Fair'],
            ['21103588-3110-4a60-ac2c-d4f12655d5c5', 'Uinta County Fair'],
            ['7320b7c9-91bf-4960-bda4-50b0d5b13815', 'Laramie County Fair'],
            ['0ea10087-96ba-4268-8d32-b86a615a0896', 'Chouteau County Fair'],
          ];

          for (const [id, name] of expectedDismissed) {
            const booking = byId.get(id);
            if (!booking || booking.name !== name || booking.state !== 'dismissed') {
              throw new Error(`${name} was not verified as dismissed from Kristy's review queue.`);
            }
          }

          const meeteetse = byId.get('7876eafe-bff7-4a3a-b077-4ff21bfae662');
          if (!meeteetse || meeteetse.name !== 'Meeteetse Annual Labor Day Celebration 2026' || meeteetse.state !== 'upcoming') {
            throw new Error('Meeteetse was not verified as Kristy\'s upcoming event.');
          }

          const milesCity = report.bookings.find((booking) =>
            booking.state === 'completed'
            && (booking.city === 'Miles City'
              || /miles city/i.test(booking.name)
              || /eastern montana fair/i.test(booking.name)),
          );
          if (!milesCity?.review?.id) {
            throw new Error('A completed Miles City manager report was not found in the live audit.');
          }

          fs.writeFileSync('kristy-manager-review-verification.json', JSON.stringify({
            verifiedAt: new Date().toISOString(),
            leg: report.leg,
            dismissed: expectedDismissed.map(([id, name]) => ({ id, name })),
            milesCity: {
              id: milesCity.id,
              name: milesCity.name,
              city: milesCity.city,
              reviewId: milesCity.review.id,
              reviewSource: milesCity.review.source ?? 'manager_review',
              state: milesCity.state,
            },
            meeteetse: {
              id: meeteetse.id,
              name: meeteetse.name,
              startsAt: meeteetse.startsAt,
              endsAt: meeteetse.endsAt,
              state: meeteetse.state,
            },
          }, null, 2));
          NODE

      - name: Add safe audit summary
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('kristy-manager-review-audit.json', 'utf8'));
          const verification = JSON.parse(fs.readFileSync('kristy-manager-review-verification.json', 'utf8'));
          const rows = report.bookings.map((booking) =>
            `- ${booking.name} | ${booking.state} | ${booking.startsAt ?? 'no date'} | review ${booking.review?.id ?? 'none'}`,
          );
          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              '# Kristy manager review audit',
              '',
              `- Leg: ${report.leg.name}`,
              `- Manager: ${report.leg.managerName ?? 'unnamed'}`,
              `- Total bookings: ${report.totals.bookings}`,
              `- Due: ${report.totals.due}`,
              `- Completed: ${report.totals.completed}`,
              `- Upcoming: ${report.totals.upcoming}`,
              `- Dismissed: ${report.totals.dismissed ?? 0}`,
              `- Miles City report: ${verification.milesCity.name} (${verification.milesCity.reviewSource})`,
              `- Next event: ${verification.meeteetse.name}`,
              '',
              ...rows,
              '',
            ].join('\n'),
          );
          NODE

      - name: Upload protected audit report
        uses: actions/upload-artifact@v4
        with:
          name: kristy-manager-review-audit
          path: |
            kristy-manager-review-audit.json
            kristy-manager-review-verification.json
          retention-days: 7
