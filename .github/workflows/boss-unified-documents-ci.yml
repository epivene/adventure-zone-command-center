name: Boss Unified Documents CI

on:
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/lib/boss-documents-api.ts"
      - "artifacts/adventure-zone/src/pages/BossTemplatesFilesPage.tsx"
      - "artifacts/adventure-zone/src/pages/BossTemplatesFilesPage.test.tsx"
      - "artifacts/adventure-zone/package.json"
      - "artifacts/api-server/src/routes/boss-documents.ts"
      - "artifacts/api-server/src/routes/business-documents.ts"
      - ".github/workflows/boss-unified-documents-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Boss workspace tests
        run: pnpm --filter @workspace/adventure-zone test:boss
      - name: Business document route tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/business-documents.test.ts
      - name: Build API and frontend
        run: pnpm --filter @workspace/api-server --filter @workspace/adventure-zone build
