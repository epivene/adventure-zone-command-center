name: Boss Unified Documents CI

on:
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/lib/boss-documents-api.ts"
      - "artifacts/adventure-zone/src/lib/office-documents-api.ts"
      - "artifacts/adventure-zone/src/components/business-documents/role-business-documents-page.tsx"
      - "artifacts/adventure-zone/src/components/boss/boss-shell.tsx"
      - "artifacts/adventure-zone/src/components/office/office-shell.tsx"
      - "artifacts/adventure-zone/src/pages/BossProfilesPage.tsx"
      - "artifacts/adventure-zone/src/pages/BossProfilePage.tsx"
      - "artifacts/adventure-zone/src/pages/BossProfilesPage.search.test.tsx"
      - "artifacts/adventure-zone/src/pages/BossProfileContactEditing.test.tsx"
      - "artifacts/adventure-zone/src/components/boss/boss-profile-emails.tsx"
      - "artifacts/adventure-zone/src/components/google-workspace/**"
      - "artifacts/adventure-zone/src/components/profiles/profile-at-a-glance.tsx"
      - "artifacts/adventure-zone/src/components/organizations/organization-list.tsx"
      - "artifacts/api-server/src/features/boss/boss-profile-view*"
      - "artifacts/api-server/src/features/organizations/profile-card-details.ts"
      - "artifacts/api-server/src/features/organizations/organization-directory-page.ts"
      - "artifacts/api-server/src/features/office/office-profile-service.ts"
      - "artifacts/adventure-zone/src/pages/OfficeDocumentsPage.tsx"
      - "artifacts/adventure-zone/src/App.tsx"
      - "artifacts/adventure-zone/src/pages/BossTemplatesFilesPage.tsx"
      - "artifacts/adventure-zone/src/pages/BossTemplatesFilesPage.test.tsx"
      - "artifacts/adventure-zone/package.json"
      - "artifacts/api-server/src/routes/boss-documents.ts"
      - "artifacts/api-server/src/routes/boss-business-documents.ts"
      - "artifacts/api-server/src/routes/boss-business-documents.test.ts"
      - "artifacts/api-server/src/routes/business-documents.ts"
      - "artifacts/api-server/src/routes/boss-profiles.ts"
      - "artifacts/api-server/src/routes/office-profiles.ts"
      - "artifacts/api-server/src/routes/office-documents.ts"
      - "artifacts/api-server/src/routes/office-documents.test.ts"
      - "artifacts/api-server/src/features/business-documents/business-document-ingestion.ts"
      - "artifacts/api-server/src/features/business-documents/business-document-ingestion.test.ts"
      - "artifacts/api-server/src/features/business-documents/business-document-types.ts"
      - "artifacts/api-server/src/features/business-documents/business-document-repository.ts"
      - "artifacts/api-server/src/features/business-documents/business-document-repository.test.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - ".github/workflows/boss-unified-documents-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Boss workspace tests
        run: pnpm --filter @workspace/adventure-zone test:boss
      - name: Boss profile search and editing tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run --config vitest.config.ts src/pages/BossProfilesPage.search.test.tsx src/pages/BossProfileContactEditing.test.tsx src/components/google-workspace/profile-google-email-panel.test.tsx
      - name: Boss profile facts and Office privacy tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/boss/boss-profile-view.test.ts src/features/office/office-profile-service.test.ts src/routes/boss-profile-emails.test.ts src/routes/boss-profile-contact-edit.test.ts
      - name: Business document route tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/business-documents.test.ts src/routes/boss-business-documents.test.ts src/routes/office-documents.test.ts src/features/business-documents/business-document-ingestion.test.ts src/features/business-documents/business-document-repository.test.ts
      - name: Build API and frontend
        run: pnpm --filter @workspace/api-server --filter @workspace/adventure-zone build
