name: Manager Comms Task3 Green
on:
  push:
    branches: [feature/manager-communications-acknowledgments]
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[task3-green]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerMessagesPage.test.tsx
      - run: pnpm --filter @workspace/adventure-zone typecheck
      - run: pnpm --filter @workspace/adventure-zone build
      - run: grep -q '/manager/messages' artifacts/adventure-zone/src/App.tsx
      - run: grep -q '>Messages</Link>' artifacts/adventure-zone/src/components/manager/manager-shell.tsx
