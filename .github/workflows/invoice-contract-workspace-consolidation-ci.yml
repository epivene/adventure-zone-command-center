name: Invoice Contract Workspace Consolidation CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused frontend tests
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run
          src/features/today/today-focus.test.ts
          src/components/today/invoice-contract-workspace-card.test.tsx
          src/components/today/needs-attention-semantics.test.ts
          src/pages/BookingsPage.contract-attention.test.ts
      - name: Frontend typecheck
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: Frontend production build
        run: pnpm --filter @workspace/adventure-zone build
