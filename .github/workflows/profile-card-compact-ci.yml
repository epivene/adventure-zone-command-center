name: Profile Card Compact CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/routes/organizations.ts"
      - "artifacts/api-server/src/routes/organizations.profile-card-details.test.ts"
      - "artifacts/adventure-zone/src/components/organizations/organization-list.tsx"
      - "artifacts/adventure-zone/src/components/organizations/organization-list-card.test.tsx"
      - ".github/workflows/profile-card-compact-ci.yml"
  workflow_dispatch:

jobs:
  profile-card-compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Profile card tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/routes/organizations.profile-card-details.test.ts
          pnpm --filter @workspace/adventure-zone exec vitest run --config vitest.config.ts src/components/organizations/organization-list-card.test.tsx
      - name: Workspace typecheck
        run: pnpm run typecheck
      - name: Workspace build
        run: pnpm run build
