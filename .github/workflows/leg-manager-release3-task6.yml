name: Leg Manager Release 3 Task 6
on:
  push:
    branches: [feature/leg-manager-crew-aftermath]
jobs:
  task6:
    if: "!contains(github.event.head_commit.message, '[skip release3-task6]')"
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Add incident repository
        run: |
          cat > artifacts/api-server/src/features/leg-manager/incident-repository.ts <<'EOF'
          import { and, desc, eq } from "drizzle-orm";
          import type { NodePgDatabase } from "drizzle-orm/node-postgres";
          import * as schema from "@/db/schema";
          import { bookings, legIncidentAttachments, legIncidents, trips } from "@/db/schema";

          export type IncidentInput = {
            id: string;
            type: string;
            occurredAt: Date;
            bookingId: string | null;
            tripId: string | null;
            locationText: string | null;
            peopleInvolved: string | null;
            description: string;
            actionTaken: string | null;
            followUpNeeded: boolean;
            clientMutationId: string;
          };
          export interface IncidentStore {
            findByMutation(legId:string,clientMutationId:string):Promise<any|null>;
            bookingBelongsToLeg(bookingId:string,legId:string):Promise<boolean>;
            tripBelongsToLeg(tripId:string,legId:string):Promise<boolean>;
            insertIncident(input:IncidentInput&{legId:string}):Promise<any>;
            listAll():Promise<any[]>;
          }
          export async function createIncidentForManager(store:IncidentStore,legId:string,input:IncidentInput){const existing=await store.findByMutation(legId,input.clientMutationId);if(existing)return{ok:true as const,idempotent:true,incident:existing};if(input.bookingId&&!(await store.bookingBelongsToLeg(input.bookingId,legId)))return{ok:false as const,code:"FORBIDDEN" as const};if(input.tripId&&!(await store.tripBelongsToLeg(input.tripId,legId)))return{ok:false as const,code:"FORBIDDEN" as const};return{ok:true as const,idempotent:false,incident:await store.insertIncident({...input,legId})};}
          export class DrizzleIncidentRepository implements IncidentStore{
            constructor(private readonly database:NodePgDatabase<typeof schema>){}
            async findByMutation(legId:string,id:string){return (await this.database.select().from(legIncidents).where(and(eq(legIncidents.legId,legId),eq(legIncidents.clientMutationId,id))).limit(1))[0]??null}
            async bookingBelongsToLeg(id:string,legId:string){return !!(await this.database.select({id:bookings.id}).from(bookings).where(and(eq(bookings.id,id),eq(bookings.travelLegId,legId))).limit(1))[0]}
            async tripBelongsToLeg(id:string,legId:string){return !!(await this.database.select({id:trips.id}).from(trips).where(and(eq(trips.id,id),eq(trips.travelLegId,legId))).limit(1))[0]}
            async insertIncident(input:IncidentInput&{legId:string}){const rows=await this.database.insert(legIncidents).values(input).onConflictDoNothing({target:[legIncidents.legId,legIncidents.clientMutationId]}).returning();if(rows[0])return rows[0];const existing=await this.findByMutation(input.legId,input.clientMutationId);if(!existing)throw new Error("Incident insert conflicted without existing row");return existing}
            async listAll(){return this.database.select().from(legIncidents).orderBy(desc(legIncidents.occurredAt))}
            async listForLeg(legId:string){return this.database.select().from(legIncidents).where(eq(legIncidents.legId,legId)).orderBy(desc(legIncidents.occurredAt))}
            async createAttachment(input:{id:string;legId:string;incidentId:string;clientMutationId:string;mimeType:string|null}){const rows=await this.database.insert(legIncidentAttachments).values(input).onConflictDoNothing({target:[legIncidentAttachments.legId,legIncidentAttachments.clientMutationId]}).returning();return rows[0]??(await this.database.select().from(legIncidentAttachments).where(and(eq(legIncidentAttachments.legId,input.legId),eq(legIncidentAttachments.clientMutationId,input.clientMutationId))).limit(1))[0]}
            async getAttachment(legId:string,id:string){return (await this.database.select().from(legIncidentAttachments).where(and(eq(legIncidentAttachments.legId,legId),eq(legIncidentAttachments.id,id))).limit(1))[0]??null}
            async setAttachmentUploaded(legId:string,id:string,objectKey:string,mimeType:string){return (await this.database.update(legIncidentAttachments).set({objectKey,imageStatus:"image_uploaded",mimeType,updatedAt:new Date()}).where(and(eq(legIncidentAttachments.id,id),eq(legIncidentAttachments.legId,legId))).returning())[0]??null}
          }
          EOF
      - name: Add migration 040 and schema
        run: |
          cat > lib/db/migrations/040_leg_incidents.sql <<'EOF'
          create table if not exists leg_incidents (
            id uuid primary key,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            booking_id uuid references bookings(id) on delete set null,
            trip_id uuid references trips(id) on delete set null,
            type text not null,
            occurred_at timestamptz not null,
            location_text text,
            people_involved text,
            description text not null,
            action_taken text,
            follow_up_needed boolean not null default false,
            client_mutation_id uuid not null,
            revision integer not null default 1,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint leg_incidents_type_nonblank check (nullif(trim(type),'') is not null),
            constraint leg_incidents_description_nonblank check (nullif(trim(description),'') is not null),
            constraint leg_incidents_revision_positive check (revision >= 1),
            constraint leg_incidents_leg_mutation_unique unique (leg_id, client_mutation_id)
          );
          create index if not exists leg_incidents_leg_occurred_idx on leg_incidents(leg_id, occurred_at desc);
          create index if not exists leg_incidents_booking_idx on leg_incidents(booking_id);

          create table if not exists leg_incident_attachments (
            id uuid primary key,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            incident_id uuid not null references leg_incidents(id) on delete cascade,
            object_key text,
            image_status text not null default 'image_pending',
            mime_type text,
            client_mutation_id uuid not null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint leg_incident_attachments_status_valid check (image_status in ('image_pending','image_uploaded','image_failed')),
            constraint leg_incident_attachments_leg_mutation_unique unique (leg_id, client_mutation_id)
          );
          create index if not exists leg_incident_attachments_incident_idx on leg_incident_attachments(incident_id);
          EOF
          cat >> lib/db/src/schema/index.ts <<'EOF'

          export const legIncidents = pgTable("leg_incidents", {
            id: uuid("id").primaryKey(),
            legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
            bookingId: uuid("booking_id").references(() => bookings.id, { onDelete: "set null" }),
            tripId: uuid("trip_id").references(() => trips.id, { onDelete: "set null" }),
            type: text("type").notNull(),
            occurredAt: timestamp("occurred_at", { withTimezone: true }).notNull(),
            locationText: text("location_text"),
            peopleInvolved: text("people_involved"),
            description: text("description").notNull(),
            actionTaken: text("action_taken"),
            followUpNeeded: boolean("follow_up_needed").default(false).notNull(),
            clientMutationId: uuid("client_mutation_id").notNull(),
            revision: integer("revision").default(1).notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
          }, (table) => [
            uniqueIndex("leg_incidents_leg_mutation_unique").on(table.legId, table.clientMutationId),
            index("leg_incidents_leg_occurred_idx").on(table.legId, table.occurredAt.desc()),
            index("leg_incidents_booking_idx").on(table.bookingId),
            check("leg_incidents_type_nonblank", sql`nullif(trim(${table.type}), '') is not null`),
            check("leg_incidents_description_nonblank", sql`nullif(trim(${table.description}), '') is not null`),
            check("leg_incidents_revision_positive", sql`${table.revision} >= 1`),
          ]);

          export const legIncidentAttachments = pgTable("leg_incident_attachments", {
            id: uuid("id").primaryKey(),
            legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
            incidentId: uuid("incident_id").notNull().references(() => legIncidents.id, { onDelete: "cascade" }),
            objectKey: text("object_key"),
            imageStatus: text("image_status").default("image_pending").notNull(),
            mimeType: text("mime_type"),
            clientMutationId: uuid("client_mutation_id").notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
            updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
          }, (table) => [
            uniqueIndex("leg_incident_attachments_leg_mutation_unique").on(table.legId, table.clientMutationId),
            index("leg_incident_attachments_incident_idx").on(table.incidentId),
            check("leg_incident_attachments_status_valid", sql`${table.imageStatus} in ('image_pending','image_uploaded','image_failed')`),
          ]);
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/db/src/migrations.ts');s=p.read_text()
          if '040_leg_incidents.sql' not in s:
              block='''  {
            name: "040_leg_incidents.sql",
            markerSql: "SELECT to_regclass(current_schema() || '.leg_incidents') IS NOT NULL AND to_regclass(current_schema() || '.leg_incident_attachments') IS NOT NULL AS ready",
          },
          '''
              s=s.replace('] as const;',block+'] as const;');p.write_text(s)
          PY
      - name: Wire manager and owner incident APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/leg-manager.ts');s=p.read_text()
          if 'DrizzleIncidentRepository' not in s:
              s=s.replace('import { createReviewForManager, DrizzleEventReviewRepository, listDueReviewsForManager } from "@/features/leg-manager/event-review-repository";', 'import { createReviewForManager, DrizzleEventReviewRepository, listDueReviewsForManager } from "@/features/leg-manager/event-review-repository";\nimport { createIncidentForManager, DrizzleIncidentRepository } from "@/features/leg-manager/incident-repository";')
              s=s.replace('const router:IRouter=Router();const requireManager=createRequireLegManagerMiddleware(new DrizzleLegManagerRepository(db));const finance=new DrizzleFinanceRepository(db);const crew=new DrizzleCrewRepository(db);const reviews=new DrizzleEventReviewRepository(db);', 'const router:IRouter=Router();const requireManager=createRequireLegManagerMiddleware(new DrizzleLegManagerRepository(db));const finance=new DrizzleFinanceRepository(db);const crew=new DrizzleCrewRepository(db);const reviews=new DrizzleEventReviewRepository(db);const incidents=new DrizzleIncidentRepository(db);')
          marker='\nconst issueSchema='
          block='''\nconst incidentSchema=z.object({id:z.string().uuid(),type:z.string().trim().min(1).max(120),occurredAt:z.coerce.date(),bookingId:z.string().uuid().nullable().optional(),tripId:z.string().uuid().nullable().optional(),locationText:z.string().trim().max(500).nullable().optional(),peopleInvolved:z.string().trim().max(2000).nullable().optional(),description:z.string().trim().min(1).max(12000),actionTaken:z.string().trim().max(8000).nullable().optional(),followUpNeeded:z.boolean(),clientMutationId:z.string().uuid()});\nrouter.get("/manager/incidents",requireManager,async(req,res)=>{res.json({incidents:await incidents.listForLeg(req.legManager!.legId)});});\nrouter.post("/manager/incidents",requireManager,async(req,res):Promise<void>=>{const parsed=incidentSchema.safeParse(req.body);if(!parsed.success){res.status(400).json({error:parsed.error.issues[0]?.message??"Invalid incident"});return;}const result=await createIncidentForManager(incidents,req.legManager!.legId,{...parsed.data,bookingId:parsed.data.bookingId??null,tripId:parsed.data.tripId??null,locationText:parsed.data.locationText??null,peopleInvolved:parsed.data.peopleInvolved??null,actionTaken:parsed.data.actionTaken??null});if(!result.ok){res.status(403).json({error:"Booking or trip is outside your leg"});return;}res.status(result.idempotent?200:201).json({incident:result.incident});});\nconst incidentAttachment=z.object({id:z.string().uuid(),incidentId:z.string().uuid(),clientMutationId:z.string().uuid(),mimeType:z.string().max(120).nullable().optional()});\nrouter.post("/manager/incident-attachments",requireManager,async(req,res):Promise<void>=>{const parsed=incidentAttachment.safeParse(req.body);if(!parsed.success){res.status(400).json({error:"Invalid attachment"});return;}const row=await incidents.createAttachment({id:parsed.data.id,legId:req.legManager!.legId,incidentId:parsed.data.incidentId,clientMutationId:parsed.data.clientMutationId,mimeType:parsed.data.mimeType??null});res.status(201).json({attachment:row});});\nrouter.put("/manager/incident-attachments/:attachmentId/image",requireManager,express.raw({type:"image/*",limit:"12mb"}),async(req,res):Promise<void>=>{const raw=req.params.attachmentId;const id=Array.isArray(raw)?raw[0]??"":raw;const attachment=await incidents.getAttachment(req.legManager!.legId,id);if(!attachment){res.status(403).json({error:"Attachment is outside your leg"});return;}const bytes=req.body instanceof Buffer?new Uint8Array(req.body):new Uint8Array();if(!bytes.length){res.status(400).json({error:"Image required"});return;}const header=req.headers["content-type"];const mime=Array.isArray(header)?header[0]??"image/jpeg":header??"image/jpeg";const key=`leg-incidents/${req.legManager!.legId}/${id}`;await receiptStorage.put(key,bytes,mime);res.json({attachment:await incidents.setAttachmentUploaded(req.legManager!.legId,id,key,mime)});});\n'''
          if '/manager/incidents"' not in s:s=s.replace(marker,block+marker)
          p.write_text(s)

          p=Path('artifacts/api-server/src/routes/leg-manager-admin.ts');s=p.read_text()
          if 'DrizzleIncidentRepository' not in s:
              s=s.replace('import { crewRehireStatuses } from "@/features/leg-manager/crew-types";', 'import { crewRehireStatuses } from "@/features/leg-manager/crew-types";\nimport { DrizzleIncidentRepository } from "@/features/leg-manager/incident-repository";')
              s=s.replace('const router:IRouter=Router(),repo=new DrizzleLegManagerRepository(db),crew=new DrizzleCrewRepository(db);', 'const router:IRouter=Router(),repo=new DrizzleLegManagerRepository(db),crew=new DrizzleCrewRepository(db),incidents=new DrizzleIncidentRepository(db);')
          if '/manager-admin/incidents' not in s:s=s.replace('\nexport default router;', '\nrouter.get("/manager-admin/incidents",async(_req,res)=>{res.json({incidents:await incidents.listAll()});});\n\nexport default router;')
          p.write_text(s)
          PY
      - name: Add incident UI
        run: |
          cat > artifacts/adventure-zone/src/pages/ManagerIncidentPage.tsx <<'EOF'
          import { useState } from "react";import { useManagerAuth } from "@/lib/manager-auth-context";import { queueManagerMutation,flushManagerMutationQueue } from "@/lib/manager-sync-queue";import { queueManagerBlob,flushManagerBlobQueue } from "@/lib/manager-blob-queue";
          export default function ManagerIncidentPage(){const{manager,managerApi}=useManagerAuth();const[type,setType]=useState("");const[description,setDescription]=useState("");const[action,setAction]=useState("");const[people,setPeople]=useState("");const[location,setLocation]=useState("");const[follow,setFollow]=useState(false);const[file,setFile]=useState<File|null>(null);const[status,setStatus]=useState("");async function submit(e:React.FormEvent){e.preventDefault();if(!manager)return;const incidentId=crypto.randomUUID(),mutationId=crypto.randomUUID();await queueManagerMutation({id:mutationId,legId:manager.legId,path:"/manager/incidents",method:"POST",body:{id:incidentId,type,occurredAt:new Date().toISOString(),bookingId:null,tripId:null,locationText:location||null,peopleInvolved:people||null,description,actionTaken:action||null,followUpNeeded:follow,clientMutationId:mutationId},createdAt:new Date().toISOString()});if(file){const attachmentId=crypto.randomUUID();await queueManagerMutation({id:attachmentId,legId:manager.legId,path:"/manager/incident-attachments",method:"POST",body:{id:attachmentId,incidentId,clientMutationId:attachmentId,mimeType:file.type||"image/jpeg"},createdAt:new Date().toISOString()});await queueManagerBlob({id:attachmentId,legId:manager.legId,receiptId:attachmentId,blob:file,createdAt:new Date().toISOString()})}setStatus("Saved offline");if(navigator.onLine){await flushManagerMutationQueue(managerApi);await flushManagerBlobQueue(async row=>{await managerApi(`/manager/incident-attachments/${row.receiptId}/image`,{method:"PUT",headers:{"Content-Type":row.blob.type||"image/jpeg"},body:row.blob})});setStatus("Synced")}}return <form onSubmit={submit} className="grid gap-3"><h1 className="text-2xl font-bold">Report incident</h1><label className="grid gap-1 font-semibold">Incident type<input aria-label="Incident type" value={type} onChange={e=>setType(e.target.value)} required/></label><label className="grid gap-1 font-semibold">Location<input value={location} onChange={e=>setLocation(e.target.value)}/></label><label className="grid gap-1 font-semibold">People involved<textarea value={people} onChange={e=>setPeople(e.target.value)}/></label><label className="grid gap-1 font-semibold">Description<textarea aria-label="Incident description" value={description} onChange={e=>setDescription(e.target.value)} required/></label><label className="grid gap-1 font-semibold">Action taken<textarea value={action} onChange={e=>setAction(e.target.value)}/></label><label className="flex gap-2"><input type="checkbox" checked={follow} onChange={e=>setFollow(e.target.checked)}/>Follow-up needed</label><label className="grid gap-1 font-semibold">Photo<input type="file" accept="image/*" capture="environment" onChange={e=>setFile(e.target.files?.[0]??null)}/></label><button className="button-primary">Save incident</button>{status?<p role="status">{status}</p>:null}</form>}
          EOF
          cat > artifacts/adventure-zone/src/pages/ManagerIncidentsPage.tsx <<'EOF'
          import { useEffect,useState } from "react";import { Link } from "wouter";import { useManagerAuth } from "@/lib/manager-auth-context";
          export default function ManagerIncidentsPage(){const{managerApi}=useManagerAuth();const[rows,setRows]=useState<any[]>([]);useEffect(()=>{managerApi<any>("/manager/incidents").then(d=>setRows(d.incidents??[]))},[managerApi]);return <div className="grid gap-4"><div className="flex items-center justify-between"><h1 className="text-2xl font-bold">Incidents</h1><Link href="/manager/incidents/new" className="button-primary">Report incident</Link></div>{rows.map(row=><article key={row.id} className="rounded-xl border bg-white p-4"><b>{row.type}</b><p>{row.description}</p>{row.followUpNeeded?<p className="font-semibold text-amber-700">Follow-up needed</p>:null}</article>)}</div>}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/adventure-zone/src/App.tsx');s=p.read_text()
          if 'ManagerIncidentPage' not in s:s=s.replace('import ManagerEventReviewPage from "@/pages/ManagerEventReviewPage";', 'import ManagerEventReviewPage from "@/pages/ManagerEventReviewPage";\nimport ManagerIncidentPage from "@/pages/ManagerIncidentPage";\nimport ManagerIncidentsPage from "@/pages/ManagerIncidentsPage";')
          if '/manager/incidents/new' not in s:s=s.replace('<Route path="/manager/reviews"><ManagerEventReviewPage /></Route>', '<Route path="/manager/incidents/new"><ManagerIncidentPage /></Route>\n        <Route path="/manager/incidents"><ManagerIncidentsPage /></Route>\n        <Route path="/manager/reviews"><ManagerEventReviewPage /></Route>')
          p.write_text(s)
          PY
      - name: Verify Task 6
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/incident-repository.test.ts
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/adventure-zone typecheck
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/adventure-zone build
      - name: Commit Task 6
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/features/leg-manager/incident-repository.ts artifacts/api-server/src/features/leg-manager/incident-repository.test.ts artifacts/api-server/src/routes/leg-manager.ts artifacts/api-server/src/routes/leg-manager-admin.ts lib/db/migrations/040_leg_incidents.sql lib/db/src/schema/index.ts lib/db/src/migrations.ts artifacts/adventure-zone/src/pages/ManagerIncidentPage.tsx artifacts/adventure-zone/src/pages/ManagerIncidentsPage.tsx artifacts/adventure-zone/src/App.tsx
          git commit -m 'feat: add manager incident tracking [skip release3-task1] [skip release3-task2] [skip release3-task3] [skip release3-task4] [skip release3-task6]'
          git push
