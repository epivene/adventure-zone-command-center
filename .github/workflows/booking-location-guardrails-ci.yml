name: Booking Location Guardrails CI

on:
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/components/bookings/booking-form.tsx"
      - "artifacts/adventure-zone/src/components/bookings/booking-form.test.tsx"
      - "artifacts/adventure-zone/src/features/bookings/booking-input.ts"
      - "artifacts/adventure-zone/src/features/bookings/booking-input.test.ts"
      - "artifacts/api-server/src/features/bookings/booking-input.ts"
      - "artifacts/api-server/src/features/bookings/booking-input.test.ts"
      - ".github/workflows/booking-location-guardrails-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: API location policy tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/bookings/booking-input.test.ts
      - name: Booking form location tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/bookings/booking-input.test.ts src/components/bookings/booking-form.test.tsx
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone build
      - name: API build
        run: pnpm --filter @workspace/api-server build
