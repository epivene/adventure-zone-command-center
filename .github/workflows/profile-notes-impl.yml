name: Profile notes implementation
on:
  push:
    branches: [feature/profile-family-notes-impl]

permissions:
  contents: write

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[skip profile-notes-impl]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply integration edits
        run: |
          python3 <<'PY'
          from pathlib import Path

          def edit(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing replacement in {path}: {old[:120]!r}")
              p.write_text(s.replace(old, new, count))

          # Ensure runtime-created event-family schema also contains scoped_notes.
          edit(
            "artifacts/api-server/src/features/event-families/event-family-repository.ts",
            "    CREATE INDEX IF NOT EXISTS event_family_suggestions_pending_idx ON event_family_suggestions(status, created_at DESC);\n",
            "    CREATE INDEX IF NOT EXISTS event_family_suggestions_pending_idx ON event_family_suggestions(status, created_at DESC);\n    CREATE TABLE IF NOT EXISTS scoped_notes (\n      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n      organization_location_id uuid REFERENCES organization_locations(id) ON DELETE RESTRICT,\n      event_family_id uuid REFERENCES event_families(id) ON DELETE RESTRICT,\n      body text NOT NULL,\n      source text NOT NULL DEFAULT 'local' CHECK (source = 'local'),\n      created_at timestamptz NOT NULL DEFAULT now(),\n      updated_at timestamptz NOT NULL DEFAULT now(),\n      CONSTRAINT scoped_notes_exactly_one_owner CHECK (\n        (organization_location_id IS NOT NULL)::int + (event_family_id IS NOT NULL)::int = 1\n      ),\n      CONSTRAINT scoped_notes_body_nonblank CHECK (nullif(trim(body), '') IS NOT NULL)\n    );\n    CREATE INDEX IF NOT EXISTS scoped_notes_location_created_idx ON scoped_notes(organization_location_id, created_at DESC) WHERE organization_location_id IS NOT NULL;\n    CREATE INDEX IF NOT EXISTS scoped_notes_family_created_idx ON scoped_notes(event_family_id, created_at DESC) WHERE event_family_id IS NOT NULL;\n",
          )

          # Event family note API routes.
          edit(
            "artifacts/api-server/src/routes/event-families.ts",
            'import { z } from "zod";\n',
            'import { z } from "zod";\nimport { db } from "@workspace/db";\nimport { ScopedNoteRepository } from "@/features/notes/scoped-note-repository";\n',
          )
          edit(
            "artifacts/api-server/src/routes/event-families.ts",
            'const memberSchema = z.object({ organizationId: z.string().uuid() });\n',
            'const memberSchema = z.object({ organizationId: z.string().uuid() });\nconst noteBodySchema = z.object({ body: z.string().trim().min(1, "Add note text.").max(4000) });\n',
          )
          edit(
            "artifacts/api-server/src/routes/event-families.ts",
            'function repo() {\n  return new EventFamilyRepository();\n}\n',
            'function repo() {\n  return new EventFamilyRepository();\n}\nfunction noteRepo() {\n  return new ScopedNoteRepository(db);\n}\n',
          )
          marker = 'router.post("/event-families/:id/members", async (req, res): Promise<void> => {'
          routes = '''router.get("/event-families/:id/notes", async (req, res): Promise<void> => {\n  try {\n    const familyId = idSchema.parse(req.params.id);\n    if (!(await noteRepo().ownerExists({ kind: "event_family", id: familyId }))) {\n      res.status(404).json({ ok: false, error: "Event family not found" });\n      return;\n    }\n    res.json({ notes: await noteRepo().list({ kind: "event_family", id: familyId }) });\n  } catch (error) { sendError(req, res, error); }\n});\n\nrouter.post("/event-families/:id/notes", async (req, res): Promise<void> => {\n  try {\n    const familyId = idSchema.parse(req.params.id);\n    const { body } = noteBodySchema.parse(req.body);\n    const result = await noteRepo().create({ kind: "event_family", id: familyId }, body);\n    if (!result.ok) { res.status(404).json({ ok: false, error: "Note owner not found" }); return; }\n    res.status(201).json({ ok: true, note: result.note });\n  } catch (error) { sendError(req, res, error); }\n});\n\nrouter.patch("/event-families/:id/notes/:noteId", async (req, res): Promise<void> => {\n  try {\n    const familyId = idSchema.parse(req.params.id);\n    const noteId = idSchema.parse(req.params.noteId);\n    const { body } = noteBodySchema.parse(req.body);\n    const result = await noteRepo().update({ kind: "event_family", id: familyId }, noteId, body);\n    if (!result.ok) { res.status(404).json({ ok: false, error: result.code === "OWNER_NOT_FOUND" ? "Note owner not found" : "Note not found for this owner" }); return; }\n    res.json({ ok: true, note: result.note });\n  } catch (error) { sendError(req, res, error); }\n});\n\nrouter.delete("/event-families/:id/notes/:noteId", async (req, res): Promise<void> => {\n  try {\n    const familyId = idSchema.parse(req.params.id);\n    const noteId = idSchema.parse(req.params.noteId);\n    const result = await noteRepo().remove({ kind: "event_family", id: familyId }, noteId);\n    if (!result.ok) { res.status(404).json({ ok: false, error: result.code === "OWNER_NOT_FOUND" ? "Note owner not found" : "Note not found for this owner" }); return; }\n    res.json({ ok: true });\n  } catch (error) { sendError(req, res, error); }\n});\n\n'''
          edit("artifacts/api-server/src/routes/event-families.ts", marker, routes + marker)

          # Location note API routes.
          edit(
            "artifacts/api-server/src/routes/organization-locations.ts",
            'import { db } from "@workspace/db";\n',
            'import { db } from "@workspace/db";\nimport { ScopedNoteRepository } from "@/features/notes/scoped-note-repository";\n',
          )
          edit(
            "artifacts/api-server/src/routes/organization-locations.ts",
            'function locationRepo() {\n  return new DrizzleLocationRepository(db);\n}\n',
            'function locationRepo() {\n  return new DrizzleLocationRepository(db);\n}\nfunction noteRepo() { return new ScopedNoteRepository(db); }\nconst noteBodySchema = z.object({ body: z.string().trim().min(1, "Add note text.").max(4000) });\n',
          )
          marker = '//  Activities page (cursor-keyed)\n'
          routes = '''//  Location notes\n\nrouter.get("/:locationId/notes", async (req: OrgLocationsRequest, res): Promise<void> => {\n  const organizationId = extractId(req.params.id);\n  const locationId = extractId(req.params.locationId);\n  try {\n    if (!(await locationRepo().findById(organizationId, locationId))) { res.status(404).json({ error: "Location not found" }); return; }\n    res.json({ notes: await noteRepo().list({ kind: "organization_location", id: locationId }) });\n  } catch (err) { req.log.error({ err }, "Failed to list location notes"); res.status(500).json({ error: "Failed to list location notes" }); }\n});\n\nrouter.post("/:locationId/notes", async (req: OrgLocationsRequest, res): Promise<void> => {\n  const organizationId = extractId(req.params.id);\n  const locationId = extractId(req.params.locationId);\n  const parsed = noteBodySchema.safeParse(req.body);\n  if (!parsed.success) { res.status(400).json({ ok: false, error: parsed.error.issues[0]?.message ?? "Invalid note" }); return; }\n  try {\n    if (!(await locationRepo().findById(organizationId, locationId))) { res.status(404).json({ error: "Location not found" }); return; }\n    const result = await noteRepo().create({ kind: "organization_location", id: locationId }, parsed.data.body);\n    if (!result.ok) { res.status(404).json({ ok: false, error: "Note owner not found" }); return; }\n    res.status(201).json({ ok: true, note: result.note });\n  } catch (err) { req.log.error({ err }, "Failed to create location note"); res.status(500).json({ error: "Failed to create location note" }); }\n});\n\nrouter.patch("/:locationId/notes/:noteId", async (req: OrgLocationsRequest, res): Promise<void> => {\n  const organizationId = extractId(req.params.id);\n  const locationId = extractId(req.params.locationId);\n  const noteId = extractId((req.params as any).noteId);\n  const parsed = noteBodySchema.safeParse(req.body);\n  if (!parsed.success) { res.status(400).json({ ok: false, error: parsed.error.issues[0]?.message ?? "Invalid note" }); return; }\n  try {\n    if (!(await locationRepo().findById(organizationId, locationId))) { res.status(404).json({ error: "Location not found" }); return; }\n    const result = await noteRepo().update({ kind: "organization_location", id: locationId }, noteId, parsed.data.body);\n    if (!result.ok) { res.status(404).json({ ok: false, error: "Note not found for this owner" }); return; }\n    res.json({ ok: true, note: result.note });\n  } catch (err) { req.log.error({ err }, "Failed to update location note"); res.status(500).json({ error: "Failed to update location note" }); }\n});\n\nrouter.delete("/:locationId/notes/:noteId", async (req: OrgLocationsRequest, res): Promise<void> => {\n  const organizationId = extractId(req.params.id);\n  const locationId = extractId(req.params.locationId);\n  const noteId = extractId((req.params as any).noteId);\n  try {\n    if (!(await locationRepo().findById(organizationId, locationId))) { res.status(404).json({ error: "Location not found" }); return; }\n    const result = await noteRepo().remove({ kind: "organization_location", id: locationId }, noteId);\n    if (!result.ok) { res.status(404).json({ ok: false, error: "Note not found for this owner" }); return; }\n    res.json({ ok: true });\n  } catch (err) { req.log.error({ err }, "Failed to delete location note"); res.status(500).json({ error: "Failed to delete location note" }); }\n});\n\n'''
          edit("artifacts/api-server/src/routes/organization-locations.ts", marker, routes + marker)

          # Location deletion must recognize notes as dependents.
          edit(
            "artifacts/api-server/src/features/organization-locations/location-repository.ts",
            '  organizationLocations,\n  organizations,\n',
            '  organizationLocations,\n  organizations,\n  scopedNotes,\n',
          )
          edit(
            "artifacts/api-server/src/features/organization-locations/location-repository.ts",
            '    const [[contactCount], [activityCount], [bookingCount], [followUpCount], [callSessionCount]] =\n      await Promise.all([\n',
            '    const [[contactCount], [activityCount], [bookingCount], [followUpCount], [callSessionCount], [noteCount]] =\n      await Promise.all([\n',
          )
          edit(
            "artifacts/api-server/src/features/organization-locations/location-repository.ts",
            '        this.database\n          .select({ value: count() })\n          .from(callSessions)\n          .where(eq(callSessions.organizationLocationId, locationId)),\n      ]);\n',
            '        this.database\n          .select({ value: count() })\n          .from(callSessions)\n          .where(eq(callSessions.organizationLocationId, locationId)),\n        this.database\n          .select({ value: count() })\n          .from(scopedNotes)\n          .where(eq(scopedNotes.organizationLocationId, locationId)),\n      ]);\n',
          )
          edit(
            "artifacts/api-server/src/features/organization-locations/location-repository.ts",
            '      (callSessionCount?.value ?? 0) > 0;\n',
            '      (callSessionCount?.value ?? 0) > 0 ||\n      (noteCount?.value ?? 0) > 0;\n',
          )

          # Profile timeline gets an explicit note composer while keeping all history visible.
          edit(
            "artifacts/adventure-zone/src/components/activities/activity-timeline.tsx",
            '  loadPage,\n}: {\n',
            '  loadPage,\n  noteComposer = false,\n}: {\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/activities/activity-timeline.tsx",
            '  loadPage?: (page: number) => Promise<ActivityTimelinePageResult>;\n}) {\n',
            '  loadPage?: (page: number) => Promise<ActivityTimelinePageResult>;\n  noteComposer?: boolean;\n}) {\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/activities/activity-timeline.tsx",
            '      const result = await createActivity({\n        ...parent,\n        kind: newKind,\n',
            '      const result = await createActivity({\n        ...parent,\n        kind: noteComposer ? "note" : newKind,\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/activities/activity-timeline.tsx",
            '{addOpen ? "Cancel activity" : "Add activity"}',
            '{addOpen ? (noteComposer ? "Cancel note" : "Cancel activity") : (noteComposer ? "Add note" : "Add activity")}',
          )
          edit(
            "artifacts/adventure-zone/src/components/activities/activity-timeline.tsx",
            '''              <label className="grid gap-1 text-sm font-semibold text-slate-700">\n                Activity type\n                <select\n                  className="rounded-md border border-slate-300 bg-white px-3 py-2 font-normal"\n                  onChange={(event) =>\n                    setNewKind(event.target.value as ActivityKind)\n                  }\n                  value={newKind}\n                >\n                  {manualActivityKinds.map(([value, label]) => (\n                    <option key={value} value={value}>\n                      {label}\n                    </option>\n                  ))}\n                </select>\n              </label>\n''',
            '''              {!noteComposer ? (\n                <label className="grid gap-1 text-sm font-semibold text-slate-700">\n                  Activity type\n                  <select className="rounded-md border border-slate-300 bg-white px-3 py-2 font-normal" onChange={(event) => setNewKind(event.target.value as ActivityKind)} value={newKind}>\n                    {manualActivityKinds.map(([value, label]) => <option key={value} value={value}>{label}</option>)}\n                  </select>\n                </label>\n              ) : null}\n''',
          )
          edit("artifacts/adventure-zone/src/components/activities/activity-timeline.tsx", '                Activity text\n', '                {noteComposer ? "Note" : "Activity text"}\n')
          edit("artifacts/adventure-zone/src/components/activities/activity-timeline.tsx", '{creating ? "Saving…" : "Save activity"}', '{creating ? "Saving…" : (noteComposer ? "Save note" : "Save activity")}')
          edit("artifacts/adventure-zone/src/components/activities/activity-timeline.tsx", 'No recent activity recorded.', '{noteComposer ? "No notes or call history recorded." : "No recent activity recorded."}')

          # Event profile workspace: note mode + family shared notes props/card.
          edit(
            "artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx",
            'import { groupEventProfileContacts } from "@/features/event-profiles/group-event-profile-contacts";\n',
            'import { groupEventProfileContacts } from "@/features/event-profiles/group-event-profile-contacts";\nimport { ScopedNotes } from "@/components/notes/scoped-notes";\nimport type { ScopedNoteView } from "@/features/notes/scoped-note-types";\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx",
            '  assistedCallingEnabled = false,\n}: {\n',
            '  assistedCallingEnabled = false,\n  familyNotes = [],\n  familyNotesError = null,\n  retryFamilyNotes,\n}: {\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx",
            '  assistedCallingEnabled?: boolean;\n}) {\n',
            '  assistedCallingEnabled?: boolean;\n  familyNotes?: ScopedNoteView[];\n  familyNotesError?: string | null;\n  retryFamilyNotes?: () => void;\n}) {\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx",
            '              <ActivityTimeline\n                activities={profile.notes.map((note) => ({\n',
            '              <ActivityTimeline\n                noteComposer\n                activities={profile.notes.map((note) => ({\n',
          )
          marker = '          </section>\n        </div>\n\n        <aside className="grid gap-5">\n'
          family_card = '''          </section>\n          {profile.familyContext?.kind === "event_family" ? (\n            <section className="rounded-xl border border-orange-200 bg-orange-50 p-5 shadow-sm">\n              {familyNotesError ? (\n                <div className="grid gap-2">\n                  <h2 className="text-xl font-bold">Family notes — {profile.familyContext.name}</h2>\n                  <p className="text-sm text-rose-700" role="alert">{familyNotesError}</p>\n                  {retryFamilyNotes ? <button className="button-secondary w-fit" type="button" onClick={retryFamilyNotes}>Retry family notes</button> : null}\n                  <Link className="text-sm font-semibold text-orange-800 hover:underline" href={`/event-families/${profile.familyContext.id}`}>Open event family</Link>\n                </div>\n              ) : (\n                <ScopedNotes title={`Family notes — ${profile.familyContext.name}`} notes={familyNotes} readOnly footer={<Link className="font-semibold text-orange-800 hover:underline" href={`/event-families/${profile.familyContext.id}`}>Open event family</Link>} />\n              )}\n            </section>\n          ) : null}\n        </div>\n\n        <aside className="grid gap-5">\n'''
          edit("artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx", marker, family_card)

          # Event profile page independently loads family notes.
          edit(
            "artifacts/adventure-zone/src/pages/EventProfilePage.tsx",
            'import { EventProfileWorkspace } from "@/components/event-profiles/event-profile-workspace";\n',
            'import { EventProfileWorkspace } from "@/components/event-profiles/event-profile-workspace";\nimport { listFamilyNotes } from "@/actions/scoped-notes";\nimport type { ScopedNoteView } from "@/features/notes/scoped-note-types";\n',
          )
          edit(
            "artifacts/adventure-zone/src/pages/EventProfilePage.tsx",
            '  const [callablePhoneByContactId, setCallablePhoneByContactId] = useState<Record<string, string | null>>({});\n',
            '  const [callablePhoneByContactId, setCallablePhoneByContactId] = useState<Record<string, string | null>>({});\n  const [familyNotes, setFamilyNotes] = useState<ScopedNoteView[]>([]);\n  const [familyNotesError, setFamilyNotesError] = useState<string | null>(null);\n',
          )
          edit(
            "artifacts/adventure-zone/src/pages/EventProfilePage.tsx",
            '        setCallablePhoneByContactId(Object.fromEntries(callablePhones));\n        setData(normalized);\n',
            '        setCallablePhoneByContactId(Object.fromEntries(callablePhones));\n        setFamilyNotes([]);\n        setFamilyNotesError(null);\n        if (normalized.familyContext?.kind === "event_family") {\n          listFamilyNotes(normalized.familyContext.id).then(setFamilyNotes).catch(() => setFamilyNotesError("Could not load family notes."));\n        }\n        setData(normalized);\n',
          )
          edit(
            "artifacts/adventure-zone/src/pages/EventProfilePage.tsx",
            '  if (loading) return <div className="mx-auto max-w-7xl"><p className="mt-8 text-slate-500">Loading profile…</p></div>;\n',
            '  function retryFamilyNotes() {\n    if (data?.familyContext?.kind !== "event_family") return;\n    setFamilyNotesError(null);\n    void listFamilyNotes(data.familyContext.id).then(setFamilyNotes).catch(() => setFamilyNotesError("Could not load family notes."));\n  }\n\n  if (loading) return <div className="mx-auto max-w-7xl"><p className="mt-8 text-slate-500">Loading profile…</p></div>;\n',
          )
          edit(
            "artifacts/adventure-zone/src/pages/EventProfilePage.tsx",
            '        context={{ bookingId, followUpId, action, mode }}\n',
            '        context={{ bookingId, followUpId, action, mode }}\n        familyNotes={familyNotes}\n        familyNotesError={familyNotesError}\n        retryFamilyNotes={retryFamilyNotes}\n',
          )

          # Event family page editable notes.
          p = Path("artifacts/adventure-zone/src/pages/EventFamilyPage.tsx")
          s = p.read_text()
          s = s.replace('import type { EventFamilyDetail } from "@/features/event-families/event-family-types";\n', 'import type { EventFamilyDetail } from "@/features/event-families/event-family-types";\nimport { ScopedNotes } from "@/components/notes/scoped-notes";\nimport { createFamilyNote, deleteFamilyNote, listFamilyNotes, updateFamilyNote } from "@/actions/scoped-notes";\nimport type { ScopedNoteView } from "@/features/notes/scoped-note-types";\n')
          s = s.replace('  const [error, setError] = useState<string | null>(null);\n', '  const [error, setError] = useState<string | null>(null);\n  const [familyNotes, setFamilyNotes] = useState<ScopedNoteView[]>([]);\n  const [familyNotesError, setFamilyNotesError] = useState<string | null>(null);\n')
          s = s.replace('  useEffect(() => {\n    void load();\n  }, [familyId]);\n', '  async function loadNotes() {\n    if (!familyId) return;\n    setFamilyNotesError(null);\n    try { setFamilyNotes(await listFamilyNotes(familyId)); } catch { setFamilyNotesError("Could not load family notes."); }\n  }\n\n  useEffect(() => {\n    void load();\n    void loadNotes();\n  }, [familyId]);\n')
          insert = '''\n      <section className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">\n        {familyNotesError ? (\n          <div className="grid gap-2">\n            <h2 className="text-lg font-bold">Family notes</h2>\n            <p className="text-sm text-rose-700" role="alert">{familyNotesError}</p>\n            <button className="button-secondary w-fit" type="button" onClick={() => void loadNotes()}>Retry family notes</button>\n          </div>\n        ) : (\n          <ScopedNotes\n            title="Family notes"\n            notes={familyNotes}\n            onCreate={(body) => createFamilyNote(family.id, body)}\n            onUpdate={(noteId, body) => updateFamilyNote(family.id, noteId, body)}\n            onDelete={(noteId) => deleteFamilyNote(family.id, noteId)}\n          />\n        )}\n      </section>\n\n'''
          target = '      <section className="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">\n        <div className="flex flex-wrap items-start justify-between gap-3">\n'
          if target not in s: raise SystemExit("family page insertion target missing")
          s = s.replace(target, insert + target, 1)
          p.write_text(s)

          # Location card editable notes; load independently of detail.
          edit(
            "artifacts/adventure-zone/src/components/organizations/location-card.tsx",
            'import { normalizeExternalWebsite } from "@/features/organizations/website-url";\n',
            'import { normalizeExternalWebsite } from "@/features/organizations/website-url";\nimport { ScopedNotes } from "@/components/notes/scoped-notes";\nimport { createLocationNote, deleteLocationNote, listLocationNotes, updateLocationNote } from "@/actions/scoped-notes";\nimport type { ScopedNoteView } from "@/features/notes/scoped-note-types";\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/organizations/location-card.tsx",
            '  const [detailError, setDetailError] = useState<string | null>(null);\n',
            '  const [detailError, setDetailError] = useState<string | null>(null);\n  const [locationNotes, setLocationNotes] = useState<ScopedNoteView[]>([]);\n  const [notesError, setNotesError] = useState<string | null>(null);\n  const [notesLoaded, setNotesLoaded] = useState(false);\n',
          )
          edit(
            "artifacts/adventure-zone/src/components/organizations/location-card.tsx",
            '    setDetailLoading(true);\n    setDetailError(null);\n    try {\n',
            '    setDetailLoading(true);\n    setDetailError(null);\n    if (!notesLoaded) {\n      setNotesError(null);\n      void listLocationNotes(orgId, location.id).then((notes) => { setLocationNotes(notes); setNotesLoaded(true); }).catch(() => setNotesError("Could not load location notes."));\n    }\n    try {\n',
          )
          marker = '              {/* Contacts */}\n'
          card = '''              <div>\n                {notesError ? (\n                  <div className="rounded-lg border border-rose-200 bg-rose-50 p-3 text-sm text-rose-700">\n                    <p>{notesError}</p>\n                    <button className="mt-2 font-semibold underline" type="button" onClick={() => { setNotesError(null); void listLocationNotes(orgId, location.id).then((notes) => { setLocationNotes(notes); setNotesLoaded(true); }).catch(() => setNotesError("Could not load location notes.")); }}>Retry location notes</button>\n                  </div>\n                ) : (\n                  <ScopedNotes\n                    title="Location notes"\n                    notes={locationNotes}\n                    onCreate={(body) => createLocationNote(orgId, location.id, body)}\n                    onUpdate={(noteId, body) => updateLocationNote(orgId, location.id, noteId, body)}\n                    onDelete={(noteId) => deleteLocationNote(orgId, location.id, noteId)}\n                  />\n                )}\n              </div>\n\n'''
          edit("artifacts/adventure-zone/src/components/organizations/location-card.tsx", marker, card + marker)
          PY
      - name: Verify builds
        run: |
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/adventure-zone typecheck
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/adventure-zone build
      - name: Commit implementation
        run: |
          git config user.name "epivene"
          git config user.email "Desieleighc@gmail.com"
          git add lib/db artifacts/api-server artifacts/adventure-zone
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add profile location and family notes [skip profile-notes-impl]"
          git push
