name: Inspect Colorado Events family

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/inspect-colorado-events-family.yml"

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Inspect live profiles and family membership
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const base = process.env.API_URL.replace(/\/$/, "");
          const token = process.env.ASSISTANT_IMPORT_TOKEN;

          async function search(q) {
            const response = await fetch(
              `${base}/api/assistant-import/profile-search?q=${encodeURIComponent(q)}&limit=20`,
              { headers: { Authorization: `Bearer ${token}` } },
            );
            const text = await response.text();
            if (!response.ok) throw new Error(`HTTP ${response.status}: ${text.slice(0, 500)}`);
            return JSON.parse(text);
          }

          (async () => {
            const [boulder, family] = await Promise.all([
              search("Boulder Art Festival"),
              search("ColoradoEvents.org"),
            ]);
            const receipt = {
              inspectedAt: new Date().toISOString(),
              boulderArtFestivalResults: boulder.results ?? [],
              coloradoEventsFamilyResults: family.results ?? [],
            };
            fs.writeFileSync("colorado-events-family-inspection.json", JSON.stringify(receipt, null, 2));

            const boulderProfiles = receipt.boulderArtFestivalResults.filter(
              (item) => item.kind === "organization" && /boulder art festival/i.test(item.label),
            );
            const familyMatchesFromBoulder = receipt.boulderArtFestivalResults.filter(
              (item) => item.kind === "event_family",
            );
            const familyRecord = receipt.coloradoEventsFamilyResults.find(
              (item) => item.kind === "event_family" && /coloradoevents\.org/i.test(item.label),
            );
            const members = receipt.coloradoEventsFamilyResults.filter(
              (item) => item.kind === "organization" && item.matchedOn?.includes("family"),
            );

            const lines = [
              "# Colorado Events family inspection",
              "",
              `- Boulder Art Festival profiles found: ${boulderProfiles.length}`,
              `- Event family returned when searching Boulder Art Festival: ${familyMatchesFromBoulder.map((x) => x.label).join(", ") || "none"}`,
              `- ColoradoEvents.org family record found: ${familyRecord ? "yes" : "no"}`,
              `- Family-member profiles returned: ${members.length}`,
              "",
              "## Family members returned",
              ...members.map((item) => `- ${item.label} — ${[item.city, item.region].filter(Boolean).join(", ") || "location not set"}`),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit inspection receipt
        run: |
          mkdir -p imports/inspection-receipts
          cp colorado-events-family-inspection.json imports/inspection-receipts/colorado-events-family-inspection.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imports/inspection-receipts/colorado-events-family-inspection.json
          if git diff --cached --quiet; then
            echo "Inspection receipt unchanged"
          else
            git commit -m "Record Colorado Events family inspection"
            git push
          fi

      - name: Upload inspection receipt
        uses: actions/upload-artifact@v4
        with:
          name: colorado-events-family-inspection
          path: colorado-events-family-inspection.json
          retention-days: 7
