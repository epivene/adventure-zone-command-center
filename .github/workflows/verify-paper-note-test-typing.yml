name: Verify Paper Notes test typing cluster

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  paper-note-test-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck:libs
      - name: Run focused Paper Notes suites
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/paper-notes/paper-note-import-service.pglite.test.ts
          src/features/paper-notes/paper-note-last-contact-date.test.ts
          src/features/paper-notes/paper-note-phone-service.pglite.test.ts
      - name: Verify API compiler cluster
        run: pnpm --filter @workspace/api-server run typecheck
