name: Manual Org Task1 Red
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  red:
    if: contains(github.event.head_commit.message, '[manual-org-task1-red]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-membership-schema.test.ts
