name: Manual Org Task5 Green
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  green:
    if: contains(github.event.head_commit.message, '[manual-org-task5-green]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/manual-org-task5.py
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/event-profiles/event-profile-form.test.tsx
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
      - name: Atomic create guards
        run: |
          grep -q 'parentOrganizationId: z.string().uuid()' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'parentOrganizationId: parsed.data.parentOrganizationId' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'PARENT_ORGANIZATION_INVALID' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'initialOrganizationId' artifacts/adventure-zone/src/pages/EventProfileNewPage.tsx
      - name: Commit product changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/routes/event-profiles.ts artifacts/adventure-zone/src/pages/EventProfileNewPage.tsx artifacts/adventure-zone/src/components/event-profiles/event-profile-form.tsx
          git diff --cached --check
          git commit -m "feat: create profiles inside organizations"
          git push origin HEAD:feature/manual-organization-membership-ui
