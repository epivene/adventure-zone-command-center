name: Manual Org Membership Baseline
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[manual-org-baseline]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Organization hierarchy regressions
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/organizations/imported-location-family-consolidation.test.ts
          src/features/organizations/organization-family-lock.test.ts
      - name: Capture known frontend baseline typecheck error
        run: |
          set +e
          pnpm --filter @workspace/adventure-zone typecheck 2>&1 | tee /tmp/typecheck.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -ne 0
          grep -q 'src/components/routes/travel-leg-manager-cards.tsx(15,10): error TS2352' /tmp/typecheck.log
          test "$(grep -c 'error TS' /tmp/typecheck.log)" -eq 1
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
# Known main baseline: one TS2352 in travel-leg-manager-cards.tsx; this feature must add no additional TS errors.
