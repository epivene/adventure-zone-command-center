name: Verify resource source identity typing

on:
  push:
    branches:
      - fix/resource-source-identity-type
    paths:
      - ".github/workflows/verify-resource-source-identity.yml"
      - "artifacts/api-server/src/features/resources/resource-source-candidates.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/resources/resource-source-candidate-seed.test.ts
      - run: pnpm run typecheck:libs
      - name: Verify resource source candidate compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'src/routes/resource-source-candidates\.ts\(79,65\)' /tmp/api-typecheck.log; then
            exit 1
          fi
