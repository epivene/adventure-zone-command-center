name: ACT Recovery TDD

on:
  pull_request:
    paths:
      - "lib/db/**"
      - "artifacts/api-server/**"
      - "artifacts/adventure-zone/**"
      - ".github/workflows/act-recovery-tdd.yml"
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Recovery database contract
        run: pnpm --filter @workspace/db exec vitest run src/act-archive-recovery-schema.test.ts
      - name: Recovery API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/act-recovery src/routes/act-recovery.test.ts --passWithNoTests
      - name: Recovery frontend tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ActRecoveryPage.test.tsx src/components/activities/activity-timeline.test.tsx --passWithNoTests
      - name: API build
        run: pnpm --filter @workspace/api-server run build
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone run build
