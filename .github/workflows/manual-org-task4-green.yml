name: Manual Org Task4 Green
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  green:
    if: contains(github.event.head_commit.message, '[manual-org-task4-green]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/manual-org-task4.py
      - run: pnpm --filter @workspace/api-server exec vitest run src/routes/organization-membership.test.ts
      - run: pnpm --filter @workspace/api-server build
      - name: Membership route guards
        run: |
          grep -q 'organizationMembershipRouter' artifacts/api-server/src/routes/index.ts
          grep -q 'getOrganizationMembershipContext' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'organizationContext: manualOrganizationContext' artifacts/api-server/src/routes/event-profiles.ts
          ! grep -q 'addProfileAsLocation' artifacts/api-server/src/routes/organization-membership.ts
      - name: Commit detail wiring
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/routes/event-profiles.ts
          git diff --cached --check
          git commit -m "feat: expose manual organization context on profiles"
          git push origin HEAD:feature/manual-organization-membership-ui
