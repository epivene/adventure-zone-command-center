name: Task 3 Fix Round TDD

on:
  push:
    branches:
      - agent/assisted-calling-workspace

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run Task 3 fix regressions
        run: |
          pnpm --filter @workspace/api-server test -- src/features/calls/call-service.test.ts src/db/act-review-migrations.test.ts
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/calls/call-workspace.test.tsx
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck
