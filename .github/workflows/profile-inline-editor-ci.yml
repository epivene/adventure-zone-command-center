name: Profile Inline Editor CI

on:
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/components/profiles/profile-inline-editor.tsx"
      - "artifacts/adventure-zone/src/components/profiles/profile-inline-editor.empty-contact.test.tsx"
      - ".github/workflows/profile-inline-editor-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Profile inline editor regression
        run: pnpm exec vitest run artifacts/adventure-zone/src/components/profiles/profile-inline-editor.empty-contact.test.tsx
