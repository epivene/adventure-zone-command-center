name: Profile location contact order TDD

on:
  push:
    branches:
      - fix/profile-location-contact-order
    paths:
      - "artifacts/api-server/src/features/organizations/add-profile-as-location.ts"
      - "artifacts/api-server/src/features/organizations/add-profile-as-location.test.ts"
      - ".github/workflows/profile-location-contact-order-tdd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run contact ordering regression test
        run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/add-profile-as-location.test.ts
      - name: Build API
        if: success()
        run: pnpm --filter @workspace/api-server run build
