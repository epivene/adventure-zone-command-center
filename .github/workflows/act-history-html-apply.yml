name: ACT History HTML Edit Applicator

on:
  push:
    branches:
      - fix/act-history-html-text
    paths:
      - ".github/act-history-html-edit.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/act-history-html-text
      - name: Apply timeline renderer edit
        run: node .github/act-history-html-edit.mjs
      - name: Commit renderer edit
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/adventure-zone/src/components/activities/activity-timeline.tsx
          git commit -m "fix: display existing ACT HTML history as text"
          git push origin HEAD:fix/act-history-html-text
