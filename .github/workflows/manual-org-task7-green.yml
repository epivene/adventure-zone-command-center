name: Manual Org Task7 Green
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  green:
    if: contains(github.event.head_commit.message, '[manual-org-task7-green]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/manual-org-task7.py
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/organizations/organization-membership-drawer.test.tsx src/pages/EventProfilePage.organization-membership.test.tsx
      - run: pnpm --filter @workspace/adventure-zone build
      - name: Page refresh guard
        run: grep -q 'async function loadProfile' artifacts/adventure-zone/src/pages/EventProfilePage.tsx && grep -q 'onOrganizationChanged={() => void loadProfile()}' artifacts/adventure-zone/src/pages/EventProfilePage.tsx
      - name: Commit product changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx artifacts/adventure-zone/src/pages/EventProfilePage.tsx artifacts/adventure-zone/src/components/organizations/organization-membership-drawer.tsx artifacts/adventure-zone/src/components/organizations/organization-membership-drawer.test.tsx artifacts/adventure-zone/src/pages/EventProfilePage.organization-membership.test.tsx
          git diff --cached --check
          git commit -m "feat: manage organization membership from profiles" || true
          git push origin HEAD:feature/manual-organization-membership-ui
