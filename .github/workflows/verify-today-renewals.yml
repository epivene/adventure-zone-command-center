name: Verify Today Renewals

on:
  push:
    branches:
      - agent/today-renewals

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API renewal tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/follow-ups/renewal-query.test.ts src/features/follow-ups/today-query.test.ts

      - name: Run Today UI renewal tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/today/renewals-section.test.tsx src/pages/TodayPage.test.tsx

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
