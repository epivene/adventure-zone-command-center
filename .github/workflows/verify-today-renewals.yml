name: Verify Today Renewals

on:
  push:
    branches:
      - agent/today-renewals

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API renewal tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/follow-ups/renewal-query.test.ts src/features/follow-ups/today-query.test.ts

      - name: Run Today UI renewal tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/today/renewals-section.test.tsx src/pages/TodayPage.test.tsx

      - name: Typecheck renewal API slice
        working-directory: artifacts/api-server
        run: |
          cat > tsconfig.renewals.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "incremental": false,
              "noEmit": true
            },
            "include": [
              "src/features/follow-ups/renewal-query.ts",
              "src/features/follow-ups/renewal-query.test.ts",
              "src/features/follow-ups/today-query.ts",
              "src/features/follow-ups/today-query.test.ts"
            ]
          }
          EOF
          pnpm exec tsc -p tsconfig.renewals.json --noEmit

      - name: Typecheck web app
        run: pnpm --filter @workspace/adventure-zone typecheck

      - name: Build API artifact
        run: pnpm --filter @workspace/api-server build

      - name: Build web artifact
        run: pnpm --filter @workspace/adventure-zone build
