name: Sync latest main into profile notes
on:
  push:
    branches: [feature/profile-family-notes-impl]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[profile-notes-main-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/profile-family-notes-impl
      - name: Merge latest main
        run: |
          git config user.name epivene
          git config user.email Desieleighc@gmail.com
          git fetch origin main
          git merge --no-edit origin/main
          git commit --amend -m "Merge latest main into profile notes [profile-notes-main-synced]" || true
          git push origin HEAD:feature/profile-family-notes-impl
