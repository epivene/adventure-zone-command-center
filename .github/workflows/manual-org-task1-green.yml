name: Manual Org Task1 Green
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  green:
    if: contains(github.event.head_commit.message, '[manual-org-task1-green]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python .github/scripts/manual-org-task1.py
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-membership-schema.test.ts
      - run: pnpm --filter @workspace/api-server build
      - name: Commit product changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add lib/db/src/schema/index.ts lib/db/src/migrations.ts lib/db/migrations/042_manual_organization_membership.sql
          git diff --cached --check
          git commit -m "feat: add manual organization membership schema"
          git push origin HEAD:feature/manual-organization-membership-ui
