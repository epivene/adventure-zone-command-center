name: Apply Today copilot priority typing fix

on:
  push:
    branches:
      - fix/today-copilot-dead-priority-check
    paths:
      - ".github/workflows/apply-today-copilot-priority-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-copilot-dead-priority-check
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove impossible normal-priority comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/follow-ups/today-copilot.ts')
          text = path.read_text()
          old = '    if (priority === "low" || priority === "normal") priority = "high";'
          new = '    if (priority === "low") priority = "high";'
          if old not in text:
              raise SystemExit('copilot priority comparison not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run copilot tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/follow-ups/today-copilot.test.ts
      - name: Verify copilot type error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'today-copilot\.ts\(81.*normal' /tmp/api-typecheck.log; then
            echo 'Today copilot dead comparison type error remains.' >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/follow-ups/today-copilot.ts
          git diff --cached --quiet || git commit -m "fix: remove impossible Today copilot priority check"
          git push origin HEAD:fix/today-copilot-dead-priority-check
