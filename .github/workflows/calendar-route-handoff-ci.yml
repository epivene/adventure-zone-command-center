name: Calendar Route Handoff CI

on:
  push:
    branches:
      - feature/leg-manager-foundation
      - feature/manager-leg-map-reliability
      - feature/map-login-password-fixes
      - feature/map-focus-filter-interactions
      - fix/map-layer-style-ready
      - feature/leaflet-manager-route-map
      - feature/event-wrap-up-calculators
  pull_request:
    paths:
      - "artifacts/adventure-zone/**"
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/calendar-route-handoff-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calendar unit tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/calendar/month-spans.test.ts
      - name: Leaflet route unit tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/routes/manager-map-navigation.test.ts src/features/routes/map-focus.test.ts src/components/routes/manager-map-mode.test.tsx src/components/routes/manager-route-map-shell.test.tsx src/components/routes/manager-route-map-layers.test.tsx src/components/routes/event-map-focus.test.tsx src/components/routes/event-map.test.tsx src/components/routes/trips-section.test.tsx
      - name: Handoff unit tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/routes/handoff-repository-participants.test.ts src/features/routes/handoff-scoring.test.ts src/features/trips/trip-service-handoff.test.ts src/routes/handoffs-manual.test.ts
      - name: Manager and route-map API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/event-wrap-up-calculation.test.ts src/features/leg-manager/event-wrap-up-service.test.ts src/routes/leg-manager-wrap-ups.test.ts src/routes/event-wrap-up-admin.test.ts src/features/leg-manager/fuel-price-repository.test.ts src/features/leg-manager/route-suggestion-service.test.ts src/features/leg-manager/manager-map-data.test.ts src/routes/leg-manager-admin.test.ts src/features/leg-manager/crew-repository-idempotency.test.ts src/features/leg-manager/crew-repository.test.ts src/features/routes/location-resolver.test.ts src/routes/routes-map.test.ts
      - name: Manager and route-map frontend tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/manager/manager-scoped-map.test.tsx src/components/manager/manager-travel-planning-panel.test.tsx src/components/routes/manager-preview-map.test.tsx src/components/routes/manager-route-review-queue.test.tsx src/components/routes/travel-leg-manager-cards.test.tsx src/components/routes/manual-handoff-form.test.tsx src/components/routes/travel-leg-editor.test.tsx src/lib/manager-auth-context.test.tsx src/lib/manager-back-target.test.ts src/App.manager-routing.test.tsx src/pages/ManagerHomePage.test.tsx src/pages/ManagerRoutePage.test.tsx src/pages/ManagerCrewPage.test.tsx src/pages/ManagerWorkerPage.test.tsx src/pages/ManagerOperationsPage.test.tsx src/pages/ManagerEventWrapUpPage.test.tsx
      - name: Build frontend
        run: pnpm --filter @workspace/adventure-zone run build
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Full workspace typecheck (informational; repo has pre-existing errors)
        continue-on-error: true
        run: pnpm run typecheck