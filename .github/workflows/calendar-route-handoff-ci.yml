name: Calendar Route Handoff CI

on:
  push:
    branches: [feature/leg-manager-foundation]
  pull_request:
    paths:
      - "artifacts/adventure-zone/**"
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/calendar-route-handoff-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Calendar and route unit tests
        run: |
          pnpm exec vitest run \
            artifacts/adventure-zone/src/features/calendar/month-spans.test.ts \
            artifacts/api-server/src/features/routes/handoff-scoring.test.ts
