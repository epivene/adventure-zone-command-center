name: Calendar Route Handoff CI

on:
  push:
    branches:
      - feature/leg-manager-foundation
      - feature/manager-leg-map-reliability
      - feature/map-login-password-fixes
      - feature/map-focus-filter-interactions
      - fix/map-layer-style-ready
      - fix/map-overlay-camera-race
  pull_request:
    paths:
      - "artifacts/adventure-zone/**"
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/calendar-route-handoff-ci.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply map overlay camera race hotfix
        if: github.ref_name == 'fix/map-overlay-camera-race'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/adventure-zone/src/components/routes/event-map.tsx')
          s = p.read_text()
          old = '''type StyleReadyMap = {
            isStyleLoaded: () => boolean;
            on: (event: "styledata", handler: () => void) => unknown;
          };

          export function installMapOverlaysWhenStyleReady(map: StyleReadyMap, install: () => void) {
            if (map.isStyleLoaded()) {
              install();
              return;
            }
            const installWhenLoaded = () => {
              if (map.isStyleLoaded()) install();
            };
            map.on("styledata", installWhenLoaded);
          }'''
          new = '''type StyleReadyMap = {
            isStyleLoaded: () => boolean;
            on: (event: "styledata" | "load", handler: () => void) => unknown;
          };

          export function installMapOverlaysWhenStyleReady(map: StyleReadyMap, install: () => void) {
            let installed = false;
            const installOnce = () => {
              if (installed || !map.isStyleLoaded()) return;
              installed = true;
              install();
            };
            if (map.isStyleLoaded()) {
              installOnce();
              return;
            }
            map.on("styledata", installOnce);
            map.on("load", installOnce);
          }'''
          if old not in s:
              raise SystemExit('style helper snippet not found')
          s = s.replace(old, new, 1)

          marker = '''export function viewportMode(coordinates: [number, number][]) {
            if (coordinates.length === 0) return { kind: "none" as const };
            if (coordinates.length === 1) {
              return { kind: "center" as const, center: coordinates[0]!, zoom: 10 };
            }
            return { kind: "bounds" as const, coordinates };
          }
'''
          helper = marker + '''\nexport function applyMapViewport(\n  map: Pick<MapLibreMap, "easeTo" | "fitBounds">,\n  target: MapViewportTarget,\n  Bounds: new (southWest: [number, number], northEast: [number, number]) => { extend: (point: [number, number]) => unknown },\n) {\n  if (target.kind === "none") return;\n  if (target.kind === "center") {\n    map.easeTo({ center: target.center, zoom: target.zoom, duration: 0 });\n    return;\n  }\n  const first = target.coordinates[0];\n  if (!first) return;\n  const bounds = new Bounds(first, first);\n  for (const coordinate of target.coordinates.slice(1)) bounds.extend(coordinate);\n  map.fitBounds(bounds as never, { padding: 56, maxZoom: 10, duration: 0 });\n}\n'''
          if marker not in s:
              raise SystemExit('viewport marker not found')
          s = s.replace(marker, helper, 1)

          old_fit = '''      const fitVisibleData = () => {
            const target = viewportRef.current;
            if (target.kind === "none") return;
            if (target.kind === "center") {
              map.easeTo({ center: target.center, zoom: target.zoom, duration: 0 });
              return;
            }
            const first = target.coordinates[0];
            if (!first) return;
            const bounds = new maplibregl.LngLatBounds(first, first);
            for (const coordinate of target.coordinates.slice(1)) bounds.extend(coordinate);
            map.fitBounds(bounds, { padding: 56, maxZoom: 10, duration: 0 });
          };'''
          new_fit = '''      const fitVisibleData = () => {
            applyMapViewport(map, viewportRef.current, maplibregl.LngLatBounds as never);
          };'''
          if old_fit not in s:
              raise SystemExit('fit helper snippet not found')
          s = s.replace(old_fit, new_fit, 1)

          old_effect = '''  useEffect(() => {
            viewportRef.current = viewport;
            if (mapRef.current?.getSource("events")) fitVisibleRef.current?.();
          }, [viewport]);'''
          new_effect = '''  useEffect(() => {
            viewportRef.current = viewport;
            fitVisibleRef.current?.();
          }, [viewport]);'''
          if old_effect not in s:
              raise SystemExit('viewport effect snippet not found')
          s = s.replace(old_effect, new_effect, 1)
          p.write_text(s)
          PY
          if ! git diff --quiet -- artifacts/adventure-zone/src/components/routes/event-map.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/adventure-zone/src/components/routes/event-map.tsx
            git commit -m "fix: make route overlay and camera lifecycle resilient"
            git push origin HEAD:fix/map-overlay-camera-race
            exit 0
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Calendar unit tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/calendar/month-spans.test.ts
      - name: Route focus unit tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/routes/map-focus.test.ts src/components/routes/event-map-focus.test.tsx src/components/routes/trips-section.test.tsx
      - name: Handoff unit tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/routes/handoff-scoring.test.ts src/features/trips/trip-service-handoff.test.ts
      - name: Manager and route-map API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/leg-manager-admin.test.ts src/features/routes/location-resolver.test.ts src/routes/routes-map.test.ts
      - name: Manager and route-map frontend tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/routes/travel-leg-editor.test.tsx src/components/routes/event-map.test.tsx src/lib/manager-auth-context.test.tsx src/App.manager-routing.test.tsx src/pages/ManagerHomePage.test.tsx
      - name: Build frontend
        run: pnpm --filter @workspace/adventure-zone run build
      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
      - name: Full workspace typecheck (informational; repo has pre-existing errors)
        continue-on-error: true
        run: pnpm run typecheck
