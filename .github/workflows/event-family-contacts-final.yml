name: Event Family Contacts Final
on:
  push:
    branches: [feature/event-family-website-contacts]
jobs:
  final:
    if: contains(github.event.head_commit.message, '[event-family-contacts-final]')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: adventure_zone_test }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - name: Sync latest main and resolve migration number
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ -f lib/db/migrations/043_event_family_website_contacts.sql ]; then
            git mv lib/db/migrations/043_event_family_website_contacts.sql lib/db/migrations/044_event_family_website_contacts.sql
          fi
          if git ls-files -u -- lib/db/src/migrations.ts | grep -q .; then
            git checkout --theirs lib/db/src/migrations.ts
          fi
          python .github/scripts/event-family-contacts-final-sync.py
          git add lib/db/src/migrations.ts lib/db/migrations/044_event_family_website_contacts.sql artifacts/api-server/src/features/event-families/event-family-contacts.test.ts
          if git ls-files -u | grep -q .; then
            echo 'Unexpected merge conflicts remain:' >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "Merge latest main into event family website contacts"
          elif ! git diff --cached --quiet; then
            git commit -m "chore: renumber event family contacts migration to 044"
          elif [ "$merge_status" -ne 0 ]; then
            echo 'Merge failed without a resolvable conflict' >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Focused backend verification
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/event-families/event-family-contacts.test.ts
          src/features/event-families/family-shared-contact.test.ts
          src/features/event-families/event-family-repository.test.ts
          src/routes/event-family-contacts.test.ts
      - name: Focused frontend verification
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run
          src/components/event-families/event-family-website-contacts.test.tsx
          src/components/event-profiles/family-contact-summary.test.tsx
      - run: pnpm --filter @workspace/db build
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
      - name: Compare typecheck with current main
        run: |
          set +e
          pnpm --filter @workspace/adventure-zone typecheck > /tmp/feature-typecheck.log 2>&1
          feature_status=$?
          set -e
          grep 'error TS' /tmp/feature-typecheck.log | sed -E 's#^.*(src/[^(:]+\([^)]*\): error TS[0-9]+:.*)$#\1#' > /tmp/feature-errors.txt || true

          git worktree add --detach /tmp/current-main origin/main
          (cd /tmp/current-main && pnpm install --frozen-lockfile >/tmp/main-install.log 2>&1)
          set +e
          (cd /tmp/current-main && pnpm --filter @workspace/adventure-zone typecheck > /tmp/main-typecheck.log 2>&1)
          main_status=$?
          set -e
          grep 'error TS' /tmp/main-typecheck.log | sed -E 's#^.*(src/[^(:]+\([^)]*\): error TS[0-9]+:.*)$#\1#' > /tmp/main-errors.txt || true

          echo '--- merged feature typecheck errors ---'
          cat /tmp/feature-errors.txt
          echo '--- current main typecheck errors ---'
          cat /tmp/main-errors.txt

          if [ "$feature_status" -eq 0 ]; then
            echo 'Merged feature typecheck passes.'
          else
            if [ "$main_status" -eq 0 ]; then
              echo 'Feature has TypeScript errors but current main does not.' >&2
              exit 1
            fi
            if ! diff -u /tmp/main-errors.txt /tmp/feature-errors.txt; then
              echo 'Merged feature TypeScript errors differ from current main.' >&2
              exit 1
            fi
            echo 'Merged feature has exactly the same TypeScript errors as current main; no new errors introduced.'
          fi
      - name: Safety guards
        run: |
          grep -q '043_act_archive_full_recovery.sql' lib/db/src/migrations.ts
          grep -q '044_event_family_website_contacts.sql' lib/db/src/migrations.ts
          grep -q 'eventFamilyContacts' lib/db/src/event-family-schema.ts
          grep -q 'familySharedContact' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'EventFamilyWebsiteContacts' artifacts/adventure-zone/src/pages/EventFamilyPage.tsx
          grep -q 'FamilyContactSummary' artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx
          grep -q 'ON DELETE RESTRICT' lib/db/migrations/044_event_family_website_contacts.sql
          grep -q 'ON DELETE CASCADE' lib/db/migrations/044_event_family_website_contacts.sql
      - name: Remove development-only helpers
        run: |
          rm -f .github/workflows/event-family-contacts-*.yml
          rm -f .github/scripts/event-family-contacts-*.py
          git add -A .github
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove event family contacts verification helpers"
          fi
      - name: Final diff checks and push
        run: |
          git diff --check origin/main...HEAD
          if git ls-files '.github/workflows/event-family-contacts-*' '.github/scripts/event-family-contacts-*' | grep -q .; then
            echo 'Temporary event-family-contacts helpers remain tracked' >&2
            exit 1
          fi
          git push origin HEAD:feature/event-family-website-contacts
