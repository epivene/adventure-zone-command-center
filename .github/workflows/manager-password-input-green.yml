name: Manager Password Input Green
on:
  push:
    branches: [fix/manager-password-input-crash]
jobs:
  green:
    if: "!contains(github.event.head_commit.message, '[skip password-green]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix password input event snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/adventure-zone/src/components/routes/travel-leg-editor.tsx')
          s = p.read_text()
          old = 'onChange={(event) => setPasswords((current) => ({ ...current, [leg.id]: event.currentTarget.value }))}'
          new = 'onChange={(event) => { const value = event.currentTarget.value; setPasswords((current) => ({ ...current, [leg.id]: value })); }}'
          if old not in s:
              raise SystemExit('unsafe password handler not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Guard unsafe deferred event read is gone
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('artifacts/adventure-zone/src/components/routes/travel-leg-editor.tsx','utf8');
          const unsafe = /setPasswords\(\(current\) => \(\{ \.\.\.current, \[leg\.id\]: event\.currentTarget\.value \}\)\)/.test(source);
          if (unsafe) throw new Error('Password handler still reads currentTarget inside state updater');
          NODE
      - name: Travel leg editor tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/routes/travel-leg-editor.test.tsx
      - name: Web typecheck
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: Web production build
        run: pnpm --filter @workspace/adventure-zone build
      - name: Commit product fix
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/adventure-zone/src/components/routes/travel-leg-editor.tsx
          git commit -m 'fix: keep manager password input stable [skip password-green]'
          git push origin HEAD:fix/manager-password-input-crash
