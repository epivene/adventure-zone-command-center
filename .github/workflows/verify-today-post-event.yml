name: Verify Today Post Event

on:
  push:
    branches:
      - fix/today-upcoming-post-event-followup

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run post-event API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/follow-ups/today-upcoming-post-event.test.ts src/features/follow-ups/today-query.test.ts src/features/follow-ups/renewal-query.test.ts

      - name: Run Today UI tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/TodayPage.test.tsx src/components/today/renewals-section.test.tsx

      - name: Typecheck follow-up API slice
        working-directory: artifacts/api-server
        run: |
          cat > tsconfig.post-event.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "compilerOptions": {
              "incremental": false,
              "noEmit": true
            },
            "include": [
              "src/features/follow-ups/renewal-query.ts",
              "src/features/follow-ups/renewal-query.test.ts",
              "src/features/follow-ups/today-query.ts",
              "src/features/follow-ups/today-query.test.ts",
              "src/features/follow-ups/today-upcoming-post-event.test.ts"
            ]
          }
          EOF
          pnpm exec tsc -p tsconfig.post-event.json --noEmit

      - name: Typecheck web app
        run: pnpm --filter @workspace/adventure-zone typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server build

      - name: Build web app
        run: pnpm --filter @workspace/adventure-zone build