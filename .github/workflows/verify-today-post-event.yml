name: Verify Today Post Event

on:
  push:
    branches:
      - fix/today-upcoming-post-event-followup

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run post-event classification test
        run: pnpm --filter @workspace/api-server exec vitest run src/features/follow-ups/today-upcoming-post-event.test.ts