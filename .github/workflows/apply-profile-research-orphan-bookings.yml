name: Apply profile research orphan booking fix

on:
  push:
    branches:
      - fix/profile-research-orphan-bookings
    paths:
      - ".github/workflows/apply-profile-research-orphan-bookings.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-research-orphan-bookings
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Exclude orphan bookings from profile match candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/profile-research/profile-research-related-event-matcher.ts')
          text = path.read_text()
          old = '''    ...bookingRows.map((row) => ({\n      kind: "booking" as const,\n      id: row.id,\n      organizationId: row.organizationId,\n      name: row.name,\n      city: row.city,\n      region: row.region,\n    })),'''
          new = '''    ...bookingRows\n      .filter((row): row is typeof row & { organizationId: string } => row.organizationId !== null)\n      .map((row) => ({\n        kind: "booking" as const,\n        id: row.id,\n        organizationId: row.organizationId,\n        name: row.name,\n        city: row.city,\n        region: row.region,\n      })),'''
          if old not in text:
              raise SystemExit('booking record mapper not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused related-event matcher tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/profile-research/profile-research-related-event-matcher.test.ts
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/profile-research/profile-research-related-event-matcher.ts
          git diff --cached --quiet || git commit -m "fix: exclude orphan bookings from profile research matching"
          git push origin HEAD:fix/profile-research-orphan-bookings
      - run: pnpm run typecheck:libs
      - name: Verify profile research compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'src/features/profile-research/profile-research-related-event-matcher\.ts\(114,9\)' /tmp/api-typecheck.log; then
            exit 1
          fi
