name: Event Family Contacts Baseline
on:
  push:
    branches: [feature/event-family-website-contacts]
jobs:
  baseline:
    if: contains(github.event.head_commit.message, '[event-family-contacts-baseline]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adventure_zone_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Existing event family API tests
        run: |
          files=$(find artifacts/api-server/src -type f \( -name '*event-family*.test.ts' -o -name '*event-families*.test.ts' \) | sed 's#artifacts/api-server/##')
          if [ -n "$files" ]; then pnpm --filter @workspace/api-server exec vitest run $files; else echo 'No existing event-family API tests found'; fi
      - name: Existing event family frontend tests
        run: |
          files=$(find artifacts/adventure-zone/src -type f \( -name '*event-family*.test.ts' -o -name '*event-family*.test.tsx' -o -name '*EventFamily*.test.tsx' \) | sed 's#artifacts/adventure-zone/##')
          if [ -n "$files" ]; then pnpm --filter @workspace/adventure-zone exec vitest run $files; else echo 'No existing event-family frontend tests found'; fi
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
# baseline trigger 2
