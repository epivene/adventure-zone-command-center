name: Booking Master Work Queue CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "artifacts/api-server/src/db/schema.ts"
      - "artifacts/api-server/src/features/opportunities/**"
      - "artifacts/api-server/src/features/today/**"
      - "artifacts/api-server/src/features/follow-ups/**"
      - "artifacts/api-server/src/features/bookings/booking-service.ts"
      - "artifacts/api-server/src/features/bookings/booking-repository.ts"
      - "artifacts/api-server/src/routes/opportunities.ts"
      - "artifacts/api-server/src/routes/opportunities.test.ts"
      - "artifacts/api-server/src/routes/today.ts"
      - "artifacts/api-server/src/routes/today.test.ts"
      - "artifacts/api-server/src/routes/follow-ups.ts"
      - "artifacts/api-server/src/routes/follow-ups.test.ts"
      - "artifacts/api-server/src/routes/index.ts"
      - "artifacts/adventure-zone/src/features/today/**"
      - "artifacts/adventure-zone/src/components/today/**"
      - "artifacts/adventure-zone/src/components/opportunities/**"
      - "artifacts/adventure-zone/src/components/profiles/profile-primary-actions.tsx"
      - "artifacts/adventure-zone/src/pages/TodayPage.tsx"
      - "artifacts/adventure-zone/src/pages/EventProfilePage.tsx"
      - "artifacts/adventure-zone/src/pages/EventProfilePage.test.tsx"
      - "lib/db/src/booking-opportunity-schema.ts"
      - "lib/db/src/index.ts"
      - "lib/db/src/migrations.ts"
      - "lib/db/package.json"
      - "lib/db/migrations/070_booking_opportunities.sql"
      - ".github/workflows/booking-master-work-queue-ci.yml"
  workflow_dispatch:

jobs:
  booking-master-work-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/assistant_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release 1 focused API tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run --maxWorkers=1 --hookTimeout=30000
          src/features/opportunities
          src/features/today
          src/routes/follow-ups.test.ts
          src/routes/today.test.ts
          src/routes/opportunities.test.ts
      - name: Release 1 focused web tests
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run --maxWorkers=1 --hookTimeout=30000
          src/features/today/today-return-context.test.ts
          src/components/today/master-work-queue.test.tsx
          src/components/opportunities/current-opportunity-card.test.tsx
      - name: Build database workspace
        run: pnpm --filter @workspace/db build
      - name: Frontend production build
        run: pnpm --filter @workspace/adventure-zone build
      - name: API typecheck (known main-branch baseline currently fails)
        continue-on-error: true
        run: pnpm --filter @workspace/api-server typecheck
