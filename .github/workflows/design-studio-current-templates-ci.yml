name: Design Studio Current Templates CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: >-
          pnpm --filter @workspace/api-server exec vitest run --config vitest.config.ts
          src/features/packages/current-offer-catalog.test.ts
          src/features/packages/package-defaults.test.ts
          src/features/design-studio/current-template-catalog.test.ts
          src/features/design-studio/profile-document-reuse.test.ts
          src/features/design-studio/template-instantiation-service.test.ts
          src/features/design-studio/template-catalog-schema.test.ts
      - run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run --config vitest.config.ts
          src/components/design-studio/TemplateCatalog.test.tsx
          src/components/profiles/ProfileDesignStudioPicker.test.tsx
          src/components/profiles/ProfileDesignDocuments.test.tsx
          src/pages/DesignStudioPage.test.tsx
