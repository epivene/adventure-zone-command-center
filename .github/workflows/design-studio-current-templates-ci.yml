name: Design Studio Current Templates CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run artifacts/api-server/src/features/packages/package-defaults.test.ts
