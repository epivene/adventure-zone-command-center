name: Design Studio Current Templates CI

on:
  push:
    branches:
      - codex/design-studio-current-templates-20260923
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Current template tests
        run: |
          pnpm exec vitest run \
            artifacts/api-server/src/features/packages/package-defaults.test.ts \
            artifacts/api-server/src/features/packages/current-offer-catalog.test.ts \
            artifacts/api-server/src/features/design-studio/current-template-catalog.test.ts \
            artifacts/api-server/src/features/design-studio/template-instantiation-service.test.ts \
            artifacts/api-server/src/features/design-studio/profile-document-reuse.test.ts \
            artifacts/adventure-zone/src/components/design-studio/TemplateCatalog.test.tsx \
            artifacts/adventure-zone/src/components/profiles/ProfileDesignStudioPicker.test.tsx \
            artifacts/adventure-zone/src/components/profiles/ProfileDesignDocuments.test.tsx \
            --passWithNoTests
      - name: Typecheck
        run: pnpm run typecheck
