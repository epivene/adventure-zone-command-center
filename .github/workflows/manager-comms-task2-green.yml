name: Manager Comms Task2 Green
on:
  push:
    branches: [feature/manager-communications-acknowledgments]
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[task2-green]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adventure_zone_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/manager-comms/communication-service.test.ts src/features/manager-comms/notification-repository.test.ts
      - run: pnpm --filter @workspace/api-server build
      - run: grep -q 'managerCommunicationsRouter' artifacts/api-server/src/routes/index.ts
      - run: grep -q 'getSignedReadUrl' artifacts/api-server/src/features/leg-manager/leg-manager-object-storage.ts
# rerun after timestamp normalization
