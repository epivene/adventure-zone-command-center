name: Profiles UX Finalize
on:
  push:
    branches: [feature/profiles-event-families-ux]

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip profiles-finalize]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Patch unified creation backend and profile context
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]}')
              p.write_text(s.replace(old,new,1))

          path='artifacts/api-server/src/routes/event-profiles.ts'
          rep(path,
              '  organizations,\n  eventManagerReviews,\n} from "@/db/schema";',
              '  organizations,\n  eventManagerReviews,\n  eventFamilies,\n  eventFamilyMembers,\n} from "@/db/schema";')
          rep(path,
              'const creationSchema = z.object({\n  event: z.object({ id: z.string().nullable(), name: z.string(), city: z.string(), region: z.string() }),\n  contacts: z.array(z.object({ id: z.string().nullable(), name: z.string(), phone: z.string(), email: z.string(), role: z.string(), primary: z.boolean().optional() })).min(1),\n  booking: z.object({ enabled: z.boolean(), name: z.string(), nextActionKind: z.string(), nextActionDueAt: z.string(), travelLegId: z.string().uuid().nullable() }),\n}).superRefine((input, context) => {',
              'const creationSchema = z.object({\n  event: z.object({ id: z.string().nullable(), name: z.string(), city: z.string(), region: z.string() }),\n  contacts: z.array(z.object({ id: z.string().nullable(), name: z.string(), phone: z.string(), email: z.string(), role: z.string(), primary: z.boolean().optional() })).default([]),\n  booking: z.object({ enabled: z.boolean(), name: z.string(), nextActionKind: z.string(), nextActionDueAt: z.string(), travelLegId: z.string().uuid().nullable() }),\n  familyId: z.string().uuid().nullable().optional().default(null),\n}).superRefine((input, context) => {')
          rep(path,
              '  if (input.event.id ? !uuid.safeParse(input.event.id).success : !input.event.name.trim() || !input.event.city.trim() || input.event.region.trim().length !== 2) context.addIssue({ code: "custom", message: "Choose an event or enter its name, city, and two-letter state." });',
              '  if (input.event.id ? !uuid.safeParse(input.event.id).success : !input.event.name.trim()) context.addIssue({ code: "custom", message: "Choose an existing profile or enter an event / lead name." });\n  if (input.event.region.trim() && input.event.region.trim().length !== 2) context.addIssue({ code: "custom", message: "Use a two-letter state when a state is entered." });')

          # Add family/group context to profile response.
          rep(path,
              '    const bookingIds=profile.bookings.map((booking)=>booking.id);',
              '    const [membership] = await db\n      .select({ familyId: eventFamilyMembers.familyId, familyName: eventFamilies.name })\n      .from(eventFamilyMembers)\n      .innerJoin(eventFamilies, eq(eventFamilies.id, eventFamilyMembers.familyId))\n      .where(eq(eventFamilyMembers.organizationId, id))\n      .limit(1);\n    const [organizationContext] = await db\n      .select({ consolidatedIntoId: organizations.consolidatedIntoId })\n      .from(organizations)\n      .where(eq(organizations.id, id))\n      .limit(1);\n    let familyContext: { kind: "event_family" | "organization_group"; id: string; name: string } | null = membership\n      ? { kind: "event_family", id: membership.familyId, name: membership.familyName }\n      : null;\n    if (!familyContext && organizationContext?.consolidatedIntoId) {\n      const [parent] = await db.select({ id: organizations.id, name: organizations.name }).from(organizations).where(eq(organizations.id, organizationContext.consolidatedIntoId)).limit(1);\n      if (parent) familyContext = { kind: "organization_group", id: parent.id, name: parent.name };\n    }\n    const bookingIds=profile.bookings.map((booking)=>booking.id);')
          rep(path,
              '    res.json({ ...profile, managerReviews, managerReviewAverage, assistedCallingEnabled: process.env.ASSISTED_CALLING_ENABLED === "true" });',
              '    res.json({ ...profile, familyContext, managerReviews, managerReviewAverage, assistedCallingEnabled: process.env.ASSISTED_CALLING_ENABLED === "true" });')

          # Creation supports sparse profile data and family assignment in same transaction.
          rep(path,
              '        const [found] = await transaction.select({ id: organizations.id, city: organizations.city, region: organizations.region }).from(organizations).where(eq(organizations.id, organizationId)).limit(1);',
              '        const [found] = await transaction.select({ id: organizations.id, city: organizations.city, region: organizations.region, consolidatedIntoId: organizations.consolidatedIntoId }).from(organizations).where(eq(organizations.id, organizationId)).limit(1);')
          rep(path,
              '        const [created] = await transaction.insert(organizations).values({ name: parsed.data.event.name.trim(), city: eventCity, region: eventRegion, placeType: "other", createdAt: now, updatedAt: now }).returning({ id: organizations.id });',
              '        const [created] = await transaction.insert(organizations).values({ name: parsed.data.event.name.trim(), city: eventCity || null, region: eventRegion || null, placeType: "festival_event", createdAt: now, updatedAt: now }).returning({ id: organizations.id });')
          rep(path,
              '      const contactIds: string[] = [];',
              '      if (parsed.data.familyId) {\n        const [family] = await transaction.select({ id: eventFamilies.id }).from(eventFamilies).where(eq(eventFamilies.id, parsed.data.familyId)).limit(1);\n        if (!family) throw new Error("EVENT_FAMILY_NOT_FOUND");\n        const [organizationState] = await transaction.select({ consolidatedIntoId: organizations.consolidatedIntoId }).from(organizations).where(eq(organizations.id, organizationId)).limit(1);\n        if (organizationState?.consolidatedIntoId) throw new Error("GROUPED_PROFILE_CONFLICT");\n        const [existingMembership] = await transaction.select({ familyId: eventFamilyMembers.familyId }).from(eventFamilyMembers).where(eq(eventFamilyMembers.organizationId, organizationId)).limit(1);\n        if (existingMembership && existingMembership.familyId !== parsed.data.familyId) throw new Error("EVENT_FAMILY_CONFLICT");\n        if (!existingMembership) await transaction.insert(eventFamilyMembers).values({ familyId: parsed.data.familyId, organizationId, source: "manual" });\n      }\n\n      const contactIds: string[] = [];')
          rep(path,
              '        await transaction.insert(bookingContacts).values(contactIds.map((contactId) => ({ bookingId: booking.id, contactId, isPrimary: contactId === primaryContactId, source: "local" as const, createdAt: now, updatedAt: now })));\n        await transaction.update(bookings).set({ primaryContactId, updatedAt: now }).where(eq(bookings.id, booking.id));',
              '        if (contactIds.length) {\n          await transaction.insert(bookingContacts).values(contactIds.map((contactId) => ({ bookingId: booking.id, contactId, isPrimary: contactId === primaryContactId, source: "local" as const, createdAt: now, updatedAt: now })));\n        }\n        await transaction.update(bookings).set({ primaryContactId: primaryContactId ?? null, updatedAt: now }).where(eq(bookings.id, booking.id));')
          rep(path,
              '        await transaction.insert(followUps).values({ bookingId: booking.id, organizationId, contactId: primaryContactId, kind: parsed.data.booking.nextActionKind.trim() || "call", dueAt, createdAt: now, updatedAt: now });',
              '        await transaction.insert(followUps).values({ bookingId: booking.id, organizationId, contactId: primaryContactId ?? null, kind: parsed.data.booking.nextActionKind.trim() || "call", dueAt, createdAt: now, updatedAt: now });')
          rep(path,
              '    if (error instanceof Error && ["EVENT_NOT_FOUND", "CONTACT_NOT_FOUND"].includes(error.message)) {',
              '    if (error instanceof Error && ["EVENT_NOT_FOUND", "CONTACT_NOT_FOUND", "EVENT_FAMILY_NOT_FOUND"].includes(error.message)) {')
          rep(path,
              '    if (error instanceof Error && error.message === "BOOKING_EVENT_LOCATION_MISSING") {',
              '    if (error instanceof Error && ["EVENT_FAMILY_CONFLICT", "GROUPED_PROFILE_CONFLICT"].includes(error.message)) {\n      res.status(409).json({ ok: false, error: "This profile already belongs to another family or profile group. Remove it there before moving it." });\n      return;\n    }\n    if (error instanceof Error && error.message === "BOOKING_EVENT_LOCATION_MISSING") {')

          # Frontend profile type includes family/group context.
          path='artifacts/adventure-zone/src/features/event-profiles/event-profile-repository.ts'
          rep(path,
              '  sourceProvenance: EventProfileSourceReference[];\n  migrationHistory?: {',
              '  sourceProvenance: EventProfileSourceReference[];\n  familyContext?: { kind: "event_family" | "organization_group"; id: string; name: string } | null;\n  migrationHistory?: {')

          # Profile UI: drawer instead of giant list, no source provenance, visible parent context.
          path='artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx'
          rep(path,
              'import { PossibleLocationsSection } from "@/components/organizations/possible-locations-section";',
              'import { PossibleLocationsDrawer } from "@/components/organizations/possible-locations-drawer";')
          rep(path,
              '            <Link className="button-secondary text-center" href="/event-profiles/new">New event</Link>',
              '            <Link className="button-secondary text-center" href="/event-profiles/new">Add Event / Lead</Link>')
          rep(path,
              '        {profile.place.lastResort ? (',
              '        {profile.familyContext ? (\n          <p className="mt-4 rounded-lg border border-orange-200 bg-orange-50 p-3 text-sm font-semibold text-orange-950">\n            {profile.familyContext.kind === "event_family" ? "Part of" : "Location of"}{" "}\n            <Link className="underline" href={profile.familyContext.kind === "event_family" ? `/event-families/${profile.familyContext.id}` : `/event-profiles/${profile.familyContext.id}`}>{profile.familyContext.name}</Link>\n          </p>\n        ) : null}\n        {profile.place.lastResort ? (')
          rep(path,
              '      <PossibleLocationsSection orgId={profile.id} />',
              '      <PossibleLocationsDrawer orgId={profile.id} />')
          source='''\n          <section className="rounded-xl border border-slate-200 bg-white p-5 shadow-sm" aria-labelledby="event-sources-title">\n            <h2 className="text-xl font-bold" id="event-sources-title">Source provenance</h2>\n            {profile.sourceProvenance.length ? <ul className="mt-3 grid gap-2 text-sm">{profile.sourceProvenance.map((source) => <li key={`${source.entityId}:${source.sourceEntityType}:${source.actRecordId}`}><span className="font-semibold">{source.actRecordId}</span> <span className="text-slate-600">· {source.sourceEntityType}</span></li>)}</ul> : <p className="mt-3 text-sm text-slate-600">No external source record is linked.</p>}\n          </section>'''
          p=Path(path); s=p.read_text()
          if source not in s: raise SystemExit('source provenance section anchor missing')
          p.write_text(s.replace(source,'',1))
          PY

      - name: Verify focused UX tests
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run src/pages/OrganizationsPage.test.tsx src/components/organizations/organization-list.test.tsx src/components/event-profiles/event-profile-form.test.tsx
      - name: Verify typecheck and production builds
        run: |
          pnpm --filter @workspace/adventure-zone typecheck
          pnpm --filter @workspace/api-server build
          pnpm --filter @workspace/adventure-zone build
      - name: Guard requested UX changes
        run: |
          ! grep -q '>Source provenance<' artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx
          grep -q 'PossibleLocationsDrawer' artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx
          grep -q 'Add Event / Lead' artifacts/adventure-zone/src/components/event-profiles/event-profile-form.tsx
          grep -q 'familyContext' artifacts/api-server/src/routes/event-profiles.ts
          test ! -f .github/workflows/profiles-ux-batch1.yml
      - name: Commit verified final product changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/routes/event-profiles.ts artifacts/adventure-zone/src/features/event-profiles/event-profile-repository.ts artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx
          git commit -m 'feat: finish profiles and event families ux [skip profiles-finalize]'
          git push origin HEAD:feature/profiles-event-families-ux
