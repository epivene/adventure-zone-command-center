name: Verify paper note activity default
on:
  push:
    branches: [fix/paper-note-activity-default-v2]
    paths: [.github/workflows/apply-paper-note-activity-default-v2.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paper-note-activity-default-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply activity default
        run: |
          python -c 'from pathlib import Path; p=Path("artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts"); s=p.read_text(); old="  }).optional().default({}),\n  contacts:"; new="  }).optional().default({ dateSource: \"unknown\", method: \"unknown\" }),\n  contacts:"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
      - name: Test extraction schema
        run: pnpm --filter @workspace/api-server exec vitest run src/features/paper-notes/paper-note-extraction-schema.test.ts
      - name: Verify targeted compiler error is gone
        run: |
          pnpm run typecheck:libs
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api.log
          set -e
          ! grep -E 'paper-note-extraction-schema\.ts.*error TS2769' /tmp/api.log
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts
          git diff --cached --quiet || git commit -m "fix: default omitted paper note activity"
          git push origin HEAD:fix/paper-note-activity-default-v2
