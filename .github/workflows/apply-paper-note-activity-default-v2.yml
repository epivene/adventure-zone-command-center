name: Apply paper note activity default

on:
  push:
    branches:
      - fix/paper-note-activity-default-v2
    paths:
      - ".github/workflows/apply-paper-note-activity-default-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paper-note-activity-default-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm activity default compiler error exists
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'paper-note-extraction-schema\.ts.*error TS2769' /tmp/api-before.log >/dev/null || {
            echo "Expected paper-note activity default type error was not present." >&2
            exit 1
          }
      - name: Default omitted activity to canonical unknown values
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts')
          text = path.read_text()
          needle = '''  activity: z.object({
    rawDateText: z.unknown().optional().nullable(),
    occurredOn: z.unknown().optional().nullable(),
    dateSource: dateSourceSchema.optional().default("unknown"),
    method: activityMethodSchema.optional().default("unknown"),
    outcome: z.unknown().optional().nullable(),
    summary: z.unknown().optional().nullable(),
  }).optional().default({}),'''
          replacement = '''  activity: z.object({
    rawDateText: z.unknown().optional().nullable(),
    occurredOn: z.unknown().optional().nullable(),
    dateSource: dateSourceSchema.optional().default("unknown"),
    method: activityMethodSchema.optional().default("unknown"),
    outcome: z.unknown().optional().nullable(),
    summary: z.unknown().optional().nullable(),
  }).optional().default({ dateSource: "unknown", method: "unknown" }),'''
          if text.count(needle) != 1:
            raise SystemExit(f'expected one activity default block, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))
          PY
      - name: Run paper note extraction schema tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/paper-notes/paper-note-extraction-schema.test.ts
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts
          git diff --cached --quiet || git commit -m "fix: default omitted paper note activity"
          git push origin HEAD:fix/paper-note-activity-default-v2
      - run: pnpm run typecheck:libs
      - name: Verify activity default compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'paper-note-extraction-schema\.ts.*error TS2769' /tmp/api-after.log; then
            echo "Paper-note activity default type error remains." >&2
            exit 1
          fi
