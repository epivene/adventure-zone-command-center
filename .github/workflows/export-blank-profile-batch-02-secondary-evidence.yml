name: Export blank profile research batch 02 secondary evidence

on:
  push:
    branches:
      - research/blank-profiles-batch-02
    paths:
      - ".github/workflows/export-blank-profile-batch-02-secondary-evidence.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export broad duplicate and organization-family searches
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${API_URL}"
          test -n "${ASSISTANT_IMPORT_TOKEN}"
          BASE_URL="${API_URL%/}/api/assistant-import"
          mkdir -p evidence

          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const queries = [
            'NE Nebraska',
            'Payette Apple Blossom',
            'Pikes Peak Birding',
            'Rocky Mountain Rambler',
            'San Juan Southern Paiute',
            'Vail Comedy',
            'Denver Food Wine',
            'No Barriers',
            'Orofino Fireworks',
            'Alamosa 4th',
            'Kahler Memorial',
            'National Park Celebration',
            'Cumbres Toltec',
            'Food Wine Classic',
            'Quilt Craft Sewing',
            'Colorado Events',
            'June Jubilee',
            'Pearl Street Arts',
            'Breck Epic',
            'Breck Film',
            'Breckenridge Film',
            'Breckenridge Beer',
            'Breckenridge Food Wine',
            'Mountain Art Festivals',
            'Great Divide Art',
            'Breckenridge International Festival',
            'Breck Create',
            'Paddlefest',
            'Tough Mudder',
          ];
          const base = process.env.API_URL.replace(/\/$/, '') + '/api/assistant-import';
          const token = process.env.ASSISTANT_IMPORT_TOKEN;
          const searches = [];
          const ids = new Set();
          for (const query of queries) {
            const output = execFileSync('curl', [
              '--fail', '--silent', '--show-error',
              '--header', `Authorization: Bearer ${token}`,
              `${base}/profile-search?q=${encodeURIComponent(query)}&limit=20`,
            ], { encoding: 'utf8' });
            const result = JSON.parse(output);
            searches.push({ query, result });
            for (const row of result.results || []) {
              if (row.kind === 'organization' && row.id) ids.add(row.id);
            }
          }

          const histories = {};
          for (const id of ids) {
            const output = execFileSync('curl', [
              '--fail', '--silent', '--show-error',
              '--header', `Authorization: Bearer ${token}`,
              `${base}/profile-history/${id}`,
            ], { encoding: 'utf8' });
            histories[id] = JSON.parse(output);
          }

          fs.writeFileSync('blank-profile-batch-02-secondary-evidence.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            searches,
            histories,
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: blank-profile-batch-02-secondary-evidence
          path: blank-profile-batch-02-secondary-evidence.json
          retention-days: 2
