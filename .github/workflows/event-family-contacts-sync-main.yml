name: Event Family Contacts Sync Main
on:
  push:
    branches: [feature/event-family-website-contacts]
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[event-family-contacts-sync]')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge current main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/event-family-website-contacts
