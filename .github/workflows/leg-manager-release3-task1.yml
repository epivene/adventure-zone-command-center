name: Leg Manager Release 3 Task 1
on:
  push:
    branches: [feature/leg-manager-crew-aftermath]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crew repository test
        run: pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/crew-repository.test.ts
