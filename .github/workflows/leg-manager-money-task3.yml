name: Leg Manager Money Task 3
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  task3:
    if: "!contains(github.event.head_commit.message, '[skip money-task3]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: RED — money page tests
        run: |
          cat > artifacts/adventure-zone/src/pages/ManagerMoneyPage.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import { cleanup, fireEvent, render, screen, waitFor } from "@testing-library/react";
          import { afterEach, describe, expect, it, vi } from "vitest";
          import ManagerMoneyPage from "./ManagerMoneyPage";

          const mocks=vi.hoisted(()=>({
            api:vi.fn(async(path:string)=> path==="/manager/dashboard"?{events:[{id:"stop-1",bookingId:"00000000-0000-4000-8000-000000000010",name:"Town Festival",startsAt:"2026-08-20T12:00:00Z"}]}:{incomeTotalCents:0,expenseTotalCents:0,cashPosition:{cashOnHandCents:0},settlement:{ownerOwesManagerCents:2500,managerOwesOwnerCents:0,netCents:2500}}),
            queue:vi.fn(async(m:any)=>({...m,state:"saved_offline"})),
            flush:vi.fn(async()=>[]),
          }));
          vi.mock("@/lib/manager-auth-context",()=>({useManagerAuth:()=>({manager:{legId:"leg-a",legName:"Leg A",managerName:"Amy"},managerApi:mocks.api})}));
          vi.mock("@/lib/manager-sync-queue",()=>({queueManagerMutation:mocks.queue,flushManagerMutationQueue:mocks.flush}));
          afterEach(()=>{cleanup();vi.clearAllMocks();});

          describe("ManagerMoneyPage",()=>{
            it("shows settlement direction and queues manual event income",async()=>{
              render(<ManagerMoneyPage/>);
              expect(await screen.findByText("Adventure Zone owes you $25.00")).toBeInTheDocument();
              expect(screen.getByRole("option",{name:"Town Festival"})).toBeInTheDocument();
              fireEvent.change(screen.getByLabelText("Cash"),{target:{value:"120.50"}});
              fireEvent.change(screen.getByLabelText("Square / card"),{target:{value:"80"}});
              fireEvent.click(screen.getByRole("button",{name:"Save income"}));
              await waitFor(()=>expect(mocks.queue).toHaveBeenCalledTimes(1));
              const mutation=mocks.queue.mock.calls[0][0];
              expect(mutation.path).toBe("/manager/income");
              expect(mutation.body.cashCents).toBe(12050);
              expect(mutation.body.squareCents).toBe(8000);
              expect(screen.getByText(/Saved offline|Syncing|Synced/)).toBeInTheDocument();
            });
          });
          EOF
          set +e
          pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerMoneyPage.test.tsx > /tmp/task3-red.log 2>&1
          code=$?
          set -e
          cat /tmp/task3-red.log
          test "$code" -ne 0
      - name: GREEN — manager money UI and routes
        run: |
          mkdir -p artifacts/adventure-zone/src/components/manager
          cat > artifacts/adventure-zone/src/components/manager/settlement-summary.tsx <<'EOF'
          function money(cents:number){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(cents/100);}
          export function SettlementSummary({settlement}:{settlement:{ownerOwesManagerCents:number;managerOwesOwnerCents:number;netCents:number}}){
            const text=settlement.netCents>0?`Adventure Zone owes you ${money(settlement.netCents)}`:settlement.netCents<0?`You owe Adventure Zone ${money(Math.abs(settlement.netCents))}`:"Settled";
            return <section className="rounded-xl border bg-white p-4"><p className="text-xs font-bold uppercase tracking-wide text-slate-500">Settlement</p><p className="mt-1 text-lg font-bold">{text}</p><p className="mt-1 text-sm text-slate-600">Calculated from ledger entries — not an editable balance.</p></section>;
          }
          EOF

          cat > artifacts/adventure-zone/src/components/manager/event-income-form.tsx <<'EOF'
          import { useState } from "react";
          import { useManagerAuth } from "@/lib/manager-auth-context";
          import { flushManagerMutationQueue,queueManagerMutation } from "@/lib/manager-sync-queue";
          import { ManagerSyncStatus } from "./manager-sync-status";
          type EventOption={id:string;bookingId?:string|null;name?:string;tripId?:string|null};
          const cents=(value:string)=>Math.round((Number(value)||0)*100);
          export function EventIncomeForm({events}:{events:EventOption[]}){const {manager,managerApi}=useManagerAuth();const [eventId,setEventId]=useState(events[0]?.id??"");const [cash,setCash]=useState("");const [square,setSquare]=useState("");const [other,setOther]=useState("");const [otherLabel,setOtherLabel]=useState("");const [state,setState]=useState<"saved_offline"|"syncing"|"synced"|"needs_attention"|null>(null);
            async function submit(e:React.FormEvent){e.preventDefault();if(!manager)return;const selected=events.find(x=>x.id===eventId);const id=crypto.randomUUID();const body={bookingId:selected?.bookingId??null,tripId:selected?.tripId??null,cashCents:cents(cash),squareCents:cents(square),otherCents:cents(other),otherLabel:otherLabel.trim()||null,occurredAt:new Date().toISOString(),clientMutationId:id};await queueManagerMutation({id,legId:manager.legId,method:"POST",path:"/manager/income",body,createdAt:new Date().toISOString()});setState("saved_offline");if(navigator.onLine){setState("syncing");const rows=await flushManagerMutationQueue(managerApi);setState((rows.find(r=>r.id===id)?.state as any)??"synced");}}
            return <form onSubmit={submit} className="grid gap-3 rounded-xl border bg-white p-4"><h2 className="font-bold">Event / place income</h2><label className="grid gap-1 text-sm font-semibold">Event<select value={eventId} onChange={e=>setEventId(e.target.value)}>{events.map(e=><option key={e.id} value={e.id}>{e.name??"Scheduled event"}</option>)}</select></label><div className="grid grid-cols-2 gap-3"><label className="grid gap-1 text-sm font-semibold">Cash<input inputMode="decimal" value={cash} onChange={e=>setCash(e.target.value)} placeholder="0.00"/></label><label className="grid gap-1 text-sm font-semibold">Square / card<input inputMode="decimal" value={square} onChange={e=>setSquare(e.target.value)} placeholder="0.00"/></label></div><label className="grid gap-1 text-sm font-semibold">Other<input inputMode="decimal" value={other} onChange={e=>setOther(e.target.value)} placeholder="0.00"/></label><label className="grid gap-1 text-sm font-semibold">Other label<input value={otherLabel} onChange={e=>setOtherLabel(e.target.value)}/></label><button className="button-primary">Save income</button>{state?<ManagerSyncStatus state={state}/>:null}</form>;
          }
          EOF

          cat > artifacts/adventure-zone/src/pages/ManagerMoneyPage.tsx <<'EOF'
          import { useEffect,useState } from "react";
          import { useManagerAuth } from "@/lib/manager-auth-context";
          import { EventIncomeForm } from "@/components/manager/event-income-form";
          import { SettlementSummary } from "@/components/manager/settlement-summary";
          type Summary={incomeTotalCents:number;expenseTotalCents:number;cashPosition:{cashOnHandCents:number};settlement:{ownerOwesManagerCents:number;managerOwesOwnerCents:number;netCents:number}};
          type Dashboard={events:Array<{id:string;bookingId?:string|null;name?:string;tripId?:string|null}>};
          const money=(c:number)=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(c/100);
          export default function ManagerMoneyPage(){const {managerApi}=useManagerAuth();const [summary,setSummary]=useState<Summary|null>(null);const [events,setEvents]=useState<Dashboard["events"]>([]);const [error,setError]=useState("");useEffect(()=>{Promise.all([managerApi<Summary>("/manager/money/summary"),managerApi<Dashboard>("/manager/dashboard")]).then(([s,d])=>{setSummary(s);setEvents(d.events??[])}).catch(e=>setError(e instanceof Error?e.message:"Could not load money"));},[managerApi]);if(error)return <p role="alert">{error}</p>;if(!summary)return <p>Loading money…</p>;return <div className="grid gap-4"><header><p className="text-xs font-bold uppercase tracking-wider text-orange-700">Money</p><h1 className="text-2xl font-bold">Leg money & settlement</h1></header><div className="grid grid-cols-2 gap-3"><div className="rounded-xl border bg-white p-3"><p className="text-xs text-slate-500">Income</p><p className="font-bold">{money(summary.incomeTotalCents)}</p></div><div className="rounded-xl border bg-white p-3"><p className="text-xs text-slate-500">Expenses</p><p className="font-bold">{money(summary.expenseTotalCents)}</p></div><div className="rounded-xl border bg-white p-3"><p className="text-xs text-slate-500">Cash on hand</p><p className="font-bold">{money(summary.cashPosition.cashOnHandCents)}</p></div></div><SettlementSummary settlement={summary.settlement}/><EventIncomeForm events={events}/></div>}
          EOF

          python - <<'PY'
          from pathlib import Path
          app=Path('artifacts/adventure-zone/src/App.tsx');s=app.read_text()
          if 'ManagerMoneyPage' not in s:
              s=s.replace('import ManagerRoutePage from "@/pages/ManagerRoutePage";','import ManagerRoutePage from "@/pages/ManagerRoutePage";\nimport ManagerMoneyPage from "@/pages/ManagerMoneyPage";')
          old='return <ManagerShell><Switch><Route path="/manager/route"><ManagerRoutePage /></Route><Route path="/manager"><ManagerHomePage /></Route></Switch></ManagerShell>;'
          new='return <ManagerShell><Switch><Route path="/manager/money"><ManagerMoneyPage /></Route><Route path="/manager/route"><ManagerRoutePage /></Route><Route path="/manager"><ManagerHomePage /></Route></Switch></ManagerShell>;'
          s=s.replace(old,new)
          anchor='      <Route path="/sign-in" component={SignInPage} />\n'
          manager='      <Route path="/manager/sign-in"><ManagerAuthProvider><ManagerSignInPage /></ManagerAuthProvider></Route>\n      <Route path="/manager/{*rest}"><ManagerAuthProvider><ManagerProtectedApp /></ManagerAuthProvider></Route>\n      <Route path="/manager"><ManagerAuthProvider><ManagerProtectedApp /></ManagerAuthProvider></Route>\n'
          if '<Route path="/manager/sign-in">' not in s:s=s.replace(anchor,anchor+manager)
          app.write_text(s)

          shell=Path('artifacts/adventure-zone/src/components/manager/manager-shell.tsx');s=shell.read_text()
          s=s.replace('import { Home, MapPinned, LogOut } from "lucide-react";','import { Home, MapPinned, LogOut, WalletCards } from "lucide-react";')
          s=s.replace('grid-cols-2','grid-cols-3')
          needle='<Link href="/manager/route" className="flex min-h-16 flex-col items-center justify-center text-xs font-semibold"><MapPinned className="h-5 w-5" />Events / Route</Link>'
          repl=needle+'\n      <Link href="/manager/money" className="flex min-h-16 flex-col items-center justify-center text-xs font-semibold"><WalletCards className="h-5 w-5" />Money</Link>'
          if 'href="/manager/money"' not in s:s=s.replace(needle,repl)
          shell.write_text(s)
          PY
      - name: Verify Task 3 green
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerMoneyPage.test.tsx
          pnpm --filter @workspace/adventure-zone typecheck
          grep -q '/manager/sign-in' artifacts/adventure-zone/src/App.tsx
          grep -q '/manager/money' artifacts/adventure-zone/src/App.tsx
      - name: Commit Task 3
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/adventure-zone/src/pages/ManagerMoneyPage.tsx artifacts/adventure-zone/src/pages/ManagerMoneyPage.test.tsx artifacts/adventure-zone/src/components/manager/event-income-form.tsx artifacts/adventure-zone/src/components/manager/settlement-summary.tsx artifacts/adventure-zone/src/App.tsx artifacts/adventure-zone/src/components/manager/manager-shell.tsx
          git commit -m 'feat: add manager money dashboard [skip money-task1] [skip money-task2] [skip money-task2-retry] [skip money-task3]'
          git push
