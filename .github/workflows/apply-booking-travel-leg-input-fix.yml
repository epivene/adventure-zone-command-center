name: Apply booking create travel leg input fix

on:
  push:
    branches:
      - fix/booking-create-travel-leg-input
    paths:
      - ".github/workflows/apply-booking-travel-leg-input-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/booking-create-travel-leg-input
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add travel leg to booking create schema
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/bookings/booking-input.ts')
          text = path.read_text()
          old = '''    status: z.enum(bookingStatusValues),\n    nextActionKind: z.string(),'''
          new = '''    status: z.enum(bookingStatusValues),\n    travelLegId: z\n      .union([z.literal(""), z.null(), z.string().uuid()])\n      .transform((value) => value || null),\n    nextActionKind: z.string(),'''
          if old not in text:
              raise SystemExit('booking create schema insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run booking input regression
        run: pnpm --filter @workspace/api-server exec vitest run src/features/bookings/booking-input-travel-leg.test.ts
      - name: Verify booking route type error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'routes/bookings\.ts\(95.*travelLegId' /tmp/api-typecheck.log; then
            echo 'Booking create travelLegId type error remains.' >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/bookings/booking-input.ts
          git diff --cached --quiet || git commit -m "fix: preserve travel leg on booking create input"
          git push origin HEAD:fix/booking-create-travel-leg-input
