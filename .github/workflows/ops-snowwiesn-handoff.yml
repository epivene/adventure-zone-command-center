name: One-time SnowWiesn recipient correction

on:
  push:
    branches:
      - ops/snowwiesn-handoff-2026-09-01
    paths:
      - ".github/workflows/ops-snowwiesn-handoff.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/snowwiesn-handoff-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record current recipient decision
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          fs.writeFileSync('/tmp/snowwiesn-recipient-note.json', JSON.stringify({
            organizationId: '9957265b-fb03-4ee1-8e37-b19fd751ce7d',
            subject: 'SnowWiesn recipient correction - Zach is current contact',
            body: 'Desiree removed Michael Rueckert from the September 1, 2026 reply because Zachary Smith is now the active SnowWiesn contact. Keep Michael as historical relationship context only; do not automatically copy him on future SnowWiesn drafts. Zach: zach.smith@snowbasin.com.'
          }));
          NODE

          curl --fail --silent --show-error             --request POST             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             --header "Content-Type: application/json"             --data-binary @/tmp/snowwiesn-recipient-note.json             "${BASE_URL}/profile-notes" > /tmp/snowwiesn-recipient-response.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const note = JSON.parse(fs.readFileSync('/tmp/snowwiesn-recipient-response.json', 'utf8'));
          if (note.ok !== true || note.organizationId !== '9957265b-fb03-4ee1-8e37-b19fd751ce7d') {
            throw new Error('SnowWiesn recipient correction failed.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/snowwiesn-recipient-correction.json', JSON.stringify({
            completedAt: new Date().toISOString(),
            ok: true,
            organizationId: note.organizationId,
            noteCreated: note.created,
            activityId: note.activityId
          }, null, 2) + '\n');
          NODE

      - name: Commit correction receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/snowwiesn-recipient-correction.json
          git commit -m "ops: record SnowWiesn recipient correction"
          git push origin HEAD:ops/snowwiesn-handoff-2026-09-01
