name: One-time SnowWiesn detailed history audit

on:
  push:
    branches:
      - ops/snowwiesn-handoff-2026-09-01
    paths:
      - ".github/workflows/ops-snowwiesn-handoff.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/snowwiesn-handoff-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Export relevant live SnowWiesn history
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          PROFILE_ID="9957265b-fb03-4ee1-8e37-b19fd751ce7d"
          curl --fail --silent --show-error             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             "${BASE_URL}/profile-history/${PROFILE_ID}" > /tmp/snowwiesn-history.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('/tmp/snowwiesn-history.json', 'utf8'));
          if (root.ok !== true || root.profileId !== '9957265b-fb03-4ee1-8e37-b19fd751ce7d') {
            throw new Error('The exact SnowWiesn profile could not be verified.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/snowwiesn-detailed-history.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            profileId: root.profileId,
            place: root.place,
            contacts: root.contacts,
            bookings: root.bookings,
            followUps: root.followUps,
            notes: root.notes,
            history: root.history,
            migrationHistory: root.migrationHistory
          }, null, 2) + '\n');
          NODE

      - name: Commit detailed audit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/snowwiesn-detailed-history.json
          git commit -m "ops: record detailed SnowWiesn history audit"
          git push origin HEAD:ops/snowwiesn-handoff-2026-09-01
