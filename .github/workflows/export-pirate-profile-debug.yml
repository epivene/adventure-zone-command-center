name: Export duplicate profile child evidence

on:
  push:
    branches:
      - fix/canonical-profile-children
    paths:
      - ".github/workflows/export-pirate-profile-debug.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Export protected live integrity report
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            "${API_URL%/}/api/assistant-import/profile-integrity-audit" \
            --output profile-integrity-audit.json

      - name: Extract every exact duplicate child group
        id: duplicate_profiles
        run: |
          mkdir -p duplicate-profile-histories
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('profile-integrity-audit.json', 'utf8'));
          const duplicateCodes = new Set(['duplicate_appearance_exact', 'duplicate_profile_contact']);
          const issues = report.issues.filter((issue) => duplicateCodes.has(issue.code));
          const ids = [...new Set(issues.map((issue) => issue.profileId).filter(Boolean))].sort();
          const idSet = new Set(ids);
          const profiles = report.profiles.filter((profile) => idSet.has(profile.id));
          fs.writeFileSync('duplicate-profile-audit.json', JSON.stringify({
            generatedAt: report.generatedAt,
            profiles,
            issues,
            summary: report.summary,
          }, null, 2));
          fs.writeFileSync('duplicate-profile-ids.txt', ids.join('\n') + (ids.length ? '\n' : ''));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# Exact duplicate profile children',
            '',
            `- Affected profiles: ${ids.length}`,
            `- Duplicate contact groups: ${issues.filter((issue) => issue.code === 'duplicate_profile_contact').length}`,
            `- Duplicate yearly appearance groups: ${issues.filter((issue) => issue.code === 'duplicate_appearance_exact').length}`,
          ].join('\n') + '\n');
          NODE

      - name: Export each affected full profile
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          while IFS= read -r profile_id; do
            [ -n "${profile_id}" ] || continue
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              "${API_URL%/}/api/assistant-import/profile-history/${profile_id}" \
              --output "duplicate-profile-histories/${profile_id}.json"
          done < duplicate-profile-ids.txt

          node <<'NODE'
          const fs = require('fs');
          for (const file of fs.readdirSync('duplicate-profile-histories')) {
            const profile = JSON.parse(fs.readFileSync(`duplicate-profile-histories/${file}`, 'utf8'));
            if (profile.ok !== true || !Array.isArray(profile.contacts) || !Array.isArray(profile.bookings)) {
              throw new Error(`Invalid profile export: ${file}`);
            }
          }
          NODE

      - name: Upload protected evidence
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-profile-child-evidence
          path: |
            duplicate-profile-audit.json
            duplicate-profile-ids.txt
            duplicate-profile-histories/
          retention-days: 2
