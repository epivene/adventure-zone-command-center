name: Codex hierarchy branch checks

on:
  push:
    branches:
      - codex/organization-location-hierarchy
  workflow_dispatch:

# Verification marker: Task 9 merge family guards

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run scripts/verify-organization-location-hierarchy.test.ts
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-merge-family-guard.test.ts --testTimeout=15000
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/organizations/bulk-duplicate-merge.test.ts
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-family-review.test.ts --testTimeout=15000
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/organizations/duplicates-family-review.test.tsx src/components/organizations/duplicates-view.test.tsx
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-family-matcher.test.ts --testTimeout=15000
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/act-replacement/matching/matchers.test.ts --testTimeout=15000
      - run: pnpm --filter @workspace/api-server exec vitest run --testTimeout=15000
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/organizations/organization-search-hierarchy.test.ts src/components/organizations/organization-list-hierarchy.test.tsx src/features/organizations/website-url.test.ts src/features/event-profiles/event-profile-hierarchy.test.ts src/components/event-profiles/event-profile-hierarchy.test.tsx src/components/organizations/hierarchy-controls.test.tsx
      - run: pnpm --filter @workspace/db build
      - run: pnpm exec tsc -p lib/api-zod/tsconfig.json
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/adventure-zone typecheck
        if: ${{ always() }}
      - run: pnpm run typecheck
      - run: pnpm run build
