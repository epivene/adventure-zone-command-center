name: Codex hierarchy branch checks

on:
  push:
    branches:
      - codex/organization-location-hierarchy
  workflow_dispatch:

# Verification marker: Task 9 merge family guards

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verification script tests
        run: pnpm exec vitest run scripts/verify-organization-location-hierarchy.test.ts
      - name: API tests
        if: ${{ always() }}
        run: pnpm --filter @workspace/api-server exec vitest run --testTimeout=15000
      - name: Frontend tests
        if: ${{ always() }}
        run: pnpm --filter @workspace/adventure-zone exec vitest run src
      - name: Library builds
        if: ${{ always() }}
        run: pnpm run typecheck:libs
      - name: API typecheck
        if: ${{ always() }}
        run: pnpm --filter @workspace/api-server typecheck
      - name: Frontend typecheck
        if: ${{ always() }}
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: API build
        if: ${{ always() }}
        run: pnpm --filter @workspace/api-server build
      - name: Frontend build
        if: ${{ always() }}
        run: pnpm --filter @workspace/adventure-zone build
      - name: Water Lantern production hierarchy verification
        if: ${{ always() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is unavailable; production-data verification is not runnable in branch CI."
            exit 0
          fi
          pnpm verify:organization-hierarchy -- --organization "Water Lantern Festival"
