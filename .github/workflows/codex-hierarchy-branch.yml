name: Codex hierarchy branch checks

on:
  push:
    branches:
      - codex/organization-location-hierarchy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run --testTimeout=15000
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/organizations/organization-search-hierarchy.test.ts src/components/organizations/organization-list-hierarchy.test.tsx
      - run: pnpm run typecheck
      - run: pnpm run build
