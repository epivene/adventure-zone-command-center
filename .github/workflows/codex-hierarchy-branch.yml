name: Codex hierarchy branch checks

on:
  push:
    branches:
      - codex/organization-location-hierarchy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hierarchy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hierarchy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hierarchy_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hierarchy_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/db exec drizzle-kit push --force --config ./drizzle.config.ts
      - run: pnpm --filter @workspace/api-server exec vitest run --testTimeout=20000
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/organizations/organization-search-hierarchy.test.ts src/components/organizations/organization-list-hierarchy.test.tsx src/features/organizations/website-url.test.ts src/features/event-profiles/event-profile-hierarchy.test.ts src/components/event-profiles/event-profile-hierarchy.test.tsx src/components/organizations/hierarchy-controls.test.tsx src/components/organizations/duplicates-family-review.test.tsx src/features/organizations/bulk-duplicate-merge.test.ts
      - run: pnpm --filter @workspace/db build
      - run: pnpm exec tsc -p lib/api-zod/tsconfig.json
      - run: pnpm --filter @workspace/api-server typecheck
      - run: pnpm --filter @workspace/adventure-zone typecheck
        if: ${{ always() }}
      - run: pnpm run typecheck
      - run: pnpm run build
