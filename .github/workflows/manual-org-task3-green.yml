name: Manual Org Task3 Green
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  green:
    if: contains(github.event.head_commit.message, '[manual-org-task3-green]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adventure_zone_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-membership-query.test.ts src/features/organizations/organization-membership.test.ts src/features/organizations/organization-membership-schema.test.ts
      - run: pnpm --filter @workspace/api-server build
