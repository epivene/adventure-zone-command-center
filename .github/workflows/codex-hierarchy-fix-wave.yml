name: Codex hierarchy fix wave
on:
  push:
    branches: [codex/organization-location-hierarchy]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend hierarchy regressions
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/features/event-profiles/event-profile-hierarchy.test.ts src/components/organizations/duplicates-family-review.test.tsx
      - name: API hierarchy regressions
        run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-family-review.test.ts src/features/organizations/organization-family-atomic.test.ts src/features/organizations/organization-merge-family-guard.test.ts
