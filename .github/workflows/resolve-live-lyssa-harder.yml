name: Apply Northern Gila response updates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resolve-live-lyssa-harder.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply protected live CRM updates
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${API_URL}"
          test -n "${ASSISTANT_IMPORT_TOKEN}"
          BASE_URL="${API_URL%/}/api/assistant-import"
          AUTH_HEADER="Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          fs.writeFileSync("booking.json", JSON.stringify({
            event: {
              id: "6813439b-4ba6-478c-9c51-70b583914e9e",
              name: "Northern Gila County Fair",
              city: "Payson",
              region: "AZ"
            },
            profile: {},
            contacts: [],
            booking: {
              enabled: true,
              name: "Northern Gila County Fair - 2026",
              startsAt: "2026-10-01T17:00:00.000Z",
              endsAt: "2026-10-03T17:00:00.000Z",
              status: "declined"
            }
          }));
          fs.writeFileSync("note.json", JSON.stringify({
            organizationId: "6813439b-4ba6-478c-9c51-70b583914e9e",
            subject: "2026 vendor decision - local vendor contracted",
            body: "Lyssa Harder replied September 1, 2026 that Northern Gila County Fair already has a contract in place with a local vendor for the 2026 event. She was previously unaware of the existing contract and said she will keep The Adventure Zone's name and company on file for future events. Treat the 2026 opportunity as declined because an incumbent local vendor is already contracted, not because of dissatisfaction with Adventure Zone. Reconnect early for 2027 and offer backup or supplemental coverage if their vendor cannot cover everything."
          }));
          fs.writeFileSync("follow-up.json", JSON.stringify({
            organizationId: "6813439b-4ba6-478c-9c51-70b583914e9e",
            label: "Reconnect early for 2027 Northern Gila County Fair",
            reason: "Lyssa said Northern Gila County Fair has a local vendor contracted for 2026 but will keep Adventure Zone on file. Contact her early about 2027 before vendor plans are finalized and offer backup or supplemental coverage if the local vendor cannot meet all of the fair's needs.",
            dueAt: "2026-11-02T16:00:00.000Z",
            preserveExisting: false
          }));
          NODE

          curl --fail --silent --show-error \
            --header "${AUTH_HEADER}" \
            --header "Content-Type: application/json" \
            --data @booking.json \
            "${BASE_URL}/event-profiles" > booking-response.json

          curl --fail --silent --show-error \
            --header "${AUTH_HEADER}" \
            --header "Content-Type: application/json" \
            --data @note.json \
            "${BASE_URL}/profile-notes" > note-response.json

          curl --fail --silent --show-error \
            --header "${AUTH_HEADER}" \
            --header "Content-Type: application/json" \
            --data @follow-up.json \
            "${BASE_URL}/today-followups" > follow-up-response.json

          curl --fail --silent --show-error \
            --header "${AUTH_HEADER}" \
            "${BASE_URL}/profile-history/6813439b-4ba6-478c-9c51-70b583914e9e" \
            > verified-profile-history.json

          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const file of ["booking-response.json", "note-response.json", "follow-up-response.json", "verified-profile-history.json"]) {
            JSON.parse(fs.readFileSync(file, "utf8"));
          }
          NODE
      - name: Upload protected verification
        uses: actions/upload-artifact@v4
        with:
          name: northern-gila-live-update-verification
          path: |
            booking-response.json
            note-response.json
            follow-up-response.json
            verified-profile-history.json
          retention-days: 1
