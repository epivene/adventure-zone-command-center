name: Manual Org Sync Main
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[manual-org-sync-main]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/manual-organization-membership-ui
