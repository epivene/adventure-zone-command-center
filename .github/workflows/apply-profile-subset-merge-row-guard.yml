name: Apply profile subset merge row guard

on:
  push:
    branches:
      - fix/profile-subset-merge-row-guard
    paths:
      - ".github/workflows/apply-profile-subset-merge-row-guard.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-subset-merge-row-guard
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm compiler error exists before fix
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'profile-subset-merge-guard\.ts.*error TS2352' /tmp/api-before.log >/dev/null || {
            echo "Expected profile subset merge TS2352 was not present." >&2
            exit 1
          }
      - name: Guard selected profile query rows
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/organizations/profile-subset-merge-guard.ts')
          text = path.read_text()
          marker = '''type MergeCandidateRow = {\n  id: string;\n  city: string | null;\n  region: string | null;\n  consolidatedIntoId: string | null;\n};\n'''
          guard = marker + '''\nfunction isMergeCandidateRow(row: Record<string, unknown>): row is MergeCandidateRow {\n  return typeof row.id === "string"\n    && (row.city === null || typeof row.city === "string")\n    && (row.region === null || typeof row.region === "string")\n    && (row.consolidatedIntoId === null || typeof row.consolidatedIntoId === "string");\n}\n'''
          if marker not in text:
              raise SystemExit('merge candidate marker not found')
          text = text.replace(marker, guard, 1)
          old = '  const rows = ((result as { rows?: MergeCandidateRow[] }).rows ?? []);'
          if old not in text:
              raise SystemExit('unsafe merge candidate cast not found')
          text = text.replace(old, '  const rows = result.rows.filter(isMergeCandidateRow);', 1)
          path.write_text(text)
          PY
      - name: Run subset merge safety tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-merge-subset-safety.test.ts
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/organizations/profile-subset-merge-guard.ts
          git diff --cached --quiet || git commit -m "fix: guard profile subset merge query rows"
          git push origin HEAD:fix/profile-subset-merge-row-guard
      - run: pnpm run typecheck:libs
      - name: Verify compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'profile-subset-merge-guard\.ts.*error TS2352' /tmp/api-after.log; then
            echo "Profile subset merge TS2352 remains." >&2
            exit 1
          fi
