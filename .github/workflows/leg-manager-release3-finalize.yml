value={location} onChange={e=>setLocation(e.target.value)}/></label><label className="grid gap-1 font-semibold">People involved<textarea value={people} onChange={e=>setPeople(e.target.value)}/></label><label className="grid gap-1 font-semibold">Description<textarea aria-label="Incident description" value={description} onChange={e=>setDescription(e.target.value)} required/></label><label className="grid gap-1 font-semibold">Action taken<textarea value={action} onChange={e=>setAction(e.target.value)}/></label><label className="flex gap-2"><input type="checkbox" checked={follow} onChange={e=>setFollow(e.target.checked)}/>Follow-up needed</label><label className="grid gap-1 font-semibold">Photo<input type="file" accept="image/*" capture="environment" onChange={e=>setFile(e.target.files?.[0]??null)}/></label><button className="button-primary">Save incident</button>{status?<p role="status">{status}</p>:null}</form>}
