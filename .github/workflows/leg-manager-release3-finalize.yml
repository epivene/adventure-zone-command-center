          block='''\nconst incidentSchema=z.object({id:z.string().uuid(),type:z.string().trim().min(1).max(120),occurredAt:z.coerce.date(),bookingId:z.string().uuid().nullable().optional(),tripId:z.string().uuid().nullable().optional(),locationText:z.string().trim().max(500).nullable().optional(),peopleInvolved:z.string().trim().max(2000).nullable().optional(),description:z.string().trim().min(1).max(12000),actionTaken:z.string().trim().max(8000).nullable().optional(),followUpNeeded:z.boolean(),clientMutationId:z.string().uuid()});\nrouter.get("/manager/incidents",requireManager,async(req,res)=>{res.json({incidents:await incidents.listForLeg(req.legManager!.legId)});});\nrouter.post("/manager/incidents",requireManager,async(req,res):Promise<void>=>{const parsed=incidentSchema.safeParse(req.body);if(!parsed.success){res.status(400).json({error:parsed.error.issues[0]?.message??"Invalid incident"});return;}const result=await createIncidentForManager(incidents,req.legManager!.legId,{...parsed.data,bookingId:parsed.data.bookingId??null,tripId:parsed.data.tripId??null,locationText:parsed.data.locationText??null,peopleInvolved:parsed.data.peopleInvolved??null,actionTaken:parsed.data.actionTaken??null});if(!result.ok){res.status(403).json({error:"Booking or trip is outside your leg"});return;}res.status(result.idempotent?200:201).json({incident:result.incident});});\nconst incidentAttachment=z.object({id:z.string().uuid(),incidentId:z.string().uuid(),clientMutationId:z.string().uuid(),mimeType:z.string().max(120).nullable().optional()});\nrouter.post("/manager/incident-attachments",requireManager,async(req,res):Promise<void>=>{const parsed=incidentAttachment.safeParse(req.body);if(!parsed.success){res.status(400).json({error:"Invalid attachment"});return;}res.status(201).json({attachment:await incidents.createAttachment({id:parsed.data.id,legId:req.legManager!.legId,incidentId:parsed.data.incidentId,clientMutationId:parsed.data.clientMutationId,mimeType:parsed.data.mimeType