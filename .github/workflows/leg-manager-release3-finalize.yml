name: Finalize Leg Manager Release 3
on:
  push:
    branches: [feature/leg-manager-crew-aftermath]

jobs:
  finalize:
    if: "!contains(github.event.head_commit.message, '[skip release3-finalize]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Add event review repository and APIs
        run: |
          cat > artifacts/api-server/src/features/leg-manager/event-review-repository.ts <<'EOF'
          import { and, desc, eq } from "drizzle-orm";
          import type { NodePgDatabase } from "drizzle-orm/node-postgres";
          import * as schema from "@/db/schema";
          import { bookings, eventManagerReviews } from "@/db/schema";
          import { isEventReviewDue } from "./event-review-service";

          export type EventReviewInput = {
            bookingId: string;
            rating: number;
            feedback: string | null;
            organizerSiteNotes: string | null;
            crewNotes: string | null;
            recommendReturn: "yes" | "no" | "unsure" | null;
            clientMutationId: string;
          };
          export type ReviewBooking = { id:string; travelLegId:string|null; name:string; startsAt:Date|null; endsAt:Date|null };
          export interface EventReviewStore {
            listBookingsForLeg(legId:string):Promise<ReviewBooking[]>;
            listReviewsForLeg(legId:string):Promise<any[]>;
            bookingBelongsToLeg(bookingId:string,legId:string):Promise<boolean>;
            findByMutation(legId:string,clientMutationId:string):Promise<any|null>;
            insertReview(input:EventReviewInput&{legId:string}):Promise<any>;
            listReviewsForBooking(bookingId:string):Promise<any[]>;
          }
          export async function listDueReviewsForManager(store:EventReviewStore,legId:string,now=new Date()){
            const [bookingsForLeg,reviews]=await Promise.all([store.listBookingsForLeg(legId),store.listReviewsForLeg(legId)]);
            const reviewed=new Set(reviews.map((review)=>review.bookingId));
            return bookingsForLeg.filter((booking)=>!reviewed.has(booking.id)&&isEventReviewDue(booking,now));
          }
          export async function createReviewForManager(store:EventReviewStore,legId:string,input:EventReviewInput){
            const existing=await store.findByMutation(legId,input.clientMutationId);
            if(existing)return{ok:true as const,idempotent:true,review:existing};
            if(!(await store.bookingBelongsToLeg(input.bookingId,legId)))return{ok:false as const,code:"FORBIDDEN" as const};
            return{ok:true as const,idempotent:false,review:await store.insertReview({...input,legId})};
          }
          export async function summarizeReviewHistory(store:EventReviewStore,bookingId:string){
            const reviews=await store.listReviewsForBooking(bookingId);
            return{reviews,averageRating:reviews.length?reviews.reduce((sum,review)=>sum+review.rating,0)/reviews.length:null};
          }
          export class DrizzleEventReviewRepository implements EventReviewStore {
            constructor(private readonly database:NodePgDatabase<typeof schema>){}
            async listBookingsForLeg(legId:string){return this.database.select({id:bookings.id,travelLegId:bookings.travelLegId,name:bookings.name,startsAt:bookings.startsAt,endsAt:bookings.endsAt}).from(bookings).where(eq(bookings.travelLegId,legId));}
            async listReviewsForLeg(legId:string){return this.database.select().from(eventManagerReviews).where(eq(eventManagerReviews.legId,legId)).orderBy(desc(eventManagerReviews.createdAt));}
            async bookingBelongsToLeg(bookingId:string,legId:string){return !!(await this.database.select({id:bookings.id}).from(bookings).where(and(eq(bookings.id,bookingId),eq(bookings.travelLegId,legId))).limit(1))[0];}
            async findByMutation(legId:string,clientMutationId:string){return (await this.database.select().from(eventManagerReviews).where(and(eq(eventManagerReviews.legId,legId),eq(eventManagerReviews.clientMutationId,clientMutationId))).limit(1))[0]??null;}
            async insertReview(input:EventReviewInput&{legId:string}){const rows=await this.database.insert(eventManagerReviews).values(input).onConflictDoNothing({target:[eventManagerReviews.legId,eventManagerReviews.clientMutationId]}).returning();if(rows[0])return rows[0];const existing=await this.findByMutation(input.legId,input.clientMutationId);if(!existing)throw new Error("Review insert conflict without existing row");return existing;}
            async listReviewsForBooking(bookingId:string){return this.database.select().from(eventManagerReviews).where(eq(eventManagerReviews.bookingId,bookingId)).orderBy(desc(eventManagerReviews.createdAt));}
            async listAll(){return this.database.select().from(eventManagerReviews).orderBy(desc(eventManagerReviews.createdAt));}
          }
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/leg-manager.ts')
          s=p.read_text()
          if 'DrizzleEventReviewRepository' not in s:
              s=s.replace('import { crewRehireStatuses } from "@/features/leg-manager/crew-types";', 'import { crewRehireStatuses } from "@/features/leg-manager/crew-types";\nimport { createReviewForManager, DrizzleEventReviewRepository, listDueReviewsForManager } from "@/features/leg-manager/event-review-repository";')
              s=s.replace('const router:IRouter=Router();const requireManager=createRequireLegManagerMiddleware(new DrizzleLegManagerRepository(db));const finance=new DrizzleFinanceRepository(db);const crew=new DrizzleCrewRepository(db);', 'const router:IRouter=Router();const requireManager=createRequireLegManagerMiddleware(new DrizzleLegManagerRepository(db));const finance=new DrizzleFinanceRepository(db);const crew=new DrizzleCrewRepository(db);const reviews=new DrizzleEventReviewRepository(db);')
          marker='\nconst issueSchema='
          block='''\nconst eventReviewSchema=z.object({bookingId:z.string().uuid(),rating:z.number().int().min(0).max(5),feedback:z.string().trim().max(8000).nullable().optional(),organizerSiteNotes:z.string().trim().max(8000).nullable().optional(),crewNotes:z.string().trim().max(8000).nullable().optional(),recommendReturn:z.enum(["yes","no","unsure"]).nullable().optional(),clientMutationId:z.string().uuid()});\nrouter.get("/manager/reviews/due",requireManager,async(req,res)=>{res.json({reviewsDue:await listDueReviewsForManager(reviews,req.legManager!.legId,new Date())});});\nrouter.post("/manager/reviews",requireManager,async(req,res):Promise<void>=>{const parsed=eventReviewSchema.safeParse(req.body);if(!parsed.success){res.status(400).json({error:parsed.error.issues[0]?.message??"Invalid event review"});return;}const result=await createReviewForManager(reviews,req.legManager!.legId,{...parsed.data,feedback:parsed.data.feedback??null,organizerSiteNotes:parsed.data.organizerSiteNotes??null,crewNotes:parsed.data.crewNotes??null,recommendReturn:parsed.data.recommendReturn??null});if(!result.ok){res.status(403).json({error:"Booking is outside your leg"});return;}res.status(result.idempotent?200:201).json({review:result.review});});\n'''
          if '/manager/reviews/due' not in s:s=s.replace(marker,block+marker)
          p.write_text(s)
          PY

      - name: Add event review UI and profile history
        run: |
          cat > artifacts/adventure-zone/src/pages/ManagerEventReviewPage.tsx <<'EOF'
          import { useEffect,useState } from "react";import { useManagerAuth } from "@/lib/manager-auth-context";import { queueManagerMutation,flushManagerMutationQueue } from "@/lib/manager-sync-queue";import { ManagerSyncStatus } from "@/components/manager/manager-sync-status";
          export default function ManagerEventReviewPage(){const{manager,managerApi}=useManagerAuth();const[due,setDue]=useState<any[]>([]);const[selected,setSelected]=useState("");const[rating,setRating]=useState("5");const[feedback,setFeedback]=useState("");const[site,setSite]=useState("");const[crew,setCrew]=useState("");const[recommend,setRecommend]=useState("unsure");const[state,setState]=useState<any>(null);useEffect(()=>{managerApi<any>("/manager/reviews/due").then(d=>{setDue(d.reviewsDue??[]);setSelected(d.reviewsDue?.[0]?.id??"")})},[managerApi]);async function submit(e:React.FormEvent){e.preventDefault();if(!manager||!selected)return;const id=crypto.randomUUID();const body={bookingId:selected,rating:Number(rating),feedback:feedback.trim()||null,organizerSiteNotes:site.trim()||null,crewNotes:crew.trim()||null,recommendReturn:recommend,clientMutationId:id};await queueManagerMutation({id,legId:manager.legId,path:"/manager/reviews",method:"POST",body,createdAt:new Date().toISOString()});setState("saved_offline");if(navigator.onLine){setState("syncing");const rows=await flushManagerMutationQueue(managerApi);setState(rows.find(r=>r.id===id)?.state??"synced")}}return <div className="grid gap-4"><h1 className="text-2xl font-bold">Event reviews</h1>{due.length?<form onSubmit={submit} className="grid gap-3 rounded-xl border bg-white p-4"><label className="grid gap-1 font-semibold">Event<select value={selected} onChange={e=>setSelected(e.target.value)}>{due.map(event=><option key={event.id} value={event.id}>{event.name}</option>)}</select></label><label className="grid gap-1 font-semibold">Event rating<select aria-label="Event rating" value={rating} onChange={e=>setRating(e.target.value)}>{[0,1,2,3,4,5].map(v=><option key={v} value={v}>{v} stars</option>)}</select></label><label className="grid gap-1 font-semibold">Feedback<textarea aria-label="Feedback" value={feedback} onChange={e=>setFeedback(e.target.value)}/></label><label className="grid gap-1 font-semibold">Organizer / site notes<textarea value={site} onChange={e=>setSite(e.target.value)}/></label><label className="grid gap-1 font-semibold">Crew notes<textarea value={crew} onChange={e=>setCrew(e.target.value)}/></label><label className="grid gap-1 font-semibold">Recommend return<select aria-label="Recommend return" value={recommend} onChange={e=>setRecommend(e.target.value)}><option value="yes">Yes</option><option value="no">No</option><option value="unsure">Unsure</option></select></label><button className="button-primary">Save review</button>{state?<ManagerSyncStatus state={state}/>:null}</form>:<p>No event reviews are due.</p>}</div>}
          EOF
          cat > artifacts/adventure-zone/src/pages/ManagerHomePage.tsx <<'EOF'
          import { useEffect,useState } from "react";import { Link } from "wouter";import { useManagerAuth } from "@/lib/manager-auth-context";
          export default function ManagerHomePage(){const{manager,managerApi}=useManagerAuth();const[count,setCount]=useState(0);useEffect(()=>{managerApi<any>("/manager/reviews/due").then(d=>setCount(d.reviewsDue?.length??0)).catch(()=>setCount(0))},[managerApi]);return <div className="grid gap-4"><div><p className="text-sm text-slate-600">Signed in for</p><h1 className="text-2xl font-bold">{manager?.legName}</h1></div>{count>0?<section className="rounded-xl border border-amber-200 bg-amber-50 p-4"><h2 className="font-bold">{count} {count===1?"event still needs":"events still need"} reviews</h2><Link href="/manager/reviews" className="button-primary mt-3 inline-flex">Complete reviews</Link></section>:null}<section className="rounded-xl border bg-white p-4"><h2 className="font-bold">Schedule & route</h2><p className="mt-1 text-sm text-slate-600">Official schedule information is view-only here.</p><Link href="/manager/route" className="button-primary mt-4 inline-flex">View events & route</Link></section></div>}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/adventure-zone/src/App.tsx');s=p.read_text()
          if 'ManagerEventReviewPage' not in s:s=s.replace('import ManagerWorkerPage from "@/pages/ManagerWorkerPage";', 'import ManagerWorkerPage from "@/pages/ManagerWorkerPage";\nimport ManagerEventReviewPage from "@/pages/ManagerEventReviewPage";')
          if '/manager/reviews' not in s:s=s.replace('<Route path="/manager/crew/:workerId">', '<Route path="/manager/reviews"><ManagerEventReviewPage /></Route>\n        <Route path="/manager/crew/:workerId">')
          p.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/event-profiles.ts');s=p.read_text()
          if 'eventManagerReviews' not in s:s=s.replace('  organizations,\n} from "@/db/schema";', '  organizations,\n  eventManagerReviews,\n} from "@/db/schema";')
          old='res.json({ ...profile, assistedCallingEnabled: process.env.ASSISTED_CALLING_ENABLED === "true" });'
          new='''const bookingIds=profile.bookings.map((booking)=>booking.id);\n    const allReviews=await db.select().from(eventManagerReviews);\n    const managerReviews=allReviews.filter((review)=>bookingIds.includes(review.bookingId));\n    const managerReviewAverage=managerReviews.length?managerReviews.reduce((sum,review)=>sum+review.rating,0)/managerReviews.length:null;\n    res.json({ ...profile, managerReviews, managerReviewAverage, assistedCallingEnabled: process.env.ASSISTED_CALLING_ENABLED === "true" });'''
          if 'managerReviewAverage' not in s:s=s.replace(old,new)
          p.write_text(s)
          PY

      - name: Add incident schema and repository
        run: |
          cat > lib/db/migrations/040_leg_incidents.sql <<'EOF'
          create table if not exists leg_incidents (
            id uuid primary key,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            booking_id uuid references bookings(id) on delete set null,
            trip_id uuid references trips(id) on delete set null,
            type text not null,
            occurred_at timestamptz not null,
            location_text text,
            people_involved text,
            description text not null,
            action_taken text,
            follow_up_needed boolean not null default false,
            client_mutation_id uuid not null,
            revision integer not null default 1,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint leg_incidents_type_nonblank check (nullif(trim(type),'') is not null),
            constraint leg_incidents_description_nonblank check (nullif(trim(description),'') is not null),
            constraint leg_incidents_revision_positive check (revision >= 1),
            constraint leg_incidents_leg_mutation_unique unique (leg_id, client_mutation_id)
          );
          create index if not exists leg_incidents_leg_occurred_idx on leg_incidents(leg_id, occurred_at desc);
          create table if not exists leg_incident_attachments (
            id uuid primary key,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            incident_id uuid not null references leg_incidents(id) on delete cascade,
            object_key text,
            image_status text not null default 'image_pending',
            mime_type text,
            client_mutation_id uuid not null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint leg_incident_attachments_status_valid check (image_status in ('image_pending','image_uploaded','image_failed')),
            constraint leg_incident_attachments_leg_mutation_unique unique (leg_id, client_mutation_id)
          );
          create index if not exists leg_incident_attachments_incident_idx on leg_incident_attachments(incident_id);
          EOF
          cat >> lib/db/src/schema/index.ts <<'EOF'

          export const legIncidents = pgTable("leg_incidents", {
            id: uuid("id").primaryKey(),
            legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
            bookingId: uuid("booking_id").references(() => bookings.id, { onDelete: "set null" }),
            tripId: uuid("trip_id").references(() => trips.id, { onDelete: "set null" }),
            type: text("type").notNull(), occurredAt: timestamp("occurred_at", { withTimezone: true }).notNull(),
            locationText: text("location_text"), peopleInvolved: text("people_involved"), description: text("description").notNull(), actionTaken: text("action_taken"), followUpNeeded: boolean("follow_up_needed").default(false).notNull(),
            clientMutationId: uuid("client_mutation_id").notNull(), revision: integer("revision").default(1).notNull(),
            createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(), updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
          }, (table) => [uniqueIndex("leg_incidents_leg_mutation_unique").on(table.legId, table.clientMutationId), index("leg_incidents_leg_occurred_idx").on(table.legId, table.occurredAt.desc()), check("leg_incidents_type_nonblank", sql`nullif(trim(${table.type}), '') is not null`), check("leg_incidents_description_nonblank", sql`nullif(trim(${table.description}), '') is not null`), check("leg_incidents_revision_positive", sql`${table.revision} >= 1`)]);

          export const legIncidentAttachments = pgTable("leg_incident_attachments", {
            id: uuid("id").primaryKey(), legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }), incidentId: uuid("incident_id").notNull().references(() => legIncidents.id, { onDelete: "cascade" }), objectKey: text("object_key"), imageStatus: text("image_status").default("image_pending").notNull(), mimeType: text("mime_type"), clientMutationId: uuid("client_mutation_id").notNull(), createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(), updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
          }, (table) => [uniqueIndex("leg_incident_attachments_leg_mutation_unique").on(table.legId, table.clientMutationId), index("leg_incident_attachments_incident_idx").on(table.incidentId), check("leg_incident_attachments_status_valid", sql`${table.imageStatus} in ('image_pending','image_uploaded','image_failed')`)]);
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('lib/db/src/migrations.ts');s=p.read_text()
          if '040_leg_incidents.sql' not in s:
              block='''  {
            name: "040_leg_incidents.sql",
            markerSql: "SELECT to_regclass(current_schema() || '.leg_incidents') IS NOT NULL AND to_regclass(current_schema() || '.leg_incident_attachments') IS NOT NULL AS ready",
          },
          '''
              s=s.replace('] as const;',block+'] as const;');p.write_text(s)
          PY

          cat > artifacts/api-server/src/features/leg-manager/incident-repository.ts <<'EOF'
          import { and, desc, eq } from "drizzle-orm";import type { NodePgDatabase } from "drizzle-orm/node-postgres";import * as schema from "@/db/schema";import { bookings,legIncidentAttachments,legIncidents,trips } from "@/db/schema";
          export type IncidentInput={id:string;type:string;occurredAt:Date;bookingId:string|null;tripId:string|null;locationText:string|null;peopleInvolved:string|null;description:string;actionTaken:string|null;followUpNeeded:boolean;clientMutationId:string};
          export interface IncidentStore{findByMutation(legId:string,clientMutationId:string):Promise<any|null>;bookingBelongsToLeg(bookingId:string,legId:string):Promise<boolean>;tripBelongsToLeg(tripId:string,legId:string):Promise<boolean>;insertIncident(input:IncidentInput&{legId:string}):Promise<any>;listAll():Promise<any[]>}
          export async function createIncidentForManager(store:IncidentStore,legId:string,input:IncidentInput){const existing=await store.findByMutation(legId,input.clientMutationId);if(existing)return{ok:true as const,idempotent:true,incident:existing};if(input.bookingId&&!(await store.bookingBelongsToLeg(input.bookingId,legId)))return{ok:false as const,code:"FORBIDDEN" as const};if(input.tripId&&!(await store.tripBelongsToLeg(input.tripId,legId)))return{ok:false as const,code:"FORBIDDEN" as const};return{ok:true as const,idempotent:false,incident:await store.insertIncident({...input,legId})};}
          export class DrizzleIncidentRepository implements IncidentStore{constructor(private readonly database:NodePgDatabase<typeof schema>){}async findByMutation(legId:string,id:string){return(await this.database.select().from(legIncidents).where(and(eq(legIncidents.legId,legId),eq(legIncidents.clientMutationId,id))).limit(1))[0]??null}async bookingBelongsToLeg(id:string,legId:string){return!!(await this.database.select({id:bookings.id}).from(bookings).where(and(eq(bookings.id,id),eq(bookings.travelLegId,legId))).limit(1))[0]}async tripBelongsToLeg(id:string,legId:string){return!!(await this.database.select({id:trips.id}).from(trips).where(and(eq(trips.id,id),eq(trips.travelLegId,legId))).limit(1))[0]}async insertIncident(input:IncidentInput&{legId:string}){const rows=await this.database.insert(legIncidents).values(input).onConflictDoNothing({target:[legIncidents.legId,legIncidents.clientMutationId]}).returning();if(rows[0])return rows[0];const existing=await this.findByMutation(input.legId,input.clientMutationId);if(!existing)throw new Error("Incident insert conflict");return existing}async listAll(){return this.database.select().from(legIncidents).orderBy(desc(legIncidents.occurredAt))}async listForLeg(legId:string){return this.database.select().from(legIncidents).where(eq(legIncidents.legId,legId)).orderBy(desc(legIncidents.occurredAt))}async createAttachment(input:{id:string;legId:string;incidentId:string;clientMutationId:string;mimeType:string|null}){const rows=await this.database.insert(legIncidentAttachments).values(input).onConflictDoNothing({target:[legIncidentAttachments.legId,legIncidentAttachments.clientMutationId]}).returning();return rows[0]??(await this.database.select().from(legIncidentAttachments).where(and(eq(legIncidentAttachments.legId,input.legId),eq(legIncidentAttachments.clientMutationId,input.clientMutationId))).limit(1))[0]}async getAttachment(legId:string,id:string){return(await this.database.select().from(legIncidentAttachments).where(and(eq(legIncidentAttachments.legId,legId),eq(legIncidentAttachments.id,id))).limit(1))[0]??null}async setAttachmentUploaded(legId:string,id:string,key:string,mime:string){return(await this.database.update(legIncidentAttachments).set({objectKey:key,imageStatus:"image_uploaded",mimeType:mime,updatedAt:new Date()}).where(and(eq(legIncidentAttachments.id,id),eq(legIncidentAttachments.legId,legId))).returning())[0]??null}}
          EOF

      - name: Wire incident APIs and UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/leg-manager.ts');s=p.read_text()
          if 'DrizzleIncidentRepository' not in s:
              anchor='import { createReviewForManager, DrizzleEventReviewRepository, listDueReviewsForManager } from "@/features/leg-manager/event-review-repository";'
              s=s.replace(anchor,anchor+'\nimport { createIncidentForManager, DrizzleIncidentRepository } from "@/features/leg-manager/incident-repository";')
              s=s.replace('const reviews=new DrizzleEventReviewRepository(db);','const reviews=new DrizzleEventReviewRepository(db);const incidents=new DrizzleIncidentRepository(db);')
