name: Repair pnpm lockfile

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-pnpm-lockfile.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate lockfile from current package manifests
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Verify frozen install and Render API build
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server run build

      - name: Commit repaired lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already matches package manifests."
            exit 0
          fi
          git commit -m "Fix corrupted pnpm lockfile"
          git push origin HEAD:main
