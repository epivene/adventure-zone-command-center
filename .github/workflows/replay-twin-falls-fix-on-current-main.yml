name: Replay Twin Falls duplicate fix on current main

on:
  push:
    branches:
      - fix/twin-falls-duplicate-profiles-current
    paths:
      - ".github/workflows/replay-twin-falls-fix-on-current-main.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/twin-falls-duplicate-profiles-current
          fetch-depth: 0

      - name: Replay the reviewed source changes
        run: |
          set -euo pipefail
          git fetch origin fix/twin-falls-duplicate-profiles:refs/remotes/origin/fix/twin-falls-duplicate-profiles

          git checkout origin/fix/twin-falls-duplicate-profiles -- \
            artifacts/api-server/src/features/organizations/twin-falls-duplicate-cleanup.ts \
            artifacts/api-server/src/features/organizations/twin-falls-duplicate-cleanup.test.ts \
            artifacts/api-server/src/features/organizations/organization-duplicate-normalization.pglite.test.ts

          git diff 3efc693665c7c3e2c569bcfd7112f240a8e685ce..origin/fix/twin-falls-duplicate-profiles -- \
            artifacts/api-server/src/features/organizations/organization-repository.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import.test.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import-batch.test.ts \
            imports/approved-profiles/twin-falls-county-fair-2026.json \
            | git apply --3way

          rm .github/workflows/replay-twin-falls-fix-on-current-main.yml

      - name: Commit current-main version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/features/organizations/twin-falls-duplicate-cleanup.ts \
            artifacts/api-server/src/features/organizations/twin-falls-duplicate-cleanup.test.ts \
            artifacts/api-server/src/features/organizations/organization-duplicate-normalization.pglite.test.ts \
            artifacts/api-server/src/features/organizations/organization-repository.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import.test.ts \
            artifacts/api-server/src/features/approved-profile-import/startup-import-batch.test.ts \
            imports/approved-profiles/twin-falls-county-fair-2026.json \
            .github/workflows/replay-twin-falls-fix-on-current-main.yml
          git commit -m "fix: consolidate Twin Falls duplicate profiles"
          git push origin HEAD:fix/twin-falls-duplicate-profiles-current
