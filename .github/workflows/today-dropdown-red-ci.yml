name: Today Dropdown Regression

on:
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/pages/TodayPage.tsx"
      - "artifacts/adventure-zone/src/pages/TodayPage.test.tsx"
      - "artifacts/adventure-zone/src/components/today/renewals-section.tsx"
      - ".github/workflows/today-dropdown-red-ci.yml"

jobs:
  today-dropdowns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/TodayPage.test.tsx
