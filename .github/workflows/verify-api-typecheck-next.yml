name: Verify next API typecheck cluster

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace declarations
        run: pnpm run typecheck:libs
      - name: Capture API compiler baseline
        run: pnpm --filter @workspace/api-server run typecheck
