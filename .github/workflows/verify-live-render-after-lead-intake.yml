name: Verify live Render after lead intake repair

on:
  push:
    branches:
      - fix/lead-intake-startup-timeout-final
    paths:
      - ".github/workflows/verify-live-render-after-lead-intake.yml"

permissions:
  contents: read

env:
  APP_BASE_URL: https://adventure-zone-command-center.onrender.com
  PIRATE_PROFILE_ID: f24033e1-801b-43ff-9a7e-a9d6d7b426c3

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Wait for healthy Render API
        run: |
          for attempt in $(seq 1 50); do
            code=$(curl --silent --show-error --max-time 20 --output health.json --write-out '%{http_code}' "${APP_BASE_URL}/api/healthz" || true)
            echo "health attempt=${attempt} http=${code}"
            if [ "$code" = "200" ]; then
              cat health.json
              exit 0
            fi
            sleep 10
          done
          echo "Render API never became healthy"
          cat health.json 2>/dev/null || true
          exit 1

      - name: Verify protected profile read
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          code=$(curl --silent --show-error --max-time 30 \
            --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            --output profile.json --write-out '%{http_code}' \
            "${APP_BASE_URL}/api/assistant-import/profile-history/${PIRATE_PROFILE_ID}" || true)
          echo "profile-history http=${code}"
          test "$code" = "200"
          node -e "const x=require('./profile.json'); if(x.ok!==true || x.profileId!=='${PIRATE_PROFILE_ID}') process.exit(1)"
