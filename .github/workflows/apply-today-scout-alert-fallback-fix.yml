name: Apply Today scout alert fallback typing fix

on:
  push:
    branches:
      - fix/today-scout-alert-fallback-typing
    paths:
      - ".github/workflows/apply-today-scout-alert-fallback-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-scout-alert-fallback-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Preserve Scout Alert fallback type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/routes/today.ts')
          text = path.read_text()
          text = text.replace(
              'import { ScoutAlertRepository } from "@/features/assistant/scout-alert-repository";\n',
              'import { ScoutAlertRepository } from "@/features/assistant/scout-alert-repository";\nimport type { ScoutAlertView } from "@/features/assistant/scout-alert-types";\n',
              1,
          )
          old = '''      scoutAlertRepository.listVisible(now).catch((error) => {\n        req.log.warn({ err: error }, "Scout Alerts could not be loaded for Today");\n        return [];\n      }),'''
          new = '''      scoutAlertRepository.listVisible(now).catch((error): ScoutAlertView[] => {\n        req.log.warn({ err: error }, "Scout Alerts could not be loaded for Today");\n        return [];\n      }),'''
          if old not in text:
              raise SystemExit('Scout Alert fallback block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run Scout Alert repository tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/assistant/scout-alert-repository.test.ts
      - name: Verify Today severity type error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'routes/today\.ts\(18[0-9].*severity' /tmp/api-typecheck.log; then
            echo 'Today Scout Alert severity type error remains.' >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/today.ts
          git diff --cached --quiet || git commit -m "fix: preserve Today scout alert fallback typing"
          git push origin HEAD:fix/today-scout-alert-fallback-typing
