name: Leg Manager Release 3 Task 1 Green
on:
  push:
    branches: [feature/leg-manager-crew-aftermath]

jobs:
  task1:
    if: "!contains(github.event.head_commit.message, '[skip release3-task1]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add crew domain and repository
        run: |
          cat > artifacts/api-server/src/features/leg-manager/crew-types.ts <<'EOF'
          export const crewRehireStatuses = ["rehirable", "undecided", "do_not_rehire"] as const;
          export type CrewRehireStatus = (typeof crewRehireStatuses)[number];

          export type CrewWorker = {
            id: string;
            name: string;
            phone: string | null;
            normalizedPhone: string | null;
            email: string | null;
            city: string | null;
            region: string | null;
            locationText: string | null;
            rehireStatus: CrewRehireStatus;
          };

          export type CrewWorkHistory = {
            id: string;
            workerId: string;
            legId: string;
            bookingId: string | null;
            tripId: string | null;
            role: string;
            startedAt: Date;
            endedAt: Date | null;
            rating: number | null;
            note: string | null;
          };

          export type CrewManagerNote = {
            id: string;
            workerId: string;
            legId: string;
            bookingId: string | null;
            note: string;
          };

          export type CrewWorkerWithHistory = CrewWorker & {
            workHistory: CrewWorkHistory[];
            managerNotes: CrewManagerNote[];
          };

          export function normalizeCrewPhone(phone: string | null | undefined): string | null {
            if (!phone) return null;
            const digits = phone.replace(/\D/g, "");
            if (!digits) return null;
            if (digits.length === 11 && digits.startsWith("1")) return digits.slice(1);
            return digits;
          }
          EOF

          cat > artifacts/api-server/src/features/leg-manager/crew-repository.ts <<'EOF'
          import { asc, desc, eq } from "drizzle-orm";
          import type { NodePgDatabase } from "drizzle-orm/node-postgres";
          import * as schema from "@/db/schema";
          import { crewManagerNotes, crewWorkers, crewWorkHistory } from "@/db/schema";
          import {
            normalizeCrewPhone,
            type CrewManagerNote,
            type CrewWorker,
            type CrewWorkerWithHistory,
            type CrewWorkHistory,
            type CrewRehireStatus,
          } from "./crew-types";

          export type CrewWorkHistoryPatch = Partial<
            Pick<CrewWorkHistory, "role" | "startedAt" | "endedAt" | "rating" | "note">
          >;

          export interface CrewRepositoryStore {
            listWorkers(): Promise<CrewWorker[]>;
            listWorkHistory(): Promise<CrewWorkHistory[]>;
            listManagerNotes(): Promise<CrewManagerNote[]>;
            getWorkHistory(id: string): Promise<CrewWorkHistory | null>;
            updateWorkHistory(id: string, patch: CrewWorkHistoryPatch): Promise<CrewWorkHistory | null>;
          }

          export async function listWorkersForManager(
            store: CrewRepositoryStore,
            _managerLegId: string,
          ): Promise<CrewWorkerWithHistory[]> {
            const [workers, history, notes] = await Promise.all([
              store.listWorkers(),
              store.listWorkHistory(),
              store.listManagerNotes(),
            ]);
            return workers.map((worker) => ({
              ...worker,
              workHistory: history.filter((entry) => entry.workerId === worker.id),
              managerNotes: notes.filter((note) => note.workerId === worker.id),
            }));
          }

          export async function updateWorkHistoryAsManager(
            store: CrewRepositoryStore,
            managerLegId: string,
            historyId: string,
            patch: CrewWorkHistoryPatch,
          ) {
            const existing = await store.getWorkHistory(historyId);
            if (!existing) return { ok: false as const, code: "NOT_FOUND" as const };
            if (existing.legId !== managerLegId) {
              return { ok: false as const, code: "FORBIDDEN" as const };
            }
            const entry = await store.updateWorkHistory(historyId, patch);
            if (!entry) return { ok: false as const, code: "NOT_FOUND" as const };
            return { ok: true as const, entry };
          }

          export class DrizzleCrewRepository implements CrewRepositoryStore {
            constructor(private readonly database: NodePgDatabase<typeof schema>) {}

            async listWorkers() {
              return (await this.database.select().from(crewWorkers).orderBy(asc(crewWorkers.name))) as CrewWorker[];
            }

            async listWorkHistory() {
              return (await this.database
                .select()
                .from(crewWorkHistory)
                .orderBy(desc(crewWorkHistory.startedAt))) as CrewWorkHistory[];
            }

            async listManagerNotes() {
              return (await this.database
                .select()
                .from(crewManagerNotes)
                .orderBy(desc(crewManagerNotes.createdAt))) as CrewManagerNote[];
            }

            async getWorkHistory(id: string) {
              return ((await this.database
                .select()
                .from(crewWorkHistory)
                .where(eq(crewWorkHistory.id, id))
                .limit(1))[0] ?? null) as CrewWorkHistory | null;
            }

            async updateWorkHistory(id: string, patch: CrewWorkHistoryPatch) {
              return ((await this.database
                .update(crewWorkHistory)
                .set({ ...patch, updatedAt: new Date() })
                .where(eq(crewWorkHistory.id, id))
                .returning())[0] ?? null) as CrewWorkHistory | null;
            }

            async createWorker(input: {
              name: string;
              phone?: string | null;
              email?: string | null;
              city?: string | null;
              region?: string | null;
              locationText?: string | null;
              rehireStatus?: CrewRehireStatus;
            }) {
              return (await this.database
                .insert(crewWorkers)
                .values({
                  name: input.name.trim(),
                  phone: input.phone?.trim() || null,
                  normalizedPhone: normalizeCrewPhone(input.phone),
                  email: input.email?.trim() || null,
                  city: input.city?.trim() || null,
                  region: input.region?.trim() || null,
                  locationText: input.locationText?.trim() || null,
                  rehireStatus: input.rehireStatus ?? "undecided",
                })
                .returning())[0];
            }

            async findPossibleMatches(input: { name: string; phone?: string | null }) {
              const normalizedPhone = normalizeCrewPhone(input.phone);
              const workers = await this.listWorkers();
              const normalizedName = input.name.trim().toLocaleLowerCase();
              return workers.filter(
                (worker) =>
                  (normalizedPhone && worker.normalizedPhone === normalizedPhone) ||
                  worker.name.trim().toLocaleLowerCase() === normalizedName,
              );
            }
          }
          EOF
      - name: Add migration and schema
        run: |
          cat > lib/db/migrations/038_leg_crew.sql <<'EOF'
          create table if not exists crew_workers (
            id uuid primary key default gen_random_uuid(),
            name text not null,
            phone text,
            normalized_phone text,
            email text,
            city text,
            region text,
            location_text text,
            rehire_status text not null default 'undecided',
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint crew_workers_name_nonblank check (nullif(trim(name), '') is not null),
            constraint crew_workers_rehire_status_valid check (rehire_status in ('rehirable','undecided','do_not_rehire'))
          );
          create index if not exists crew_workers_location_idx on crew_workers(region, city);
          create index if not exists crew_workers_normalized_phone_idx on crew_workers(normalized_phone) where normalized_phone is not null;

          create table if not exists crew_work_history (
            id uuid primary key default gen_random_uuid(),
            worker_id uuid not null references crew_workers(id) on delete restrict,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            booking_id uuid references bookings(id) on delete set null,
            trip_id uuid references trips(id) on delete set null,
            role text not null,
            started_at timestamptz not null,
            ended_at timestamptz,
            rating integer,
            note text,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint crew_work_history_role_nonblank check (nullif(trim(role), '') is not null),
            constraint crew_work_history_dates_valid check (ended_at is null or ended_at >= started_at),
            constraint crew_work_history_rating_valid check (rating is null or rating between 0 and 5)
          );
          create index if not exists crew_work_history_worker_started_idx on crew_work_history(worker_id, started_at desc);
          create index if not exists crew_work_history_leg_started_idx on crew_work_history(leg_id, started_at desc);

          create table if not exists crew_manager_notes (
            id uuid primary key default gen_random_uuid(),
            worker_id uuid not null references crew_workers(id) on delete restrict,
            leg_id uuid not null references travel_legs(id) on delete restrict,
            booking_id uuid references bookings(id) on delete set null,
            note text not null,
            created_at timestamptz not null default now(),
            updated_at timestamptz not null default now(),
            constraint crew_manager_notes_note_nonblank check (nullif(trim(note), '') is not null)
          );
          create index if not exists crew_manager_notes_worker_created_idx on crew_manager_notes(worker_id, created_at desc);
          create index if not exists crew_manager_notes_leg_created_idx on crew_manager_notes(leg_id, created_at desc);
          EOF

          cat >> lib/db/src/schema/index.ts <<'EOF'

          export const crewWorkers = pgTable(
            "crew_workers",
            {
              id: uuid("id").defaultRandom().primaryKey(),
              name: text("name").notNull(),
              phone: text("phone"),
              normalizedPhone: text("normalized_phone"),
              email: text("email"),
              city: text("city"),
              region: text("region"),
              locationText: text("location_text"),
              rehireStatus: text("rehire_status").default("undecided").notNull(),
              createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
              updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
            },
            (table) => [
              index("crew_workers_location_idx").on(table.region, table.city),
              index("crew_workers_normalized_phone_idx").on(table.normalizedPhone).where(sql`${table.normalizedPhone} is not null`),
              check("crew_workers_name_nonblank", sql`nullif(trim(${table.name}), '') is not null`),
              check("crew_workers_rehire_status_valid", sql`${table.rehireStatus} in ('rehirable','undecided','do_not_rehire')`),
            ],
          );

          export const crewWorkHistory = pgTable(
            "crew_work_history",
            {
              id: uuid("id").defaultRandom().primaryKey(),
              workerId: uuid("worker_id").notNull().references(() => crewWorkers.id, { onDelete: "restrict" }),
              legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
              bookingId: uuid("booking_id").references(() => bookings.id, { onDelete: "set null" }),
              tripId: uuid("trip_id").references(() => trips.id, { onDelete: "set null" }),
              role: text("role").notNull(),
              startedAt: timestamp("started_at", { withTimezone: true }).notNull(),
              endedAt: timestamp("ended_at", { withTimezone: true }),
              rating: integer("rating"),
              note: text("note"),
              createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
              updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
            },
            (table) => [
              index("crew_work_history_worker_started_idx").on(table.workerId, table.startedAt.desc()),
              index("crew_work_history_leg_started_idx").on(table.legId, table.startedAt.desc()),
              check("crew_work_history_role_nonblank", sql`nullif(trim(${table.role}), '') is not null`),
              check("crew_work_history_dates_valid", sql`${table.endedAt} is null or ${table.endedAt} >= ${table.startedAt}`),
              check("crew_work_history_rating_valid", sql`${table.rating} is null or ${table.rating} between 0 and 5`),
            ],
          );

          export const crewManagerNotes = pgTable(
            "crew_manager_notes",
            {
              id: uuid("id").defaultRandom().primaryKey(),
              workerId: uuid("worker_id").notNull().references(() => crewWorkers.id, { onDelete: "restrict" }),
              legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
              bookingId: uuid("booking_id").references(() => bookings.id, { onDelete: "set null" }),
              note: text("note").notNull(),
              createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
              updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
            },
            (table) => [
              index("crew_manager_notes_worker_created_idx").on(table.workerId, table.createdAt.desc()),
              index("crew_manager_notes_leg_created_idx").on(table.legId, table.createdAt.desc()),
              check("crew_manager_notes_note_nonblank", sql`nullif(trim(${table.note}), '') is not null`),
            ],
          );
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('lib/db/src/migrations.ts')
          s=p.read_text()
          if '038_leg_crew.sql' not in s:
              needle='] as const;'
              block='''  {\n    name: "038_leg_crew.sql",\n    markerSql: "SELECT to_regclass(current_schema() || '.crew_workers') IS NOT NULL AND to_regclass(current_schema() || '.crew_work_history') IS NOT NULL AND to_regclass(current_schema() || '.crew_manager_notes') IS NOT NULL AS ready",\n  },\n'''
              s=s.replace(needle,block+needle)
              p.write_text(s)
          PY
      - name: Verify Task 1
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/crew-repository.test.ts
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-server build
      - name: Commit Task 1 product files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/features/leg-manager/crew-types.ts artifacts/api-server/src/features/leg-manager/crew-repository.ts artifacts/api-server/src/features/leg-manager/crew-repository.test.ts lib/db/migrations/038_leg_crew.sql lib/db/src/schema/index.ts lib/db/src/migrations.ts
          git commit -m 'feat: add shared seasonal crew directory [skip release3-task1]'
          git push
