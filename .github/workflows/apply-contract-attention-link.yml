name: Apply contract attention link

on:
  push:
    branches:
      - fix/contracts-attention-queue
    paths:
      - ".github/workflows/apply-contract-attention-link.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contracts-attention-queue
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Patch Today contract action
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/adventure-zone/src/pages/TodayPage.tsx')
          text = path.read_text()
          old = '<Link className="text-sm font-bold text-orange-700 hover:underline" href="/profiles">Open booking work</Link>'
          new = '<Link className="text-sm font-bold text-orange-700 hover:underline" href="/bookings?attention=contracts">Open contract work</Link>'
          if old not in text:
              raise SystemExit('Today contract action anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run focused contract queue test
        run: pnpm --filter @workspace/adventure-zone exec vitest run --config vitest.config.ts src/pages/BookingsPage.contract-attention.test.ts
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/adventure-zone/src/pages/TodayPage.tsx
          git diff --cached --quiet || git commit -m "fix: route Today contracts to focused queue"
          git push origin HEAD:fix/contracts-attention-queue
