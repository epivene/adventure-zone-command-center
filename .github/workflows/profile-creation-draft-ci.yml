name: Profile Creation Draft CI

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/adventure-zone/src/components/event-profiles/**"
      - "artifacts/adventure-zone/src/components/navigation/app-menu.tsx"
      - "artifacts/adventure-zone/src/lib/profile-draft.ts"
      - "artifacts/adventure-zone/src/pages/EventProfileNewPage.tsx"
      - "artifacts/adventure-zone/src/profile-creation-flow.test.ts"
      - "artifacts/api-server/src/routes/event-profiles.ts"
      - ".github/workflows/profile-creation-draft-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused profile creation tests
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/profile-creation-flow.test.ts src/components/event-profiles/event-profile-form.test.tsx
      - name: Frontend typecheck
        run: pnpm --filter @workspace/adventure-zone run typecheck
      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone run build
      - name: API build
        run: pnpm --filter @workspace/api-server run build
