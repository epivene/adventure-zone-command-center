name: Manual Org Task7 Red
on:
  push:
    branches: [feature/manual-organization-membership-ui]
jobs:
  red:
    if: contains(github.event.head_commit.message, '[manual-org-task7-red]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/adventure-zone exec vitest run src/pages/EventProfilePage.organization-membership.test.tsx
# red trigger
