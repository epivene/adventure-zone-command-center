name: Replay Gmail profile-link repair on current main

on:
  push:
    branches:
      - fix/gmail-profile-history-audit-current
    paths:
      - ".github/workflows/replay-gmail-profile-link-audit-on-current-main.yml"

permissions:
  contents: write

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-profile-history-audit-current
          fetch-depth: 0

      - name: Replay reviewed Gmail profile-link changes
        run: |
          set -euo pipefail
          SOURCE_BRANCH="fix/gmail-profile-history-audit-2026-08-31"
          git fetch origin "${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}"
          BASE=$(git merge-base HEAD "origin/${SOURCE_BRANCH}")

          git checkout "origin/${SOURCE_BRANCH}" -- \
            artifacts/api-server/src/features/google-workspace/google-api-client-query.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-window-query.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.test.ts \
            artifacts/api-server/src/routes/assistant-gmail-profile-links.ts \
            artifacts/api-server/src/routes/assistant-gmail-profile-links.test.ts \
            .github/workflows/gmail-profile-link-audit-ci.yml

          git diff "${BASE}".."origin/${SOURCE_BRANCH}" -- \
            artifacts/api-server/src/features/google-workspace/google-api-types.ts \
            artifacts/api-server/src/features/google-workspace/google-api-client.ts \
            artifacts/api-server/src/app.ts \
            | git apply --3way

          python <<'PY'
          from pathlib import Path

          loop = Path('artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.ts')
          text = loop.read_text()
          text = text.replace(
              'export const GOOGLE_SENT_PROFILE_LINK_LOOKBACK_MS = 45 * 24 * 60 * 60 * 1_000;',
              'export const GOOGLE_SENT_PROFILE_LINK_LOOKBACK_MS = 14 * 24 * 60 * 60 * 1_000;',
          )
          text = text.replace(
              'export const GOOGLE_SENT_PROFILE_LINK_SWEEP_INTERVAL_MS = 15 * 60 * 1_000;',
              'export const GOOGLE_SENT_PROFILE_LINK_SWEEP_INTERVAL_MS = 60 * 60 * 1_000;',
          )
          loop.write_text(text)

          index = Path('artifacts/api-server/src/index.ts')
          text = index.read_text()
          import_marker = 'import { createOpportunityEmailWorkerLoop } from "./features/opportunity-email/opportunity-email-worker-runtime";'
          imports = '''import { GoogleSentProfileLinkSweepService } from "./features/google-workspace/google-sent-profile-link-sweep-service";
          import {
            GoogleSentProfileLinkSweepLoop,
            systemGoogleSentProfileLinkSweepLoopScheduler,
          } from "./features/google-workspace/google-sent-profile-link-sweep-loop";'''.replace('          ', '')
          if 'GoogleSentProfileLinkSweepLoop' not in text:
              if import_marker not in text:
                  raise SystemExit('Opportunity-email import marker is missing')
              text = text.replace(import_marker, import_marker + '\n' + imports, 1)

          instance_marker = '''const paperNoteLoop = new PaperNoteWorkerLoop({
            worker: createPaperNoteExtractionWorker({
              repository: new PaperNoteExtractionRepository(db),
              storage: paperNoteStorage,
            }),
            workerId: `paper-notes-${randomUUID()}`,
            clock: { now: () => new Date() },
            scheduler: systemPaperNoteWorkerLoopScheduler,
          });
          '''.replace('          ', '')
          instance = '''
          const gmailProfileLinkSweepLoop = new GoogleSentProfileLinkSweepLoop({
            sweep: new GoogleSentProfileLinkSweepService(),
            clock: { now: () => new Date() },
            scheduler: systemGoogleSentProfileLinkSweepLoopScheduler,
          });
          '''.replace('          ', '')
          if 'const gmailProfileLinkSweepLoop =' not in text:
              if instance_marker not in text:
                  raise SystemExit('Paper-note loop marker is missing')
              text = text.replace(instance_marker, instance_marker + instance, 1)

          close_marker = '''      assistantJobLoop.close(),
                paperNoteLoop.close(),
          '''.replace('          ', '')
          close_replacement = '''      assistantJobLoop.close(),
                paperNoteLoop.close(),
                gmailProfileLinkSweepLoop.close(),
          '''.replace('          ', '')
          if 'gmailProfileLinkSweepLoop.close()' not in text:
              if close_marker not in text:
                  raise SystemExit('Shutdown marker is missing')
              text = text.replace(close_marker, close_replacement, 1)

          start_marker = '''  assistantJobLoop.start();
            paperNoteLoop.start();
          '''.replace('          ', '')
          start_replacement = '''  assistantJobLoop.start();
            paperNoteLoop.start();
            gmailProfileLinkSweepLoop.start();
          '''.replace('          ', '')
          if 'gmailProfileLinkSweepLoop.start()' not in text:
              if start_marker not in text:
                  raise SystemExit('Worker-start marker is missing')
              text = text.replace(start_marker, start_replacement, 1)
          index.write_text(text)

          workflow = Path('.github/workflows/gmail-profile-link-audit-ci.yml')
          ci = workflow.read_text()
          ci = ci.replace(
              'fix/gmail-profile-history-audit-2026-08-31',
              'fix/gmail-profile-history-audit-current',
          )
          workflow.write_text(ci)

          Path('.github/workflows/replay-gmail-profile-link-audit-on-current-main.yml').unlink()
          PY

      - name: Commit replayed changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/features/google-workspace/google-api-types.ts \
            artifacts/api-server/src/features/google-workspace/google-api-client.ts \
            artifacts/api-server/src/features/google-workspace/google-api-client-query.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-window-query.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.ts \
            artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.test.ts \
            artifacts/api-server/src/routes/assistant-gmail-profile-links.ts \
            artifacts/api-server/src/routes/assistant-gmail-profile-links.test.ts \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/index.ts \
            .github/workflows/gmail-profile-link-audit-ci.yml \
            .github/workflows/replay-gmail-profile-link-audit-on-current-main.yml
          git commit -m "Fix and audit sent Gmail profile links"
          git push origin HEAD:fix/gmail-profile-history-audit-current
