name: Export blank profile research batch 02 live evidence

on:
  push:
    branches:
      - research/blank-profiles-batch-02
    paths:
      - ".github/workflows/export-blank-profile-batch-02-live-evidence.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Export current blank profiles and exact live histories
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          mkdir -p batch02/history batch02/search

          # Batch 01 must be visible in production before selecting the next 25.
          # Its merged changes leave fewer than 435 ACT-backed blank profiles.
          for attempt in $(seq 1 60); do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              "${BASE_URL}/profile-integrity-audit" \
              > batch02/audit.json

            if node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('batch02/audit.json', 'utf8'));
          const blanks = (audit.profiles || []).filter((profile) =>
            profile.actRecordId
            && Number(profile.contactCount || 0) === 0
            && Number(profile.appearanceCount || 0) === 0
            && Number(profile.timelineCount || 0) === 0
            && Number(profile.openFollowUpCount || 0) === 0
            && Number(profile.gmailThreadCount || 0) === 0
            && Number(profile.calendarLinkCount || 0) === 0
          );
          process.exit(blanks.length < 435 ? 0 : 1);
          NODE
            then
              echo "Batch 01 is reflected in production on attempt ${attempt}."
              break
            fi

            if [ "${attempt}" = "60" ]; then
              echo "Batch 01 never became visible in the live audit."
              exit 1
            fi
            sleep 15
          done

          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('batch02/audit.json', 'utf8'));
          const statePattern = /^[A-Z]{2}$/;
          const blanks = (audit.profiles || []).filter((profile) =>
            profile.actRecordId
            && Number(profile.contactCount || 0) === 0
            && Number(profile.appearanceCount || 0) === 0
            && Number(profile.timelineCount || 0) === 0
            && Number(profile.openFollowUpCount || 0) === 0
            && Number(profile.gmailThreadCount || 0) === 0
            && Number(profile.calendarLinkCount || 0) === 0
          );

          const locationProblem = (profile) =>
            !String(profile.city || '').trim()
            || !statePattern.test(String(profile.region || '').trim().toUpperCase());

          const selected = [...blanks].sort((left, right) => {
            const leftGroup = locationProblem(left) ? 0 : String(left.region || '').toUpperCase() === 'CO' ? 1 : 2;
            const rightGroup = locationProblem(right) ? 0 : String(right.region || '').toUpperCase() === 'CO' ? 1 : 2;
            return leftGroup - rightGroup
              || String(left.region || '').localeCompare(String(right.region || ''))
              || String(left.city || '').localeCompare(String(right.city || ''))
              || String(left.name || '').localeCompare(String(right.name || ''))
              || String(left.id || '').localeCompare(String(right.id || ''));
          }).slice(0, 25);

          if (selected.length !== 25) {
            throw new Error(`Expected 25 profiles for batch 02; found ${selected.length}.`);
          }

          fs.writeFileSync('batch02/selection.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            auditGeneratedAt: audit.generatedAt,
            blankActBackedCount: blanks.length,
            selected,
          }, null, 2));
          NODE

          node - <<'NODE' > batch02/selected-ids.txt
          const fs = require('fs');
          const selection = JSON.parse(fs.readFileSync('batch02/selection.json', 'utf8'));
          for (const profile of selection.selected) console.log(profile.id);
          NODE

          while IFS= read -r PROFILE_ID; do
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              "${BASE_URL}/profile-history/${PROFILE_ID}" \
              > "batch02/history/${PROFILE_ID}.json"
          done < batch02/selected-ids.txt

          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const selection = JSON.parse(fs.readFileSync('batch02/selection.json', 'utf8'));
          const base = process.env.API_URL.replace(/\/$/, '') + '/api/assistant-import';
          const token = process.env.ASSISTANT_IMPORT_TOKEN;
          for (const profile of selection.selected) {
            const query = encodeURIComponent(profile.name);
            const output = execFileSync('curl', [
              '--fail', '--silent', '--show-error',
              '--header', `Authorization: Bearer ${token}`,
              `${base}/profile-search?q=${query}&limit=20`,
            ], { encoding: 'utf8' });
            fs.writeFileSync(`batch02/search/${profile.id}.json`, output);
          }
          NODE

          node <<'NODE'
          const fs = require('fs');
          const selection = JSON.parse(fs.readFileSync('batch02/selection.json', 'utf8'));
          const records = selection.selected.map((profile) => ({
            profile,
            history: JSON.parse(fs.readFileSync(`batch02/history/${profile.id}.json`, 'utf8')),
            search: JSON.parse(fs.readFileSync(`batch02/search/${profile.id}.json`, 'utf8')),
          }));
          fs.writeFileSync('blank-profile-batch-02-live-evidence.json', JSON.stringify({
            generatedAt: new Date().toISOString(),
            auditGeneratedAt: selection.auditGeneratedAt,
            blankActBackedCount: selection.blankActBackedCount,
            records,
          }, null, 2));
          NODE

      - name: Upload protected batch evidence
        uses: actions/upload-artifact@v4
        with:
          name: blank-profile-batch-02-live-evidence
          path: blank-profile-batch-02-live-evidence.json
          retention-days: 2
