name: Apply profile notes integration
on:
  push:
    branches: [feature/profile-family-notes-impl]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[profile-notes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run integration edit script from verifier workflow
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/profile-notes-impl.yml').read_text()
          start_marker = "          python3 <<'PY'\n"
          start = text.index(start_marker) + len(start_marker)
          end = text.index("\n          PY\n", start)
          code = text[start:end]
          # YAML block indentation is ten spaces; strip it before execution.
          lines = code.splitlines()
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          ns = {"__name__": "__main__"}
          exec(compile(code, "profile-notes-impl", "exec"), ns, ns)
          PY
      - name: Commit applied integration
        run: |
          git config user.name "epivene"
          git config user.email "Desieleighc@gmail.com"
          git add artifacts/api-server artifacts/adventure-zone
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: wire profile location and family notes [profile-notes-applied]"
          git push
