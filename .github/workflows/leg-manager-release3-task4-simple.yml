name: Verify Release 3 Review Foundation
on:
  push:
    branches: [feature/leg-manager-crew-aftermath]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add review table to Drizzle schema
        run: |
          cat >> lib/db/src/schema/index.ts <<'EOF'

          export const eventManagerReviews = pgTable(
            "event_manager_reviews",
            {
              id: uuid("id").defaultRandom().primaryKey(),
              bookingId: uuid("booking_id").notNull().references(() => bookings.id, { onDelete: "restrict" }),
              legId: uuid("leg_id").notNull().references(() => travelLegs.id, { onDelete: "restrict" }),
              rating: integer("rating").notNull(),
              feedback: text("feedback"),
              organizerSiteNotes: text("organizer_site_notes"),
              crewNotes: text("crew_notes"),
              recommendReturn: text("recommend_return"),
              clientMutationId: uuid("client_mutation_id").notNull(),
              createdAt: timestamp("created_at", { withTimezone: true }).defaultNow().notNull(),
              updatedAt: timestamp("updated_at", { withTimezone: true }).defaultNow().notNull(),
            },
            (table) => [
              index("event_manager_reviews_booking_created_idx").on(table.bookingId, table.createdAt.desc()),
              index("event_manager_reviews_leg_created_idx").on(table.legId, table.createdAt.desc()),
              uniqueIndex("event_manager_reviews_leg_mutation_unique").on(table.legId, table.clientMutationId),
              check("event_manager_reviews_rating_valid", sql`${table.rating} between 0 and 5`),
              check("event_manager_reviews_recommend_return_valid", sql`${table.recommendReturn} is null or ${table.recommendReturn} in ('yes','no','unsure')`),
            ],
          );
          EOF
      - name: Register migration 039
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/db/src/migrations.ts')
          s = p.read_text()
          if '039_event_manager_reviews.sql' not in s:
              block = '''  {
            name: "039_event_manager_reviews.sql",
            markerSql: "SELECT to_regclass(current_schema() || '.event_manager_reviews') IS NOT NULL AS ready",
          },
          '''
              s = s.replace('] as const;', block + '] as const;')
              p.write_text(s)
          PY
      - name: Verify review foundation
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/event-review-service.test.ts
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-server build
      - name: Commit review foundation
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/features/leg-manager/event-review-service.ts artifacts/api-server/src/features/leg-manager/event-review-service.test.ts lib/db/migrations/039_event_manager_reviews.sql lib/db/src/schema/index.ts lib/db/src/migrations.ts
          git commit -m 'feat: add post event manager reviews [skip release3-task1] [skip release3-task2] [skip release3-task3] [skip release3-task4]'
          git push
