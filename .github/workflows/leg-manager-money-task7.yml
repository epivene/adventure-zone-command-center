name: Leg Manager Money Task 7
on:
  push:
    branches: [feature/leg-manager-money]
jobs:
  task7:
    if: "!contains(github.event.head_commit.message, '[skip money-task7]')"
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: RED — admin finance view
        run: |
          cat > artifacts/adventure-zone/src/pages/ManagerFinanceAdminPage.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import { cleanup,fireEvent,render,screen,waitFor } from '@testing-library/react';import { afterEach,describe,expect,it,vi } from 'vitest';import ManagerFinanceAdminPage from './ManagerFinanceAdminPage';
          const mocks=vi.hoisted(()=>({get:vi.fn(async(path:string)=>path==='/manager-admin/legs/access'?{legs:[{legId:'a',legName:'Leg A',archivedAt:null,enabled:true},{legId:'b',legName:'Leg B',archivedAt:'2026-01-01',enabled:true}]}:path==='/manager-admin/money/summary'?{incomeTotalCents:150000,expenseTotalCents:50000,settlement:{netCents:25000}}:{incomeTotalCents:100000,expenseTotalCents:30000,settlement:{netCents:20000},expenses:[]}))}));
          vi.mock('@/lib/auth-token',()=>({apiGet:mocks.get}));afterEach(()=>{cleanup();vi.clearAllMocks()});
          describe('ManagerFinanceAdminPage',()=>{it('shows combined totals and filters archived legs',async()=>{render(<ManagerFinanceAdminPage/>);expect(await screen.findByText('$1,500.00')).toBeInTheDocument();expect(screen.getByText('Leg A')).toBeInTheDocument();expect(screen.queryByText('Leg B')).not.toBeInTheDocument();fireEvent.click(screen.getByLabelText('Show archived legs'));expect(screen.getByText('Leg B')).toBeInTheDocument();fireEvent.click(screen.getByRole('button',{name:/Leg A/}));await waitFor(()=>expect(mocks.get).toHaveBeenCalledWith('/manager-admin/legs/a/money/summary'));});});
          EOF
          set +e; pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerFinanceAdminPage.test.tsx >/tmp/r7 2>&1; c=$?; set -e; cat /tmp/r7; test "$c" -ne 0
      - name: GREEN — owner finance page
        run: |
          cat > artifacts/adventure-zone/src/pages/ManagerFinanceAdminPage.tsx <<'EOF'
          import { useEffect,useState } from 'react';import { apiGet } from '@/lib/auth-token';
          const money=(c:number)=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format((c??0)/100);
          export default function ManagerFinanceAdminPage(){const[legs,setLegs]=useState<any[]>([]);const[summary,setSummary]=useState<any>(null);const[selected,setSelected]=useState<any>(null);const[showArchived,setShowArchived]=useState(false);useEffect(()=>{Promise.all([apiGet<any>('/manager-admin/legs/access'),apiGet<any>('/manager-admin/money/summary')]).then(([l,s])=>{setLegs(l.legs??[]);setSummary(s)})},[]);async function open(leg:any){setSelected({leg,...await apiGet<any>(`/manager-admin/legs/${leg.legId}/money/summary`)})}if(!summary)return <p>Loading manager finances…</p>;return <div className="mx-auto grid max-w-5xl gap-4"><header><p className="text-sm font-bold uppercase tracking-wide text-orange-700">Leg managers</p><h1 className="text-3xl font-bold">Finance overview</h1></header><section className="grid grid-cols-3 gap-3"><div className="rounded-xl border bg-white p-4"><p className="text-xs text-slate-500">Combined income</p><p className="text-xl font-bold">{money(summary.incomeTotalCents)}</p></div><div className="rounded-xl border bg-white p-4"><p className="text-xs text-slate-500">Combined expenses</p><p className="text-xl font-bold">{money(summary.expenseTotalCents)}</p></div><div className="rounded-xl border bg-white p-4"><p className="text-xs text-slate-500">Net settlement</p><p className="text-xl font-bold">{money(summary.settlement?.netCents??0)}</p></div></section><label className="flex gap-2"><input type="checkbox" aria-label="Show archived legs" checked={showArchived} onChange={e=>setShowArchived(e.target.checked)}/>Show archived legs</label><section className="grid gap-2">{legs.filter(l=>showArchived||!l.archivedAt).map(leg=><button key={leg.legId} className="rounded-xl border bg-white p-4 text-left" onClick={()=>open(leg)}>{leg.legName}{leg.archivedAt?' — Archived':''}</button>)}</section>{selected?<section className="rounded-xl border bg-white p-4"><h2 className="font-bold">{selected.leg.legName}</h2><p>Income: {money(selected.incomeTotalCents)}</p><p>Expenses: {money(selected.expenseTotalCents)}</p><p>Settlement: {money(selected.settlement?.netCents??0)}</p></section>:null}</div>}
          EOF
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/adventure-zone/src/App.tsx');s=p.read_text();
          if 'ManagerFinanceAdminPage' not in s:s=s.replace('import RoutesPage from "@/pages/RoutesPage";','import RoutesPage from "@/pages/RoutesPage";\nimport ManagerFinanceAdminPage from "@/pages/ManagerFinanceAdminPage";')
          if 'manager-finance' not in s:s=s.replace('<Route path="/routes"><RoutesPage /></Route>','<Route path="/manager-finance"><ManagerFinanceAdminPage /></Route><Route path="/routes"><RoutesPage /></Route>')
          p.write_text(s)
          rp=Path('artifacts/adventure-zone/src/pages/RoutesPage.tsx');s=rp.read_text();
          if '/manager-finance' not in s:s=s.replace('<LegManagerAccess />','<LegManagerAccess />\n      <a className="rounded-xl border bg-white p-4 font-semibold" href="/manager-finance">View all leg finances →</a>')
          rp.write_text(s)
          PY
      - name: Verify Task 7
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run src/pages/ManagerFinanceAdminPage.test.tsx
          pnpm --filter @workspace/adventure-zone typecheck
      - name: Commit Task 7
        run: |
          git config user.name github-actions && git config user.email github-actions@github.com
          git add artifacts/adventure-zone/src/pages/ManagerFinanceAdminPage.tsx artifacts/adventure-zone/src/pages/ManagerFinanceAdminPage.test.tsx artifacts/adventure-zone/src/App.tsx artifacts/adventure-zone/src/pages/RoutesPage.tsx
          git commit -m 'feat: add admin leg finance view [skip money-task1] [skip money-task2] [skip money-task2-retry] [skip money-task3] [skip money-task4] [skip money-task5] [skip money-task5-retry] [skip money-task6] [skip money-task7]'
          git push
