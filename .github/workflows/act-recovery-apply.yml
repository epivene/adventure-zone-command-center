name: ACT Recovery Patch Applicator

on:
  push:
    branches:
      - feature/act-archive-full-recovery
    paths:
      - ".github/patches/act-recovery-*.patch"
      - ".github/recovery-edits/act-recovery-*.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/act-archive-full-recovery
          fetch-depth: 0
      - name: Apply unapplied recovery changes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for patch in .github/patches/act-recovery-*.patch; do
            if git apply --reverse --check "$patch" >/dev/null 2>&1; then
              echo "Already applied: $patch"
              continue
            fi
            echo "Applying: $patch"
            git apply "$patch"
          done
          for script in .github/recovery-edits/act-recovery-*.mjs; do
            echo "Running: $script"
            node "$script"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: apply ACT recovery implementation edits"
          git push origin HEAD:feature/act-archive-full-recovery
