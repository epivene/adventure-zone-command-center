name: Generate blank profile batch 01 payload

on:
  push:
    branches:
      - research/blank-profiles-batch-01
    paths:
      - ".github/workflows/generate-blank-profile-batch-01.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/blank-profiles-batch-01
      - name: Generate reviewed batch payload and wire startup maintenance
        run: |
          python <<'PY'
          import base64
          import gzip
          from pathlib import Path

          encoded = """"""

          payload_path = Path("imports/approved-profiles/blank-profile-batch-01.json")
          payload_path.parent.mkdir(parents=True, exist_ok=True)
          payload_path.write_bytes(gzip.decompress(base64.b64decode(encoded)))

          startup_path = Path("artifacts/api-server/src/features/approved-profile-import/startup-import.ts")
          text = startup_path.read_text()
          import_line = 'import { applyBlankProfileBatch01 } from "../organizations/blank-profile-batch-01";\n'
          if import_line not in text:
              marker = '} from "./reconciliation";\n'
              if marker not in text:
                  raise SystemExit("Could not locate startup-import reconciliation import")
              text = text.replace(marker, marker + import_line, 1)

          call_marker = '  const directory = path.resolve(process.cwd(), "imports", "approved-profiles");\n'
          call_block = '''  try {\n    const batch01 = await applyBlankProfileBatch01();\n    logger.info(\n      batch01,\n      "Blank profile research batch 01 maintenance applied or safely skipped",\n    );\n  } catch (error) {\n    logger.error(\n      { err: error },\n      "Blank profile research batch 01 maintenance failed; approved profile imports will continue",\n    );\n  }\n\n'''
          if call_block not in text:
              if call_marker not in text:
                  raise SystemExit("Could not locate approved-profile directory marker")
              text = text.replace(call_marker, call_block + call_marker, 1)

          text = text.replace(
              'payload: { organizationId: profileId, ...followUp, preserveExisting: true },',
              'payload: { organizationId: profileId, ...followUp },',
          )
          startup_path.write_text(text)
          PY

      - name: Commit generated reviewed batch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            imports/approved-profiles/blank-profile-batch-01.json \
            artifacts/api-server/src/features/approved-profile-import/startup-import.ts
          git commit -m "data: add reviewed blank profile research batch 01"
          git push origin HEAD:research/blank-profiles-batch-01
