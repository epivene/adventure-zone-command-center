name: Manager Comms Baseline
on:
  push:
    branches: [feature/manager-communications-acknowledgments]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/routes/handoff-repository-participants.test.ts src/features/leg-manager/manager-map-data.test.ts
      - run: pnpm --filter @workspace/adventure-zone typecheck
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
