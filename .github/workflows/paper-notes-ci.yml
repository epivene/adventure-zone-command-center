name: Paper Notes CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/features/paper-notes/**"
      - "artifacts/api-server/src/routes/paper-note*.ts"
      - "artifacts/api-server/src/features/activities/**"
      - "artifacts/api-server/src/features/act-recovery/act-note-profile-repair.pglite.test.ts"
      - "artifacts/api-server/src/features/act-recovery/timeline-recovery.ts"
      - "artifacts/api-server/src/features/act-recovery/recovery-repository.ts"
      - "artifacts/api-server/src/features/act-replacement/runtime.ts"
      - "artifacts/adventure-zone/src/features/paper-notes/**"
      - "artifacts/adventure-zone/src/components/paper-notes/**"
      - "artifacts/adventure-zone/src/pages/PaperNote*.tsx"
      - "artifacts/adventure-zone/src/pages/EventProfilePage.tsx"
      - "lib/db/migrations/*paper_notes*"
      - "lib/db/src/schema/index.ts"
      - "lib/db/src/migrations.ts"
      - ".github/workflows/paper-notes-ci.yml"
  workflow_dispatch:

jobs:
  paper-notes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adventure_zone_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Paper Notes API tests
        run: >-
          pnpm --filter @workspace/api-server test --
          src/features/paper-notes
          src/features/act-recovery/act-note-profile-repair.pglite.test.ts
          src/routes/paper-note-extraction.test.ts
          src/routes/paper-note-import.test.ts
          src/routes/paper-note-matching.test.ts
          src/routes/paper-note-review.test.ts
          src/routes/paper-note-source.test.ts
          src/routes/paper-note-manual-profile-search.test.ts
      - name: Paper Notes frontend tests
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run
          src/components/paper-notes
          src/features/paper-notes
      - name: API typecheck
        run: pnpm --filter @workspace/api-server typecheck
      - name: Frontend typecheck
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: API build
        run: pnpm --filter @workspace/api-server build
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone build
