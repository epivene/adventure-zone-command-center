name: Apply paper note preflight recovery row guards

on:
  push:
    branches:
      - fix/paper-note-preflight-recovery-rows
    paths:
      - ".github/workflows/apply-paper-note-preflight-recovery-rows.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paper-note-preflight-recovery-rows
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard preflight and recovery query rows
        run: |
          python - <<'PY'
          from pathlib import Path
          base = Path('artifacts/api-server/src/features/paper-notes')

          preflight = base / 'paper-note-preflight-service.ts'
          text = preflight.read_text()
          text = text.replace(
              'import { validatePaperNoteEventDate } from "./paper-note-event-date-validation";\n',
              'import { validatePaperNoteEventDate } from "./paper-note-event-date-validation";\nimport { firstQueryRow, queryRows } from "./paper-note-query-rows";\n',
              1,
          )
          old = 'type EntryRow = { id: string; pageId: string; state: string; reviewPayload: unknown; targetSnapshot: unknown };\n'
          new = '''type BatchRow = { id: string; status: string };\ntype PageRow = PaperNotePreflightBatch["pages"][number];\ntype EntryRow = { id: string; pageId: string; state: string; reviewPayload: unknown; targetSnapshot: unknown };\n\nfunction isBatchRow(row: Record<string, unknown>): row is BatchRow {\n  return typeof row.id === "string" && typeof row.status === "string";\n}\n\nfunction isPageRow(row: Record<string, unknown>): row is PageRow {\n  return typeof row.id === "string"\n    && typeof row.status === "string"\n    && (row.originalObjectKey === null || typeof row.originalObjectKey === "string");\n}\n\nfunction isEntryRow(row: Record<string, unknown>): row is EntryRow {\n  return typeof row.id === "string"\n    && typeof row.pageId === "string"\n    && typeof row.state === "string"\n    && "reviewPayload" in row\n    && "targetSnapshot" in row;\n}\n'''
          if old not in text:
              raise SystemExit('preflight EntryRow marker not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '    const batch = (batchResult as { rows?: Array<{ id: string; status: string }> }).rows?.[0];',
              '    const batch = firstQueryRow(batchResult, isBatchRow);',
              1,
          )
          text = text.replace(
              '      pages: ((pagesResult as { rows?: PaperNotePreflightBatch["pages"] }).rows ?? []),',
              '      pages: queryRows(pagesResult, isPageRow),',
              1,
          )
          text = text.replace(
              '      entries: ((entriesResult as { rows?: EntryRow[] }).rows ?? []).map((entry) => ({',
              '      entries: queryRows(entriesResult, isEntryRow).map((entry) => ({',
              1,
          )
          preflight.write_text(text)

          recovery = base / 'paper-note-recovery-repository.ts'
          text = recovery.read_text()
          text = text.replace(
              'import type { PaperNoteExtraction } from "./paper-note-extraction-schema";\n',
              'import type { PaperNoteExtraction } from "./paper-note-extraction-schema";\nimport { firstQueryRow } from "./paper-note-query-rows";\n',
              1,
          )
          marker = 'type DrizzleDatabase = typeof database;\n'
          guards = marker + '''\ntype LockedPageRow = {\n  id: string;\n  status: string;\n  extractedAt: Date | null;\n  batchStatus: string;\n};\n\nfunction isValueRow(row: Record<string, unknown>): row is { value: number } {\n  return typeof row.value === "number";\n}\n\nfunction isCountRow(row: Record<string, unknown>): row is { count: number } {\n  return typeof row.count === "number";\n}\n\nfunction isLockedPageRow(row: Record<string, unknown>): row is LockedPageRow {\n  return typeof row.id === "string"\n    && typeof row.status === "string"\n    && (row.extractedAt === null || row.extractedAt instanceof Date)\n    && typeof row.batchStatus === "string";\n}\n'''
          if marker not in text:
              raise SystemExit('recovery DrizzleDatabase marker not found')
          text = text.replace(marker, guards, 1)
          old = '''      const currentMax = Number(\n        (orderResult as { rows?: Array<{ value: number }> }).rows?.[0]?.value ?? -1,\n      );'''
          new = '      const currentMax = Number(firstQueryRow(orderResult, isValueRow)?.value ?? -1);'
          if old not in text:
              raise SystemExit('recovery max-order cast not found')
          text = text.replace(old, new, 1)
          old = '''    const row = (result as {\n      rows?: Array<{\n        id: string;\n        status: string;\n        extractedAt: Date | null;\n        batchStatus: string;\n      }>;\n    }).rows?.[0];'''
          if old not in text:
              raise SystemExit('recovery locked-page cast not found')
          text = text.replace(old, '    const row = firstQueryRow(result, isLockedPageRow);', 1)
          old = '''    const unresolved = Number(\n      (result as { rows?: Array<{ count: number }> }).rows?.[0]?.count ?? 0,\n    );'''
          if old not in text:
              raise SystemExit('recovery count cast not found')
          text = text.replace(old, '    const unresolved = Number(firstQueryRow(result, isCountRow)?.count ?? 0);', 1)
          recovery.write_text(text)
          PY
      - name: Run focused preflight and recovery tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/features/paper-notes/paper-note-preflight-service.test.ts \
            src/features/paper-notes/paper-note-recovery-service.pglite.test.ts
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/paper-notes/paper-note-preflight-service.ts \
                  artifacts/api-server/src/features/paper-notes/paper-note-recovery-repository.ts
          git diff --cached --quiet || git commit -m "fix: guard paper note preflight and recovery rows"
          git push origin HEAD:fix/paper-note-preflight-recovery-rows
      - run: pnpm run typecheck:libs
      - name: Verify preflight and recovery cast errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'paper-note-preflight-service\.ts\((225,20|251,16|252,18)\)|paper-note-recovery-repository\.ts\((125,10|211,18|242,8)\)' /tmp/api-typecheck.log; then
            echo 'Paper-note preflight/recovery cast errors remain.' >&2
            exit 1
          fi
