name: Leg Manager Money Task 4
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  task4:
    if: "!contains(github.event.head_commit.message, '[skip money-task4]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: RED — expense form behavior
        run: |
          cat > artifacts/adventure-zone/src/components/manager/expense-form.test.tsx <<'EOF'
          // @vitest-environment jsdom
          import { cleanup,fireEvent,render,screen,waitFor } from "@testing-library/react";
          import { afterEach,describe,expect,it,vi } from "vitest";
          import { ExpenseForm } from "./expense-form";
          const mocks=vi.hoisted(()=>({queue:vi.fn(async(m:any)=>({...m,state:"saved_offline"})),flush:vi.fn(async()=>[])}));
          vi.mock("@/lib/manager-auth-context",()=>({useManagerAuth:()=>({manager:{legId:"leg-a"},managerApi:vi.fn()})}));
          vi.mock("@/lib/manager-sync-queue",()=>({queueManagerMutation:mocks.queue,flushManagerMutationQueue:mocks.flush}));
          afterEach(()=>{cleanup();vi.clearAllMocks()});
          describe("ExpenseForm",()=>{
            it("explains personal reimbursement and queues the expense",async()=>{
              Object.defineProperty(navigator,"onLine",{configurable:true,value:false});
              render(<ExpenseForm/>);
              fireEvent.change(screen.getByLabelText("Amount"),{target:{value:"42.50"}});
              fireEvent.change(screen.getByLabelText("Payment source"),{target:{value:"personal"}});
              expect(screen.getByText(/Adventure Zone owes you reimbursement/i)).toBeInTheDocument();
              fireEvent.click(screen.getByRole("button",{name:"Save expense"}));
              await waitFor(()=>expect(mocks.queue).toHaveBeenCalledTimes(1));
              expect(mocks.queue.mock.calls[0][0].body.amountCents).toBe(4250);
            });
            it("does not describe company debit as personal reimbursement",()=>{
              render(<ExpenseForm/>);
              fireEvent.change(screen.getByLabelText("Payment source"),{target:{value:"adventure_zone_debit"}});
              expect(screen.queryByText(/Adventure Zone owes you reimbursement/i)).not.toBeInTheDocument();
              expect(screen.getByText(/company debit/i)).toBeInTheDocument();
            });
          });
          EOF
          set +e
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/manager/expense-form.test.tsx > /tmp/task4-red.log 2>&1
          code=$?
          set -e
          cat /tmp/task4-red.log
          test "$code" -ne 0
      - name: GREEN — expense and cash forms
        run: |
          cat > artifacts/adventure-zone/src/components/manager/expense-form.tsx <<'EOF'
          import { useState } from "react";
          import { useManagerAuth } from "@/lib/manager-auth-context";
          import { flushManagerMutationQueue,queueManagerMutation } from "@/lib/manager-sync-queue";
          import { ManagerSyncStatus } from "./manager-sync-status";
          const categories=[['fuel','Fuel'],['food','Food'],['rv_park','RV park'],['vehicle_maintenance','Vehicle maintenance'],['trailer_maintenance','Trailer maintenance'],['supplies','Supplies'],['employee_related','Employee related'],['other','Other']] as const;
          export function ExpenseForm({bookingId=null,tripId=null,tripSegmentId=null}:{bookingId?:string|null;tripId?:string|null;tripSegmentId?:string|null}){const {manager,managerApi}=useManagerAuth();const [amount,setAmount]=useState('');const [tax,setTax]=useState('');const [category,setCategory]=useState('fuel');const [source,setSource]=useState('adventure_zone_debit');const [merchant,setMerchant]=useState('');const [employeeNote,setEmployeeNote]=useState('');const [notes,setNotes]=useState('');const [state,setState]=useState<any>(null);const cents=(v:string)=>Math.round((Number(v)||0)*100);async function submit(e:React.FormEvent){e.preventDefault();if(!manager||cents(amount)<=0)return;const id=crypto.randomUUID();const body={bookingId,tripId,tripSegmentId,category,merchant:merchant.trim()||null,amountCents:cents(amount),taxCents:cents(tax),paymentSource:source,occurredAt:new Date().toISOString(),notes:notes.trim()||null,employeeNote:employeeNote.trim()||null,clientMutationId:id};await queueManagerMutation({id,legId:manager.legId,method:'POST',path:'/manager/expenses',body,createdAt:new Date().toISOString()});setState('saved_offline');if(navigator.onLine){setState('syncing');const rows=await flushManagerMutationQueue(managerApi);setState(rows.find(r=>r.id===id)?.state??'synced');}}
            return <form onSubmit={submit} className="grid gap-3 rounded-xl border bg-white p-4"><h2 className="font-bold">Expense</h2><label className="grid gap-1 text-sm font-semibold">Category<select value={category} onChange={e=>setCategory(e.target.value)}>{categories.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></label><label className="grid gap-1 text-sm font-semibold">Merchant<input value={merchant} onChange={e=>setMerchant(e.target.value)}/></label><div className="grid grid-cols-2 gap-3"><label className="grid gap-1 text-sm font-semibold">Amount<input inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} required/></label><label className="grid gap-1 text-sm font-semibold">Tax<input inputMode="decimal" value={tax} onChange={e=>setTax(e.target.value)}/></label></div><label className="grid gap-1 text-sm font-semibold">Payment source<select value={source} onChange={e=>setSource(e.target.value)}><option value="adventure_zone_cash">Adventure Zone cash</option><option value="adventure_zone_debit">Adventure Zone company debit</option><option value="personal">Personal money/card</option></select></label>{source==='personal'?<p className="rounded-lg bg-amber-50 p-2 text-sm">Adventure Zone owes you reimbursement for approved personal expenses.</p>:source==='adventure_zone_debit'?<p className="text-sm text-slate-600">Company debit spending is a company expense and does not create personal reimbursement.</p>:<p className="text-sm text-slate-600">This reduces Adventure Zone cash you are holding.</p>}<label className="grid gap-1 text-sm font-semibold">Employee note<input value={employeeNote} onChange={e=>setEmployeeNote(e.target.value)} placeholder="Optional — who made the purchase"/></label><label className="grid gap-1 text-sm font-semibold">Notes<textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3}/></label><button className="button-primary">Save expense</button>{state?<ManagerSyncStatus state={state}/>:null}</form>}
          EOF

          cat > artifacts/adventure-zone/src/components/manager/cash-entry-form.tsx <<'EOF'
          import { useState } from "react";
          import { useManagerAuth } from "@/lib/manager-auth-context";
          import { flushManagerMutationQueue,queueManagerMutation } from "@/lib/manager-sync-queue";
          import { ManagerSyncStatus } from "./manager-sync-status";
          const kinds=[['advance_received','Advance received'],['cash_turned_in','Cash turned in'],['cash_returned','Cash returned'],['manager_reimbursed','Manager reimbursed'],['adjustment','Adjustment']] as const;
          export function CashEntryForm({tripId=null}:{tripId?:string|null}){const {manager,managerApi}=useManagerAuth();const [kind,setKind]=useState('cash_turned_in');const [amount,setAmount]=useState('');const [notes,setNotes]=useState('');const [state,setState]=useState<any>(null);async function submit(e:React.FormEvent){e.preventDefault();if(!manager)return;const amountCents=Math.round((Number(amount)||0)*100);if(kind!=='adjustment'&&amountCents<0)return;const id=crypto.randomUUID();const body={tripId,bookingId:null,tripSegmentId:null,kind,amountCents,occurredAt:new Date().toISOString(),notes:notes.trim()||null,clientMutationId:id};await queueManagerMutation({id,legId:manager.legId,method:'POST',path:'/manager/cash',body,createdAt:new Date().toISOString()});setState('saved_offline');if(navigator.onLine){setState('syncing');const rows=await flushManagerMutationQueue(managerApi);setState(rows.find(r=>r.id===id)?.state??'synced');}}
            return <form onSubmit={submit} className="grid gap-3 rounded-xl border bg-white p-4"><h2 className="font-bold">Cash flow</h2><label className="grid gap-1 text-sm font-semibold">Cash action<select value={kind} onChange={e=>setKind(e.target.value)}>{kinds.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></label><label className="grid gap-1 text-sm font-semibold">Cash amount<input inputMode="decimal" value={amount} onChange={e=>setAmount(e.target.value)} required/></label><p className="text-sm text-slate-600">Cash turned in/returned lowers the Adventure Zone cash you still need to account for.</p><label className="grid gap-1 text-sm font-semibold">Cash notes<textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={2}/></label><button className="button-primary">Save cash entry</button>{state?<ManagerSyncStatus state={state}/>:null}</form>}
          EOF

          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/adventure-zone/src/pages/ManagerMoneyPage.tsx');s=p.read_text()
          if 'ExpenseForm' not in s:s=s.replace('import { SettlementSummary } from "@/components/manager/settlement-summary";','import { SettlementSummary } from "@/components/manager/settlement-summary";\nimport { ExpenseForm } from "@/components/manager/expense-form";\nimport { CashEntryForm } from "@/components/manager/cash-entry-form";')
          s=s.replace('<EventIncomeForm events={events}/></div>}','<EventIncomeForm events={events}/><ExpenseForm/><CashEntryForm/></div>}')
          p.write_text(s)
          PY
      - name: Verify Task 4 green
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/manager/expense-form.test.tsx src/pages/ManagerMoneyPage.test.tsx
          pnpm --filter @workspace/adventure-zone typecheck
      - name: Commit Task 4
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/adventure-zone/src/components/manager/expense-form.tsx artifacts/adventure-zone/src/components/manager/cash-entry-form.tsx artifacts/adventure-zone/src/components/manager/expense-form.test.tsx artifacts/adventure-zone/src/pages/ManagerMoneyPage.tsx
          git commit -m 'feat: add manager expense and cash entry [skip money-task1] [skip money-task2] [skip money-task2-retry] [skip money-task3] [skip money-task4]'
          git push
