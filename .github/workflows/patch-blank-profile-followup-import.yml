name: Patch blank profile follow-up import policy

on:
  push:
    branches:
      - research/blank-profiles-batch-01
    paths:
      - ".github/workflows/patch-blank-profile-followup-import.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/blank-profiles-batch-01
      - name: Mark approved-profile follow-ups as non-destructive
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("artifacts/api-server/src/features/approved-profile-import/startup-import.ts")
          text = path.read_text()
          old = "payload: { organizationId: profileId, ...followUp },"
          new = "payload: { organizationId: profileId, ...followUp, preserveExisting: true },"
          if new not in text:
              if old not in text:
                  raise SystemExit("Could not locate approved follow-up payload")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit follow-up policy patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/approved-profile-import/startup-import.ts
          git commit -m "fix: preserve human follow-ups during approved imports"
          git push origin HEAD:research/blank-profiles-batch-01
