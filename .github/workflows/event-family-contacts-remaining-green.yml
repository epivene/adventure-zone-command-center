name: Event Family Contacts Final Verification
on:
  push:
    branches: [feature/event-family-website-contacts]
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[event-family-contacts-remaining-green]')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: adventure_zone_test }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Event Family backend regressions
        run: |
          files=$(find artifacts/api-server/src -type f \( -name '*event-family*.test.ts' -o -name '*event-families*.test.ts' -o -name 'family-shared-contact.test.ts' \) | sed 's#artifacts/api-server/##')
          pnpm --filter @workspace/api-server exec vitest run $files
      - name: Event Family frontend regressions
        run: |
          files=$(find artifacts/adventure-zone/src -type f \( -name '*event-family*.test.ts' -o -name '*event-family*.test.tsx' -o -name '*EventFamily*.test.tsx' -o -name 'family-contact-summary.test.tsx' \) | sed 's#artifacts/adventure-zone/##')
          pnpm --filter @workspace/adventure-zone exec vitest run $files
      - run: pnpm --filter @workspace/db build
      - run: pnpm --filter @workspace/api-server build
      - run: pnpm --filter @workspace/adventure-zone build
      - run: pnpm --filter @workspace/adventure-zone typecheck
      - name: Diff and safety guards
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD
          grep -q 'familySharedContact' artifacts/api-server/src/routes/event-profiles.ts
          grep -q 'EventFamilyWebsiteContacts' artifacts/adventure-zone/src/pages/EventFamilyPage.tsx
          grep -q 'FamilyContactSummary' artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace.tsx
          grep -q 'ON DELETE RESTRICT' lib/db/migrations/043_event_family_website_contacts.sql
          grep -q 'ON DELETE CASCADE' lib/db/migrations/043_event_family_website_contacts.sql
