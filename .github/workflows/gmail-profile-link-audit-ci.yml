name: Gmail profile-link audit CI

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/src/features/google-workspace/google-api-client.ts"
      - "artifacts/api-server/src/features/google-workspace/google-api-types.ts"
      - "artifacts/api-server/src/features/google-workspace/google-profile-label-cleanup-service.ts"
      - "artifacts/api-server/src/features/google-workspace/google-profile-label-cleanup-service.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-gmail-label-client.test.ts"
      - "artifacts/api-server/src/routes/google-workspace-validation.ts"
      - "artifacts/api-server/src/routes/google-workspace-validation.test.ts"
      - "artifacts/adventure-zone/src/features/google-workspace/google-workspace-client.ts"
      - "artifacts/adventure-zone/src/components/google-workspace/google-validation-review.tsx"
      - "artifacts/adventure-zone/src/components/google-workspace/google-validation-review.test.tsx"
      - "artifacts/api-server/src/features/google-workspace/google-api-client-query.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-window-query.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-historical-backfill-loop.ts"
      - "artifacts/api-server/src/features/google-workspace/google-historical-backfill-loop.test.ts"
      - "artifacts/api-server/src/routes/assistant-gmail-profile-links.ts"
      - "artifacts/api-server/src/routes/assistant-gmail-profile-links.test.ts"
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/index.ts"
      - "render.yaml"
      - ".github/workflows/gmail-profile-link-audit-ci.yml"
  push:
    branches:
      - fix/gmail-profile-history-audit-final
      - main
    paths:
      - "artifacts/api-server/src/features/google-workspace/google-api-client.ts"
      - "artifacts/api-server/src/features/google-workspace/google-api-types.ts"
      - "artifacts/api-server/src/features/google-workspace/google-profile-label-cleanup-service.ts"
      - "artifacts/api-server/src/features/google-workspace/google-profile-label-cleanup-service.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-gmail-label-client.test.ts"
      - "artifacts/api-server/src/routes/google-workspace-validation.ts"
      - "artifacts/api-server/src/routes/google-workspace-validation.test.ts"
      - "artifacts/adventure-zone/src/features/google-workspace/google-workspace-client.ts"
      - "artifacts/adventure-zone/src/components/google-workspace/google-validation-review.tsx"
      - "artifacts/adventure-zone/src/components/google-workspace/google-validation-review.test.tsx"
      - "artifacts/api-server/src/features/google-workspace/google-api-client-query.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-window-query.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.ts"
      - "artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-loop.test.ts"
      - "artifacts/api-server/src/features/google-workspace/google-historical-backfill-loop.ts"
      - "artifacts/api-server/src/features/google-workspace/google-historical-backfill-loop.test.ts"
      - "artifacts/api-server/src/routes/assistant-gmail-profile-links.ts"
      - "artifacts/api-server/src/routes/assistant-gmail-profile-links.test.ts"
      - "artifacts/api-server/src/app.ts"
      - "artifacts/api-server/src/index.ts"
      - "render.yaml"
      - ".github/workflows/gmail-profile-link-audit-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gmail client and profile-link tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/google-workspace/google-api-client.test.ts
          src/features/google-workspace/google-api-client-metadata.test.ts
          src/features/google-workspace/google-api-client-query.test.ts
          src/features/google-workspace/google-gmail-label-client.test.ts
          src/features/google-workspace/google-profile-label-cleanup-service.test.ts
          src/routes/google-workspace-validation.test.ts
          src/features/google-workspace/google-sent-profile-link-window-query.test.ts
          src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts
          src/features/google-workspace/google-sent-profile-link-sweep-loop.test.ts
          src/features/google-workspace/google-historical-backfill-loop.test.ts
          src/routes/assistant-gmail-profile-links.test.ts
          src/routes/google-workspace-profile-email.test.ts
      - name: Email Review label cleanup test
        run: >-
          pnpm --filter @workspace/adventure-zone exec vitest run
          src/components/google-workspace/google-validation-review.test.tsx
      - name: Production API build
        run: pnpm --filter @workspace/api-server build
      - name: Production frontend build
        run: pnpm --filter @workspace/adventure-zone build
