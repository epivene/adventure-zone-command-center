name: Task 6 TDD

on:
  push:
    branches:
      - agent/assisted-calling-workspace

jobs:
  task-6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - id: web_tests
        continue-on-error: true
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/calls/call-workspace.test.tsx src/features/calls/call-draft.test.ts src/features/calls/phone-launcher.test.ts
      - id: api_tests
        continue-on-error: true
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/calls.test.ts
      - id: libs_typecheck
        continue-on-error: true
        run: pnpm run typecheck:libs
      - id: api_typecheck
        continue-on-error: true
        run: pnpm --filter @workspace/api-server typecheck
      - name: Confirm the known six-error web baseline
        run: |
          set +e
          pnpm --filter @workspace/adventure-zone typecheck 2>&1 | tee web-typecheck.log
          typecheck_status=${PIPESTATUS[0]}
          set -e
          test "$typecheck_status" -ne 0
          test "$(grep -c 'error TS' web-typecheck.log)" -eq 6
      - name: Require focused tests and relevant typechecks
        if: always()
        run: |
          test "${{ steps.web_tests.outcome }}" = "success"
          test "${{ steps.api_tests.outcome }}" = "success"
          test "${{ steps.libs_typecheck.outcome }}" = "success"
          test "${{ steps.api_typecheck.outcome }}" = "success"
