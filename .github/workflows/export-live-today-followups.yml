name: Inspect live county fair profile matches

on:
  push:
    branches:
      - codex/verify-live-county-followups

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query protected profile search
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}"
          test -n "${ASSISTANT_IMPORT_TOKEN}"
          mkdir results
          BASE_URL="${API_URL%/}"
          while IFS='|' read -r SLUG QUERY; do
            HTTP_STATUS=$(curl --silent --show-error --get \
              --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --data-urlencode "q=${QUERY}" \
              --data-urlencode "limit=20" \
              --output "results/${SLUG}.json" \
              --write-out "%{http_code}" \
              "${BASE_URL}/api/assistant-import/profile-search" || true)
            test "${HTTP_STATUS}" = "200"
          done <<'QUERIES'
          ramsey|Ramsey
          wells|Wells
          stutsman|Stutsman
          pierce|Pierce
          ransom|Ransom
          devils-lake|Devils Lake
          fessenden|Fessenden
          jamestown|Jamestown
          rugby|Rugby
          lisbon|Lisbon
          hanson|Hanson
          hartl|Hartl
          hatlewick|Hatlewick
          sobolik|Sobolik
          aabrekke|Aabrekke
          QUERIES

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-county-fair-profile-searches
          path: results
          retention-days: 1
