name: Event Family Contacts Task1 Red
on:
  push:
    branches: [feature/event-family-website-contacts]
jobs:
  red:
    if: contains(github.event.head_commit.message, '[event-family-contacts-task1-red]')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/unused
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/event-families/event-family-contacts.test.ts
# trigger
