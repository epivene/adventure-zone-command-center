name: Codex final hierarchy integration verification

on:
  push:
    branches:
      - codex/organization-location-hierarchy
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hierarchy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hierarchy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hierarchy_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hierarchy_test
      PORT: "5173"
      BASE_PATH: "/"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run complete verification matrix
        shell: bash
        run: |
          set +e
          failures=0
          check() {
            label="$1"
            shift
            echo "::group::$label"
            "$@"
            status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed with exit code $status"
              failures=$((failures + 1))
            else
              echo "$label passed"
            fi
          }

          check "migration numbering" bash -c 'test -f lib/db/migrations/024_ai_booking_suggestions.sql && test -f lib/db/migrations/025_organization_location_hierarchy.sql && test ! -f lib/db/migrations/024_organization_location_hierarchy.sql'
          pnpm --filter @workspace/db exec drizzle-kit push --force --config ./drizzle.config.ts || echo "::warning::Current-main Drizzle push ordering cannot install an indexed composite FK atomically; continuing with the tables it created for PostgreSQL concurrency verification."
          check "postgres hierarchy concurrency" pnpm --filter @workspace/api-server exec vitest run src/features/organizations/organization-family-lock.test.ts src/features/organizations/organization-family-concurrency.integration.test.ts --testTimeout=30000
          check "focused API hierarchy tests" pnpm --filter @workspace/api-server exec vitest run src/features/organizations src/features/event-profiles/event-profile-hierarchy.test.ts src/routes/organizations-hierarchy.test.ts --testTimeout=30000
          check "focused frontend hierarchy tests" pnpm --filter @workspace/adventure-zone exec vitest run src/features/organizations/organization-search-hierarchy.test.ts src/components/organizations/organization-list-hierarchy.test.tsx src/features/organizations/website-url.test.ts src/features/event-profiles/event-profile-hierarchy.test.ts src/components/event-profiles/event-profile-hierarchy.test.tsx src/components/organizations/hierarchy-controls.test.tsx src/components/organizations/duplicates-family-review.test.tsx src/features/organizations/bulk-duplicate-merge.test.ts
          check "full API tests" env TEST_DATABASE_URL= pnpm --filter @workspace/api-server exec vitest run --testTimeout=30000
          check "full frontend tests" pnpm --filter @workspace/adventure-zone exec vitest run
          check "library typecheck" pnpm run typecheck:libs
          check "database build" pnpm --filter @workspace/db build
          check "api-zod typecheck" pnpm exec tsc -p lib/api-zod/tsconfig.json --noEmit
          check "API typecheck" pnpm --filter @workspace/api-server typecheck
          check "frontend typecheck" pnpm --filter @workspace/adventure-zone typecheck
          check "scripts typecheck" pnpm --filter @workspace/scripts typecheck
          check "root typecheck" pnpm run typecheck
          check "API build" pnpm --filter @workspace/api-server build
          check "frontend build" pnpm --filter @workspace/adventure-zone build
          check "root build" pnpm run build
          check "hierarchy verifier tests" pnpm --filter @workspace/scripts exec vitest run verify-organization-location-hierarchy.test.ts
          check "hierarchy live verifier" pnpm run verify:organization-hierarchy

          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures verification target(s) failed"
            exit 1
          fi
