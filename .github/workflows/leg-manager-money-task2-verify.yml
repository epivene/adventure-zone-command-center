name: Verify Leg Manager Money Task 2
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Finance API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/finance-repository.test.ts src/features/leg-manager/finance-math.test.ts
      - name: Manager scoped typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.manager.json --noEmit
