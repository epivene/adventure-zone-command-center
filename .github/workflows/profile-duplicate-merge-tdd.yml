name: Profile duplicate merge TDD

on:
  push:
    branches:
      - ops/northern-gila-duplicate-merge
    paths:
      - "artifacts/api-server/src/routes/assistant-profile-integrity.ts"
      - "artifacts/api-server/src/routes/assistant-profile-merge.test.ts"
      - ".github/workflows/profile-duplicate-merge-tdd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run protected merge route test
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/assistant-profile-merge.test.ts
      - name: Build API
        run: pnpm --filter @workspace/api-server run build
