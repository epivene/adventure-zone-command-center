name: Apply Scout Alert PGlite row typing

on:
  push:
    branches:
      - fix/scout-alert-pglite-row-typing
    paths:
      - ".github/workflows/apply-scout-alert-pglite-row-typing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-alert-pglite-row-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm stale Scout Alert row errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'scout-alert-repository\.test\.ts.*error TS2339' /tmp/api-before.log >/dev/null || {
            echo "Expected Scout Alert row-property errors were not present." >&2
            exit 1
          }
      - name: Guard PGlite row property access
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/assistant/scout-alert-repository.test.ts')
          text = path.read_text()
          marker = 'import type { ScoutAlertDraft, ScoutAlertSnapshot } from "./scout-alert-types";\n'
          helper = marker + '''\nfunction rowValue(rows: unknown[], index: number, key: string): unknown {\n  const row = rows[index];\n  return row && typeof row === "object" && !Array.isArray(row) && key in row\n    ? (row as Record<string, unknown>)[key]\n    : undefined;\n}\n'''
          if marker not in text:
            raise SystemExit('import marker not found')
          text = text.replace(marker, helper, 1)
          replacements = {
            'String(watch.rows[0]?.id)': 'String(rowValue(watch.rows, 0, "id"))',
            'watch?.snapshot': 'rowValue([watch], 0, "snapshot")',
            'watch?.last_evaluated_at': 'rowValue([watch], 0, "last_evaluated_at")',
            'count.rows[0]?.count': 'rowValue(count.rows, 0, "count")',
            'watch?.next_evaluation_at': 'rowValue([watch], 0, "next_evaluation_at")',
            ')).rows[0]?.status': ')).rows.length ? rowValue((await db.client.query(`select status from scout_alert_watches where id=$1`, [db.watchId])).rows, 0, "status") : undefined',
          }
          for old, new in replacements.items():
            if old in text:
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Run Scout Alert repository tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/assistant/scout-alert-repository.test.ts
      - name: Commit verified test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/assistant/scout-alert-repository.test.ts
          git diff --cached --quiet || git commit -m "test: guard Scout Alert PGlite row access"
          git push origin HEAD:fix/scout-alert-pglite-row-typing
      - run: pnpm run typecheck:libs
      - name: Verify Scout Alert row errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'scout-alert-repository\.test\.ts.*error TS2339' /tmp/api-after.log; then
            echo "Scout Alert row-property errors remain." >&2
            exit 1
          fi
