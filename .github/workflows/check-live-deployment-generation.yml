name: Check live deployment generation

on:
  push:
    branches:
      - verify/twin-falls-duplicate-cleanup-live
    paths:
      - ".github/workflows/check-live-deployment-generation.yml"

permissions:
  contents: read

jobs:
  check-generation:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether post-Twin-Falls imports are live
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            "${BASE_URL}/profile-search?q=Greeley%20Arts%20Picnic&limit=10" \
            > search.json

          PROFILE_ID=$(node -e "const x=require('./search.json'); const row=(x.results||[]).find(r=>r.kind==='organization'); if(!row) process.exit(2); process.stdout.write(row.id)")
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            "${BASE_URL}/profile-history/${PROFILE_ID}" \
            > history.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const history = JSON.parse(fs.readFileSync('history.json', 'utf8'));
          const subjects = (history.notes || []).map((note) => note.subject);
          const followUps = (history.followUps || []).map((item) => item.kind);
          const contactEmails = (history.contacts || []).map((contact) => contact.email).filter(Boolean);
          const markerSubject = 'Verified Gmail history + current contact - Greeley Arts Picnic';
          fs.writeFileSync('live-deployment-generation.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            profileId: history.place.id,
            profileName: history.place.name,
            postTwinFallsCommitImportIsLive: subjects.includes(markerSubject),
            markerSubjectPresent: subjects.includes(markerSubject),
            contactEmails,
            followUps,
          }, null, 2));
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: live-deployment-generation
          path: live-deployment-generation.json
          retention-days: 1
