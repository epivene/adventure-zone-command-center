name: Task 4 Fix 1 TDD

on:
  push:
    branches:
      - agent/assisted-calling-workspace

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server exec vitest run src/features/calls/call-workspace-context.test.ts src/features/calls/call-script.test.ts src/features/calls/call-workspace-query.test.ts
      - run: pnpm run typecheck:libs
      - run: pnpm --filter @workspace/api-server typecheck
