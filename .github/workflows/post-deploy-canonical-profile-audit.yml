name: Post-deploy canonical profile audit

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/post-deploy-canonical-profile-audit.yml

permissions:
  contents: read

env:
  APP_BASE_URL: https://adventure-zone-command-center.onrender.com
  PIRATE_PROFILE_ID: f24033e1-801b-43ff-9a7e-a9d6d7b426c3

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Wait for deployed canonical profile repair and export evidence
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          base = os.environ["APP_BASE_URL"].rstrip("/")
          profile_id = os.environ["PIRATE_PROFILE_ID"]
          token = os.environ.get("ASSISTANT_IMPORT_TOKEN", "").strip()
          if not token:
              raise SystemExit("ASSISTANT_IMPORT_TOKEN is unavailable")

          output = Path("post-deploy-profile-audit")
          output.mkdir(exist_ok=True)

          def fetch(path):
              request = urllib.request.Request(
                  base + path,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/json",
                      "User-Agent": "adventure-zone-post-deploy-audit",
                  },
              )
              with urllib.request.urlopen(request, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          last_error = None
          for attempt in range(1, 81):
              try:
                  audit = fetch("/api/assistant-import/profile-integrity-audit")
                  history = fetch(f"/api/assistant-import/profile-history/{profile_id}")
                  calendar = fetch(f"/api/assistant-import/profile-integrity-calendar-links/{profile_id}")

                  (output / "profile-integrity-audit.json").write_text(
                      json.dumps(audit, indent=2, sort_keys=True), encoding="utf-8"
                  )
                  (output / "pirate-profile-history.json").write_text(
                      json.dumps(history, indent=2, sort_keys=True), encoding="utf-8"
                  )
                  (output / "pirate-calendar-links.json").write_text(
                      json.dumps(calendar, indent=2, sort_keys=True), encoding="utf-8"
                  )

                  summary = audit.get("summary") if isinstance(audit, dict) else None
                  duplicate_contacts = summary.get("duplicateContactGroupCount") if isinstance(summary, dict) else None
                  duplicate_appearances = summary.get("duplicateAppearanceGroupCount") if isinstance(summary, dict) else None
                  history_ok = isinstance(history, dict) and history.get("ok") is True
                  calendar_ok = isinstance(calendar, dict) and calendar.get("ok") is True

                  print(json.dumps({
                      "attempt": attempt,
                      "generatedAt": audit.get("generatedAt") if isinstance(audit, dict) else None,
                      "duplicateContactGroupCount": duplicate_contacts,
                      "duplicateAppearanceGroupCount": duplicate_appearances,
                      "historyOk": history_ok,
                      "calendarOk": calendar_ok,
                  }, sort_keys=True))

                  if duplicate_contacts == 0 and duplicate_appearances == 0 and history_ok and calendar_ok:
                      print("Deployed canonical profile repair is visible to the live audit.")
                      break
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError) as error:
                  last_error = repr(error)
                  print(f"Attempt {attempt} could not read live evidence: {last_error}")

              if attempt == 80:
                  raise SystemExit(
                      "Live canonical profile audit did not reach zero duplicate groups. "
                      + (last_error or "See exported evidence.")
                  )
              time.sleep(15)
          PY

      - name: Upload live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-canonical-profile-audit
          path: post-deploy-profile-audit
          if-no-files-found: error
          retention-days: 7
