name: Apply paper note activity defaults

on:
  push:
    branches:
      - fix/paper-note-activity-default
    paths:
      - ".github/workflows/apply-paper-note-activity-default.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/paper-note-activity-default
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add regression test for omitted activity
        run: |
          cat > artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.activity-default.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { parsePaperNoteEntryExtraction } from "./paper-note-extraction-schema";

          describe("paper-note extraction activity defaults", () => {
            it("normalizes an omitted activity to unknown date source and method", () => {
              const extraction = parsePaperNoteEntryExtraction(JSON.stringify({
                transcription: "Called about next year's festival.",
                event: { name: "Example Festival" },
              }));

              expect(extraction.activity.dateSource).toBe("unknown");
              expect(extraction.activity.method).toBe("unknown");
            });
          });
          EOF
      - name: Confirm regression fails before fix
        run: |
          set +e
          pnpm --filter @workspace/api-server exec vitest run src/features/paper-notes/paper-note-extraction-schema.activity-default.test.ts > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          if [ "$code" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the fix." >&2
            exit 1
          fi
          grep -E 'expected.*unknown|Expected.*unknown|to be.*unknown' /tmp/red.log >/dev/null || {
            echo "Regression did not fail for the expected missing activity defaults." >&2
            exit 1
          }
      - name: Fix activity parent default
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts')
          text = path.read_text()
          old = '''  }).optional().default({}),\n  contacts: z.array(z.object({'''
          new = '''  }).optional().default({ dateSource: "unknown", method: "unknown" }),\n  contacts: z.array(z.object({'''
          if old not in text:
              raise SystemExit('activity default marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run regression and extraction tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/features/paper-notes/paper-note-extraction-schema.activity-default.test.ts \
            src/features/paper-notes/paper-note-extraction-provider.test.ts
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.ts \
                  artifacts/api-server/src/features/paper-notes/paper-note-extraction-schema.activity-default.test.ts
          git diff --cached --quiet || git commit -m "fix: default missing paper note activity metadata"
          git push origin HEAD:fix/paper-note-activity-default
      - run: pnpm run typecheck:libs
      - name: Verify production schema compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'paper-note-extraction-schema\.ts.*error TS2769' /tmp/api-after.log; then
            echo "Paper-note extraction activity default compiler error remains." >&2
            exit 1
          fi
