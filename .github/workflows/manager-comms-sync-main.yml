name: Manager Comms Sync Main
on:
  push:
    branches: [feature/manager-communications-acknowledgments]
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[manager-comms-sync-main]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Merge latest main
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git merge --no-edit origin/main
          git push origin HEAD:feature/manager-communications-acknowledgments
