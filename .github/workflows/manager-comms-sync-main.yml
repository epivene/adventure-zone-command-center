name: Manager Comms Sync Main
on:
  push:
    branches: [feature/manager-communications-acknowledgments]
jobs:
  sync:
    if: contains(github.event.head_commit.message, '[manager-comms-sync-main]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge latest main and preserve route mounts
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git fetch origin main
          git merge --no-edit origin/main || true
          git checkout --ours artifacts/api-server/src/routes/index.ts
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/api-server/src/routes/index.ts')
          s = p.read_text()
          imp_anchor = 'import managerRouter from "./leg-manager";'
          imp = 'import managerTravelRouter from "./leg-manager-travel";'
          if imp not in s:
              if imp_anchor not in s: raise SystemExit('manager router import anchor missing')
              s = s.replace(imp_anchor, imp_anchor + '\n' + imp, 1)
          use_anchor = 'router.use(managerRouter);'
          use = 'router.use(managerTravelRouter);'
          if use not in s:
              if use_anchor not in s: raise SystemExit('manager router mount anchor missing')
              s = s.replace(use_anchor, use_anchor + '\n' + use, 1)
          p.write_text(s)
          PY
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- artifacts/api-server/src/routes/index.ts
          git commit --no-edit
          git push origin HEAD:feature/manager-communications-acknowledgments
