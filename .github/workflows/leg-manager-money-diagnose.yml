name: Diagnose Leg Manager Money Typecheck
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace declarations first
        run: |
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-zod build
          pnpm --filter @workspace/integrations-anthropic-ai build
      - name: Feature full API typecheck after dependency builds
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck > /tmp/feature.log 2>&1
          code=$?
          set -e
          cat /tmp/feature.log
          echo "FEATURE_EXIT=$code"
          grep -E 'src/(features/leg-manager|routes/leg-manager)' /tmp/feature.log || true
      - name: Baseline main full API typecheck after dependency builds
        run: |
          git worktree add /tmp/main origin/main
          cd /tmp/main
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/db build
          pnpm --filter @workspace/api-zod build
          pnpm --filter @workspace/integrations-anthropic-ai build
          set +e
          pnpm --filter @workspace/api-server typecheck > /tmp/main.log 2>&1
          code=$?
          set -e
          cat /tmp/main.log
          echo "MAIN_EXIT=$code"
