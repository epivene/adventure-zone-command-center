name: Profiles API and Pirate outcome CI

on:
  push:
    branches:
      - fix/profiles-api-pirate-outcome

permissions:
  contents: write

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/profiles_api_test

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/profiles-api-pirate-outcome
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply the minimal production repair
        run: python .github/scripts/apply_profiles_api_pirate_fix.py
      - name: Focused regression tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/organizations/organization-list-sort.test.ts
          src/features/approved-profile-import/pirate-fest-confirmed.test.ts
      - name: Existing required-startup regression test
        run: pnpm --filter @workspace/api-server exec vitest run src/db/required-schema-startup.test.ts
      - name: Production API build
        run: pnpm --filter @workspace/api-server build
      - name: Commit verified repair
        run: |
          rm .github/workflows/profiles-api-pirate-ci.yml
          rm .github/scripts/apply_profiles_api_pirate_fix.py
          git diff --check
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: restore Profiles API and Pirate 2026 outcome"
          git push origin HEAD:fix/profiles-api-pirate-outcome
