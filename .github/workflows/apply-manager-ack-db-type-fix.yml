name: Apply manager acknowledgment db type fix

on:
  push:
    branches:
      - fix/manager-ack-db-type
    paths:
      - ".github/workflows/apply-manager-ack-db-type-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manager-ack-db-type
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fix database type alias shadowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/manager-comms/admin-message-acknowledgment-status.ts')
          text = path.read_text()
          old_import = 'import type { db as database } from "@/db/client";'
          new_import = 'import type { db as databaseClient } from "@/db/client";'
          old_param = '  database: typeof database,'
          new_param = '  database: typeof databaseClient,'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          if old_param in text:
              text = text.replace(old_param, new_param, 1)
          if new_import not in text or new_param not in text:
              raise SystemExit('manager acknowledgment db alias fix is missing')
          path.write_text(text)
          PY
      - name: Run focused acknowledgment behavior tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/manager-comms/admin-message-acknowledgment.test.ts
      - name: Commit verified production patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/manager-comms/admin-message-acknowledgment-status.ts
          git diff --cached --quiet || git commit -m "fix: avoid manager acknowledgment db type shadowing"
          git push origin HEAD:fix/manager-ack-db-type
      - name: Build/typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Verify manager acknowledgment compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'src/features/manager-comms/admin-message-acknowledgment-status\.ts\(17,3\)' /tmp/api-typecheck.log; then
            echo 'Manager acknowledgment database self-reference error remains.' >&2
            exit 1
          fi
