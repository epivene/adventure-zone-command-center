name: Apply Sept 25 Langford decline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-2026-09-25-langford-decline.yml"
      - "imports/approved-profiles/2026-09-25-langford-decline.json"

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply and verify Langford CRM update
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

          node <<'NODE'
          const fs = require("node:fs");
          const base = process.env.API_URL.replace(/\/$/, "");
          const token = process.env.ASSISTANT_IMPORT_TOKEN;
          const source = "imports/approved-profiles/2026-09-25-langford-decline.json";
          const [payload] = JSON.parse(fs.readFileSync(source, "utf8"));
          const profileId = payload.organizationId;

          async function request(path, options = {}) {
            let response, body;
            for (let attempt = 1; attempt <= 12; attempt++) {
              response = await fetch(base + "/api/assistant-import/" + path, {
                ...options,
                headers: {
                  Authorization: "Bearer " + token,
                  ...(options.body ? { "Content-Type": "application/json" } : {}),
                  ...(options.headers || {}),
                },
              });
              body = await response.text();
              if (response.ok) {
                try { return JSON.parse(body); } catch { throw new Error(path + ": invalid JSON"); }
              }
              if (![502, 503].includes(response.status)) break;
              await new Promise(r => setTimeout(r, 10000));
            }
            throw new Error(path + ": HTTP " + response?.status + " " + String(body).slice(0, 500));
          }

          (async () => {
            const before = await request("profile-history/" + profileId);

            const eventPayload = {
              importRevision: 1,
              matchExisting: true,
              requireExisting: true,
              ...payload.eventProfile,
              event: { ...payload.eventProfile.event, id: profileId },
            };
            await request("event-profiles", {
              method: "POST",
              body: JSON.stringify(eventPayload),
            });

            for (const contact of payload.profileContacts || []) {
              const email = String(contact.email || "").toLowerCase();
              const phone = String(contact.phone || "").replace(/\D/g, "");
              const exists = (before.contacts || []).some(x =>
                (email && String(x.email || "").toLowerCase() === email) ||
                (phone && String(x.phone || "").replace(/\D/g, "") === phone)
              );
              if (!exists) {
                await request("profile-contacts", {
                  method: "POST",
                  body: JSON.stringify({ organizationId: profileId, contact }),
                });
              }
            }

            for (const note of payload.notes || []) {
              const exists = (before.notes || []).some(x => x.subject === note.subject);
              if (!exists) {
                await request("profile-notes", {
                  method: "POST",
                  body: JSON.stringify({ organizationId: profileId, ...note }),
                });
              }
            }

            if (payload.clearFollowUps) {
              await request("today-followups/clear", {
                method: "POST",
                body: JSON.stringify({
                  organizationId: profileId,
                  reason: "Town of Langford declined the 2027 Pirate's Rebellion quote and the guaranteed pay-per-play alternative on Sept. 25, 2026. No current follow-up is needed unless the town reaches back out."
                }),
              });
            }

            const after = await request("profile-history/" + profileId);
            const wantedNote = payload.notes[0].subject;
            if (!(after.notes || []).some(x => x.subject === wantedNote)) {
              throw new Error("Langford decline note verification failed");
            }
            const open = (after.followUps || []).filter(x => !x.completedAt);
            if (open.length !== 0) {
              throw new Error("Langford still has open follow-ups after decline update");
            }
            const contact = payload.profileContacts[0];
            const contactOk = (after.contacts || []).some(x =>
              String(x.email || "").toLowerCase() === contact.email.toLowerCase() &&
              String(x.phone || "").replace(/\D/g, "") === contact.phone.replace(/\D/g, "")
            );
            if (!contactOk) throw new Error("Langford contact verification failed");

            const receipt = {
              appliedAt: new Date().toISOString(),
              profileId,
              profileName: after.place?.name || "Town of Langford",
              note: wantedNote,
              openFollowUps: open.length,
              contact: {
                name: contact.name,
                role: contact.role,
                email: contact.email,
                phone: contact.phone,
              },
            };
            fs.writeFileSync("langford-decline-receipt.json", JSON.stringify(receipt, null, 2));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "# Town of Langford CRM update\n\n" +
              "- Final decline recorded\n" +
              "- Kaitie Stiegelmeier saved as Finance Officer\n" +
              "- Open follow-ups cleared\n" +
              "- Live profile verified\n"
            );
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload protected receipt
        uses: actions/upload-artifact@v4
        with:
          name: langford-decline-receipt
          path: langford-decline-receipt.json
          retention-days: 7
