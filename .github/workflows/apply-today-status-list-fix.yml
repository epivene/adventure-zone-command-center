name: Apply Today closed status list typing fix

on:
  push:
    branches:
      - fix/today-closed-status-list-typing
    paths:
      - ".github/workflows/apply-today-status-list-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-closed-status-list-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type closed status lists as mutable opportunity-status arrays
        run: |
          python - <<'PY'
          from pathlib import Path

          repo = Path('artifacts/api-server/src/features/today/master-work-queue-repository.ts')
          text = repo.read_text()
          old = '''const closedOpportunityStatuses = [\n  "not_pursuing",\n  "declined",\n  "no_response",\n  "territory_hold",\n  "cancelled",\n] as const;'''
          new = '''const closedOpportunityStatuses: OpportunityStatus[] = [\n  "not_pursuing",\n  "declined",\n  "no_response",\n  "territory_hold",\n  "cancelled",\n];'''
          if old not in text:
              raise SystemExit('master work queue closed-status block not found')
          repo.write_text(text.replace(old, new, 1))

          controls = Path('artifacts/api-server/src/features/today/today-work-controls.ts')
          text = controls.read_text()
          text = text.replace(
              'import {\n  bookingOpportunities,\n  bookingOpportunityQueueOverrides,\n} from "@/db/schema";\n',
              'import {\n  bookingOpportunities,\n  bookingOpportunityQueueOverrides,\n} from "@/db/schema";\nimport type { OpportunityStatus } from "@/features/opportunities/opportunity-types";\n',
              1,
          )
          if old not in text:
              raise SystemExit('today controls closed-status block not found')
          controls.write_text(text.replace(old, new, 1))
          PY
      - name: Run Today queue tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/today/master-work-queue.test.ts
      - name: Verify Today status-list type errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'master-work-queue-repository\.ts\(229|today-work-controls\.ts\(' /tmp/api-typecheck.log | grep -E 'readonly|not assignable|inArray|notInArray'; then
            echo 'Today closed-status list type errors remain.' >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/today/master-work-queue-repository.ts artifacts/api-server/src/features/today/today-work-controls.ts
          git diff --cached --quiet || git commit -m "fix: type Today closed opportunity status lists"
          git push origin HEAD:fix/today-closed-status-list-typing
