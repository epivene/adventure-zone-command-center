name: Apply follow-up route error fix

on:
  push:
    branches:
      - fix/followup-route-error-copy
    paths:
      - ".github/workflows/apply-followup-route-error-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/followup-route-error-copy
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Handle follow-up create errors exhaustively
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/routes/follow-ups.ts')
          text = path.read_text()
          old = '''      if (!result.ok) {\n        res.status(400).json({ ok: false, error: result.error.message });\n        return;\n      }'''
          new = '''      if (!result.ok) {\n        if (result.error.code === "FOLLOW_UP_NOT_FOUND") {\n          res.status(404).json({ ok: false, error: "Follow-up not found." });\n          return;\n        }\n        res.status(400).json({ ok: false, error: result.error.message });\n        return;\n      }'''
          if old not in text:
              raise SystemExit('follow-up create error block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Run follow-up route tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/follow-ups.test.ts src/features/follow-ups/follow-up-service.test.ts
      - name: Verify follow-up route type error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'routes/follow-ups\.ts\(129.*message' /tmp/api-typecheck.log; then
            echo 'Follow-up route error typing remains.' >&2
            exit 1
          fi
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/follow-ups.ts
          git diff --cached --quiet || git commit -m "fix: handle follow-up create errors by code"
          git push origin HEAD:fix/followup-route-error-copy
