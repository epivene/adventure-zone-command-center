name: Apply Boss dashboard count typing

on:
  push:
    branches:
      - fix/boss-dashboard-count-typing
    paths:
      - ".github/workflows/apply-boss-dashboard-count-typing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boss-dashboard-count-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm both Boss dashboard compiler errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'boss-dashboard\.ts.*error TS2769' /tmp/api-before.log >/dev/null || {
            echo "Expected Boss dashboard nullability error was not present." >&2
            exit 1
          }
          grep -E 'boss-dashboard\.ts.*error TS7053' /tmp/api-before.log >/dev/null || {
            echo "Expected Boss dashboard count-shape error was not present." >&2
            exit 1
          }
      - name: Preserve narrowed account id and count-array shape
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/routes/boss-dashboard.ts')
          text = path.read_text()
          old = 'eq(designProjects.officeAccountId, req.bossAccount!.studioOfficeAccountId)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one nullable office account comparison, found {text.count(old)}')
          text = text.replace(old, 'eq(designProjects.officeAccountId, officeAccountId)', 1)
          old = 'Promise.resolve([{ value: 0 }, { value: 0 }, { value: 0 }])'
          if text.count(old) != 1:
              raise SystemExit(f'expected one business-document fallback, found {text.count(old)}')
          text = text.replace(old, 'Promise.resolve([[{ value: 0 }], [{ value: 0 }], [{ value: 0 }]])', 1)
          path.write_text(text)
          PY
      - name: Run available Boss route tests
        run: |
          cd artifacts/api-server
          files=$(find src/routes -maxdepth 1 -type f -name 'boss*.test.ts' -print | tr '\n' ' ')
          if [ -n "$files" ]; then
            pnpm exec vitest run $files
          else
            echo "No dedicated Boss route test files found; relying on targeted compiler verification."
          fi
      - name: Commit verified patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/boss-dashboard.ts
          git diff --cached --quiet || git commit -m "fix: align Boss dashboard account and count shapes"
          git push origin HEAD:fix/boss-dashboard-count-typing
      - run: pnpm run typecheck:libs
      - name: Verify both Boss dashboard compiler errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'boss-dashboard\.ts.*error (TS2769|TS7053)' /tmp/api-after.log; then
            echo "Boss dashboard targeted compiler errors remain." >&2
            exit 1
          fi
