name: Profile Follow-up TDD

on:
  push:
    branches:
      - fix/profile-follow-up-scheduler
  pull_request:
    paths:
      - "artifacts/adventure-zone/src/components/event-profiles/event-profile-workspace*"
      - "artifacts/adventure-zone/src/actions/follow-ups*"
      - "artifacts/api-server/src/routes/follow-ups*"
      - ".github/workflows/profile-follow-up-tdd.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      SESSION_SECRET: profile-follow-up-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Follow-up frontend test
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/event-profiles/event-profile-workspace.follow-up.test.tsx
      - name: Follow-up API tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/follow-ups.test.ts
      - name: Frontend build
        run: pnpm --filter @workspace/adventure-zone run build
      - name: API build
        run: pnpm --filter @workspace/api-server run build
