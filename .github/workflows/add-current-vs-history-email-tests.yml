name: Add current vs historical profile email tests

on:
  push:
    branches:
      - fix/profile-email-current-vs-history
    paths:
      - ".github/workflows/add-current-vs-history-email-tests.yml"

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adventure_zone_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-email-current-vs-history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Add failing behavior tests
        run: |
          python <<'PY'
          from pathlib import Path

          api_test = Path('artifacts/api-server/src/routes/google-workspace-profile-email.test.ts')
          text = api_test.read_text()
          text = text.replace('internalDateMs: 1000,', 'internalDateMs: Date.UTC(2026, 7, 24, 16, 0, 0),')

          old = '''      unavailableThreadCount: 0,
      conversations: [
        {
          threadId: "thread-1",'''
          new = '''      unavailableThreadCount: 0,
      currentYear: 2026,
      currentConversations: [
        {
          threadId: "thread-1",
          subject: "County Fair follow up",
          from: "fair@example.org",
          to: "zone@example.com",
          date: "Mon, 24 Aug 2026 10:00:00 -0600",
          internalDateMs: Date.UTC(2026, 7, 24, 16, 0, 0),
          hasAttachments: true,
          contactId: "contact-1",
          evidenceCodes: ["exact_contact_email", "contact_active_organization"],
          originalGmailUrl: "https://mail.google.com/mail/u/0/#all/thread-1",
        },
      ],
      historicalConversations: [],
      conversations: [
        {
          threadId: "thread-1",'''
          if old not in text:
              raise SystemExit('Could not find profile-email response expectation marker')
          text = text.replace(old, new, 1)

          marker = '''  it("does not require Google when the profile has no matched Gmail", async () => {'''
          test = '''  it("separates current-year Gmail conversations from earlier relationship history", async () => {
    const currentYear = new Date().getUTCFullYear();
    const previousYear = currentYear - 1;
    const mappings = [
      {
        messageId: "current-message",
        threadId: "thread-current",
        organizationId: "org-1",
        contactId: "contact-1",
        evidenceCodes: ["exact_contact_email"],
      },
      {
        messageId: "historical-message",
        threadId: "thread-historical",
        organizationId: "org-1",
        contactId: "contact-1",
        evidenceCodes: ["historical_gmail_backfill"],
      },
    ];
    const client = googleClient({
      getThreadDetail: async (threadId) => {
        const year = threadId === "thread-current" ? currentYear : previousYear;
        const internalDateMs = Date.UTC(year, 7, 24, 16, 0, 0);
        return {
          id: threadId,
          subject: `${year} County Fair`,
          originalGmailUrl: `https://mail.google.com/mail/u/0/#all/${threadId}`,
          messages: [{
            id: `${threadId}-message`,
            internalDateMs,
            from: "zone@example.com",
            to: "fair@example.org",
            cc: "",
            subject: `${year} County Fair`,
            date: new Date(internalDateMs).toUTCString(),
            direction: "outgoing" as const,
            bodyText: "Hello",
            attachments: [],
          }],
        };
      },
    });

    const response = await request(appFor({ client, mappings: mappings as any })).get(
      "/google-workspace/profiles/org-1/emails",
    );

    expect(response.status).toBe(200);
    expect(response.body.currentYear).toBe(currentYear);
    expect(response.body.currentConversations.map((row: any) => row.threadId)).toEqual([
      "thread-current",
    ]);
    expect(response.body.historicalConversations.map((row: any) => row.threadId)).toEqual([
      "thread-historical",
    ]);
    expect(response.body.conversations).toHaveLength(2);
  });

'''
          if marker not in text:
              raise SystemExit('Could not find insertion point for current/history API test')
          text = text.replace(marker, test + marker, 1)

          # Empty profiles must expose the same response shape.
          text = text.replace(
              '''      unavailableThreadCount: 0,
      conversations: [],
    });''',
              '''      unavailableThreadCount: 0,
      currentYear: new Date().getUTCFullYear(),
      currentConversations: [],
      historicalConversations: [],
      conversations: [],
    });''',
              1,
          )
          api_test.write_text(text)

          panel_test = Path('artifacts/adventure-zone/src/components/google-workspace/profile-google-email-panel.test.tsx')
          panel_test.write_text(r'''import { render, screen, waitFor } from "@testing-library/react";
import { beforeEach, describe, expect, it, vi } from "vitest";

import { ProfileGoogleEmailPanel } from "./profile-google-email-panel";
import {
  getGoogleProfileEmails,
  getGoogleProfileFiles,
} from "@/features/google-workspace/google-workspace-client";

vi.mock("@/features/google-workspace/google-workspace-client", async () => {
  const actual = await vi.importActual<any>("@/features/google-workspace/google-workspace-client");
  return {
    ...actual,
    getGoogleProfileEmails: vi.fn(),
    getGoogleProfileFiles: vi.fn(),
    getGoogleProfileEmailThread: vi.fn(),
    copyGoogleProfileThreadFiles: vi.fn(),
    openGoogleProfileFile: vi.fn(),
  };
});

function conversation(threadId: string, year: number) {
  return {
    threadId,
    subject: `${year} Twin Falls County Fair ${threadId}`,
    from: "Adventure Zone <theadventurezone12@gmail.com>",
    to: "fair@tfcfair.com",
    date: `${year}-08-25`,
    internalDateMs: Date.UTC(year, 7, 25, 18, 0, 0),
    hasAttachments: false,
    contactId: null,
    evidenceCodes: ["exact_contact_email"],
    originalGmailUrl: `https://mail.google.com/mail/u/0/#all/${threadId}`,
  };
}

describe("ProfileGoogleEmailPanel", () => {
  beforeEach(() => {
    vi.mocked(getGoogleProfileFiles).mockResolvedValue({ files: [] });
  });

  it("shows current-year email conversations separately from earlier Gmail history", async () => {
    const year = 2026;
    const currentConversations = [1, 2, 3, 4].map((n) => conversation(`current-${n}`, year));
    const historicalConversations = [1, 2, 3, 4, 5].map((n) => conversation(`history-${n}`, year - n));
    vi.mocked(getGoogleProfileEmails).mockResolvedValue({
      validationSampleOnly: false,
      historicalBackfillIncluded: true,
      liveGmail: true,
      unavailableThreadCount: 0,
      currentYear: year,
      currentConversations,
      historicalConversations,
      conversations: [...currentConversations, ...historicalConversations],
    } as any);

    render(<ProfileGoogleEmailPanel organizationId="org-1" />);

    await waitFor(() => expect(getGoogleProfileEmails).toHaveBeenCalledWith("org-1"));
    expect(await screen.findByText("2026 emails (4)")).toBeInTheDocument();
    expect(screen.getByText("Earlier Gmail history (5)")).toBeInTheDocument();
    expect(screen.getByText("2026 Twin Falls County Fair current-4")).toBeInTheDocument();
  });
});
''')

          Path('.github/workflows/add-current-vs-history-email-tests.yml').unlink()
          PY

      - name: Verify tests fail for the missing behavior
        run: |
          set +e
          pnpm --filter @workspace/api-server exec vitest run src/routes/google-workspace-profile-email.test.ts > /tmp/api-red.log 2>&1
          API_STATUS=$?
          pnpm --filter @workspace/adventure-zone exec vitest run src/components/google-workspace/profile-google-email-panel.test.tsx > /tmp/ui-red.log 2>&1
          UI_STATUS=$?
          set -e
          cat /tmp/api-red.log
          cat /tmp/ui-red.log
          if [ "$API_STATUS" -eq 0 ] || [ "$UI_STATUS" -eq 0 ]; then
            echo "Expected both new behavior tests to fail before implementation."
            exit 1
          fi
          grep -Eq "currentYear|currentConversations|Earlier Gmail history|2026 emails" /tmp/api-red.log /tmp/ui-red.log || {
            echo "Tests failed for an unrelated reason."
            exit 1
          }
          echo "RED verified: current/history behavior is not implemented yet."

      - name: Commit failing tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/routes/google-workspace-profile-email.test.ts \
            artifacts/adventure-zone/src/components/google-workspace/profile-google-email-panel.test.tsx \
            .github/workflows/add-current-vs-history-email-tests.yml
          git commit -m "test: separate current profile emails from Gmail history"
          git push origin HEAD:fix/profile-email-current-vs-history
