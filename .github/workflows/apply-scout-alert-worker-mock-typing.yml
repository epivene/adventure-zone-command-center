name: Apply Scout Alert worker mock typing

on:
  push:
    branches:
      - fix/scout-alert-worker-mock-typing
    paths:
      - ".github/workflows/apply-scout-alert-worker-mock-typing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-alert-worker-mock-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm residual provider mock errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'scout-alert-worker\.test\.ts.*error (TS2532|TS2493)' /tmp/api-before.log >/dev/null || {
            echo "Expected residual provider mock typing errors were not present." >&2
            exit 1
          }
      - name: Match provider mock signature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/assistant/scout-alert-worker.test.ts')
          text = path.read_text()
          import_marker = 'import { ScoutAlertWorker } from "./scout-alert-worker";\n'
          provider_import = 'import type { LeadScoutProvider } from "./lead-scout-provider";\n'
          if provider_import not in text:
            if import_marker not in text:
              raise SystemExit('worker import marker not found')
            text = text.replace(import_marker, import_marker + provider_import, 1)
          old_throw = 'vi.fn(async () => { throw input.providerError; })'
          new_throw = 'vi.fn(async (_input: Parameters<LeadScoutProvider["enrichCandidate"]>[0]) => { throw input.providerError; })'
          old_ok = 'vi.fn(async () => input?.enrichment ?? ({ facts: [], sources: [], coverageGaps: [] }))'
          new_ok = 'vi.fn(async (_input: Parameters<LeadScoutProvider["enrichCandidate"]>[0]) => input?.enrichment ?? ({ facts: [], sources: [], coverageGaps: [] }))'
          if old_throw not in text or old_ok not in text:
            raise SystemExit('provider mock markers not found')
          text = text.replace(old_throw, new_throw, 1).replace(old_ok, new_ok, 1)
          path.write_text(text)
          PY
      - name: Run Scout Alert worker tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/assistant/scout-alert-worker.test.ts
      - name: Commit verified residual patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/assistant/scout-alert-worker.test.ts
          git diff --cached --quiet || git commit -m "test: align Scout Alert worker provider mock"
          git push origin HEAD:fix/scout-alert-worker-mock-typing
      - run: pnpm run typecheck:libs
      - name: Verify worker mock errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'scout-alert-worker\.test\.ts.*error (TS2322|TS2532|TS2493)' /tmp/api-after.log; then
            echo "Scout Alert worker targeted type errors remain." >&2
            exit 1
          fi
