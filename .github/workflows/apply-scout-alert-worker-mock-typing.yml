name: Apply Scout Alert worker mock typing

on:
  push:
    branches:
      - fix/scout-alert-worker-mock-typing
    paths:
      - ".github/workflows/apply-scout-alert-worker-mock-typing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scout-alert-worker-mock-typing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm stale worker mock errors exist
        run: |
          set +e
          pnpm run typecheck:libs
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-before.log
          set -e
          grep -E 'scout-alert-worker\.test\.ts.*error TS2322' /tmp/api-before.log >/dev/null || {
            echo "Expected worker repository mock typing errors were not present." >&2
            exit 1
          }
      - name: Match repository mock signatures
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/assistant/scout-alert-worker.test.ts')
          text = path.read_text()
          old_import = '''import type {\n  ScoutAlertWatchClaim,\n  ScoutAlertWatchContext,\n} from "./scout-alert-repository";'''
          new_import = '''import type {\n  ScoutAlertRepository,\n  ScoutAlertWatchClaim,\n  ScoutAlertWatchContext,\n} from "./scout-alert-repository";'''
          if old_import not in text:
            raise SystemExit('repository import marker not found')
          text = text.replace(old_import, new_import, 1)
          text = text.replace(
            'const claimed = input && "claim" in input ? input.claim : claim();',
            'const claimed: ScoutAlertWatchClaim | null = input && "claim" in input ? input.claim ?? null : claim();',
            1,
          )
          text = text.replace(
            'const loaded = input && "context" in input ? input.context : context({ claim: claimed ?? claim() });',
            'const loaded: ScoutAlertWatchContext | null = input && "context" in input ? input.context ?? null : context({ claim: claimed ?? claim() });',
            1,
          )
          replacements = {
            'saveSuccess: vi.fn(async () => undefined),': 'saveSuccess: vi.fn(async (_input: Parameters<ScoutAlertRepository["saveSuccess"]>[0]) => undefined),',
            'recordFailure: vi.fn(async () => undefined),': 'recordFailure: vi.fn(async (_input: Parameters<ScoutAlertRepository["recordFailure"]>[0]) => undefined),',
            'completeWatch: vi.fn(async () => undefined),': 'completeWatch: vi.fn(async (_input: Parameters<ScoutAlertRepository["completeWatch"]>[0]) => undefined),',
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'expected one mock marker: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Run Scout Alert worker tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/assistant/scout-alert-worker.test.ts
      - name: Commit verified test patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/assistant/scout-alert-worker.test.ts
          git diff --cached --quiet || git commit -m "test: align Scout Alert worker repository mocks"
          git push origin HEAD:fix/scout-alert-worker-mock-typing
      - run: pnpm run typecheck:libs
      - name: Verify worker mock errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-after.log
          set -e
          if grep -E 'scout-alert-worker\.test\.ts.*error (TS2322|TS2532|TS2493)' /tmp/api-after.log; then
            echo "Scout Alert worker targeted type errors remain." >&2
            exit 1
          fi
