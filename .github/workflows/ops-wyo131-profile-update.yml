name: One-time WYO131 profile verification

on:
  push:
    branches:
      - ops/wyo131-profile-update-2026-09-01
    paths:
      - ".github/workflows/ops-wyo131-profile-update.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/wyo131-profile-update-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live WYO131 profile state
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          PROFILE_ID="47a2421f-efbd-4abe-bc21-3123bb65f40f"
          curl --fail --silent --show-error             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             "${BASE_URL}/profile-history/${PROFILE_ID}" > /tmp/wyo131-verified.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('/tmp/wyo131-verified.json', 'utf8'));
          const serialized = JSON.stringify(root);
          const contact = (root.contacts ?? []).find((item) =>
            item.name === 'Nicki Simon' &&
            String(item.email ?? '').toLowerCase() === 'wyo131gravel@landercycling.org' &&
            item.isPrimary === true
          );
          const notePresent =
            serialized.includes('Contact update - WYO131 Google Workspace') &&
            serialized.includes('Gwen Robson is the adviser') &&
            serialized.includes('307-330-3002') &&
            serialized.includes('wyo131gravel@gmail.com are forwarded');
          if (root.ok !== true || root.profileId !== '47a2421f-efbd-4abe-bc21-3123bb65f40f' || !contact || !notePresent) {
            throw new Error('Fresh live verification did not find the expected WYO131 state.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/wyo131-profile-verification.json', JSON.stringify({
            verifiedAt: new Date().toISOString(),
            ok: true,
            profileId: root.profileId,
            profileName: root.place?.name,
            primaryContact: {
              name: contact.name,
              role: contact.role,
              email: contact.email,
              phone: contact.phone
            },
            contactUpdateNotePresent: true
          }, null, 2) + '\n');
          NODE

      - name: Commit verification receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/wyo131-profile-verification.json
          git commit -m "ops: verify live WYO131 profile update"
          git push origin HEAD:ops/wyo131-profile-update-2026-09-01
