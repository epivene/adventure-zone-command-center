name: One-time WYO131 profile audit

on:
  push:
    branches:
      - ops/wyo131-profile-update-2026-09-01
    paths:
      - ".github/workflows/ops-wyo131-profile-update.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/wyo131-profile-update-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read exact live profile and contacts
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${API_URL}"
          test -n "${ASSISTANT_IMPORT_TOKEN}"
          BASE_URL="${API_URL%/}/api/assistant-import"
          PROFILE_ID="47a2421f-efbd-4abe-bc21-3123bb65f40f"
          curl --fail --silent --show-error             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             "${BASE_URL}/profile-history/${PROFILE_ID}" > /tmp/wyo131-history.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('/tmp/wyo131-history.json', 'utf8'));
          if (root.ok !== true || root.profileId !== '47a2421f-efbd-4abe-bc21-3123bb65f40f') {
            throw new Error('The exact WYO131 profile could not be verified.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/wyo131-profile-audit.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            ok: true,
            profileId: root.profileId,
            place: root.place,
            contacts: root.contacts,
          }, null, 2) + '\n');
          NODE

      - name: Commit sanitized audit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/wyo131-profile-audit.json
          git commit -m "ops: record WYO131 contact audit"
          git push origin HEAD:ops/wyo131-profile-update-2026-09-01
