name: Verify Leg Manager Money Release 2
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Finance API tests
        run: |
          pnpm --filter @workspace/api-server exec vitest run \
            src/features/leg-manager/finance-math.test.ts \
            src/features/leg-manager/finance-repository.test.ts \
            src/features/leg-manager/receipt-service.test.ts \
            src/features/leg-manager/operations-rollup.test.ts \
            src/features/leg-manager/leg-manager-middleware.test.ts
      - name: Manager money web tests
        run: |
          pnpm --filter @workspace/adventure-zone exec vitest run \
            src/pages/ManagerMoneyPage.test.tsx \
            src/components/manager/expense-form.test.tsx \
            src/lib/manager-blob-queue.test.ts \
            src/pages/ManagerFinanceAdminPage.test.tsx \
            src/lib/manager-sync-queue.test.ts
      - name: Web typecheck
        run: pnpm --filter @workspace/adventure-zone typecheck
      - name: Scoped manager API typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.manager.json --noEmit
      - name: Full API typecheck
        run: pnpm --filter @workspace/api-server typecheck
      - name: Database build
        run: pnpm --filter @workspace/db build
      - name: API build
        run: pnpm --filter @workspace/api-server build
      - name: Web build
        run: pnpm --filter @workspace/adventure-zone build
      - name: Release 2 security and accounting assertions
        run: |
          grep -q '037_leg_manager_finance.sql' lib/db/src/migrations.ts
          grep -q 'req.legManager!.legId' artifacts/api-server/src/routes/leg-manager.ts
          grep -q 'event_cash_collected' artifacts/api-server/src/features/leg-manager/finance-repository.ts
          grep -q 'expense_paid_cash' artifacts/api-server/src/features/leg-manager/finance-repository.ts
          grep -q 'missingReceiptCount' artifacts/api-server/src/features/leg-manager/finance-repository.ts
          grep -q 'GoogleCloudLegManagerObjectStorage' artifacts/api-server/src/features/leg-manager/leg-manager-object-storage.ts
          grep -q 'capture="environment"' artifacts/adventure-zone/src/components/manager/receipt-capture.tsx
          grep -q 'id, bookingId' artifacts/adventure-zone/src/components/manager/expense-form.tsx
          ! grep -R -q 'squareup\|SquareClient\|OCR' artifacts/api-server/src/features/leg-manager artifacts/adventure-zone/src/components/manager artifacts/adventure-zone/src/pages/ManagerMoneyPage.tsx || (echo 'Live Square/OCR integration is out of scope' && exit 1)
          ! grep -q 'bytea\|blob' lib/db/migrations/037_leg_manager_finance.sql
      - name: Remove temporary Release 2 workflows
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/leg-manager-money-*.yml
          git commit -m 'chore: remove temporary release 2 verification workflows'
          git push
