name: Consolidate Northern Gila duplicate

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/consolidate-northern-gila.yml"

permissions:
  contents: read

jobs:
  consolidate:
    runs-on: ubuntu-latest
    env:
      API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
      ASSISTANT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
      CANONICAL_ID: 6813439b-4ba6-478c-9c51-70b583914e9e
      SOURCE_ID: 93ee6ee1-9bea-403e-a83c-83a3de8566d4
      FOLLOWUP_ID: 88b7e80b-3f46-49a7-bc55-e6914e6ae6a3
      BOOKING_ID: 42b47136-f8f6-4f83-9027-e23b5cdc10f2
    steps:
      - name: Wait for merge API and consolidate profiles
        shell: bash
        run: |
          set -euo pipefail
          base="${API_URL%/}"
          payload=$(jq -nc --arg canonical "$CANONICAL_ID" --arg source "$SOURCE_ID" '{canonicalOrgId:$canonical,sourceOrgId:$source,label:"Payson, AZ"}')
          for attempt in $(seq 1 90); do
            status=$(curl -sS -o merge-response.json -w '%{http_code}' \
              -X POST "$base/api/assistant-import/profile-merge" \
              -H "Authorization: Bearer $ASSISTANT_TOKEN" \
              -H "Content-Type: application/json" \
              --data "$payload")
            if [ "$status" = "200" ]; then
              jq -e '.ok == true and (.locationId | type == "string")' merge-response.json
              break
            fi
            if [ "$status" != "404" ] && [ "$status" != "500" ] && [ "$status" != "502" ] && [ "$status" != "503" ]; then
              jq . merge-response.json || true
              echo "Unexpected merge response: HTTP $status"
              exit 1
            fi
            if [ "$attempt" = "90" ]; then
              echo "Timed out waiting for the deployed merge API"
              exit 1
            fi
            sleep 10
          done

      - name: Verify surviving profile and visible follow-up
        shell: bash
        run: |
          set -euo pipefail
          base="${API_URL%/}"
          curl -fsS \
            -H "Authorization: Bearer $ASSISTANT_TOKEN" \
            "$base/api/assistant-import/profile-history/$CANONICAL_ID" \
            -o canonical-history.json
          curl -fsS \
            -H "Authorization: Bearer $ASSISTANT_TOKEN" \
            "$base/api/assistant-import/profile-history/$SOURCE_ID" \
            -o source-history.json

          jq -e --arg id "$CANONICAL_ID" '.ok == true and .profileId == $id' canonical-history.json
          jq -e --arg id "$FOLLOWUP_ID" 'any(.followUps[]?; .id == $id and .status == "open")' canonical-history.json
          jq -e --arg id "$BOOKING_ID" 'any(.bookings[]?; .id == $id and .status == "declined")' canonical-history.json
          jq -e 'any(.contacts[]?; (.email // "" | ascii_downcase) == "lyssaharder88@gmail.com")' canonical-history.json
          jq -e '.contacts | length == 0' source-history.json
          jq -e '.bookings | length == 0' source-history.json
          jq -e '.followUps | length == 0' source-history.json

          jq -n \
            --slurpfile merge merge-response.json \
            --slurpfile canonical canonical-history.json \
            '{merged:$merge[0].ok,locationId:$merge[0].locationId,canonicalProfile:$canonical[0].place.name,openFollowUp:($canonical[0].followUps | map(select(.status == "open")) | map({id,label,dueAt,status})),declinedBooking:($canonical[0].bookings | map(select(.status == "declined")) | map({id,name,status}))}'
