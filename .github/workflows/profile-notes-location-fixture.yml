name: Update location note fixture
on:
  push:
    branches: [feature/profile-family-notes-impl]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[location-note-fixture]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile
      - name: Patch location PGlite fixture
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/features/organization-locations/location-repository.pglite.test.ts')
          s=p.read_text()
          old='''  await client.exec(migration030);\n\n  // Seed two organizations.\n'''
          new='''  await client.exec(migration030);\n\n  // scoped_notes is introduced after organization_locations and is now part of\n  // the location delete dependency check. This focused fixture only needs the\n  // location-owner side of the table.\n  await client.exec(`\n    CREATE TABLE scoped_notes (\n      id uuid PRIMARY KEY DEFAULT gen_random_uuid(),\n      organization_location_id uuid REFERENCES organization_locations(id) ON DELETE RESTRICT,\n      body text NOT NULL,\n      created_at timestamptz NOT NULL DEFAULT now(),\n      updated_at timestamptz NOT NULL DEFAULT now()\n    );\n  `);\n\n  // Seed two organizations.\n'''
          if old not in s: raise SystemExit('setup insertion point missing')
          s=s.replace(old,new,1)
          old2='''  it("returns 'not_found' for an unknown location id", async () => {\n'''
          new2='''  it("returns 'has_dependents' when a manual note belongs to the location", async () => {\n    const noteLocation = "66666666-6666-4666-8666-666666666666";\n    await client.exec(`\n      INSERT INTO organization_locations (id, organization_id, label)\n      VALUES ('${noteLocation}', '${ORG_A}', 'Notes-only location');\n      INSERT INTO scoped_notes (organization_location_id, body)\n      VALUES ('${noteLocation}', 'Keep this location note');\n    `);\n    expect(await repo.remove(ORG_A, noteLocation)).toBe("has_dependents");\n  });\n\n  it("returns 'not_found' for an unknown location id", async () => {\n'''
          if old2 not in s: raise SystemExit('remove test insertion point missing')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Run note-dependent location deletion tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/organization-locations/location-repository.pglite.test.ts -t "returns 'has_dependents'"
      - name: Commit fixture regression
        run: |
          git config user.name epivene
          git config user.email Desieleighc@gmail.com
          git add artifacts/api-server/src/features/organization-locations/location-repository.pglite.test.ts
          git commit -m "test: cover location note delete dependency [location-note-fixture]"
          git push
