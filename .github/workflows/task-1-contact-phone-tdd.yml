name: Task 1 contact-phone TDD

on:
  push:
    branches:
      - agent/assisted-calling-workspace

jobs:
  task-1-tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server test -- src/features/contact-phones/contact-phone-repository.test.ts && pnpm run typecheck:libs
