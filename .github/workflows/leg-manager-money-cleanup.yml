name: Cleanup Leg Manager Money Workflows
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  cleanup:
    if: "!contains(github.event.head_commit.message, 'remove temporary release 2 workflows')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary workflows in one commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm .github/workflows/leg-manager-money-*.yml
          git commit -m 'chore: remove temporary release 2 workflows'
          git push
