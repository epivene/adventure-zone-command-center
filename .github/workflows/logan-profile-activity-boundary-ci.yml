name: Logan profile activity boundary CI

on:
  push:
    branches:
      - fix/logan-profile-activity-boundary
    paths:
      - "artifacts/api-server/src/features/event-profiles/event-profile-repository.ts"
      - "artifacts/api-server/src/features/event-profiles/event-profile-activity-classification.test.ts"
      - ".github/workflows/logan-profile-activity-boundary-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Profile activity boundary regression
        run: pnpm --filter @workspace/api-server exec vitest run src/features/event-profiles/event-profile-activity-classification.test.ts
      - name: Build API type declarations
        run: pnpm --filter @workspace/db run build
      - name: API typecheck
        run: pnpm --filter @workspace/api-server run typecheck
      - name: Production API build
        run: pnpm --filter @workspace/api-server run build
