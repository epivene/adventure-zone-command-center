name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Read remaining Week 3 relationship histories
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/ids.txt <<'EOF'
          11195641-d050-408f-b0d6-58cbc14165ad Greek Festival Cheyenne
          b808a33d-650e-4b28-9ccc-1a3dc5d26c46 Arc Oktoberfest
          8d637750-e245-43cd-bcc1-af2cf1f0bcd7 Denver Oktoberfest
          a128b6ae-d9c9-42ae-ac60-9abe28cfd5f6 Parker Oktoberfest
          44f4b435-5710-4b67-a1f8-decf8345e7f8 OktoberWest
          f24033e1-801b-43ff-9a7e-a9d6d7b426c3 Pirate Fest Northglenn
          EOF
          while read -r ID NAME; do
            echo "=== ${NAME} | ${ID} ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              "${BASE}/api/assistant-import/profile-history/${ID}" | jq -c '{profileId,place,contacts,bookings,followUps,notes,history}'
            echo
          done < /tmp/ids.txt
