name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Search next outreach batch profiles
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          QUERIES=(
            "Autumn Aloft Balloon Festival"
            "Mackay Days Free BBQ"
            "Santa Fe Renaissance Faire"
            "Telluride Autumn Classic"
            "Vintage Market Days Northern Utah"
            "World Series of Team Roping Tremonton Qualifier"
            "Golden Aspen Motorcycle Rally"
            "Rendezvous Royale"
            "Commerce City Eats"
            "Pawtoberfest"
          )
          for Q in "${QUERIES[@]}"; do
            echo "=== QUERY: ${Q} ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search"
            echo
          done
