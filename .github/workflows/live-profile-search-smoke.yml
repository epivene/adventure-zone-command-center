name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Create Palisade Art Festival profile
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          P=$(cat <<'JSON'
          {"event":{"id":null,"name":"Palisade Art Festival","city":"Palisade","region":"CO"},"profile":{"placeType":"festival_event","description":"","phone":"970-406-1866","website":"https://www.mountainartfestivals.com/","address1":"120 W 8th St","address2":"Veterans Memorial Park","postalCode":"81526"},"contacts":[{"id":null,"name":"Dick & Tina Cunningham","phone":"970-406-1866","email":"mountainartfestivals@gmail.com","role":"Directors / Promoters","primary":true}],"booking":{"enabled":false,"name":"","status":"new_lead","startsAt":"","endsAt":"","nextActionKind":"","nextActionDueAt":"","travelLegId":null},"familyId":null,"parentOrganizationId":null}
          JSON
          )
          RESP=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/event-profiles" --data-binary "$P")
          echo "$RESP"
          ID=$(echo "$RESP" | jq -r '.profileId')
          N=$(jq -n --arg id "$ID" '{organizationId:$id,subject:"2026 outreach draft prepared",body:"Palisade Art Festival is confirmed for Sept. 26-27, 2026 and is produced by Mountain Art Festivals. Current directors/promoters are Dick and Tina Cunningham; sponsorship/organizer contact is mountainartfestivals@gmail.com / 970-406-1866. Because the show is a strict juried original-art marketplace, the draft is framed as a separate family-entertainment/sponsorship partnership rather than a normal artist/vendor application."}')
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/profile-notes" --data-binary "$N"
          echo
