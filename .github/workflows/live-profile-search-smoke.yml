name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check alternate names for remaining Week 3 leads
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/queries.txt <<'EOF'
          Greek Festival (Cheyenne) WY
          Cheyenne Greek Festival
          Oktoberfest - Arc of Laramie County (Cheyenne) WY
          Arc Laramie County
          Oktoberfest - Grand Targhee (Alta) WY
          Grand Targhee Oktoberfest
          Oktoberfest (Denver) CO
          Denver Oktoberfest
          Oktoberfest (Parker) CO
          Parker Oktoberfest
          OktoberWest (Steamboat Springs) CO
          Steamboat OktoberWest
          Pirate Fest, The (Northglenn) CO
          Northglenn Pirate Festival
          Pirate Festival Northglenn
          EOF
          while IFS= read -r Q; do
            [ -z "$Q" ] && continue
            echo "=== ${Q} ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search" | jq -c '.results'
            echo
          done < /tmp/queries.txt
