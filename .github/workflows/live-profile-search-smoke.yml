name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Create owner Today held-lead follow-ups
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          create_followup() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST "${BASE}/api/assistant-import/today-followups" \
              --data-binary "$1"
            echo
          }

          create_followup '{"organizationId":"2b73d06e-833b-47d2-b96c-15addc4c521a","label":"Review: Crestone Energy Fair","reason":"The 2026 Crestone Energy Fair is confirmed for Sept. 11-13, but our package availability during that mid-September window needs to be verified against existing route commitments before outreach. Confirm which normal package units are actually available, then proceed only with accurate availability notes.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"7ad109bf-fc65-4b65-a815-0463bdfedba9","label":"Review: Prescott Intertribal Powwow","reason":"Verify the current 2026 dates and organizer contact, and review event fit before outreach. Because this is an intertribal cultural event, confirm that a separate family entertainment area is appropriate and wanted before sending a standard inflatable package pitch.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"2d158aad-f3a4-4226-b334-42eb84769999","label":"Review: Silver Threads Quilt Show","reason":"The Silver Threads Quilt Show is not scheduled for 2026; the biennial show returns in 2027. Hold 2026 outreach and revisit this lead for the 2027 show instead.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"9bcc2100-a1ce-45c6-81a2-f7df1d284f04","label":"Review: Stamp & Scrapbook Expo","reason":"The 2026 Mesa event is active Sept. 18-19, but it is primarily an indoor crafting, shopping, and workshop expo. Review whether a full Adventure Zone package is a realistic fit for the venue and event format before contacting exhibitors@scrapbookexpo.com again.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"a7063ca6-cc65-46d1-a57d-f77bce58f3dc","label":"Verify: Bully EXPO DOG","reason":"The CRM profile has no usable organizer email, and the event is centered on dogs at an indoor events venue. Verify the current 2026 event date and direct organizer contact, and confirm that inflatables/noise are compatible with the animal-focused event before outreach.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"1f0a810b-0980-41c5-9cfe-382c68bb4242","label":"Review: Telluride Blues & Brews","reason":"The 2026 festival is Sept. 18-20, but prior direct history says their available space only fits two inflatables. That does not match our standard package model. Do not send another standard package pitch unless an approved smaller-format option becomes available or the organizer confirms substantially more space.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"9e53c47e-681c-4745-8d70-8c8a76bfa936","label":"Review: PASEO Art Project","reason":"The PASEO Project states that the street festival will not take place in 2026, although other public-art programming continues. Hold standard festival outreach for 2026 and revisit when the street festival returns or if a specific family-focused program becomes suitable.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"304c3256-8f6d-451f-a181-e8d7ef642966","label":"Non-fit: Santa Fe Wine & Chile Fiesta","reason":"The 2026 Santa Fe Wine & Chile Fiesta is strictly 21+; its official FAQ states that no children, infants, or minors are allowed. This is not a fit for family inflatable entertainment. Review marking this lead as non-fit for standard Adventure Zone outreach.","dueAt":"2026-09-01T09:00:00-06:00"}'

          create_followup '{"organizationId":"2277206b-1c44-4936-b5bc-d9474bc3e54c","label":"Review: ThirstyFest","reason":"ThirstyFest is a volunteer-led beer festival benefiting Water For People, centered on craft beer, music, and food trucks. Review whether it should remain in the family-entertainment prospect list and verify any 2026 event details before considering outreach.","dueAt":"2026-09-01T09:00:00-06:00"}'
