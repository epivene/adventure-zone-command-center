name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Audit current Gmail draft profiles
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/events.txt <<'EOF'
          The Springs Home Show
          Rendezvous Royale
          Telluride Autumn Classic
          Rocky Mountain ATV Jamboree
          Thousand Springs Festival of the Arts
          Sandy Heritage Festival
          Bear Lake Brawl Triathlon
          A Blast on the Grass
          International Arts & Crafts Festival
          Colorfest Balloon Rally
          Breck Film Fest
          Durango Autumn Arts Festival
          Saguache Fall Festival & Quilt Show
          Holly Gateway Fair
          Cochise County Fair
          Santa Cruz County Fair
          Colorado Highland Games
          Cruisin' the Canyon Car Show
          Experience Rexburg
          Higher Ground Fair
          Rides & Rods Classic Car Show
          Fall Family Festival
          International Camel & Ostrich Races
          EOF
          while IFS= read -r Q; do
            [ -z "$Q" ] && continue
            RESP=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search")
            COUNT=$(printf '%s' "$RESP" | jq '.results | length')
            echo "=== ${Q} | count=${COUNT} ==="
            printf '%s' "$RESP" | jq -c '.results'
          done < /tmp/events.txt
