name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Update Evanston Cowboy Days profile details
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          PAYLOAD=$(python3 - <<'PY'
          import json
          print(json.dumps({
            "event": {"name": "Evanston Cowboy Days", "city": "Evanston", "region": "WY"},
            "profile": {
              "placeType": "festival_event",
              "description": "",
              "phone": "307-679-8019",
              "website": "https://www.evanstoncowboydays.com/",
              "address1": "130 Bear River Drive",
              "address2": "Uinta County Fairgrounds",
              "postalCode": ""
            }
          }))
          PY
          )
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${BASE}/api/assistant-import/event-profiles" \
            --data-binary "${PAYLOAD}"
          echo
