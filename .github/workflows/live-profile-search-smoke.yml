name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Week 4 batch 4 profile screen
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/events.txt <<'EOF'
          Afro Utah Festival (SLC) UT
          Ak-Chin Native American Recognition Day (Maricopa) AZ
          American Indian Day
          Andelin Family Farm - Harvest Festival (Sparks) NV
          Apple City Festival (Lander) WY
          Bear 100 Endurance Run (Fish Haven) ID
          Bear Lake Fall Market Days (Garden) UT
          County Fair - Arizona State Fair(Phoenix) AZ
          Pueblo Chile & Frijoles Festival (Pueblo) CO
          Pyramid Lake Piute Pow Wow (Nixon) NV
          Renner Farm Corn Maze & Pumpkin Patch (Smith) NV
          Roam Fest (Fruita) CO
          Run the Red Desert (S Pass) WY
          San Luis Valley Intertribal Pow Wow (Monte Vista) CO
          Snow Valley Garlic A Taste of Garlic (Priest River) ID
          South Fork Par Fly (South Fork) CO
          Standin' on the Corner Music Festival (Winslow) AZ
          Sundown Music Festival (Denver) CO
          WYO Film Festival (Sheridan) WY
          EOF
          while IFS= read -r Q; do
            echo "=== QUERY: $Q ==="
            RESP=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" --get --data-urlencode "q=${Q}" "${BASE}/api/assistant-import/profile-search")
            echo "$RESP" | jq -c '.results'
            ID=$(echo "$RESP" | jq -r '[.results[] | select(.kind=="organization")][0].id // empty')
            if [ -n "$ID" ]; then
              echo "=== HISTORY: ${ID} ==="
              curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" "${BASE}/api/assistant-import/profile-history/${ID}" | jq -c '{profileId,place,contacts,bookings,followUps,notes,history}'
            fi
            echo
          done < /tmp/events.txt
