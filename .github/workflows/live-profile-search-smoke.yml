name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Correct adult-only event handling
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"

          NOTE=$(jq -n '{
            organizationId:"ba8b0b3c-4265-4d71-9e81-d8144f491cd5",
            subject:"CORRECTION - adult-only events can be viable",
            body:"Correction to the earlier Week 3 review: adult-only / 21+ status by itself is NOT a reason to classify an event as a non-fit. The Adventure Zone can make special arrangements for adult-only events by combining the inflatables into one large obstacle-course style experience. Colorado Mountain Winefest should therefore remain eligible for case-by-case consideration. For this specific event, current 2026 materials describe a curated, invitation-only activation model, so organizer fit/approval still needs to be evaluated before outreach. This note supersedes the earlier age-based non-fit reasoning."
          }')
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
            -H "Content-Type: application/json" \
            -X POST "${BASE}/api/assistant-import/profile-notes" \
            --data-binary "$NOTE"
          echo
