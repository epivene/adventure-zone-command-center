name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Create verified January 2027 follow-ups
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          AUTH=(-H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}")

          find_profile() {
            local q="$1"
            local needle="$2"
            local search
            search=$(curl --fail-with-body --silent --show-error "${AUTH[@]}" "${BASE}/api/assistant-import/profile-search?q=${q}&limit=10")
            echo "$search" >&2
            echo "$search" | jq -r --arg needle "$needle" '.results[] | select(.kind=="organization") | select((.label|ascii_downcase|contains($needle))) | .id' | head -n1
          }

          TELLURIDE_ID=$(find_profile "Telluride%20Autumn%20Classic" "telluride autumn classic")
          test -n "$TELLURIDE_ID"
          TELLURIDE_FU=$(jq -n --arg id "$TELLURIDE_ID" '{organizationId:$id,label:"January 2027 - Telluride Autumn Classic",reason:"Anita Cody specifically asked on Aug. 27, 2026 for a reminder in January 2027 so Adventure Zone can possibly be considered for the next Telluride Autumn Classic. Reach out early in the planning cycle; 2026 was already set less than 30 days before the event, not a fit rejection.",dueAt:"2027-01-08T09:00:00-07:00"}')
          TELLURIDE_RESP=$(curl --fail-with-body --silent --show-error "${AUTH[@]}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/today-followups" --data-binary "$TELLURIDE_FU")
          echo "$TELLURIDE_RESP"
          echo "$TELLURIDE_RESP" | jq -e '.ok == true and (.followUpId|length) > 0 and .dueAt == "2027-01-08T16:00:00.000Z"' >/dev/null

          OKTOBER_ID=$(find_profile "OktoberWest" "oktoberwest")
          test -n "$OKTOBER_ID"
          OKTOBER_FU=$(jq -n --arg id "$OKTOBER_ID" '{organizationId:$id,label:"January 2027 - OktoberWest",reason:"Cecilia Morter said on Aug. 27, 2026 that OktoberWest had no additional space and would need footprint expansion and permits, but she would save Adventure Zone information for the future. Reconnect early for 2027 before space and permits are locked in.",dueAt:"2027-01-15T09:00:00-07:00"}')
          OKTOBER_RESP=$(curl --fail-with-body --silent --show-error "${AUTH[@]}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/today-followups" --data-binary "$OKTOBER_FU")
          echo "$OKTOBER_RESP"
          echo "$OKTOBER_RESP" | jq -e '.ok == true and (.followUpId|length) > 0 and .dueAt == "2027-01-15T16:00:00.000Z"' >/dev/null
