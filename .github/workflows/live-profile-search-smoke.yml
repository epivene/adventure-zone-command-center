name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Finalize Week 4 batch 4 CRM outcomes
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          add_note() {
            ID="$1"; SUBJECT="$2"; BODY="$3"
            P=$(jq -n --arg id "$ID" --arg subject "$SUBJECT" --arg body "$BODY" '{organizationId:$id,subject:$subject,body:$body}')
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/profile-notes" --data-binary "$P"; echo
          }
          add_followup() {
            ID="$1"; LABEL="$2"; REASON="$3"
            P=$(jq -n --arg id "$ID" --arg label "$LABEL" --arg reason "$REASON" '{organizationId:$id,label:$label,reason:$reason,dueAt:"2026-09-01T09:00:00-06:00"}')
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/today-followups" --data-binary "$P"; echo
          }

          add_note "232baf54-5bb1-4c42-92b9-7e728a34cb9b" "2026 outreach draft prepared" "Andelin Family Farm Fall Festival returns Sept. 19, 2026. Current contact remains Natalie Andelin / andelinfamilyfarm@gmail.com. A draft was prepared offering Adventure Zone as a selected-weekend feature that complements, rather than duplicates, the farm's existing pumpkin, corn-maze, animal and play attractions."
          add_note "3d01e066-ee30-4be6-9d7b-7bee016564b7" "2026 outreach draft prepared" "Pueblo Chile & Frijoles Festival is confirmed for Sept. 18-20, 2026. Terri Kallish remains the current chamber event contact. A relationship-aware draft was prepared to terrik@pueblochamber.net, using the festival's existing Kids Corner and broad family attendance as the attraction-area fit."
          add_note "5cfa2159-c22c-4774-9937-6ab9f10256a7" "2026 outreach draft prepared" "Standin' on the Corner Festival is confirmed for Sept. 25-26, 2026. The current 2026 vendor application still uses ContactusSOTC@gmail.com and is addressed through the Standin' on the Corner Foundation. A relationship-aware draft was prepared to that verified current address."
          add_note "8e681957-2f89-42a2-84d5-788797cf7728" "2026 outreach draft prepared" "WYO Film Festival is confirmed for Oct. 1-4, 2026 in Sheridan. The current official direct festival address is director@wyofilmfest.org. A relationship-aware draft was prepared using a community/family activation angle around the screening schedule rather than treating the film program itself as a fair."

          add_note "26fe38db-b8b4-48e0-a8ec-27f79e6abdc0" "2026 relationship hold - prior safety/contract issue needs review" "Afro Utah Festival is confirmed for Sept. 5, 2026 and remains a large family-friendly public cultural festival. Adventure Zone has substantial prior booking history, but the profile also records that the company was unable to participate in 2024 because of a breach of contract involving safety requirements. Do not send routine outreach until that prior issue is reviewed and the relationship is cleared."
          add_followup "26fe38db-b8b4-48e0-a8ec-27f79e6abdc0" "Review: Afro Utah Festival relationship" "Review the prior 2024 safety/contract issue before deciding whether to resume outreach for the Sept. 5, 2026 Afro Utah Festival."

          add_note "d2206dc8-d8e2-4ed7-bb37-fc582d7db6c9" "Lead cleanup - not a specific event" "The spreadsheet row 'American Indian Day' is a general observance/listing rather than a specific bookable event with a verified organizer, city, date and venue. Do not create outreach from this row."
          add_note "9e7f9499-d6e2-446b-a203-3315d578b64a" "2026 review - short museum program / structural non-fit" "The current Apple Fest at the Lander Pioneer Museum is Sept. 19, 2026 from 1-3 p.m. It is a two-hour museum children's exploration program, too short and small-format for a normal 1-4 day staffed Adventure Zone package. No draft created."
          add_note "b8b623ee-18cf-4ded-ba45-d9edf1d53ea9" "2026 review - endurance race / structural non-fit" "The Bear 100 starts Sept. 25, 2026 and is a 100-mile endurance trail race from Logan, Utah to the Bear Lake area. Current format is race-focused rather than a public festival with a suitable entertainment footprint. No standard outreach draft created."

          add_note "44fa5132-36e9-4ffc-9ba6-735b3cc36530" "2026 outreach hold - current Market Days event not verified" "A current authoritative 2026 Bear Lake Fall Market Days date and organizer/contact could not be verified. Do not reuse the stale Facebook-only profile information without confirmation."
          add_followup "44fa5132-36e9-4ffc-9ba6-735b3cc36530" "Review: Bear Lake Fall Market Days" "Verify the 2026 event date and current organizer/contact before outreach."

          add_note "1c5d959b-f9c7-43c5-a95e-73f371bd8c20" "2026 review - fair participation rules conflict with normal package" "Arizona State Fair is confirmed for Oct. 1-Nov. 1, 2026. Current commercial-vendor rules require vendors to remain fully staffed for all 20 operating days. Adventure Zone's normal offer is a 1-4 day package, so the published participation structure does not fit standard outreach. Preserve the prior convention relationship, but do not send a normal 1-4 day pitch unless the Fair specifically confirms a separate entertainment/activation opportunity."

          add_note "e12e45e6-6f0a-4534-bf44-30f97d026c58" "2026 outreach hold - current powwow identity/location changed" "Current 2026 Pyramid Lake-area materials identify the Sacred Visions Powwow Sept. 11-13 at Big Bend Ranch in Wadsworth, while the spreadsheet/profile uses Pyramid Lake Paiute Pow Wow in Nixon. Do not assume these are the same booking opportunity without organizer confirmation."
          add_followup "e12e45e6-6f0a-4534-bf44-30f97d026c58" "Review: Pyramid Lake powwow 2026" "Confirm whether the spreadsheet's Nixon powwow is the current Sacred Visions Powwow in Wadsworth and determine whether a separate family/youth attraction area is appropriate before outreach."

          add_note "9b7cde0c-d6d9-4830-9cae-bce86937d1cf" "2026 outreach hold - current Roam Fest date not verified" "Roam Fest remains an adult/femme-focused mountain-bike festival at the North Fruita Desert, but the current public site does not clearly publish a 2026 event date. Adult-only status is not a barrier; a special obstacle-course configuration could be considered if a 2026 festival is confirmed."
          add_followup "9b7cde0c-d6d9-4830-9cae-bce86937d1cf" "Review: Roam Fest 2026" "Verify whether Roam Fest is taking place in Fruita in 2026 and identify the current partnership/sponsor contact. If active, consider the adult obstacle-course configuration."

          add_note "307f053e-1d7d-4cb2-9b8c-37f65133153e" "2026 review - remote endurance race / structural non-fit" "Run the Red is confirmed for Sept. 26, 2026 as 30K/50K trail races from Whitehorse Creek to South Pass City. The remote race format does not provide a demonstrated public festival footprint suitable for a full staffed inflatable package. No draft created."

          add_note "54954a3b-f059-46bc-ac3b-3013e1c6fc34" "2026 outreach hold - current powwow details need verification" "The San Luis Valley Intertribal Pow Wow has prior Adventure Zone outreach history, but a current authoritative 2026 date/event page was not verified during this review. Confirm the current organizer and whether a separate family/youth attraction area would be appropriate before outreach."
          add_followup "54954a3b-f059-46bc-ac3b-3013e1c6fc34" "Review: San Luis Valley Intertribal Pow Wow" "Verify the 2026 powwow dates/current organizer and decide whether a separate family/youth attraction area would be appropriate before outreach."

          add_note "c3ec282e-6f52-426b-8423-07dee75f9a2e" "Do not pursue routine outreach - repeated prior decline" "Snow Valley Garlic / A Taste of Garlic has two prior direct replies stating they were not interested. Do not send routine new outreach unless the organizer contacts Adventure Zone or there is a material change in the event relationship."

          add_note "2e29a96e-79e7-4351-a65f-48fcf2e51913" "2026 outreach hold - current Sundown event not verified" "A current authoritative 2026 Sundown Music Festival event/date was not verified. Adult music-event status would not automatically disqualify the opportunity, but do not outreach from stale event information."
          add_followup "2e29a96e-79e7-4351-a65f-48fcf2e51913" "Review: Sundown Music Festival 2026" "Verify the 2026 event date, venue and current organizer/contact before outreach; if adult-only, consider the special adult obstacle-course setup."
