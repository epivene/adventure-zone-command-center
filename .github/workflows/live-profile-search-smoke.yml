name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Week 4 batch 1 profile screen
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/events.txt <<'EOF'
          Errl Camp, The [Pot Festival] (Tempe) AZ
          Broomfield Days (Midway) CO
          Red River Folk Festival (Red River) NM
          Oktoberfest (Casper) WY
          Pahrump Fall Festival (Pahrump) NV
          Prickly Pear Festival (Albuquerque) NM
          Sheridan Celebrates (Sheridan) CO
          Color Country OHV Jamboree (Parowan) UT
          County Fair - Southern New Mexico State Fair (Las Cruces) NM
          Oktoberfest (Montrose) CO
          Ak-Chin Native American Recognition Day (Maricopa) AZ
          Riverton Fall Harvest Festival (Riverton) WY
          EOF
          while IFS= read -r Q; do
            [ -z "$Q" ] && continue
            echo "=== QUERY: ${Q} ==="
            RESP=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search")
            echo "$RESP" | jq -c '.results'
            STATE=$(printf '%s' "$Q" | sed -E 's/.*\) ([A-Z]{2}).*/\1/')
            if [ "$STATE" != "NM" ]; then
              ID=$(echo "$RESP" | jq -r '[.results[] | select(.kind=="organization")][0].id // empty')
              if [ -n "$ID" ]; then
                echo "=== HISTORY: ${ID} ==="
                curl --fail-with-body --silent --show-error \
                  -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
                  "${BASE}/api/assistant-import/profile-history/${ID}" | jq -c '{profileId,place,contacts,bookings,followUps,notes,history}'
              fi
            fi
            echo
          done < /tmp/events.txt
