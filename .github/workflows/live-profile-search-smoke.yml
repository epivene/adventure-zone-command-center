name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Search fourth outreach batch profiles
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          QUERIES=(
            "Crestone Energy Fair"
            "Prescott Intertribal Powwow"
            "Silver Threads Quilt Show"
            "Springs Home Show"
            "Stamp & Scrapbook Expo"
            "Bully EXPO DOG"
            "Telluride Blues & Brews"
            "PASEO Art Project"
            "Santa Fe Wine & Chile Fiesta"
            "ThirstyFest"
          )
          for Q in "${QUERIES[@]}"; do
            echo "=== QUERY: ${Q} ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search"
            echo
          done
