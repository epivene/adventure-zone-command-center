name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Audit Week 3 and Week 4 real Today follow-ups
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          AUTH=(-H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}")

          check_followup() {
            local id="$1"
            local label="$2"
            local history
            history=$(curl --fail-with-body --silent --show-error "${AUTH[@]}" "${BASE}/api/assistant-import/profile-history/${id}")
            if echo "$history" | jq -e --arg label "$label" '.followUps | any(.kind == $label and .completedAt == null and ((.dueAt | tostring) | startswith("2026-09-01")))' >/dev/null; then
              echo "FOUND|${label}|${id}"
            else
              echo "MISSING|${label}|${id}"
              return 1
            fi
          }

          echo "=== WEEK 3 OWNER/TODAY FOLLOW-UPS ==="
          check_followup "2b73d06e-833b-47d2-b96c-15addc4c521a" "Review: Crestone Energy Fair"
          check_followup "7ad109bf-fc65-4b65-a815-0463bdfedba9" "Review: Prescott Intertribal Powwow"
          check_followup "2d158aad-f3a4-4226-b334-42eb84769999" "Review: Silver Threads Quilt Show"
          check_followup "9bcc2100-a1ce-45c6-81a2-f7df1d284f04" "Review: Stamp & Scrapbook Expo"
          check_followup "a7063ca6-cc65-46d1-a57d-f77bce58f3dc" "Verify: Bully EXPO DOG"
          check_followup "1f0a810b-0980-41c5-9cfe-382c68bb4242" "Review: Telluride Blues & Brews"
          check_followup "9e53c47e-681c-4745-8d70-8c8a76bfa936" "Review: PASEO Art Project"
          check_followup "304c3256-8f6d-451f-a181-e8d7ef642966" "Non-fit: Santa Fe Wine & Chile Fiesta"
          check_followup "2277206b-1c44-4936-b5bc-d9474bc3e54c" "Review: ThirstyFest"
          check_followup "841aa9e8-ca44-49d2-9503-f1b4f5b94d9f" "Review: Bear Lake Caribbean Cruze Motorcycle Rally"
          check_followup "11195641-d050-408f-b0d6-58cbc14165ad" "Review: Cheyenne Greek Festival"

          echo "=== WEEK 4 OWNER/TODAY FOLLOW-UPS ==="
          check_followup "bc7ac73a-7f4b-49ff-9c4a-d49bae42a2b6" "Review: Errl Camp 2026"
          check_followup "f50bc280-d806-4d5a-be03-618e2bbfe2a9" "Review: Casper Oktoberfest 2026"
          check_followup "64ec258e-8c09-44d4-9819-ab090d65280d" "Review: Color Country OHV Jamboree 2026"
          check_followup "772eb6bf-e842-4bb6-895e-884ee7ce4770" "Review: Montrose Oktoberfest 2026"
          check_followup "90988838-b5d0-4487-92b8-29b50b2bb047" "Review: Hops Drops 2026"
          check_followup "4dd35411-5413-49a9-9811-0335bc699d75" "Review: Last Chance Community Pow Wow"
          check_followup "3e9b69ad-655c-4634-9386-b617c5402944" "Review: Mineral County Rodeo 2026"
          check_followup "308c657d-4220-43a1-abf3-0a5949aa4eb1" "Review: Saratoga Oktoberfest 2026"
          check_followup "2d738070-f4a6-46d4-9eb1-029e912a0c25" "Review: Gate City Oktoberfest contact"
          check_followup "26fe38db-b8b4-48e0-a8ec-27f79e6abdc0" "Review: Afro Utah Festival relationship"
          check_followup "44fa5132-36e9-4ffc-9ba6-735b3cc36530" "Review: Bear Lake Fall Market Days"
          check_followup "e12e45e6-6f0a-4534-bf44-30f97d026c58" "Review: Pyramid Lake powwow 2026"
          check_followup "9b7cde0c-d6d9-4830-9cae-bce86937d1cf" "Review: Roam Fest 2026"
          check_followup "54954a3b-f059-46bc-ac3b-3013e1c6fc34" "Review: San Luis Valley Intertribal Pow Wow"
          check_followup "2e29a96e-79e7-4351-a65f-48fcf2e51913" "Review: Sundown Music Festival 2026"

          echo "AUDIT_OK=26"
