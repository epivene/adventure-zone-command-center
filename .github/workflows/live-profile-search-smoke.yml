name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Week 4 batch 2 profile screen
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/events.txt <<'EOF'
          County Fair - Lewis (Nezperce) ID
          Crested Butte ARTumn Festival (Crested Butte) CO
          Durango Cowboy Poetry Gathering (Durango) CO
          End of the Trail Kite Festival (Pine Bluffs) WY
          Estes Park Autumn Gold (Estes Park, CO)
          Ferrari Farms Fall Festival (Reno) NV
          Founders Day (S SLC) UT
          Fruita Fall Festival (Fruita) CO
          Great Aardvark Embark Balloon Launch (Greeley) CO
          Handmade in Colorado Expo (Glenwood Springs) CO
          Handmade in Colorado Expo Cherry Creek (Denver) CO
          EOF
          while IFS= read -r Q; do
            echo "=== QUERY: $Q ==="
            RESP=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" --get --data-urlencode "q=${Q}" "${BASE}/api/assistant-import/profile-search")
            echo "$RESP" | jq -c '.results'
            ID=$(echo "$RESP" | jq -r '[.results[] | select(.kind=="organization")][0].id // empty')
            if [ -n "$ID" ]; then
              echo "=== HISTORY: ${ID} ==="
              curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" "${BASE}/api/assistant-import/profile-history/${ID}" | jq -c '{profileId,place,contacts,bookings,followUps,notes,history}'
            fi
            echo
          done < /tmp/events.txt
