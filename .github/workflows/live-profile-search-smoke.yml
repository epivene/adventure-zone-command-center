name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Desiree task queue and create first held task
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          for ASSIGNEE in "Desiree Conklin" "Desiree" "Desiree C"; do
            echo "Trying ${ASSIGNEE}"
            BODY=$(ASSIGNEE="$ASSIGNEE" python3 - <<'PY'
          import json, os
          print(json.dumps({
            "assignee": os.environ["ASSIGNEE"],
            "taskType": "research_update",
            "title": "Review lead: Silver Threads Quilt Show",
            "instructions": "The Silver Threads Quilt Show is not scheduled for 2026. The organizer states the biennial show will return in 2027. Hold 2026 outreach and revisit this lead for the 2027 show instead.",
            "organizationId": "2d158aad-f3a4-4226-b334-42eb84769999",
            "contactId": None,
            "dueAt": "2026-09-01T09:00:00-06:00"
          }))
          PY
          )
            HTTP=$(curl --silent --show-error -o /tmp/task.json -w "%{http_code}" \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST "${BASE}/api/assistant-import/office-tasks" \
              --data-binary "${BODY}")
            cat /tmp/task.json; echo
            if [ "$HTTP" = "201" ]; then echo "TASK_OWNER=${ASSIGNEE}"; exit 0; fi
            if [ "$HTTP" != "404" ]; then exit 1; fi
          done
          exit 2
