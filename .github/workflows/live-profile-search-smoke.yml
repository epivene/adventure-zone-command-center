name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Finalize Week 4 batch 3 CRM outcomes
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          add_note() {
            ID="$1"; SUBJECT="$2"; BODY="$3"
            P=$(jq -n --arg id "$ID" --arg subject "$SUBJECT" --arg body "$BODY" '{organizationId:$id,subject:$subject,body:$body}')
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/profile-notes" --data-binary "$P"; echo
          }
          add_followup() {
            ID="$1"; LABEL="$2"; REASON="$3"
            P=$(jq -n --arg id "$ID" --arg label "$LABEL" --arg reason "$REASON" '{organizationId:$id,label:$label,reason:$reason,dueAt:"2026-09-01T09:00:00-06:00"}')
            curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/today-followups" --data-binary "$P"; echo
          }

          # Create missing Harvest Lantern profile and record draft.
          HP=$(cat <<'JSON'
          {"event":{"id":null,"name":"Harvest Lantern Festival","city":"Pocatello","region":"ID"},"profile":{"placeType":"festival_event","description":"","phone":"208-478-1818","website":"https://www.harvestlanternfestival.com/","address1":"2375 Olympus Dr","address2":"Portneuf Wellness Complex","postalCode":"83201"},"contacts":[{"id":null,"name":"Harvest Lantern Festival","phone":"208-478-1818","email":"Harvestlanternfestival@gmail.com","role":"Festival contact","primary":true}],"booking":{"enabled":false,"name":"","status":"new_lead","startsAt":"","endsAt":"","nextActionKind":"","nextActionDueAt":"","travelLegId":null},"familyId":null,"parentOrganizationId":null}
          JSON
          )
          HRESP=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" -H "Content-Type: application/json" -X POST "${BASE}/api/assistant-import/event-profiles" --data-binary "$HP")
          echo "$HRESP"
          HID=$(echo "$HRESP" | jq -r '.profileId')
          add_note "$HID" "2026 outreach draft prepared" "Harvest Lantern Festival is confirmed for Sept. 26, 2026 from 4-9:30 p.m. at Portneuf Wellness Complex. Current official contact is Harvestlanternfestival@gmail.com / 208-478-1818. A normal family-event outreach draft was prepared after the live booking calendar showed no package conflicts."

          add_note "e22782ee-f620-4253-ae53-e4198acac920" "2026 outreach draft prepared" "Lattin Farms Fall Festival runs Fridays and Saturdays beginning Sept. 26 through Oct. 31, 2026. The farm already has a corn maze, hay rides, zip lines, jump pad, games and other attractions, so the draft offers Adventure Zone as a larger selected-weekend feature rather than duplicating the permanent activity mix. Current contact is farmer@lattinfarms.com / 775-867-3750."
          add_note "d3d8de0f-bab3-47d5-9f11-23a732d8c513" "2026 follow-up draft prepared" "Adventure Zone already emailed Morrison Ciderfest in March 2026. The event is confirmed for Sept. 26 and already includes bounce houses/family activities, so a follow-up draft was prepared asking whether they would consider expanding into a larger staffed attraction area."
          add_note "036b0c0d-8129-4eb8-9f4d-b197282bae8a" "2026 outreach draft prepared" "Colorado Springs Oktoberfest is confirmed for Sept. 25-27, 2026. Current organizer contact is Carol O'Donnell at Carol@ODonnell2.com / 719-635-8803. A normal outreach draft was prepared using a separate attraction-zone angle alongside the German food, drink, music and cultural programming."
          add_note "3c67966e-285b-440c-ac9b-5adeb9caa1b6" "2026 follow-up draft prepared" "Adventure Zone already emailed Alaina Bobo in May 2026. Parker Fall Fest is confirmed for Sept. 26 and already includes carnival games and an inflatable corn maze. A follow-up draft was prepared asking whether they would consider expanding the inflatable/attraction side through a larger staffed area or sponsorship partnership."
          add_note "bab5e4ce-4ae2-43f2-8a9f-b4ddeab3e04a" "2026 outreach draft prepared" "Pikes Peak Regional Airshow is confirmed for Sept. 19-20, 2026. Official materials describe a family-friendly event with vendors, exhibits, static displays and kid activities; current general contact is info@thesportscorp.org. A draft was prepared proposing a separate family attraction area between flying portions of the show."

          add_note "90988838-b5d0-4487-92b8-29b50b2bb047" "2026 outreach hold - current event date not verified" "The current Hops Drops website still displays prior-year event information rather than an authoritative 2026 date. Adult/alcohol focus alone is not a disqualifier, but the 2026 event must be verified before outreach."
          add_followup "90988838-b5d0-4487-92b8-29b50b2bb047" "Review: Hops Drops 2026" "Verify whether Hops Drops Evergreen Music & Beer Festival is officially scheduled in 2026 and confirm the current organizer/contact before outreach."

          add_note "4dd35411-5413-49a9-9811-0335bc699d75" "2026 fit hold - separate attraction area needs organizer approval" "Last Chance Community Pow Wow is confirmed for Sept. 25-27, 2026 in the Lewis & Clark Fairgrounds Exhibit Hall. Because the core event is culturally focused and indoors, do not assume a full inflatable package fits. Current contact remains lccpw@hotmail.com / 406-439-5631. Review whether a separate outdoor family/youth attraction area would be appropriate before outreach."
          add_followup "4dd35411-5413-49a9-9811-0335bc699d75" "Review: Last Chance Community Pow Wow" "Decide whether to approach the organizer about a separate outdoor family/youth attraction area. The 2026 powwow is confirmed but the main program is culturally focused and held inside the fairgrounds exhibit hall."

          add_note "3e9b69ad-655c-4634-9386-b617c5402944" "2026 outreach hold - current rodeo dates need confirmation" "Adventure Zone emailed Mineral County Rodeo in February 2026 using Sept. 25-26 dates, but the organizer's current public page still displays prior-year dates. Do not send another message until the 2026 rodeo dates are independently confirmed."
          add_followup "3e9b69ad-655c-4634-9386-b617c5402944" "Review: Mineral County Rodeo 2026" "Confirm the official 2026 rodeo dates before following up on Amy's February outreach."

          add_note "308c657d-4220-43a1-abf3-0a5949aa4eb1" "2026 outreach hold - current Oktoberfest not verified" "A current official 2026 Snow Mountain Brewery/Saratoga Oktoberfest date was not verified during Week 4 review. Do not infer the date from older listings."
          add_followup "308c657d-4220-43a1-abf3-0a5949aa4eb1" "Review: Saratoga Oktoberfest 2026" "Verify the current 2026 Snow Mountain Brewery Oktoberfest date and organizer/contact before outreach."

          add_note "2d738070-f4a6-46d4-9eb1-029e912a0c25" "2026 outreach hold - adult event contact needed" "Gate City Oktoberfest is confirmed for Sept. 26, 2026 at Lookout Point and is a beer/cider tasting event. Adult-only status is not a barrier: Adventure Zone can configure the inflatables together as a large adult obstacle-course experience. The official site publishes a contact form and phone 208-233-1525 but no direct event email, so hold until the correct sponsorship/organizer email is verified."
          add_followup "2d738070-f4a6-46d4-9eb1-029e912a0c25" "Review: Gate City Oktoberfest contact" "Find the current direct sponsorship/organizer email for the Sept. 26 Gate City Oktoberfest, then consider pitching the special adult obstacle-course setup."

          add_note "b3a647f6-c3f3-4bff-a322-4334d8f63a44" "2026 review - professional summit / structural non-fit" "Jackson Wild's 2026 summit is a professional nature-media/industry gathering rather than a public family festival. A full staffed inflatable package is structurally incompatible with the current event format, so no outreach draft was created."
          add_note "9c4e8f6e-b721-413b-99eb-c34ab7c1b632" "2026 review - educational indoor fair / structural non-fit" "Loveland Stone Age Fair is an indoor archaeology and cultural-education fair at the McKee 4-H Youth & Community Building. A full outdoor inflatable carnival package does not fit the current event format; no 2026 draft created."
          add_note "a866797a-6b2e-44f6-831c-00084bdc9671" "2026 review - sale event, not entertainment festival" "Post Cereal Sale is a retail/community sale listing rather than an entertainment event with a demonstrated need for a staffed attraction area. No outreach draft created."
