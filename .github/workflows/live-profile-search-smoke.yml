name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Week 4 batch 3 profile screen
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/events.txt <<'EOF'
          Harvest Lantern Festival (Pocatello) ID
          Hops Drops The Evergreen Music & Beer Festival (Evergreen) CO
          Jackson Wild (Jackson) WY
          Last Chance Community Powwow (Helena) MT
          Lattin Farms Fall Festival (Fallon) NV
          Loveland Stone Age Fair (Loveland) CO
          Mineral County Rodeo (Hawthorne) NV
          Morrison Ciderfest (Morrison) CO
          Oktoberfest - Snow Mountain Brewery (Saratoga) WY
          Oktoberfest (Colorado Springs) CO
          Oktoberfest (Pocatello) ID
          Palisade Art Festival (Palisade) CO
          Parker Fall Festival (Parker) CO
          Pikes Peak Regional Airshow (CO Springs) CO
          Post Cereal Sale (Tremonton) UT
          EOF
          while IFS= read -r Q; do
            echo "=== QUERY: $Q ==="
            RESP=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" --get --data-urlencode "q=${Q}" "${BASE}/api/assistant-import/profile-search")
            echo "$RESP" | jq -c '.results'
            ID=$(echo "$RESP" | jq -r '[.results[] | select(.kind=="organization")][0].id // empty')
            if [ -n "$ID" ]; then
              echo "=== HISTORY: ${ID} ==="
              curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" "${BASE}/api/assistant-import/profile-history/${ID}" | jq -c '{profileId,place,contacts,bookings,followUps,notes,history}'
            fi
            echo
          done < /tmp/events.txt
