name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Read alternate-name profile history
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          IDS=(
            "A Blast on the Grass|6e537d3e-01e2-482a-a02e-a842a78ba72b"
            "Grant County Fair NM|2c3dfcd7-fb16-4995-8048-bf576fa01c25"
            "Otero County Fair NM|af71ea65-ef9f-4abe-bf11-5ecf084b3409"
          )
          for ENTRY in "${IDS[@]}"; do
            NAME="${ENTRY%%|*}"
            ID="${ENTRY##*|}"
            echo "=== HISTORY: ${NAME} ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              "${BASE}/api/assistant-import/profile-history/${ID}"
            echo
          done
