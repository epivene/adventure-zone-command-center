name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live profile notes and calls
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          for ID in \
            "0b0f8457-7c18-477e-a0e9-44ae5bd7e892" \
            "1098a2b0-5d27-4121-bc93-b3672c528162" \
            "9f7ce3bd-249a-435c-abfd-97f2762e2122"
          do
            echo "=== PROFILE: $ID ==="
            curl --fail-with-body --silent --show-error \
              "${BASE}/api/event-profiles/${ID}"
            echo
          done
