name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check live assistant profile search
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ASSISTANT_IMPORT_TOKEN:-}" ]; then
            echo "ASSISTANT_IMPORT_TOKEN_MISSING"
            exit 2
          fi
          BASE="https://adventure-zone-api.onrender.com"
          for Q in \
            "Saguache Fall Festival & Quilt Show" \
            "Higher Ground Fair" \
            "Experience Rexburg" \
            "Durango Autumn Arts Festival" \
            "Santa Cruz County Fair" \
            "Cruisin' the Canyon Car Show" \
            "Breck Film Fest" \
            "Cochise County Fair" \
            "Colorado Highland Games" \
            "Holly Gateway Fair"
          do
            echo "=== QUERY: $Q ==="
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search"
            echo
          done
