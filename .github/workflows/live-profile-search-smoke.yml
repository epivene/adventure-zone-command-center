name: Live Profile Search Smoke
on:
  push:
    branches: [live-profile-search-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check alternate profile names for unmatched drafts
        env:
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE="https://adventure-zone-command-center.onrender.com"
          cat > /tmp/queries.txt <<'EOF'
          Springs Home Show Colorado Springs
          Colorado Springs Home Show
          Nationwide Expos Colorado Springs
          Blast on the Grass Hagerman
          Hagerman Blast Grass
          Gateway Fair Holly
          Holly Fair
          County Fair Cochise
          Cochise Fair Douglas
          County Fair Santa Cruz
          Santa Cruz Fair Sonoita
          Sonoita Fair
          EOF
          while IFS= read -r Q; do
            [ -z "$Q" ] && continue
            RESP=$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}" \
              --get --data-urlencode "q=${Q}" \
              "${BASE}/api/assistant-import/profile-search")
            echo "=== ${Q} ==="
            printf '%s' "$RESP" | jq -c '.results'
          done < /tmp/queries.txt
