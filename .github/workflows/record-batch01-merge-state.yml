name: Record blank profile batch 01 merge state

on:
  push:
    branches:
      - research/blank-profiles-batch-02
    paths:
      - ".github/workflows/record-batch01-merge-state.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/blank-profiles-batch-02
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for batch 01 to merge
        run: |
          set -euo pipefail
          mkdir -p docs/operations/receipts
          for attempt in $(seq 1 80); do
            JSON=$(gh pr list \
              --head research/blank-profiles-batch-01 \
              --base main \
              --state merged \
              --json number,state,mergedAt,mergeCommit,url \
              --limit 1)
            if [ "$(printf '%s' "$JSON" | jq 'length')" -eq 1 ]; then
              printf '%s\n' "$JSON" | jq '.[0] + {verifiedAt: (now | todateiso8601)}' \
                > docs/operations/receipts/blank-profile-batch-01-merge.json
              break
            fi
            if [ "$attempt" -eq 80 ]; then
              echo "Batch 01 did not reach merged state in time."
              exit 1
            fi
            sleep 15
          done
      - name: Commit receipt to batch 02 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/operations/receipts/blank-profile-batch-01-merge.json
          git commit -m "docs: record blank profile batch 01 merge" || exit 0
          git push origin HEAD:research/blank-profiles-batch-02
