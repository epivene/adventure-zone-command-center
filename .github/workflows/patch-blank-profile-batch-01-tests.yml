name: Patch blank profile batch 01 test isolation

on:
  push:
    branches:
      - research/blank-profiles-batch-01
    paths:
      - ".github/workflows/patch-blank-profile-batch-01-tests.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/blank-profiles-batch-01
      - name: Mock batch maintenance in startup-import unit tests
        run: |
          python <<'PY'
          from pathlib import Path

          paths = [
              Path("artifacts/api-server/src/features/approved-profile-import/startup-import.test.ts"),
              Path("artifacts/api-server/src/features/approved-profile-import/startup-import-batch.test.ts"),
          ]
          block = '''\nvi.mock("../organizations/blank-profile-batch-01", () => ({\n  applyBlankProfileBatch01: vi.fn().mockResolvedValue({\n    merged: [],\n    alreadyMerged: [],\n    renamed: [],\n    alreadyCurrent: [],\n    skipped: [],\n  }),\n}));\n'''
          marker = '''vi.mock("node:fs/promises", () => ({\n  readdir: vi.fn(),\n  readFile: vi.fn(),\n}));\n'''
          for path in paths:
              text = path.read_text()
              if block.strip() in text:
                  continue
              if marker not in text:
                  raise SystemExit(f"Could not find fs mock in {path}")
              path.write_text(text.replace(marker, marker + block, 1))
          PY
      - name: Commit test isolation patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/approved-profile-import/startup-import.test.ts \
                  artifacts/api-server/src/features/approved-profile-import/startup-import-batch.test.ts
          git commit -m "test: isolate blank profile startup maintenance"
          git push origin HEAD:research/blank-profiles-batch-01
