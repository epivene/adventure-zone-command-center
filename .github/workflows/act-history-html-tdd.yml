name: ACT History HTML TDD

on:
  push:
    branches:
      - fix/act-history-html-text
  pull_request:
    branches:
      - main
    paths:
      - "artifacts/adventure-zone/src/components/activities/**"
      - "artifacts/api-server/src/features/act-recovery/**"
      - "artifacts/api-server/src/features/act-replacement/normalizers/**"
      - ".github/workflows/act-history-html-tdd.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: ACT history HTML backend regression
        run: pnpm --filter @workspace/api-server exec vitest run src/features/act-recovery/timeline-html-normalization.test.ts
      - name: ACT history HTML frontend regression
        run: pnpm --filter @workspace/adventure-zone exec vitest run src/components/activities/activity-timeline-act-html.test.tsx
