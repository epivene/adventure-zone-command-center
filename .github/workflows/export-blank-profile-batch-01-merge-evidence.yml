name: Export blank profile batch 01 merge evidence

on:
  push:
    branches:
      - research/blank-profiles-batch-01
    paths:
      - ".github/workflows/export-blank-profile-batch-01-merge-evidence.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Export exact survivor histories
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const base = process.env.API_URL.replace(/\/$/, '') + '/api/assistant-import';
          const headers = { Authorization: `Bearer ${process.env.ASSISTANT_IMPORT_TOKEN}` };
          async function get(path) {
            const response = await fetch(`${base}/${path}`, { headers });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text }; }
            return { status: response.status, body };
          }
          (async () => {
            const ids = [
              '2d29adc2-5482-4d95-9e50-b60d4aae908c',
              'ad4cb1ee-7c19-4afc-9aac-159c8d9270cd',
              '0965cbf6-2396-42b9-89b8-666cd3150cda',
              '176889d4-b85a-40e9-ae93-f506687f26ff',
            ];
            const histories = {};
            for (const id of ids) histories[id] = await get(`profile-history/${id}`);
            fs.writeFileSync('blank-profile-batch-01-merge-evidence.json', JSON.stringify({
              capturedAt: new Date().toISOString(), histories,
            }, null, 2));
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: blank-profile-batch-01-merge-evidence
          path: blank-profile-batch-01-merge-evidence.json
          retention-days: 2
