name: Manager Password Input Red
on:
  push:
    branches: [fix/manager-password-input-crash]
jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Reproduce unsafe deferred event read
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('artifacts/adventure-zone/src/components/routes/travel-leg-editor.tsx','utf8');
          const unsafe = /setPasswords\(\(current\) => \(\{ \.\.\.current, \[leg\.id\]: event\.currentTarget\.value \}\)\)/.test(source);
          if (!unsafe) process.exit(0);
          console.error('Password onChange reads event.currentTarget from inside the deferred state updater');
          process.exit(1);
          NODE
