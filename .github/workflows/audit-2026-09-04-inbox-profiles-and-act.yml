name: Audit Sept 4 inbox profiles and ACT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-2026-09-04-inbox-profiles-and-act.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Audit live profiles and ACT status
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }
          node <<'NODE'
          const fs = require("node:fs");
          const base = process.env.API_URL.replace(/\/$/, "");
          const token = process.env.ASSISTANT_IMPORT_TOKEN;
          const targets = [
            ["Castle Rock Artfest","08a64711-ef24-4e42-865b-bcf5bc525665"],
            ["International Arts & Crafts Festival","1f474081-dfb5-4565-8ca5-e371f0805d23"],
            ["WYO-131 Biketoberfest Gravel Race","47a2421f-efbd-4abe-bc21-3123bb65f40f"],
            ["Rist Canyon Mountain Festival","09da8d99-b383-4328-b42b-7c057a65ea27"],
            ["Timpanogos Storytelling Festival","f8c3b2a1-5e7f-4db6-8663-6a5114d222fe"],
            ["Sheridan Celebrates","91761e7d-f23b-4c24-8ca8-207f845f3ec9"],
            ["Silverton Arts Festival","b427a3c6-04dd-4908-b37b-aef2e105847b"],
            ["Celebrate South Salt Lake","d7d3b5f5-1b32-4ced-a243-a82cc5c3989f"],
            ["Evanston Cowboy Days","c73ddb1a-8065-4978-b69c-9d6b325966e6"],
            ["Gaylord","849ce124-2037-4314-b830-8527b337a225"],
            ["Tomato Days","5acd56e4-f8b9-4cac-8660-42cbd1af3041"],
            ["Wagon Days","0be0ba16-c148-4a7b-8bc9-0704d4515b62"],
            ["Town of Langford","7a678287-6c31-41fb-bc1d-1754298a0581"],
            ["White Sulphur Springs Labor Day Rodeo","a7e364d7-b320-42ac-8306-f89ebf452ddd"],
            ["Colorado Springs Labor Day Lift Off","ed6c9f2b-ceea-48ca-ab3f-d4bdae91eb2f"],
            ["Northwest Montana Fair & Rodeo","fba0de3d-3b19-48bf-8d52-69bd5fe94866"],
            ["Joe Mama's Car Show","83eab446-ee96-466c-a192-90ba1896a164"],
            ["Spirit of Boise Balloon Classic","21e8367b-fa81-48d6-b388-3f49805f8c51"],
            ["Sounds of Thunder Mountain Pow Wow","53a6398c-7180-48d6-91e9-77b6e5201478"],
            ["Stone Age Stampede canonical","b453e452-4665-44a1-80b5-3d1c8a96d2f2"],
            ["Stone Age Stampede legacy","5f15c7f2-38e2-4b95-98cc-c277c389abd8"],
            ["Helper Arts Festival","3cb429e6-adae-4fc6-9481-cb7276c11679"],
            ["Blanding City Fall Festival","e00c8d3e-1265-4d0a-b80b-acc38abbae0f"]
          ];
          const searches = [
            "Great Reno Balloon Race","Boulder Art Festival","Green River Melon Days",
            "Jefferson County Fair Boulder Montana","San Juan County Fair",
            "Country Jam Colorado","Old South Gaylord"
          ];
          async function request(path, auth = true) {
            const response = await fetch(base + path, {
              headers: auth ? {Authorization: "Bearer " + token} : {}
            });
            const text = await response.text();
            let body; try { body = JSON.parse(text); } catch { body = {raw:text.slice(0,1000)}; }
            return {status:response.status, ok:response.ok, body};
          }
          (async () => {
            const profiles = [];
            for (const [label,id] of targets) {
              profiles.push({label,id,...await request("/api/assistant-import/profile-history/"+id)});
            }
            const searchResults = [];
            for (const query of searches) {
              searchResults.push({query,...await request("/api/assistant-import/profile-search?q="+encodeURIComponent(query)+"&limit=20")});
            }
            const actMigration = await request("/api/migration/act/status/latest");
            const actRecovery = await request("/api/act-recovery/status");
            const result = {generatedAt:new Date().toISOString(),profiles,searchResults,actMigration,actRecovery};
            fs.writeFileSync("sept-4-inbox-profiles-act-audit.json", JSON.stringify(result,null,2));
            const okProfiles = profiles.filter(x=>x.ok).length;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "# Sept. 4 inbox profile and ACT audit\n\n"+
              "- Profile histories loaded: "+okProfiles+"/"+profiles.length+"\n"+
              "- Profile searches completed: "+searchResults.filter(x=>x.ok).length+"/"+searchResults.length+"\n"+
              "- ACT migration status HTTP: "+actMigration.status+"\n"+
              "- ACT recovery status HTTP: "+actRecovery.status+"\n");
            if (okProfiles !== profiles.length) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Upload protected audit
        uses: actions/upload-artifact@v4
        with:
          name: sept-4-inbox-profiles-act-audit
          path: sept-4-inbox-profiles-act-audit.json
          retention-days: 7
