name: Add Gmail sweep context refresh regression test

on:
  push:
    branches:
      - fix/gmail-profile-history-audit-current
    paths:
      - ".github/workflows/add-gmail-sweep-refresh-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-profile-history-audit-current
          fetch-depth: 0
      - name: Add regression test before implementation
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts')
          text = path.read_text()
          marker = '  it("is read-only when repair is false", async () => {\n'
          test = '''  it("reloads profile evidence for each sweep run", async () => {\n    const messages = [message({\n      id: "fresh-profile-message",\n      dateMs: Date.UTC(2026, 7, 1),\n      subject: "Newly created event profile",\n    })];\n    const repository = new FakeRepository();\n    let factoryCalls = 0;\n    const service = new GoogleSentProfileLinkSweepService({\n      connection: { createReadClient: async () => client(messages) },\n      repository,\n      classifierFactory: () => {\n        factoryCalls += 1;\n        return classifier({\n          "fresh-profile-message": {\n            outcome: "attached",\n            organization: {\n              id: `org-run-${factoryCalls}`,\n              name: `Current profile ${factoryCalls}`,\n            },\n            evidenceCodes: ["fresh_profile_context"],\n          },\n        });\n      },\n    });\n\n    const window = {\n      after: new Date(Date.UTC(2026, 0, 1)),\n      before: new Date(Date.UTC(2027, 0, 1)),\n      repair: true,\n    } as const;\n    await service.run(window);\n    await service.run(window);\n\n    expect(factoryCalls).toBe(2);\n    expect(repository.linked.map((row) => row.organizationId)).toEqual([\n      "org-run-1",\n      "org-run-2",\n    ]);\n  });\n\n'''
          if 'reloads profile evidence for each sweep run' not in text:
              if marker not in text:
                  raise SystemExit('Insertion marker not found')
              path.write_text(text.replace(marker, test + marker))
          Path('.github/workflows/add-gmail-sweep-refresh-test.yml').unlink()
          PY
      - name: Commit test only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/features/google-workspace/google-sent-profile-link-sweep-service.test.ts .github/workflows/add-gmail-sweep-refresh-test.yml
          git commit -m "test: require fresh Gmail profile evidence per sweep"
          git push origin HEAD:fix/gmail-profile-history-audit-current
