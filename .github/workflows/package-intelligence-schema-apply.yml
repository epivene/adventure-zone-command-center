name: Apply Package Intelligence Schema Patch

on:
  push:
    branches: [feature/package-intelligence]
    paths:
      - "scripts/apply-package-intelligence-schema.py"
      - ".github/workflows/package-intelligence-schema-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/package-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/apply-package-intelligence-schema.py
      - name: Commit generated schema changes
        run: |
          if git diff --quiet; then
            echo "No schema changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/db/src/schema/index.ts lib/db/src/migrations.ts
          git commit -m "feat: wire package intelligence schema"
          git push origin HEAD:feature/package-intelligence
