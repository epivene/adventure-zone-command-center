name: Apply assistant Lead Scout narrowing

on:
  push:
    branches:
      - fix/assistant-lead-scout-narrowing
    paths:
      - ".github/workflows/apply-assistant-lead-scout-narrowing.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-lead-scout-narrowing
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm Lead Scout discovery narrowing is present
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('artifacts/api-server/src/routes/assistant.ts').read_text()
          expected = 'if (!("crmMatches" in discovery)) {'
          if expected not in text:
              raise SystemExit('assistant Lead Scout narrowing is missing')
          PY
      - name: Run focused Lead Scout service tests
        run: pnpm --filter @workspace/api-server exec vitest run src/features/assistant/lead-scout-service.test.ts
      - name: Build/typecheck shared libraries
        run: pnpm run typecheck:libs
      - name: Verify assistant route compiler error is gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'src/routes/assistant\.ts\(12[23],' /tmp/api-typecheck.log; then
            echo 'Assistant Lead Scout narrowing errors remain.' >&2
            exit 1
          fi
