name: Verify live blank profile batch 02

on:
  push:
    branches:
      - verify/blank-profile-batch-02-live
    paths:
      - ".github/workflows/verify-live-blank-profile-batch-02.yml"

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check protected live configuration
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          test -n "${API_URL}" || { echo "ADVENTURE_ZONE_API_URL is not configured"; exit 1; }
          test -n "${ASSISTANT_IMPORT_TOKEN}" || { echo "ASSISTANT_IMPORT_TOKEN is not configured"; exit 1; }

      - name: Wait for the deployed app to apply and verify all 25 records
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
          MERGED_COMMIT: 3efc693665c7c3e2c569bcfd7112f240a8e685ce
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const sourceDir = 'imports/approved-profiles';
          const sourceFiles = fs.readdirSync(sourceDir)
            .filter((name) => /^blank-profile-batch-02-part-\d+\.json$/.test(name))
            .sort();
          const payloads = sourceFiles.flatMap((name) => {
            const value = JSON.parse(fs.readFileSync(path.join(sourceDir, name), 'utf8'));
            if (!Array.isArray(value)) throw new Error(`${name} must contain an array.`);
            return value;
          });

          if (payloads.length !== 25) {
            throw new Error(`Expected 25 batch-02 profiles, found ${payloads.length}.`);
          }
          const uniqueIds = new Set(payloads.map((payload) => payload.event?.id));
          if (uniqueIds.size !== 25 || uniqueIds.has(undefined) || uniqueIds.has(null)) {
            throw new Error('Batch-02 payload IDs are missing or duplicated.');
          }

          const baseUrl = process.env.API_URL.replace(/\/$/, '') + '/api/assistant-import';
          const headers = { Authorization: `Bearer ${process.env.ASSISTANT_IMPORT_TOKEN}` };
          const expectedNoteSubject = 'Blank profile batch 02 research - 2026-08-31';

          const normalizePhone = (value) => {
            const digits = String(value || '').replace(/\D/g, '');
            return digits.length === 11 && digits.startsWith('1') ? digits.slice(1) : digits;
          };

          async function getJson(route) {
            const response = await fetch(`${baseUrl}/${route}`, { headers });
            let body = null;
            const raw = await response.text();
            try { body = JSON.parse(raw); } catch {}
            return { status: response.status, body, raw };
          }

          function verifyHistory(payload, response) {
            const failures = [];
            const history = response.body;
            const expectedEvent = payload.event || {};
            const expectedProfile = payload.profile || {};

            if (response.status !== 200 || history?.ok !== true) {
              return [`profile-history returned HTTP ${response.status}`];
            }
            const place = history.place || {};
            const expectedCity = String(expectedEvent.city || '').trim() || null;
            const expectedRegion = String(expectedEvent.region || '').trim().toUpperCase() || null;
            if (place.id !== expectedEvent.id) failures.push('profile ID mismatch');
            if (place.name !== expectedEvent.name) failures.push(`name is ${JSON.stringify(place.name)}`);
            if ((place.city || null) !== expectedCity) failures.push(`city is ${JSON.stringify(place.city)}`);
            if ((place.region || null) !== expectedRegion) failures.push(`region is ${JSON.stringify(place.region)}`);

            for (const [key, expectedValue] of [
              ['placeType', expectedProfile.placeType],
              ['phone', expectedProfile.phone],
              ['website', expectedProfile.website],
              ['address1', expectedProfile.address1],
              ['address2', expectedProfile.address2],
              ['postalCode', expectedProfile.postalCode],
            ]) {
              const expected = typeof expectedValue === 'string' && expectedValue.trim()
                ? expectedValue.trim()
                : null;
              if ((place[key] || null) !== expected) {
                failures.push(`${key} is ${JSON.stringify(place[key])}`);
              }
            }

            const notes = Array.isArray(history.notes) ? history.notes : [];
            const expectedNote = (payload.notes || []).find((note) => note.subject === expectedNoteSubject);
            if (!expectedNote) {
              failures.push('reviewed batch note is missing from payload');
            } else if (!notes.some((note) =>
              note.subject === expectedNote.subject && note.body === expectedNote.body
            )) {
              failures.push('exact reviewed batch note is not live');
            }

            const contacts = Array.isArray(history.contacts) ? history.contacts : [];
            for (const expectedContact of payload.contacts || []) {
              const matched = contacts.some((contact) => {
                const emailMatches = expectedContact.email
                  ? String(contact.email || '').toLowerCase() === String(expectedContact.email).toLowerCase()
                  : true;
                const phoneMatches = expectedContact.phone
                  ? normalizePhone(contact.phone) === normalizePhone(expectedContact.phone)
                  : true;
                const nameMatches = String(contact.name || '').trim() === String(expectedContact.name || '').trim();
                return emailMatches && phoneMatches && nameMatches;
              });
              if (!matched) failures.push(`contact ${expectedContact.name} is not live`);
            }

            const followUps = Array.isArray(history.followUps) ? history.followUps : [];
            for (const expectedFollowUp of payload.followUps || []) {
              const matched = followUps.some((followUp) =>
                followUp.kind === expectedFollowUp.label
                && followUp.dueAt === expectedFollowUp.dueAt
                && !followUp.completedAt
              );
              if (!matched) failures.push(`follow-up ${expectedFollowUp.label} is not open/live`);
            }

            return failures;
          }

          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));
          let finalHistories = null;
          let finalFailures = null;

          for (let attempt = 1; attempt <= 80; attempt += 1) {
            const histories = await Promise.all(payloads.map((payload) =>
              getJson(`profile-history/${encodeURIComponent(payload.event.id)}`)
            ));
            const failures = payloads.flatMap((payload, index) => {
              const reasons = verifyHistory(payload, histories[index]);
              return reasons.map((reason) => ({
                id: payload.event.id,
                name: payload.event.name,
                reason,
              }));
            });

            if (failures.length === 0) {
              finalHistories = histories;
              finalFailures = [];
              console.log(`All 25 live profiles verified on attempt ${attempt}.`);
              break;
            }

            finalFailures = failures;
            const byProfile = new Set(failures.map((failure) => failure.id)).size;
            console.log(`Attempt ${attempt}: ${byProfile} profiles are not fully applied yet.`);
            if (attempt < 80) await sleep(15000);
          }

          if (!finalHistories || finalFailures?.length) {
            fs.writeFileSync('batch-02-live-verification-failures.json', JSON.stringify({
              checkedAt: new Date().toISOString(),
              mergedCommit: process.env.MERGED_COMMIT,
              failures: finalFailures,
            }, null, 2));
            throw new Error(`Live batch-02 verification did not converge; ${finalFailures?.length || 0} checks remain.`);
          }

          const auditResponse = await getJson('profile-integrity-audit');
          if (auditResponse.status !== 200 || auditResponse.body?.ok !== true) {
            throw new Error(`Profile-integrity audit returned HTTP ${auditResponse.status}.`);
          }
          const audit = auditResponse.body;
          const batchIds = new Set(payloads.map((payload) => payload.event.id));
          const blankActBacked = (audit.profiles || []).filter((profile) =>
            profile.actRecordId
            && Number(profile.contactCount || 0) === 0
            && Number(profile.appearanceCount || 0) === 0
            && Number(profile.timelineCount || 0) === 0
            && Number(profile.openFollowUpCount || 0) === 0
            && Number(profile.gmailThreadCount || 0) === 0
            && Number(profile.calendarLinkCount || 0) === 0
          );
          const stillBlank = blankActBacked.filter((profile) => batchIds.has(profile.id));
          if (stillBlank.length > 0) {
            throw new Error(`${stillBlank.length} batch-02 profiles still qualify as blank in the live audit.`);
          }

          const expectedContactCount = payloads.reduce(
            (sum, payload) => sum + (Array.isArray(payload.contacts) ? payload.contacts.length : 0),
            0,
          );
          const expectedFollowUpCount = payloads.reduce(
            (sum, payload) => sum + (Array.isArray(payload.followUps) ? payload.followUps.length : 0),
            0,
          );
          const verifiedContactCount = payloads.reduce((sum, payload, index) => {
            const history = finalHistories[index].body;
            return sum + (payload.contacts || []).filter((expectedContact) =>
              (history.contacts || []).some((contact) => {
                const emailMatches = expectedContact.email
                  ? String(contact.email || '').toLowerCase() === String(expectedContact.email).toLowerCase()
                  : true;
                const phoneMatches = expectedContact.phone
                  ? normalizePhone(contact.phone) === normalizePhone(expectedContact.phone)
                  : true;
                return emailMatches
                  && phoneMatches
                  && String(contact.name || '').trim() === String(expectedContact.name || '').trim();
              })
            ).length;
          }, 0);
          const verifiedFollowUpCount = payloads.reduce((sum, payload, index) => {
            const history = finalHistories[index].body;
            return sum + (payload.followUps || []).filter((expectedFollowUp) =>
              (history.followUps || []).some((followUp) =>
                followUp.kind === expectedFollowUp.label
                && followUp.dueAt === expectedFollowUp.dueAt
                && !followUp.completedAt
              )
            ).length;
          }, 0);

          const summary = {
            ok: true,
            verifiedAt: new Date().toISOString(),
            mergedCommit: process.env.MERGED_COMMIT,
            auditGeneratedAt: audit.generatedAt,
            profileCount: payloads.length,
            reviewedNoteCount: payloads.length,
            expectedContactCount,
            verifiedContactCount,
            expectedFollowUpCount,
            verifiedFollowUpCount,
            intentionalNoFollowUpCount: payloads.filter((payload) =>
              !Array.isArray(payload.followUps) || payload.followUps.length === 0
            ).length,
            liveBlankActBackedCountAfter: blankActBacked.length,
            batchProfilesStillBlank: 0,
            profiles: payloads.map((payload, index) => ({
              id: payload.event.id,
              name: finalHistories[index].body.place.name,
              city: finalHistories[index].body.place.city,
              region: finalHistories[index].body.place.region,
              contactCount: (finalHistories[index].body.contacts || []).length,
              noteCount: (finalHistories[index].body.notes || []).length,
              openFollowUpCount: (finalHistories[index].body.followUps || []).filter((item) => !item.completedAt).length,
            })),
          };
          fs.writeFileSync('batch-02-live-verification.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          NODE

      - name: Upload sanitized live verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-02-live-verification
          path: |
            batch-02-live-verification.json
            batch-02-live-verification-failures.json
          if-no-files-found: ignore
          retention-days: 2
