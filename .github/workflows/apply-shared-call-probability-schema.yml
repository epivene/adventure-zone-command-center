name: Apply shared call/probability schema sync

on:
  push:
    branches:
      - fix/shared-call-probability-schema
    paths:
      - ".github/workflows/apply-shared-call-probability-schema.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/shared-call-probability-schema
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync shared enum source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          schema = Path('lib/db/src/schema/index.ts')
          text = schema.read_text()
          text = text.replace(
              'const probabilityValues = ["likely","possible","unlikely"] as const;',
              'const probabilityValues = ["definite","likely","possible","unlikely"] as const;',
              1,
          )
          old = '''export const callDispositionValues = [\n  "no_answer",\n  "left_voicemail",\n  "follow_up_needed",\n  "interested",\n  "proposal_sent",\n  "booked",\n  "declined",\n  "last_resort",\n  "spoke_with_contact",\n  "wrong_number",\n  "do_not_call",\n] as const;'''
          new = '''export const callDispositionValues = [\n  "no_answer",\n  "left_voicemail",\n  "follow_up_needed",\n  "interested",\n  "proposal_sent",\n  "booked",\n  "declined",\n  "last_resort",\n  "spoke_with_contact",\n  "wrong_number",\n  "do_not_call",\n  "email_requested",\n] as const;'''
          if old not in text:
              raise SystemExit('callDispositionValues block not found')
          schema.write_text(text.replace(old, new, 1))

          for filename in [
              'artifacts/api-server/src/features/bookings/booking-types.ts',
              'artifacts/adventure-zone/src/features/bookings/booking-types.ts',
          ]:
              path = Path(filename)
              value = path.read_text()
              start = value.index('// The shared Drizzle schema still carries the legacy three-value static type.')
              end = value.index('>;', start) + 2
              replacement = 'export type Probability = (typeof probabilityValues)[number];'
              path.write_text(value[:start] + replacement + value[end:])
          PY
      - name: Run focused call tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/features/calls/call-email-request-outcome.test.ts
          src/features/calls/assisted-calling.integration.test.ts
      - name: Verify targeted type errors are gone
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          set -e
          if grep -E 'activity-repository\.ts\(366|call-repository\.ts\(365|call-service\.ts\(331|routes/calls\.ts\(159' /tmp/api-typecheck.log; then
            echo 'Targeted call/probability type errors remain.' >&2
            exit 1
          fi
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/db/src/schema/index.ts artifacts/api-server/src/features/bookings/booking-types.ts artifacts/adventure-zone/src/features/bookings/booking-types.ts
          git diff --cached --quiet || git commit -m "fix: sync call disposition and probability schema types"
          git push origin HEAD:fix/shared-call-probability-schema
