name: Apply Gmail profile integrity wiring

on:
  push:
    branches:
      - fix/gmail-profile-link-integrity
    paths:
      - ".github/workflows/apply-gmail-profile-integrity-wiring.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/gmail-profile-link-integrity
          fetch-depth: 0

      - name: Wire the protected route and startup repair
        run: |
          python <<'PY'
          from pathlib import Path

          app = Path('artifacts/api-server/src/app.ts')
          text = app.read_text()
          route_import = 'import assistantGmailProfileIntegrityRouter from "./routes/assistant-gmail-profile-integrity";'
          import_marker = 'import assistantProfileNotesRouter from "./routes/assistant-profile-notes";'
          if route_import not in text:
              if import_marker not in text:
                  raise SystemExit('assistant profile-notes import marker not found')
              text = text.replace(import_marker, import_marker + '\n' + route_import)
          mount = 'app.use("/api/assistant-import", assistantGmailProfileIntegrityRouter);'
          mount_marker = 'app.use("/api/assistant-import", assistantProfileNotesRouter);'
          if mount not in text:
              if mount_marker not in text:
                  raise SystemExit('assistant profile-notes mount marker not found')
              text = text.replace(mount_marker, mount_marker + '\n' + mount)
          app.write_text(text)

          index = Path('artifacts/api-server/src/index.ts')
          text = index.read_text()
          feature_import = 'import { repairGmailProfileIntegrity } from "./features/google-workspace/gmail-profile-integrity";'
          import_marker = 'import { autoConsolidateImportedLocationFamilies } from "./features/organizations/imported-location-family-consolidation";'
          if feature_import not in text:
              if import_marker not in text:
                  raise SystemExit('organization-consolidation import marker not found')
              text = text.replace(import_marker, import_marker + '\n' + feature_import)

          startup_marker = '  await runStartupStep("event leg lifecycle schema", ensureEventLegLifecycleSchema);\n'
          repair_block = '''  try {
            const gmailIntegrity = await runStartupStep(
              "sent Gmail profile integrity repair",
              repairGmailProfileIntegrity,
            );
            logger.info(
              gmailIntegrity,
              gmailIntegrity.audit.eligibleUnlinkedSentEmails === 0
                && gmailIntegrity.audit.retiredProfileReferences === 0
                ? "Sent Gmail profile integrity verified"
                : "Sent Gmail profile integrity requires review",
            );
          } catch (err) {
            logger.error(
              { err },
              "Sent Gmail profile integrity repair deferred; startup will continue",
            );
          }
          '''
          if repair_block not in text:
              if startup_marker not in text:
                  raise SystemExit('event lifecycle startup marker not found')
              text = text.replace(startup_marker, startup_marker + repair_block)
          index.write_text(text)

          Path('.github/workflows/apply-gmail-profile-integrity-wiring.yml').unlink()
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            artifacts/api-server/src/app.ts \
            artifacts/api-server/src/index.ts \
            .github/workflows/apply-gmail-profile-integrity-wiring.yml
          git commit -m "feat: run sent Gmail integrity repair at startup"
          git push origin HEAD:fix/gmail-profile-link-integrity
