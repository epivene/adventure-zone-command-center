name: Leg Manager Money Task 2
on:
  push:
    branches: [feature/leg-manager-money]

jobs:
  task2:
    if: "!contains(github.event.head_commit.message, '[skip money-task2]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: RED — finance repository scope/idempotency tests
        run: |
          cat > artifacts/api-server/src/features/leg-manager/finance-repository.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import { createFinanceMutation, type FinanceMutationStore } from "./finance-repository";

          function fakeStore(): FinanceMutationStore & { rows: any[] } {
            const rows:any[]=[];
            return {
              rows,
              async findByMutation(legId, kind, clientMutationId) { return rows.find(r=>r.legId===legId&&r.kind===kind&&r.clientMutationId===clientMutationId)??null; },
              async refsBelongToLeg(legId, refs) { return refs.tripId !== "trip-b" && refs.bookingId !== "booking-b" && refs.tripSegmentId !== "segment-b"; },
              async insert(kind, input) { const row={id:`row-${rows.length+1}`,kind,...input}; rows.push(row); return row; },
            };
          }

          describe("createFinanceMutation", () => {
            it("deduplicates the same expense mutation id", async () => {
              const store=fakeStore();
              const input={legId:"leg-a",clientMutationId:"00000000-0000-4000-8000-000000000001",tripId:"trip-a",bookingId:null,tripSegmentId:null,payload:{amountCents:5000}};
              const first=await createFinanceMutation(store,"expense",input);
              const second=await createFinanceMutation(store,"expense",input);
              expect(first.ok&&first.idempotent).toBe(false);
              expect(second.ok&&second.idempotent).toBe(true);
              expect(store.rows).toHaveLength(1);
            });

            it("rejects references owned by a different leg", async () => {
              const store=fakeStore();
              const result=await createFinanceMutation(store,"expense",{legId:"leg-a",clientMutationId:"00000000-0000-4000-8000-000000000002",tripId:"trip-b",bookingId:null,tripSegmentId:null,payload:{amountCents:5000}});
              expect(result).toEqual({ok:false,error:"OUTSIDE_LEG"});
              expect(store.rows).toHaveLength(0);
            });
          });
          EOF
          set +e
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/finance-repository.test.ts > /tmp/red2.log 2>&1
          code=$?
          set -e
          cat /tmp/red2.log
          test "$code" -ne 0
      - name: GREEN — repository and finance endpoints
        run: |
          cat > artifacts/api-server/src/features/leg-manager/finance-repository.ts <<'EOF'
          import { and, eq, sql } from "drizzle-orm";
          import type { NodePgDatabase } from "drizzle-orm/node-postgres";
          import * as schema from "@/db/schema";
          import { bookings, legCashEntries, legEventIncome, legExpenses, legMileageEntries, tripSegments, trips } from "@/db/schema";
          import { calculateCashPosition, calculateSettlement } from "./finance-math";

          export type FinanceMutationKind="income"|"expense"|"cash"|"mileage";
          export type FinanceRefs={bookingId:string|null;tripId:string|null;tripSegmentId:string|null};
          export type FinanceMutationInput={legId:string;clientMutationId:string;bookingId:string|null;tripId:string|null;tripSegmentId:string|null;payload:Record<string,unknown>};
          export interface FinanceMutationStore {
            findByMutation(legId:string,kind:FinanceMutationKind,clientMutationId:string):Promise<any|null>;
            refsBelongToLeg(legId:string,refs:FinanceRefs):Promise<boolean>;
            insert(kind:FinanceMutationKind,input:FinanceMutationInput):Promise<any>;
          }
          export async function createFinanceMutation(store:FinanceMutationStore,kind:FinanceMutationKind,input:FinanceMutationInput){
            const existing=await store.findByMutation(input.legId,kind,input.clientMutationId);if(existing)return {ok:true as const,idempotent:true,row:existing};
            if(!(await store.refsBelongToLeg(input.legId,input)))return {ok:false as const,error:"OUTSIDE_LEG" as const};
            return {ok:true as const,idempotent:false,row:await store.insert(kind,input)};
          }

          export class DrizzleFinanceRepository implements FinanceMutationStore {
            constructor(private readonly database:NodePgDatabase<typeof schema>){}
            private table(kind:FinanceMutationKind){return kind==="income"?legEventIncome:kind==="expense"?legExpenses:kind==="cash"?legCashEntries:legMileageEntries;}
            async findByMutation(legId:string,kind:FinanceMutationKind,clientMutationId:string){const t:any=this.table(kind);const rows=await this.database.select().from(t).where(and(eq(t.legId,legId),eq(t.clientMutationId,clientMutationId))).limit(1);return rows[0]??null;}
            async refsBelongToLeg(legId:string,refs:FinanceRefs){
              if(refs.bookingId){const r=await this.database.select({id:bookings.id}).from(bookings).where(and(eq(bookings.id,refs.bookingId),eq(bookings.travelLegId,legId))).limit(1);if(!r[0])return false;}
              if(refs.tripId){const r=await this.database.select({id:trips.id}).from(trips).where(and(eq(trips.id,refs.tripId),eq(trips.travelLegId,legId))).limit(1);if(!r[0])return false;}
              if(refs.tripSegmentId){const r=await this.database.select({id:tripSegments.id}).from(tripSegments).innerJoin(trips,eq(trips.id,tripSegments.tripId)).where(and(eq(tripSegments.id,refs.tripSegmentId),eq(trips.travelLegId,legId))).limit(1);if(!r[0])return false;}
              return true;
            }
            async insert(kind:FinanceMutationKind,input:FinanceMutationInput){const t:any=this.table(kind);const values={legId:input.legId,bookingId:input.bookingId,tripId:input.tripId,tripSegmentId:input.tripSegmentId,clientMutationId:input.clientMutationId,...input.payload};const rows=await this.database.insert(t).values(values as any).onConflictDoNothing().returning();if(rows[0])return rows[0];const existing=await this.findByMutation(input.legId,kind,input.clientMutationId);if(!existing)throw new Error("Finance mutation insert conflict without existing row");return existing;}
            async summary(legId:string|null,tripId?:string|null){
              const where=(t:any)=>and(legId?eq(t.legId,legId):undefined,tripId?eq(t.tripId,tripId):undefined);
              const [income,expenses,cash,mileage]=await Promise.all([
                this.database.select().from(legEventIncome).where(where(legEventIncome)),
                this.database.select().from(legExpenses).where(where(legExpenses)),
                this.database.select().from(legCashEntries).where(where(legCashEntries)),
                this.database.select().from(legMileageEntries).where(where(legMileageEntries)),
              ]);
              const incomeTotalCents=income.reduce((n,r)=>n+r.cashCents+r.squareCents+r.otherCents,0);
              const expenseTotalCents=expenses.reduce((n,r)=>n+r.amountCents+r.taxCents,0);
              const settlementEffects:any[]=[];
              for(const e of expenses){if(e.paymentSource==="personal")settlementEffects.push({kind:"personal_expense",amountCents:e.amountCents+e.taxCents});else if(e.paymentSource==="adventure_zone_debit")settlementEffects.push({kind:"company_debit_expense",amountCents:e.amountCents+e.taxCents});}
              for(const c of cash)settlementEffects.push({kind:c.kind,amountCents:c.amountCents});
              return {incomeTotalCents,expenseTotalCents,cashPosition:calculateCashPosition(cash as any),settlement:calculateSettlement(settlementEffects),income,expenses,cash,mileage};
            }
          }
          EOF

          cat > artifacts/api-server/src/routes/leg-manager.ts <<'EOF'
          import { Router,type IRouter } from "express";
          import { db } from "@workspace/db";
          import { DrizzleLegManagerRepository } from "@/features/leg-manager/leg-manager-repository";
          import { createRequireLegManagerMiddleware } from "@/features/leg-manager/leg-manager-middleware";
          import { loadLegManagerDashboard } from "@/features/leg-manager/leg-manager-dashboard";
          import { DrizzleTripRepository } from "@/features/trips/trip-repository";
          import { DrizzleScheduleIssueRepository, scheduleIssueKinds } from "@/features/leg-manager/schedule-issue-repository";
          import { createFinanceMutation, DrizzleFinanceRepository, type FinanceMutationKind } from "@/features/leg-manager/finance-repository";
          import { legCashEntryKinds, legExpenseCategories, legPaymentSources } from "@/features/leg-manager/finance-types";
          import { z } from "zod";
          const router:IRouter=Router();const requireManager=createRequireLegManagerMiddleware(new DrizzleLegManagerRepository(db));const finance=new DrizzleFinanceRepository(db);
          async function data(req:any,res:any){const result=await loadLegManagerDashboard(new DrizzleTripRepository(db),req.legManager.legId);res.json(result);}
          router.get("/manager/dashboard",requireManager,data);router.get("/manager/route",requireManager,data);
          const refs={bookingId:z.string().uuid().nullable().optional(),tripId:z.string().uuid().nullable().optional(),tripSegmentId:z.string().uuid().nullable().optional(),clientMutationId:z.string().uuid()};
          const income=z.object({...refs,cashCents:z.number().int().nonnegative().default(0),squareCents:z.number().int().nonnegative().default(0),otherCents:z.number().int().nonnegative().default(0),otherLabel:z.string().trim().max(120).nullable().optional(),occurredAt:z.coerce.date(),notes:z.string().max(4000).nullable().optional()});
          const expense=z.object({...refs,category:z.enum(legExpenseCategories),merchant:z.string().trim().max(200).nullable().optional(),amountCents:z.number().int().nonnegative(),taxCents:z.number().int().nonnegative().default(0),paymentSource:z.enum(legPaymentSources),occurredAt:z.coerce.date(),notes:z.string().max(4000).nullable().optional(),employeeNote:z.string().max(1000).nullable().optional(),detailJson:z.record(z.string(),z.unknown()).nullable().optional()});
          const cash=z.object({...refs,kind:z.enum(legCashEntryKinds),amountCents:z.number().int(),occurredAt:z.coerce.date(),notes:z.string().max(4000).nullable().optional()}).refine(v=>v.kind==="adjustment"||v.amountCents>=0,{message:"Amount must be nonnegative unless adjustment"});
          const mileage=z.object({...refs,miles:z.number().nonnegative().nullable().optional(),odometerStart:z.number().nonnegative().nullable().optional(),odometerEnd:z.number().nonnegative().nullable().optional(),vehicleLabel:z.string().max(160).nullable().optional(),occurredAt:z.coerce.date(),notes:z.string().max(4000).nullable().optional()}).refine(v=>v.miles!=null||(v.odometerStart!=null&&v.odometerEnd!=null&&v.odometerEnd>=v.odometerStart),{message:"Enter miles or valid odometer readings"});
          async function post(kind:FinanceMutationKind,schema:any,req:any,res:any){const p=schema.safeParse(req.body);if(!p.success){res.status(400).json({error:p.error.issues[0]?.message??"Invalid finance entry"});return;}const {bookingId=null,tripId=null,tripSegmentId=null,clientMutationId,...payload}=p.data;const result=await createFinanceMutation(finance,kind,{legId:req.legManager.legId,bookingId,tripId,tripSegmentId,clientMutationId,payload});if(!result.ok){res.status(403).json({error:"The referenced booking, trip, or segment is outside your leg"});return;}res.status(result.idempotent?200:201).json(result.row);}
          router.get("/manager/money/summary",requireManager,async(req,res)=>res.json(await finance.summary(req.legManager!.legId,typeof req.query.tripId==="string"?req.query.tripId:null)));
          router.post("/manager/income",requireManager,(req,res)=>post("income",income,req,res));
          router.post("/manager/expenses",requireManager,(req,res)=>post("expense",expense,req,res));
          router.post("/manager/cash",requireManager,(req,res)=>post("cash",cash,req,res));
          router.post("/manager/mileage",requireManager,(req,res)=>post("mileage",mileage,req,res));
          const issueSchema=z.object({bookingId:z.string().uuid().nullable().optional(),tripId:z.string().uuid().nullable().optional(),kind:z.enum(scheduleIssueKinds),notes:z.string().trim().min(1).max(4000),clientMutationId:z.string().uuid()});
          router.post("/manager/issues",requireManager,async(req,res):Promise<void>=>{const p=issueSchema.safeParse(req.body);if(!p.success){res.status(400).json({error:p.error.issues[0]?.message??"Invalid issue report"});return;}const result=await new DrizzleScheduleIssueRepository(db).create({legId:req.legManager!.legId,bookingId:p.data.bookingId??null,tripId:p.data.tripId??null,kind:p.data.kind,notes:p.data.notes,clientMutationId:p.data.clientMutationId});if(!result.ok){res.status(403).json({error:"The referenced booking or trip is outside your leg"});return;}res.status(result.idempotent?200:201).json(result.issue);});
          export default router;
          EOF

          cat >> artifacts/api-server/src/routes/leg-manager-admin.ts <<'EOF'

          // Release 2 owner finance inspection. This router is mounted behind owner auth.
          router.get("/manager-admin/legs/:legId/money/summary",async(req,res)=>{const { DrizzleFinanceRepository }=await import("@/features/leg-manager/finance-repository");res.json(await new DrizzleFinanceRepository(db).summary(req.params.legId,typeof req.query.tripId==="string"?req.query.tripId:null));});
          router.get("/manager-admin/money/summary",async(req,res)=>{const { DrizzleFinanceRepository }=await import("@/features/leg-manager/finance-repository");res.json(await new DrizzleFinanceRepository(db).summary(null,typeof req.query.tripId==="string"?req.query.tripId:null));});
          EOF
          # Move export default back to the end after appended owner routes.
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/leg-manager-admin.ts');s=p.read_text();s=s.replace('\nexport default router;\n\n// Release 2 owner finance inspection.', '\n// Release 2 owner finance inspection.');
          if not s.rstrip().endswith('export default router;'): s=s.rstrip()+'\n\nexport default router;\n'
          p.write_text(s)
          PY
      - name: Verify Task 2 green
        run: |
          pnpm --filter @workspace/api-server exec vitest run src/features/leg-manager/finance-repository.test.ts src/features/leg-manager/finance-math.test.ts
          pnpm --filter @workspace/api-server exec tsc -p tsconfig.manager.json --noEmit
      - name: Commit Task 2
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/api-server/src/features/leg-manager/finance-repository.ts artifacts/api-server/src/features/leg-manager/finance-repository.test.ts artifacts/api-server/src/routes/leg-manager.ts artifacts/api-server/src/routes/leg-manager-admin.ts
          git commit -m 'feat: add leg scoped finance APIs [skip money-task1] [skip money-task2]'
          git push
