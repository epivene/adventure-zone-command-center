name: Verify Event Family Index

on:
  push:
    branches:
      - agent/fix-event-family-fingerprint-index

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:1/unused
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run event family repository regression test
        run: pnpm --filter @workspace/api-server exec vitest run src/features/event-families/event-family-repository.test.ts

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace
        run: pnpm run build
