name: One-time Ak-Chin profile contact audit

on:
  push:
    branches:
      - ops/ak-chin-december-event-2026-09-01
    paths:
      - ".github/workflows/ops-ak-chin-december-event.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ak-chin-december-event-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read exact live profile
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          PROFILE_ID="86509cbd-60c8-4ea7-a061-f1a39681448b"
          curl --fail --silent --show-error             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             "${BASE_URL}/profile-history/${PROFILE_ID}" > /tmp/ak-chin-history.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('/tmp/ak-chin-history.json', 'utf8'));
          if (root.ok !== true || root.profileId !== '86509cbd-60c8-4ea7-a061-f1a39681448b') {
            throw new Error('The exact Ak-Chin profile could not be verified.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/ak-chin-profile-audit.json', JSON.stringify({
            checkedAt: new Date().toISOString(),
            ok: true,
            profileId: root.profileId,
            place: root.place,
            contacts: root.contacts,
            bookings: root.bookings
          }, null, 2) + '\n');
          NODE

      - name: Commit audit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/ak-chin-profile-audit.json
          git commit -m "ops: record Ak-Chin contact audit"
          git push origin HEAD:ops/ak-chin-december-event-2026-09-01
