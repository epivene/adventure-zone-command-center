name: One-time Ak-Chin December opportunity verification

on:
  push:
    branches:
      - ops/ak-chin-december-event-2026-09-01
    paths:
      - ".github/workflows/ops-ak-chin-december-event.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/ak-chin-december-event-2026-09-01
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify live Ak-Chin profile state
        env:
          API_URL: ${{ secrets.ADVENTURE_ZONE_API_URL }}
          ASSISTANT_IMPORT_TOKEN: ${{ secrets.ASSISTANT_IMPORT_TOKEN }}
        run: |
          set -euo pipefail
          BASE_URL="${API_URL%/}/api/assistant-import"
          PROFILE_ID="86509cbd-60c8-4ea7-a061-f1a39681448b"
          curl --fail --silent --show-error             --header "Authorization: Bearer ${ASSISTANT_IMPORT_TOKEN}"             "${BASE_URL}/profile-history/${PROFILE_ID}" > /tmp/ak-chin-verified.json

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = JSON.parse(fs.readFileSync('/tmp/ak-chin-verified.json', 'utf8'));
          const serialized = JSON.stringify(root);
          const contact = (root.contacts ?? []).find((item) =>
            item.name === 'Cecily Peters' &&
            String(item.email ?? '').toLowerCase() === 'cpeters2@ak-chin.nsn.us' &&
            item.role === 'Community Events Manager' &&
            item.isPrimary === true
          );
          const notePresent =
            serialized.includes('December 17-20 winter event opportunity') &&
            serialized.includes('set up indoors with sufficient ceiling height and floor space') &&
            serialized.includes('prepaid by the event organizer') &&
            serialized.includes('Public-pay and revenue-share are not available') &&
            serialized.includes('520-709-1846');
          if (root.ok !== true || root.profileId !== '86509cbd-60c8-4ea7-a061-f1a39681448b' || !contact || !notePresent) {
            throw new Error('Fresh live verification did not find the expected Ak-Chin state.');
          }
          fs.mkdirSync('.github/ops-results', { recursive: true });
          fs.writeFileSync('.github/ops-results/ak-chin-profile-verification.json', JSON.stringify({
            verifiedAt: new Date().toISOString(),
            ok: true,
            profileId: root.profileId,
            profileName: root.place?.name,
            primaryContact: {
              name: contact.name,
              role: contact.role,
              email: contact.email,
              phone: contact.phone
            },
            decemberOpportunityNotePresent: true,
            winterTermsPresent: true
          }, null, 2) + '\n');
          NODE

      - name: Commit verification receipt
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ops-results/ak-chin-profile-verification.json
          git commit -m "ops: verify live Ak-Chin profile update"
          git push origin HEAD:ops/ak-chin-december-event-2026-09-01
