openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/agent-tax/records:
    $ref: "./agent-tax.openapi.yaml#/paths/~1admin~1agent-tax~1records"
  /admin/agent-tax/records/{id}:
    $ref: "./agent-tax.openapi.yaml#/paths/~1admin~1agent-tax~1records~1{id}"
  /admin/agent-tax/records/{id}/file:
    $ref: "./agent-tax.openapi.yaml#/paths/~1admin~1agent-tax~1records~1{id}~1file"
  /admin/agent-tax/export:
    $ref: "./agent-tax.openapi.yaml#/paths/~1admin~1agent-tax~1export"
  /admin/agent-tax/bookings:
    $ref: "./agent-tax.openapi.yaml#/paths/~1admin~1agent-tax~1bookings"
  /manager/bookings/{id}/crew-location:
    get:
      operationId: getManagerFestivalCrewLocation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read-only crew travel for the assigned booking's linked annual edition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerFestivalCrewLocation" }
        "400": { description: Invalid booking ID }
        "401": { description: Manager sign-in required }
        "403": { description: Booking not assigned to this manager's leg }
        "404": { description: Booking not found }
        "503": { description: Saved crew travel unavailable }
  /boss/bookings/{id}/crew-location:
    get:
      operationId: getBossFestivalCrewLocation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Read-only crew travel for an assigned booking's linked annual edition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagerFestivalCrewLocation" }
        "400": { description: Invalid booking ID }
        "401": { description: Boss sign-in required }
        "403": { description: Booking has no leg assignment }
        "404": { description: Booking not found }
        "503": { description: Saved crew travel unavailable }
  /festivalnet-import/matches:
    post:
      operationId: matchFestivalNetDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FestivalNetDraft"}
      responses:
        "200":
          description: Recheck profiles for an edited review without saving
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FestivalNetMatches"}
        "400": {description: Invalid reviewed draft}
  /festivalnet-import/apply-batch:
    post:
      operationId: applyFestivalNetBatch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FestivalNetBatchInput"}
      responses:
        "200":
          description: Independent atomic saves with a result or error for every entry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FestivalNetBatchResult"}
        "400": {description: Confirmation or valid batch entries required}
  /event-profiles/{id}/editions/{year}/crew-location:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    get:
      operationId: getFestivalCrewLocation
      responses:
        "200":
          description: Saved event venue pin and crew stops for this year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FestivalCrewLocation" }
    put:
      operationId: saveFestivalVenuePin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalVenuePinInput" }
      responses:
        "200":
          description: Confirmed event venue pin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FestivalCrewLocation" }
  /event-profiles/{id}/editions/{year}/crew-location/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    post:
      operationId: searchFestivalVenue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalVenueSearchInput" }
      responses:
        "200":
          description: Unconfirmed address matches; searching does not save a pin
          content:
            application/json:
              schema:
                type: object
                required: [candidates]
                properties:
                  candidates: { type: array, items: { $ref: "#/components/schemas/FestivalVenuePin" } }
  /event-profiles/{id}/editions/{year}/nearby/search:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    post:
      operationId: searchFestivalNearbyStops
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalNearbySearchInput" }
      responses:
        "200":
          description: Unverified community place suggestions; not a complete directory
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, searchedAt, radiusMiles]
                properties:
                  suggestions: { type: array, items: { $ref: "#/components/schemas/FestivalNearbySuggestion" } }
                  searchedAt: { type: string, format: date-time }
                  radiusMiles: { type: integer }
  /event-profiles/{id}/editions/{year}/crew-stops:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
    post:
      operationId: createFestivalCrewStop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalCrewStopInput" }
      responses:
        "201":
          description: Crew stop saved to this event year
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FestivalCrewStop" }
  /event-profiles/{id}/editions/{year}/crew-stops/{stopId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: year, in: path, required: true, schema: { type: integer, minimum: 1900, maximum: 2200 } }
      - { name: stopId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateFestivalCrewStop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalCrewStopInput" }
      responses:
        "200":
          description: Updated crew stop
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FestivalCrewStop" }
    delete:
      operationId: removeFestivalCrewStop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FestivalCrewStopRemoveInput" }
      responses:
        "204": { description: Removed only this saved crew stop }
  /festivalnet-import/preview:
    post:
      operationId: previewFestivalNetPdf
      parameters:
        - {name: filename, in: query, required: true, schema: {type: string, maxLength: 255}}
      requestBody:
        required: true
        content:
          application/pdf:
            schema: {$ref: "#/components/schemas/FestivalNetPdfFile"}
      responses:
        "200":
          description: Extracted fields and possible existing profiles; no records are written
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FestivalNetPreview"}
        "400": {description: "Invalid, scanned, or unsupported PDF"}
        "413": {description: PDF exceeds the 10 MB limit}
  /festivalnet-import/apply:
    post:
      operationId: applyFestivalNetImport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FestivalNetImportInput"}
      responses:
        "200":
          description: Missing information saved atomically without overwriting existing values
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FestivalNetImportResult"}
        "400": {description: Review the extracted fields}
        "409": {description: A possible duplicate requires selecting an existing profile}
  /event-profiles/{id}/editions:
    get:
      operationId: listFestivalEditions
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Saved festival years
          content:
            application/json:
              schema:
                type: object
                required: [editions]
                properties:
                  editions:
                    type: array
                    items: {$ref: "#/components/schemas/FestivalEdition"}
  /event-profiles/{id}/editions/{year}:
    put:
      operationId: saveFestivalEdition
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: year, in: path, required: true, schema: {type: integer, minimum: 1900, maximum: 2200}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FestivalEditionInput"}
      responses:
        "200":
          description: Saved event year
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FestivalEdition"}
        "409":
          description: This event year changed; reload before saving
  /bookings/{id}/lead-leg:
    post:
      operationId: assignLeadLeg
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LeadLegInput"}
      responses:
        "200":
          description: Lead leg assigned
        "409":
          description: Assignment changed or booking is no longer a lead
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ManagerFestivalCrewLocation:
      type: object
      required: [bookingId, year, crewLocation]
      properties:
        bookingId: { type: string, format: uuid }
        year: { type: [integer, "null"], minimum: 1900, maximum: 2200 }
        crewLocation:
          oneOf:
            - { $ref: "#/components/schemas/FestivalCrewLocation" }
            - { type: "null" }
    FestivalVenuePin:
      type: object
      required: [latitude, longitude, displayName]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        displayName: { type: string, maxLength: 2000 }
    FestivalVenueSearchInput:
      type: object
      required: [query]
      properties:
        query: { type: string, minLength: 3, maxLength: 400 }
    FestivalVenuePinInput:
      allOf:
        - { $ref: "#/components/schemas/FestivalVenuePin" }
        - type: object
          required: [expectedUpdatedAt]
          properties:
            expectedUpdatedAt: { type: string, format: date-time }
    FestivalCrewLocation:
      type: object
      required: [venue, editionUpdatedAt, location, stops]
      properties:
        venue: { type: string }
        editionUpdatedAt: { type: [string, "null"], format: date-time }
        location:
          oneOf:
            - { $ref: "#/components/schemas/FestivalVenuePin" }
            - { type: "null" }
        stops: { type: array, items: { $ref: "#/components/schemas/FestivalCrewStop" } }
    FestivalStopCategory:
      type: string
      enum: [rv_park, walmart, mechanic, tires, oil_change, hardware, bathroom, fuel]
    FestivalCrewFact:
      type: string
      enum: [unknown, yes, no]
    FestivalNearbySearchInput:
      type: object
      required: [radiusMiles]
      properties:
        radiusMiles: { type: integer, enum: [10, 25, 50] }
    FestivalNearbySuggestion:
      type: object
      required: [sourceKey, name, category, address, latitude, longitude, sourceUrl, phone, website, distanceMiles]
      properties:
        sourceKey: { type: string }
        name: { type: string }
        category: { $ref: "#/components/schemas/FestivalStopCategory" }
        address: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        sourceUrl: { type: string }
        phone: { type: string }
        website: { type: string }
        distanceMiles: { type: number }
    FestivalCrewStopInput:
      type: object
      required: [name, category, address, latitude, longitude, sourceKey, sourceUrl, phone, website, notes, rigFit, hookups, overnight, maxRigLengthFeet, expectedUpdatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        category: { $ref: "#/components/schemas/FestivalStopCategory" }
        address: { type: string, maxLength: 500 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        sourceKey: { type: [string, "null"], maxLength: 80 }
        sourceUrl: { type: string, maxLength: 2000 }
        phone: { type: string, maxLength: 80 }
        website: { type: string, maxLength: 2000 }
        notes: { type: string, maxLength: 2000 }
        rigFit: { $ref: "#/components/schemas/FestivalCrewFact" }
        hookups: { $ref: "#/components/schemas/FestivalCrewFact" }
        overnight: { $ref: "#/components/schemas/FestivalCrewFact" }
        rigFitConfirmedOn:
          type: [string, "null"]
          format: date
          description: Staff-confirmed calendar date, never a provider lookup time. Null clears confirmation; omitted preserves it only when the fact and rig length are unchanged.
        hookupsConfirmedOn:
          type: [string, "null"]
          format: date
          description: Staff-confirmed calendar date, never a provider lookup time. Null clears confirmation; omitted preserves it only when the fact is unchanged.
        overnightConfirmedOn:
          type: [string, "null"]
          format: date
          description: Staff-confirmed calendar date for permission or refusal, never inferred from a listing. Unknown must have no confirmation date.
        maxRigLengthFeet: { type: [integer, "null"], minimum: 1, maximum: 150 }
        expectedUpdatedAt: { type: [string, "null"], format: date-time }
    FestivalCrewStop:
      allOf:
        - { $ref: "#/components/schemas/FestivalCrewStopInput" }
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: string, format: uuid }
            updatedAt: { type: string, format: date-time }
    FestivalCrewStopRemoveInput:
      type: object
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: { type: string, format: date-time }
    FestivalNetPdfFile:
      type: string
      description: Raw PDF bytes sent as application/pdf, not JSON or base64
    FestivalNetDraft:
      type: object
      required: [name, year, sourceUrl, sourceFilename, details]
      properties:
        name: {type: string, minLength: 1, maxLength: 250}
        year: {type: integer, minimum: 1900, maximum: 2200}
        sourceUrl: {type: string, maxLength: 1000}
        sourceFilename: {type: string, minLength: 1, maxLength: 255}
        city: {type: string, maxLength: 250}
        region: {type: string, maxLength: 100}
        address1: {type: string, maxLength: 500}
        postalCode: {type: string, maxLength: 30}
        phone: {type: string, maxLength: 100}
        website: {type: string, maxLength: 1000}
        contactName: {type: string, maxLength: 250}
        contactEmail: {type: string, maxLength: 320}
        contactPhone: {type: string, maxLength: 100}
        details:
          type: object
          additionalProperties: {type: string, maxLength: 4000}
    FestivalNetCandidate:
      type: object
      required: [id, name, details, existingFields]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        city: {type: [string, "null"]}
        region: {type: [string, "null"]}
        details: {type: object, additionalProperties: {type: string}}
        existingFields: {type: object, additionalProperties: {type: string}}
    FestivalNetPreview:
      type: object
      required: [draft, candidates, warnings]
      properties:
        draft: {$ref: "#/components/schemas/FestivalNetDraft"}
        candidates:
          type: array
          items: {$ref: "#/components/schemas/FestivalNetCandidate"}
        warnings:
          type: array
          items: {type: string}
    FestivalNetImportInput:
      type: object
      required: [draft, organizationId]
      properties:
        draft: {$ref: "#/components/schemas/FestivalNetDraft"}
        organizationId: {type: [string, "null"], format: uuid}
    FestivalNetMatches:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          items: {$ref: "#/components/schemas/FestivalNetCandidate"}
    FestivalNetBatchEntry:
      type: object
      required: [entryId, draft, organizationId]
      properties:
        entryId: {type: string, minLength: 1, maxLength: 100}
        draft: {$ref: "#/components/schemas/FestivalNetDraft"}
        organizationId: {type: [string, "null"], format: uuid}
    FestivalNetBatchInput:
      type: object
      required: [confirmed, entries]
      properties:
        confirmed: {type: boolean, enum: [true]}
        entries:
          type: array
          minItems: 1
          maxItems: 25
          items: {$ref: "#/components/schemas/FestivalNetBatchEntry"}
    FestivalNetBatchOutcome:
      type: object
      required: [entryId, result, error]
      properties:
        entryId: {type: string}
        result:
          oneOf:
            - {$ref: "#/components/schemas/FestivalNetImportResult"}
            - {type: "null"}
        error: {type: [string, "null"]}
    FestivalNetBatchResult:
      type: object
      required: [outcomes]
      properties:
        outcomes:
          type: array
          items: {$ref: "#/components/schemas/FestivalNetBatchOutcome"}
    FestivalNetImportResult:
      type: object
      required: [organizationId, created, filledFields, preservedFields]
      properties:
        organizationId: {type: string, format: uuid}
        created: {type: boolean}
        filledFields: {type: array, items: {type: string}}
        preservedFields: {type: array, items: {type: string}}
    FestivalEdition:
      type: object
      required: [id, organizationId, year, details, updatedAt]
      properties:
        id: {type: string, format: uuid}
        organizationId: {type: string, format: uuid}
        year: {type: integer}
        details:
          type: object
          additionalProperties: {type: string, maxLength: 4000}
        updatedAt: {type: string, format: date-time}
    FestivalEditionInput:
      type: object
      required: [details, expectedUpdatedAt]
      properties:
        details:
          type: object
          maxProperties: 60
          additionalProperties: {type: string, maxLength: 4000}
        expectedUpdatedAt: {type: [string, "null"], format: date-time}
    LeadLegInput:
      type: object
      required: [travelLegId, expectedTravelLegId]
      properties:
        travelLegId: {type: string, format: uuid}
        expectedTravelLegId: {type: [string, "null"], format: uuid}
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

