services:
  # ── Express API ──────────────────────────────────────────────────────────────
  - type: web
    name: adventure-zone-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/db run-migrations && node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Render PostgreSQL external connection string (with SSL added automatically
      # by the db library when this key is present).
      - key: RENDER_DATABASE_URL
        sync: false
      # Secret used to sign login tokens (any long random string).
      - key: SESSION_SECRET
        sync: false
      # The owner password used to sign in to the app.
      - key: OWNER_PASSWORD
        sync: false
      # Owner-authorized outbound email. These stay server-only; Office users
      # never receive SMTP credentials and never have a send endpoint.
      - key: OFFICE_MAIL_SMTP_HOST
        sync: false
      - key: OFFICE_MAIL_SMTP_PORT
        sync: false
      - key: OFFICE_MAIL_SMTP_SECURE
        sync: false
      - key: OFFICE_MAIL_SMTP_USER
        sync: false
      - key: OFFICE_MAIL_SMTP_PASSWORD
        sync: false
      - key: OFFICE_MAIL_FROM
        sync: false
      # Private Google Cloud Storage bucket used for manager receipt images.
      - key: LEG_MANAGER_RECEIPT_BUCKET
        sync: false
      # Full service-account JSON for receipt uploads/signing. Keep this server-only.
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # Read-only Google Workspace OAuth. Configure all five secret values together.
      # REDIRECT_URI is the API callback; APP_ORIGIN is the separate static web origin
      # (for example https://adventure-zone-web.onrender.com, with no trailing slash).
      - key: GOOGLE_WORKSPACE_CLIENT_ID
        sync: false
      - key: GOOGLE_WORKSPACE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_WORKSPACE_REDIRECT_URI
        sync: false
      - key: GOOGLE_WORKSPACE_APP_ORIGIN
        sync: false
      - key: GOOGLE_WORKSPACE_TOKEN_ENCRYPTION_KEY
        sync: false
      # Phase 1 establishes connection and scope only. Historical processing and AI
      # remain explicitly disabled until their later rollout gates are approved.
      - key: GOOGLE_WORKSPACE_SYNC_ENABLED
        value: "false"
      - key: GOOGLE_WORKSPACE_AI_ENABLED
        value: "false"
      # Act! settings are server-only. Never expose these through Vite.
      - key: ACT_API_BASE_URL
        value: https://apius.act.com/act.web.api
      - key: ACT_DATABASE_NAME
        sync: false
      - key: ACT_USERNAME
        sync: false
      - key: ACT_PASSWORD
        sync: false
      # Locked by default; the one-time rollout uses a short, operator-controlled
      # true window and must restore false before the final API restart/report.
      - key: ACT_MIGRATION_APPLY_ENABLED
        value: "false"
      # Keep assisted calling off through migration and owner smoke testing.
      - key: ASSISTED_CALLING_ENABLED
        value: "false"
      # Optional private launcher value; configure it in Render, not source.
      - key: VOICEMAIL_LAUNCH_URL
        sync: false

  # ── Vite static frontend ─────────────────────────────────────────────────────
  - type: web
    name: adventure-zone-web
    runtime: static
    region: oregon
    buildCommand: >-
      pnpm install --frozen-lockfile &&
      pnpm --filter @workspace/adventure-zone run build
    staticPublishPath: artifacts/adventure-zone/dist/public
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      # Base URL of the API service, e.g. https://adventure-zone-api.onrender.com
      # (no trailing slash). Set this AFTER the API service is live and you know
      # its URL.
      - key: VITE_API_BASE_URL
        sync: false
